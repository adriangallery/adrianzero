<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>What did I miss in these X weeks? — $ADRIAN Ecosystem</title>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <link rel="icon" href="../components/images/adrianzero.png">
  <style>
    :root{
      --bg:#0b0f14;
      --fg:#e6f1ff;
      --muted:#98a6b3;
      --cyan:#00e5ff;
      --red:#ff004c;
      --green:#00ff88;
      --orange:#ff8800;
      --card:#0f1620;
      --line:#182431;
      --ring1:0 0 30px rgba(0,229,255,.28);
      --ring2:0 0 30px rgba(255,0,76,.16);
      /* Grid suave */
      --grid-rgb: 255,255,255;
      --cell: 144px;
      --block: 384px;
      --minor-a: .18;
      --major-a: .28;
    }
    
    /* Fondo cuadriculado suave estilo Miro ($ADRIAN) */
    .grid-soft{
      background-color: var(--bg);
      background-image:
        linear-gradient(to right, rgba(var(--grid-rgb), var(--minor-a)) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(var(--grid-rgb), var(--minor-a)) 1px, transparent 1px),
        linear-gradient(to right, rgba(var(--grid-rgb), var(--major-a)) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(var(--grid-rgb), var(--major-a)) 1px, transparent 1px),
        radial-gradient(1200px 800px at 80% -10%, rgba(0,229,255,.06), transparent 60%),
        radial-gradient(900px 600px at -10% 100%, rgba(255,0,76,.07), transparent 65%);
      background-size:
        var(--cell) var(--cell),
        var(--cell) var(--cell),
        var(--block) var(--block),
        var(--block) var(--block),
        auto,
        auto;
      background-position:
         0 0,
         0 0,
         0 0,
         0 0,
         center,
         center;
      background-repeat: repeat;
      background-attachment: fixed, fixed, fixed, fixed, fixed, fixed;
      image-rendering: pixelated;
    }
    
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      color:#ffffff;
      font-family:"VT323", monospace;
      line-height:1.6;
      overflow-x:hidden;
      position:relative;min-height:100vh;
    }
    
    .container{width:min(1100px,92%);margin:0 auto 64px;position:relative}
    
    /* Logo hero superior */
    .logo-hero{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;margin:8px 0 20px}
    .logo-hero img{width:280px;height:auto;user-select:none;-webkit-user-drag:none}
    .logo-hero img.brand{filter:drop-shadow(0 0 12px rgba(255,0,136,.35))}
    .logo-hero img.glasses{filter:drop-shadow(0 0 12px rgba(0,170,255,.35))}
    @media (min-width: 992px){.logo-hero img{width:360px}}

    .subtitle{text-align:center;color:#cccccc;margin-bottom:32px;font-size:24px}
    
    /* Slider Section */
    .slider-section {
      background: var(--card);
      border: 2px solid var(--line);
      border-radius: 12px;
      padding: 32px;
      margin: 40px auto;
      max-width: 600px;
      box-shadow: var(--ring1);
    }
    
    .slider-label {
      text-align: center;
      font-size: 20px;
      color: var(--fg);
      margin-bottom: 24px;
    }
    
    .slider-container {
      position: relative;
      margin: 24px 0;
    }
    
    .slider {
      width: 100%;
      height: 12px;
      border-radius: 6px;
      background: var(--line);
      outline: none;
      -webkit-appearance: none;
      appearance: none;
    }
    
    .slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--cyan);
      cursor: pointer;
      box-shadow: 0 0 10px rgba(0,229,255,.5);
      transition: all 0.3s ease;
    }
    
    .slider::-webkit-slider-thumb:hover {
      background: var(--green);
      box-shadow: 0 0 15px rgba(0,255,136,.6);
      transform: scale(1.1);
    }
    
    .slider::-moz-range-thumb {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--cyan);
      cursor: pointer;
      border: none;
      box-shadow: 0 0 10px rgba(0,229,255,.5);
      transition: all 0.3s ease;
    }
    
    .slider-value {
      text-align: center;
      font-size: 32px;
      color: var(--cyan);
      font-weight: bold;
      margin-top: 16px;
      text-shadow: 0 0 10px rgba(0,229,255,.5);
    }
    
    .weeks-text {
      text-align: center;
      font-size: 18px;
      color: var(--muted);
      margin-top: 8px;
    }
    
    /* Events Counter */
    .events-counter {
      text-align: center;
      font-size: 18px;
      color: var(--muted);
      margin: 16px 0;
    }
    
    /* Cards Grid */
    .events-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
      margin: 40px 0;
    }
    
    @media (min-width: 768px) {
      .events-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
    
    @media (min-width: 992px) {
      .events-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }
    
    .event-card {
      background: var(--card);
      border: 2px solid var(--line);
      border-radius: 12px;
      padding: 24px;
      transition: all 0.3s ease;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeInUp 0.6s ease forwards;
    }
    
    .event-card:nth-child(1) { animation-delay: 0.1s; }
    .event-card:nth-child(2) { animation-delay: 0.2s; }
    .event-card:nth-child(3) { animation-delay: 0.3s; }
    .event-card:nth-child(4) { animation-delay: 0.4s; }
    .event-card:nth-child(5) { animation-delay: 0.5s; }
    .event-card:nth-child(6) { animation-delay: 0.6s; }
    
    @keyframes fadeInUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .event-card:hover {
      transform: translateY(-4px);
      border-color: var(--cyan);
      box-shadow: var(--ring1);
    }
    
    .event-emoji {
      font-size: 48px;
      text-align: center;
      margin-bottom: 12px;
      line-height: 1;
    }
    
    .event-title {
      font-size: 22px;
      font-weight: bold;
      color: var(--fg);
      margin-bottom: 12px;
      line-height: 1.3;
    }
    
    .event-description {
      font-size: 18px;
      color: var(--muted);
      line-height: 1.5;
      margin-bottom: 16px;
    }
    
    .event-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }
    
    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .badge-status {
      background: rgba(0, 255, 136, 0.2);
      color: var(--green);
      border: 1px solid rgba(0, 255, 136, 0.3);
    }
    
    .badge-status.in-progress {
      background: rgba(255, 136, 0, 0.2);
      color: var(--orange);
      border: 1px solid rgba(255, 136, 0, 0.3);
    }
    
    .badge-status.future,
    .badge-status.announced {
      background: rgba(0, 229, 255, 0.2);
      color: var(--cyan);
      border: 1px solid rgba(0, 229, 255, 0.3);
    }
    
    .badge-category {
      background: rgba(255, 255, 255, 0.1);
      color: var(--muted);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    
    .event-stats {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
      font-size: 16px;
      color: var(--cyan);
    }
    
    .event-links {
      margin-top: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    
    .event-link {
      display: inline-block;
      padding: 6px 12px;
      background: rgba(0, 229, 255, 0.1);
      color: var(--cyan);
      border: 1px solid rgba(0, 229, 255, 0.3);
      border-radius: 6px;
      text-decoration: none;
      font-size: 14px;
      transition: all 0.3s ease;
    }
    
    .event-link:hover {
      background: rgba(0, 229, 255, 0.2);
      color: var(--fg);
      transform: translateY(-2px);
    }
    
    .no-events {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
      font-size: 20px;
    }
    
    .loading {
      text-align: center;
      padding: 60px 20px;
      color: var(--cyan);
      font-size: 24px;
    }
    
    /* Menu Styles */
    #menu-container {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
    }

    #menu-container .navbar {
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 2px solid var(--green);
    }

    #menu-container .navbar-nav .nav-link {
      color: var(--green) !important;
      font-family: 'VT323', monospace;
      font-size: 1.1rem;
      transition: all 0.3s ease;
    }

    #menu-container .navbar-nav .nav-link:hover {
      color: #ffffff !important;
      text-shadow: 0 0 10px var(--green);
    }

    #menu-container .navbar-text {
      color: var(--green) !important;
      font-family: 'VT323', monospace;
      font-size: 1.2rem;
      font-weight: bold;
    }

    #menu-container .navbar-toggler {
      border-color: var(--green);
    }

    #menu-container .navbar-toggler-icon {
      background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3e%3cpath stroke='rgba(0, 255, 0, 1)' stroke-linecap='round' stroke-miterlimit='10' stroke-width='2' d='M4 7h22M4 15h22M4 23h22'/%3e%3c/svg%3e");
    }

    /* Adjust first section to account for fixed menu */
    .hero {
      padding-top: 100px;
    }

    #menu-container .navbar-collapse {
      display: none;
    }

    #menu-container .navbar-collapse.show {
      display: block;
    }

    #menu-container .dropdown-menu {
      background: rgba(0, 0, 0, 0.95) !important;
      border: 2px solid var(--green) !important;
      border-radius: 8px !important;
      z-index: 1050 !important;
      min-width: 200px;
    }

    #menu-container .dropdown-item {
      color: var(--green) !important;
      font-family: 'VT323', monospace !important;
      font-size: 1rem !important;
      padding: 10px 20px !important;
      transition: all 0.3s ease !important;
    }

    #menu-container .dropdown-item:hover {
      background: rgba(0, 255, 0, 0.2) !important;
      color: #ffffff !important;
    }
    
    @media (max-width: 991.98px) {
      .hero {
        padding-top: 80px;
      }
      
      .slider-section {
        padding: 24px 16px;
        margin: 20px auto;
      }
      
      .events-grid {
        grid-template-columns: 1fr;
        gap: 16px;
      }
      
      .event-card {
        padding: 20px;
      }
    }
  </style>
</head>
<body class="grid-soft">
  <!-- Menu -->
  <div id="menu-container"></div>
  <script>
    fetch('../components/menu.html')
      .then(r => {
        if (!r.ok) throw new Error('Failed to load menu');
        return r.text();
      })
      .then(html => { 
        document.getElementById('menu-container').innerHTML = html; 
        const s = document.createElement('script'); 
        s.src = '../components/menu.js'; 
        s.onerror = () => console.warn('Menu script not found, continuing without it');
        document.head.appendChild(s); 
      })
      .catch(err => {
        console.warn('Error loading menu:', err);
        // Continue without menu if it fails
      });
  </script>

  <div class="container hero">
    <div class="logo-hero">
      <img src="../components/images/adrianlogo.png" alt="Adrian Logo" class="brand">
      <img src="../components/images/glasses.png" alt="Adrian Glasses" class="glasses">
    </div>
    <p class="subtitle" style="font-family: 'VT323', monospace;">What did I miss in these X weeks?</p>

    <!-- Slider Section -->
    <div class="slider-section">
      <div class="slider-label">Select how many weeks back you want to see:</div>
      <div class="slider-container">
        <input type="range" min="1" max="52" value="4" class="slider" id="weeksSlider">
        <div class="slider-value" id="sliderValue">4</div>
        <div class="weeks-text">weeks</div>
      </div>
      <div class="events-counter" id="eventsCounter">Loading events...</div>
    </div>

    <!-- Events Grid -->
    <div class="events-grid" id="eventsGrid">
      <div class="loading">Loading events...</div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="lost-app.js"></script>
</body>
</html>
