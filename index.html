<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SamuraiZERO - Batch Mint</title>
    <script src="https://unpkg.com/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <style>
        @font-face {
            font-family: 'ADRIAN ZERO';
            src: url('components/fonts/ADRIAN_ZERO.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }
        
        @font-face {
            font-family: 'ADRIAN';
            src: url('components/fonts/ADRIAN-Regular.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'VT323', monospace;
            background: linear-gradient(135deg, #000000 0%, #1a1a1a 50%, #0a0a0a 100%);
            color: #ffffff;
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Banner Section */
        .banner-section {
            width: 100%;
            position: relative;
            z-index: 1;
        }

        .banner-image {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }

        /* Mobile banner overlay to prevent menu overlap */
        .banner-mobile-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 80px;
            background: transparent;
            z-index: 2;
            pointer-events: none;
        }

        /* Hero Section */
        .hero {
            min-height: auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 20px 40px 20px;
            position: relative;
            background: radial-gradient(circle at 50% 50%, rgba(0, 255, 0, 0.1) 0%, transparent 50%);
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                linear-gradient(rgba(0, 255, 0, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 0, 0.03) 1px, transparent 1px);
            background-size: 20px 20px;
            opacity: 0.5;
            z-index: -1;
        }

        .hero h1 {
            font-family: 'ADRIAN ZERO', 'VT323', monospace;
            font-size: 5rem;
            margin-bottom: 20px;
            background: linear-gradient(45deg, #00ff00, #00ccff, #ff0088);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            color: transparent;
            animation: glow 3s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { 
                filter: drop-shadow(0 0 20px rgba(0, 255, 0, 0.5));
            }
            to { 
                filter: drop-shadow(0 0 40px rgba(0, 255, 0, 0.8));
            }
        }

        .hero .subtitle {
            font-size: 2rem;
            color: #cccccc;
            margin-bottom: 30px;
            max-width: 800px;
        }

        .hero .description {
            font-size: 1.4rem;
            color: #888888;
            margin-bottom: 20px;
            max-width: 900px;
        }

        /* Mint Section */
        .mint-section {
            padding: 60px 20px;
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
        }

        .mint-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                linear-gradient(rgba(0, 255, 0, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 0, 0.03) 1px, transparent 1px);
            background-size: 20px 20px;
            opacity: 0.5;
            z-index: -1;
        }

        .mint-card {
            background: rgba(0, 0, 0, 0.8);
            border: 3px solid #ffaa00;
            border-radius: 25px;
            padding: 40px;
            position: relative;
            transition: all 0.4s ease;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(255, 170, 0, 0.2);
            max-width: 800px;
            margin: 0 auto;
        }

        .mint-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 60px rgba(255, 170, 0, 0.4);
        }

        .mint-title {
            font-family: 'ADRIAN ZERO', 'VT323', monospace;
            font-size: 3rem;
            margin-bottom: 15px;
            text-align: center;
            color: #ffaa00;
            text-shadow: 0 0 20px rgba(255, 170, 0, 0.5);
        }

        .mint-subtitle {
            font-size: 1.3rem;
            color: #888;
            text-align: center;
            margin-bottom: 30px;
            font-style: italic;
        }

        .nft-preview {
            width: 300px;
            height: 300px;
            margin: 0 auto 30px;
            border: 3px solid #ffaa00;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(255, 170, 0, 0.3);
        }

        .nft-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .batch-info {
            background: rgba(255, 170, 0, 0.1);
            border: 2px solid rgba(255, 170, 0, 0.3);
            border-radius: 15px;
            padding: 20px;
            margin: 30px 0;
            text-align: center;
        }

        .batch-info-item {
            margin: 10px 0;
            font-size: 1.2rem;
        }

        .batch-info-label {
            color: #888;
        }

        .batch-info-value {
            color: #ffaa00;
            font-weight: bold;
        }

        .quantity-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin: 30px 0;
        }

        .quantity-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid rgba(255, 170, 0, 0.3);
            background: rgba(255, 170, 0, 0.1);
            color: #ffaa00;
            font-size: 1.8rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'VT323', monospace;
        }

        .quantity-btn:hover:not(:disabled) {
            background: rgba(255, 170, 0, 0.2);
            border-color: rgba(255, 170, 0, 0.5);
            transform: scale(1.1);
        }

        .quantity-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .quantity-display {
            font-size: 2.5rem;
            font-weight: bold;
            color: #ffaa00;
            min-width: 80px;
            text-align: center;
            background: rgba(255, 170, 0, 0.1);
            border: 2px solid rgba(255, 170, 0, 0.3);
            border-radius: 12px;
            padding: 15px;
        }

        .price-section {
            text-align: center;
            margin: 30px 0;
            padding: 20px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 15px;
        }

        .price-amount {
            font-size: 3rem;
            font-weight: bold;
            margin-bottom: 10px;
            color: #ffaa00;
        }

        .price-label {
            font-size: 1.2rem;
            color: #888;
        }

        .wallet-section {
            margin: 30px 0;
            text-align: center;
        }

        .connect-btn {
            background: linear-gradient(45deg, #00ff00, #00cc00);
            color: #000;
            border: none;
            padding: 15px 30px;
            font-size: 1.3rem;
            border-radius: 15px;
            cursor: pointer;
            font-family: 'VT323', monospace;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(0, 255, 0, 0.3);
            font-weight: bold;
        }

        .connect-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(0, 255, 0, 0.5);
        }

        .wallet-info {
            display: none;
            background: rgba(0, 170, 255, 0.1);
            border: 1px solid rgba(0, 170, 255, 0.3);
            border-radius: 12px;
            padding: 15px;
            margin: 20px auto;
            max-width: 400px;
        }

        .wallet-address {
            font-family: monospace;
            font-size: 1.2rem;
            color: #00aaff;
        }

        .mint-btn {
            width: 100%;
            padding: 20px;
            border: none;
            border-radius: 15px;
            font-size: 1.5rem;
            font-weight: bold;
            font-family: 'VT323', monospace;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
            position: relative;
            background: linear-gradient(45deg, #ffaa00, #ff8800);
            color: #000;
            box-shadow: 0 10px 30px rgba(255, 170, 0, 0.3);
        }

        .mint-btn:hover:not(:disabled) {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(255, 170, 0, 0.5);
        }

        .mint-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-loading {
            color: transparent !important;
        }

        .btn-loading::after {
            content: '';
            position: absolute;
            width: 24px;
            height: 24px;
            top: 50%;
            left: 50%;
            margin-left: -12px;
            margin-top: -12px;
            border: 3px solid transparent;
            border-top: 3px solid currentColor;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .status-message {
            margin-top: 15px;
            padding: 15px;
            border-radius: 10px;
            font-size: 1.2rem;
            text-align: center;
            display: none;
        }

        .status-message.loading {
            background: rgba(255, 255, 0, 0.1);
            border: 1px solid rgba(255, 255, 0, 0.3);
            color: #ffff00;
        }

        .status-message.success {
            background: rgba(0, 255, 0, 0.1);
            border: 1px solid rgba(0, 255, 0, 0.3);
            color: #00ff00;
        }

        .status-message.error {
            background: rgba(255, 0, 0, 0.1);
            border: 1px solid rgba(255, 0, 0, 0.3);
            color: #ff4444;
        }

        .network-warning {
            background: rgba(255, 136, 0, 0.1);
            border: 1px solid rgba(255, 136, 0, 0.3);
            border-radius: 12px;
            padding: 15px;
            margin: 20px auto;
            max-width: 800px;
            color: #ff8800;
            text-align: center;
            display: none;
        }

        .network-warning button {
            background: rgba(255, 136, 0, 0.2);
            border: 1px solid rgba(255, 136, 0, 0.5);
            color: #ff8800;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            margin-left: 10px;
            font-weight: 600;
            font-family: 'VT323', monospace;
        }

        /* Menu Styles */
        #menu-container {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
        }

        #menu-container .navbar {
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid #00ff00;
        }

        #menu-container .navbar-nav .nav-link {
            color: #00ff00 !important;
            font-family: 'VT323', monospace;
            font-size: 1.1rem;
            transition: all 0.3s ease;
        }

        #menu-container .navbar-nav .nav-link:hover {
            color: #ffffff !important;
            text-shadow: 0 0 10px #00ff00;
        }

        #menu-container .navbar-text {
            color: #00ff00 !important;
            font-family: 'VT323', monospace;
            font-size: 1.2rem;
            font-weight: bold;
        }

        #menu-container .navbar-toggler {
            border-color: #00ff00;
        }

        #menu-container .navbar-toggler-icon {
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3e%3cpath stroke='rgba(0, 255, 0, 1)' stroke-linecap='round' stroke-miterlimit='10' stroke-width='2' d='M4 7h22M4 15h22M4 23h22'/%3e%3c/svg%3e");
        }

        #menu-container .navbar-collapse {
            display: none;
        }

        #menu-container .navbar-collapse.show {
            display: block;
        }

        @media (max-width: 991.98px) {
            #menu-container .navbar-collapse {
                position: absolute;
                top: 100%;
                left: 0;
                right: 0;
                background: rgba(0, 0, 0, 0.95);
                backdrop-filter: blur(10px);
                border-top: 1px solid #00ff00;
                padding: 1rem;
            }

            .banner-mobile-overlay {
                display: block;
            }
        }

        @media (max-width: 768px) {
            .hero h1 {
                font-size: 3rem;
            }

            .hero .subtitle {
                font-size: 1.5rem;
            }

            .mint-title {
                font-size: 2rem;
            }

            .mint-card {
                padding: 25px;
            }

            .nft-preview {
                width: 250px;
                height: 250px;
            }
        }

        .fade-in {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.6s ease;
        }

        .fade-in.visible {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <!-- Include the menu -->
    <div id="menu-container"></div>
    <script>
      fetch('components/menu.html')
        .then(response => response.text())
        .then(html => {
          document.getElementById('menu-container').innerHTML = html;
          const script = document.createElement('script');
          script.src = 'components/menu.js';
          document.head.appendChild(script);
        })
        .catch(error => console.error('Error loading menu:', error));
    </script>

    <!-- Banner Section -->
    <div class="banner-section">
        <div class="banner-mobile-overlay"></div>
        <img src="components/images/ADRIAN_ZERO_Banner.gif" alt="ADRIAN ZERO Banner" class="banner-image">
    </div>

    <!-- Hero Section -->
    <section class="hero">
        <h1>SamuraiZERO</h1>
        <p class="subtitle">The Warrior Collection</p>
        <p class="description">
            Mint your SamuraiZERO NFT. A powerful warrior ready for battle in the digital realm.
        </p>
    </section>

    <!-- Network Warning -->
    <div id="networkWarning" class="network-warning">
        <span>⚠️ Please switch to Base Network</span>
        <button onclick="switchToBase()">Switch Network</button>
    </div>

    <!-- Mint Section -->
    <section class="mint-section">
        <div class="mint-card fade-in">
            <h2 class="mint-title">SamuraiZERO Batch</h2>
            <p class="mint-subtitle">Mint your warrior NFT</p>
            
            <div class="nft-preview">
                <img src="components/images/595.png" alt="SamuraiZERO Preview">
            </div>

            <div class="batch-info">
                <div class="batch-info-item">
                    <span class="batch-info-label">Price: </span>
                    <span class="batch-info-value" id="batchPrice">Loading...</span> $ADRIAN
                </div>
                <div class="batch-info-item">
                    <span class="batch-info-label">Supply: </span>
                    <span class="batch-info-value" id="batchSupply">Loading...</span>
                </div>
                <div class="batch-info-item">
                    <span class="batch-info-label">Max per wallet: </span>
                    <span class="batch-info-value" id="maxPerWallet">50</span>
                </div>
            </div>

            <div class="quantity-controls">
                <button class="quantity-btn" onclick="changeQuantity(-1)" id="decreaseBtn">-</button>
                <div class="quantity-display" id="quantity">1</div>
                <button class="quantity-btn" onclick="changeQuantity(1)" id="increaseBtn">+</button>
            </div>

            <div class="price-section">
                <div class="price-amount" id="totalPrice">Loading...</div>
                <div class="price-label">Total $ADRIAN</div>
            </div>

            <div class="wallet-section">
                <button id="connectBtn" class="connect-btn">Connect Wallet</button>
                <div id="walletInfo" class="wallet-info">
                    <div class="wallet-address" id="walletAddress"></div>
                </div>
            </div>

            <button class="mint-btn" id="mintBtn" onclick="mintBatch()" disabled>
                Mint SamuraiZERO
            </button>

            <div class="status-message" id="statusMessage"></div>
        </div>
    </section>

    <script>
        // Contract configuration
        const BATCH_CONTRACT = "0x20700BE61f2b94E08B16ebD82eE0BA46189B7305";
        const BATCH_ID = 1; // SamuraiZERO
        const ADRIAN_TOKEN = "0x7E99075Ce287F1cF8cBCAaa6A1C7894e404fD7Ea";
        const BASE_CHAIN_ID = 8453;
        const BASE_CHAIN_ID_HEX = "0x2105";

        // Contract ABIs
        const BATCH_ABI = [
            "function mint() external",
            "function mintMultiple(uint256 quantity) external",
            "function getBatchInfo(uint256 batchId) external view returns (tuple(uint256 id, uint256 price, uint256 maxSupply, uint256 minted, bool active, string name, string tag, uint256 startTime, uint256 endTime, uint256 maxPerWallet))",
            "function paymentToken() external view returns (address)",
            "function batchMintPaused() external view returns (bool)"
        ];

        const ERC20_ABI = [
            "function approve(address spender, uint256 amount) returns (bool)",
            "function allowance(address owner, address spender) view returns (uint256)",
            "function balanceOf(address account) view returns (uint256)"
        ];

        // Global state
        let provider;
        let signer;
        let userAddress;
        let batchContract;
        let adrianToken;
        let currentQuantity = 1;
        let batchPrice = ethers.utils.parseEther("0");
        let batchMaxSupply = 0;
        let batchMinted = 0;
        let batchMaxPerWallet = 50;
        let approvedAmount = 0;
        let adrianBalance = 0;

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            checkConnection();
            document.getElementById('connectBtn').addEventListener('click', connectWallet);
            setupFadeInAnimations();
            loadBatchInfo();
        });

        async function checkConnection() {
            if (window.ethereum) {
                try {
                    const accounts = await window.ethereum.request({ method: 'eth_accounts' });
                    if (accounts.length > 0) {
                        await connectWallet();
                    }
                } catch (error) {
                    console.error("Connection check failed:", error);
                }
            }
        }

        async function connectWallet() {
            try {
                if (!window.ethereum) {
                    showStatus('Please install MetaMask!', 'error');
                    return;
                }

                const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                userAddress = accounts[0];
                
                provider = new ethers.providers.Web3Provider(window.ethereum);
                signer = provider.getSigner();
                
                await ensureCorrectNetwork();
                
                batchContract = new ethers.Contract(BATCH_CONTRACT, BATCH_ABI, signer);
                adrianToken = new ethers.Contract(ADRIAN_TOKEN, ERC20_ABI, signer);
                
                updateWalletUI();
                await loadBalances();
                await loadBatchInfo();
                updateTotalPrice();
                
                showStatus('Wallet connected successfully!', 'success');
                
            } catch (error) {
                console.error('Connection error:', error);
                showStatus('Failed to connect wallet', 'error');
            }
        }

        function updateWalletUI() {
            document.getElementById('connectBtn').style.display = 'none';
            document.getElementById('walletInfo').style.display = 'block';
            document.getElementById('walletAddress').textContent = 
                `${userAddress.slice(0,6)}...${userAddress.slice(-4)}`;
        }

        async function ensureCorrectNetwork() {
            try {
                const { chainId } = await provider.getNetwork();
                if (chainId !== BASE_CHAIN_ID) {
                    document.getElementById('networkWarning').style.display = 'block';
                    throw new Error('Wrong network. Please switch to Base.');
                } else {
                    document.getElementById('networkWarning').style.display = 'none';
                }
            } catch (error) {
                console.error('Network check failed:', error);
                throw error;
            }
        }

        async function switchToBase() {
            try {
                await window.ethereum.request({
                    method: 'wallet_switchEthereumChain',
                    params: [{ chainId: BASE_CHAIN_ID_HEX }]
                });
                setTimeout(() => window.location.reload(), 1000);
            } catch (switchError) {
                if (switchError.code === 4902) {
                    try {
                        await window.ethereum.request({
                            method: 'wallet_addEthereumChain',
                            params: [{
                                chainId: BASE_CHAIN_ID_HEX,
                                chainName: 'Base',
                                nativeCurrency: { name: 'ETH', symbol: 'ETH', decimals: 18 },
                                rpcUrls: ['https://mainnet.base.org'],
                                blockExplorerUrls: ['https://basescan.org']
                            }]
                        });
                        setTimeout(() => window.location.reload(), 1000);
                    } catch (addError) {
                        console.error('Add network error:', addError);
                    }
                }
            }
        }

        async function loadBatchInfo() {
            try {
                if (!batchContract) {
                    provider = new ethers.providers.Web3Provider(window.ethereum);
                    batchContract = new ethers.Contract(BATCH_CONTRACT, BATCH_ABI, provider);
                }
                
                const batchInfo = await batchContract.getBatchInfo(BATCH_ID);
                batchPrice = batchInfo.price;
                batchMaxSupply = batchInfo.maxSupply.toNumber();
                batchMinted = batchInfo.minted.toNumber();
                batchMaxPerWallet = batchInfo.maxPerWallet.toNumber();
                
                const priceFormatted = ethers.utils.formatEther(batchPrice);
                document.getElementById('batchPrice').textContent = parseFloat(priceFormatted).toLocaleString();
                document.getElementById('batchSupply').textContent = `${batchMinted.toLocaleString()} / ${batchMaxSupply.toLocaleString()}`;
                document.getElementById('maxPerWallet').textContent = batchMaxPerWallet;
                
                updateTotalPrice();
                
                if (userAddress) {
                    const mintBtn = document.getElementById('mintBtn');
                    if (mintBtn && batchInfo.active) {
                        mintBtn.disabled = false;
                    }
                }
            } catch (error) {
                console.error('Error loading batch info:', error);
                document.getElementById('batchPrice').textContent = 'Error';
                document.getElementById('batchSupply').textContent = 'Error';
            }
        }

        async function loadBalances() {
            try {
                const balance = await adrianToken.balanceOf(userAddress);
                adrianBalance = parseFloat(ethers.utils.formatEther(balance));
                
                const allowance = await adrianToken.allowance(userAddress, BATCH_CONTRACT);
                approvedAmount = parseFloat(ethers.utils.formatEther(allowance));
            } catch (error) {
                console.error('Error loading balances:', error);
            }
        }

        function changeQuantity(delta) {
            const newQuantity = currentQuantity + delta;
            if (newQuantity >= 1 && newQuantity <= 10 && newQuantity <= batchMaxPerWallet) {
                currentQuantity = newQuantity;
                document.getElementById('quantity').textContent = currentQuantity;
                updateTotalPrice();
            }
        }

        function updateTotalPrice() {
            if (!batchPrice) return;
            
            const totalWei = batchPrice.mul(currentQuantity);
            const totalEth = ethers.utils.formatEther(totalWei);
            document.getElementById('totalPrice').textContent = parseFloat(totalEth).toLocaleString();
        }

        async function mintBatch() {
            if (!userAddress || !batchContract) {
                showStatus('Connect wallet first!', 'error');
                return;
            }
            
            try {
                const button = document.getElementById('mintBtn');
                button.disabled = true;
                button.classList.add('btn-loading');
                
                // Calculate total cost
                const totalCost = batchPrice.mul(currentQuantity);
                const totalCostEther = parseFloat(ethers.utils.formatEther(totalCost));
                
                // Check balance
                if (totalCostEther > adrianBalance) {
                    showStatus('Insufficient $ADRIAN balance', 'error');
                    button.disabled = false;
                    button.classList.remove('btn-loading');
                    return;
                }
                
                // Check and handle approval
                if (totalCostEther > approvedAmount) {
                    showStatus('Approving $ADRIAN tokens...', 'loading');
                    const approveTx = await adrianToken.approve(BATCH_CONTRACT, totalCost);
                    await approveTx.wait();
                    showStatus('Approval successful!', 'success');
                    await loadBalances();
                    await new Promise(resolve => setTimeout(resolve, 1500));
                }
                
                // Execute mint
                showStatus(`Minting ${currentQuantity} SamuraiZERO...`, 'loading');
                
                let tx;
                if (currentQuantity === 1) {
                    tx = await batchContract.mint();
                } else {
                    tx = await batchContract.mintMultiple(currentQuantity);
                }
                
                showStatus('Transaction submitted. Waiting for confirmation...', 'loading');
                await tx.wait();
                
                showStatus(`🎉 Successfully minted ${currentQuantity} SamuraiZERO!`, 'success');
                
                // Refresh data
                await loadBalances();
                await loadBatchInfo();
                
            } catch (error) {
                console.error('Mint error:', error);
                showStatus('Mint failed: ' + parseError(error), 'error');
            } finally {
                const button = document.getElementById('mintBtn');
                if (button) {
                    button.disabled = false;
                    button.classList.remove('btn-loading');
                }
            }
        }

        function showStatus(message, statusType) {
            const statusEl = document.getElementById('statusMessage');
            if (statusEl) {
                statusEl.className = `status-message ${statusType}`;
                statusEl.textContent = message;
                statusEl.style.display = 'block';
                
                if (statusType === 'success') {
                    setTimeout(() => {
                        statusEl.style.display = 'none';
                    }, 10000);
                }
            }
        }

        function parseError(error) {
            if (error.code === 4001) {
                return 'Transaction rejected by user';
            } else if (error.message && error.message.includes('insufficient funds')) {
                return 'Insufficient funds';
            } else if (error.message && error.message.includes('allowance')) {
                return 'Need to approve tokens first';
            } else {
                return error.message || 'Unknown error occurred';
            }
        }

        function setupFadeInAnimations() {
            const observerOptions = {
                threshold: 0.1,
                rootMargin: '0px 0px -50px 0px'
            };

            const observer = new IntersectionObserver(function(entries) {
                entries.forEach(function(entry) {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                    }
                });
            }, observerOptions);

            const fadeElements = document.querySelectorAll('.fade-in');
            fadeElements.forEach(function(el) {
                observer.observe(el);
            });
        }

        // Listen for account changes
        if (window.ethereum) {
            window.ethereum.on('accountsChanged', function (accounts) {
                if (accounts.length === 0) {
                    window.location.reload();
                } else {
                    connectWallet();
                }
            });

            window.ethereum.on('chainChanged', function () {
                window.location.reload();
            });
        }
    </script>
</body>
</html>
