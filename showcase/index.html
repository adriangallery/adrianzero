<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdrianZERO Showcase - Collection Gallery</title>
    <link rel="icon" type="image/x-icon" href="../zeronaked.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="showcase.css">
</head>
<body>
    <!-- Navigation Menu -->
    <div id="menu-container"></div>

    <!-- Main Showcase Container -->
    <div class="showcase-container" id="showcaseContainer">
        <!-- Loading State -->
        <div class="loading-state" id="loadingState">
            <div class="loading-spinner"></div>
            <p class="loading-text">Loading collection...</p>
        </div>

        <!-- Grid Container -->
        <div class="grid-wrapper" id="gridWrapper">
            <div class="showcase-grid" id="showcaseGrid"></div>
        </div>

        <!-- Scroll Indicator -->
        <div class="scroll-indicator" id="scrollIndicator">
            <span>Scroll to explore</span>
        </div>
    </div>

    <!-- Metadata Card Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-container" id="modalContainer">
            <button class="modal-close" id="modalClose" aria-label="Close">×</button>
            
            <div class="modal-content" id="modalContent">
                <!-- Content will be dynamically inserted -->
            </div>

            <!-- Navigation Arrows -->
            <button class="modal-nav modal-nav-prev" id="modalPrev" aria-label="Previous">‹</button>
            <button class="modal-nav modal-nav-next" id="modalNext" aria-label="Next">›</button>
        </div>
    </div>

    <!-- Idle State Overlay -->
    <div class="idle-state-overlay" id="idleStateOverlay">
        <div class="idle-state-text-wrapper">
            <div class="idle-state-text" id="idleStateText"></div>
        </div>
    </div>

    <!-- Scripts -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
    <script>
        // Load menu component
        fetch('../components/menu.html')
            .then(response => response.text())
            .then(html => {
                document.getElementById('menu-container').innerHTML = html;
            })
            .catch(err => console.warn('Menu component not loaded:', err));
    </script>
    <script src="showcase.js"></script>
</body>
</html>
