# CI de traitlabv4 en la Forja del iMac (runner «imac», modo host) desde el 25-oct-2026.
# Equivale a .github/workflows/ci.yml (GitHub Actions), que queda en GitHub como respaldo APAGADO.
name: CI (traitlabv4)

on:
  pull_request:
    paths:
      - 'traitlabv4/**'
      - '.forgejo/workflows/ci.yml'
  push:
    branches: [main]
    paths:
      - 'traitlabv4/**'
      - '.forgejo/workflows/ci.yml'
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: imac
    timeout-minutes: 30
    defaults:
      run:
        working-directory: traitlabv4

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: traitlabv4/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: "Lint (aviso - 67 errores pre-existentes, se limpian en F9/F10)"
        run: npm run lint
        continue-on-error: true

      - name: Typecheck
        run: npx tsc -b --noEmit

      - name: Test
        run: npm test
