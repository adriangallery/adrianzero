<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="600" viewBox="0 0 1920 600" shape-rendering="crispEdges">
  <!-- graveyard tombstones -->
  <g fill="#3a3a42">
    <rect x="60" y="80" width="80" height="160" rx="4"/>
    <rect x="300" y="120" width="70" height="120" rx="4"/>
    <rect x="520" y="70" width="90" height="180" rx="4"/>
