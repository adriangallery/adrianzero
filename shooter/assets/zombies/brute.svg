<svg xmlns="http://www.w3.org/2000/svg" width="96" height="112" viewBox="0 0 24 28" shape-rendering="crispEdges">
  <!-- Brute — bulky purple zombie -->
  <g fill="#5a3a6a">
    <rect x="7" y="1" width="10" height="7"/>
    <rect x="5" y="8" width="14" height="11"/>
    <rect x="3" y="10" width="2" height="8"/>
    <rect x="19" y="10" width="2" height="8"/>
  </g>
  <rect x="7" y="2" width="1" height="1" fill="#704a80"/>
  <rect x="15" y="2" width="1" height="1" fill="#704a80"/>
  <!-- hollow eye sockets -->
  <rect x="9" y="4" width="2" height="2" fill="#0a0a0a"/>
  <rect x="13" y="4" width="2" height="2" fill="#0a0a0a"/>
  <rect x="9" y="4" width="1" height="1" fill="#ff4a4a"/>
  <rect x="14" y="5" width="1" height="1" fill="#ff4a4a"/>
  <!-- massive jaw -->
  <rect x="8" y="6" width="8" height="2" fill="#0a0a0a"/>
  <rect x="9" y="7" width="1" height="1" fill="#ffffff"/>
  <rect x="11" y="7" width="1" height="1" fill="#ffffff"/>
  <rect x="13" y="7" width="1" height="1" fill="#ffffff"/>
  <!-- torn armor -->
  <rect x="5" y="10" width="14" height="6" fill="#2a2a3a"/>
  <rect x="6" y="11" width="3" height="2" fill="#4a3a5a"/>
  <rect x="15" y="13" width="3" height="2" fill="#4a3a5a"/>
  <!-- legs (thick) -->
  <rect x="6" y="19" width="4" height="8" fill="#1a1a2a"/>
  <rect x="14" y="19" width="4" height="8" fill="#1a1a2a"/>
  <rect x="5" y="26" width="5" height="1" fill="#0a0a0a"/>
  <rect x="14" y="26" width="5" height="1" fill="#0a0a0a"/>
</svg>
