<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shooter Game - Admin Panel</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans&display=swap">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Pixelify Sans', sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            color: white;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .wallet-section {
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
        }

        .wallet-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .wallet-address {
            font-family: monospace;
            background: rgba(0,0,0,0.3);
            padding: 10px;
            border-radius: 8px;
            word-break: break-all;
        }

        .btn {
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            border: none;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Pixelify Sans', sans-serif;
            font-size: 16px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255,107,107,0.4);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-success {
            background: linear-gradient(45deg, #00b894, #00a085);
        }

        .btn-danger {
            background: linear-gradient(45deg, #e17055, #d63031);
        }

        .config-section {
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
        }

        .config-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #ffd700;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            background: rgba(0,0,0,0.3);
            color: white;
            font-family: 'Pixelify Sans', sans-serif;
            font-size: 16px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #ffd700;
            box-shadow: 0 0 10px rgba(255,215,0,0.3);
        }

        .score-rewards {
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 20px;
            backdrop-filter: blur(10px);
        }

        .reward-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: rgba(0,0,0,0.2);
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .reward-item input {
            width: 100px;
            margin: 0 10px;
        }

        .status {
            padding: 10px;
            border-radius: 8px;
            margin: 10px 0;
            text-align: center;
        }

        .status.success {
            background: rgba(0,184,148,0.2);
            border: 1px solid #00b894;
        }

        .status.error {
            background: rgba(214,48,49,0.2);
            border: 1px solid #d63031;
        }

        .status.info {
            background: rgba(116,185,255,0.2);
            border: 1px solid #74b9ff;
        }

        .hidden {
            display: none;
        }

        .loading {
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid #ffd700;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎮 Shooter Game Admin Panel</h1>
            <p>Configure game rewards and settings</p>
        </div>

        <!-- Wallet Connection Section -->
        <div class="wallet-section">
            <div class="wallet-info">
                <div>
                    <h3>Wallet Connection</h3>
                    <div id="walletAddress" class="wallet-address">Not connected</div>
                </div>
                <button id="connectWallet" class="btn">Connect Wallet</button>
            </div>
            <div id="walletStatus" class="status hidden"></div>
        </div>

        <!-- Game Configuration Section -->
        <div class="config-section">
            <h3>🎯 Game Configuration</h3>
            <div class="config-grid">
                <div class="form-group">
                    <label for="burnTokenId">Burn Token ID (ERC1155)</label>
                    <input type="number" id="burnTokenId" placeholder="Token ID to burn for playing">
                </div>
                <div class="form-group">
                    <label for="playCost">Play Cost (ETH)</label>
                    <input type="number" id="playCost" step="0.001" placeholder="Cost in ETH to play">
                </div>
            </div>
            <button id="updateConfig" class="btn btn-success">Update Configuration</button>
        </div>

        <!-- Score Rewards Section -->
        <div class="score-rewards">
            <h3>🏆 Score Rewards Configuration</h3>
            <div id="rewardsList">
                <!-- Dynamic rewards will be added here -->
            </div>
            <div style="margin-top: 20px;">
                <button id="addReward" class="btn">Add New Reward</button>
                <button id="saveRewards" class="btn btn-success">Save All Rewards</button>
            </div>
        </div>

        <!-- Status Messages -->
        <div id="statusMessages"></div>
    </div>

    <script type="module">
        import { WalletManager, SHOOTER_CONTRACT_ABI } from '../utils/wallet.js';

        class AdminPanel {
            constructor() {
                this.walletManager = new WalletManager();
                this.contractAddress = '0x...'; // Replace with actual contract address
                this.adminWallet = '0x4943407105999e3E97EFA2035F5cbC64D72581C6';
                this.rewards = [];
                this.init();
            }

            async init() {
                // Initialize wallet
                try {
                    await this.walletManager.init(this.contractAddress, SHOOTER_CONTRACT_ABI);
                    this.setupEventListeners();
                    this.loadConfiguration();
                } catch (error) {
                    this.showStatus('Error initializing wallet: ' + error.message, 'error');
                }
            }

            setupEventListeners() {
                document.getElementById('connectWallet').addEventListener('click', () => this.connectWallet());
                document.getElementById('updateConfig').addEventListener('click', () => this.updateConfiguration());
                document.getElementById('addReward').addEventListener('click', () => this.addReward());
                document.getElementById('saveRewards').addEventListener('click', () => this.saveRewards());
            }

            async connectWallet() {
                try {
                    const account = await this.walletManager.connect();
                    
                    // Check if connected wallet is admin
                    if (account.toLowerCase() !== this.adminWallet.toLowerCase()) {
                        this.showStatus('Error: Connected wallet is not authorized admin', 'error');
                        this.walletManager.disconnect();
                        return;
                    }

                    document.getElementById('walletAddress').textContent = account;
                    document.getElementById('connectWallet').textContent = 'Connected';
                    document.getElementById('connectWallet').disabled = true;
                    
                    this.showStatus('Wallet connected successfully!', 'success');
                    this.loadConfiguration();
                } catch (error) {
                    this.showStatus('Failed to connect wallet: ' + error.message, 'error');
                }
            }

            async loadConfiguration() {
                if (!this.walletManager.isConnected) return;

                try {
                    const config = await this.walletManager.contract.getGameConfig();
                    document.getElementById('burnTokenId').value = config.burnTokenId;
                    document.getElementById('playCost').value = this.walletManager.provider.utils.formatEther(config.playCost);
                } catch (error) {
                    this.showStatus('Error loading configuration: ' + error.message, 'error');
                }
            }

            async updateConfiguration() {
                if (!this.walletManager.isConnected) {
                    this.showStatus('Please connect wallet first', 'error');
                    return;
                }

                try {
                    const burnTokenId = document.getElementById('burnTokenId').value;
                    const playCost = document.getElementById('playCost').value;

                    if (!burnTokenId || !playCost) {
                        this.showStatus('Please fill in all fields', 'error');
                        return;
                    }

                    const tx = await this.walletManager.contract.setGameConfig(
                        burnTokenId,
                        this.walletManager.provider.utils.parseEther(playCost)
                    );

                    this.showStatus('Transaction sent: ' + tx.hash, 'info');
                    await tx.wait();
                    this.showStatus('Configuration updated successfully!', 'success');
                } catch (error) {
                    this.showStatus('Error updating configuration: ' + error.message, 'error');
                }
            }

            addReward() {
                const rewardsList = document.getElementById('rewardsList');
                const rewardItem = document.createElement('div');
                rewardItem.className = 'reward-item';
                rewardItem.innerHTML = `
                    <span>Score:</span>
                    <input type="number" placeholder="Min Score" class="score-input">
                    <span>Token ID:</span>
                    <input type="number" placeholder="Reward Token ID" class="token-input">
                    <span>Amount:</span>
                    <input type="number" placeholder="Amount" class="amount-input">
                    <button class="btn btn-danger" onclick="this.parentElement.remove()">Remove</button>
                `;
                rewardsList.appendChild(rewardItem);
            }

            async saveRewards() {
                if (!this.walletManager.isConnected) {
                    this.showStatus('Please connect wallet first', 'error');
                    return;
                }

                try {
                    const rewardItems = document.querySelectorAll('.reward-item');
                    const scores = [];
                    const tokenIds = [];
                    const amounts = [];

                    for (const item of rewardItems) {
                        const score = item.querySelector('.score-input').value;
                        const tokenId = item.querySelector('.token-input').value;
                        const amount = item.querySelector('.amount-input').value;

                        if (score && tokenId && amount) {
                            scores.push(score);
                            tokenIds.push(tokenId);
                            amounts.push(amount);
                        }
                    }

                    if (scores.length === 0) {
                        this.showStatus('Please add at least one reward', 'error');
                        return;
                    }

                    const tx = await this.walletManager.contract.batchSetScoreRewards(scores, tokenIds, amounts);
                    this.showStatus('Transaction sent: ' + tx.hash, 'info');
                    await tx.wait();
                    this.showStatus('Rewards updated successfully!', 'success');
                } catch (error) {
                    this.showStatus('Error saving rewards: ' + error.message, 'error');
                }
            }

            showStatus(message, type) {
                const statusDiv = document.getElementById('statusMessages');
                const statusElement = document.createElement('div');
                statusElement.className = `status ${type}`;
                statusElement.textContent = message;
                statusDiv.appendChild(statusElement);

                // Remove after 5 seconds
                setTimeout(() => {
                    statusElement.remove();
                }, 5000);
            }
        }

        // Initialize admin panel
        new AdminPanel();
    </script>
</body>
</html>
