<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shooter Game - ExecutePlay Integration</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans&display=swap">
    <link rel="stylesheet" href="../styles.css">
    <style>
        /* Wallet connection overlay */
        .wallet-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .wallet-modal {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            color: white;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .wallet-modal h2 {
            font-size: 2rem;
            margin-bottom: 20px;
            color: #ffd700;
        }

        .zombie-image {
            width: 150px;
            height: 150px;
            margin-bottom: 20px;
            border-radius: 10px;
        }

        .wallet-info {
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
        }

        .wallet-address {
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            color: #4CAF50;
            word-break: break-all;
        }

        .token-status {
            background: rgba(255,255,255,0.05);
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
            border-left: 4px solid #ffd700;
        }

        .approval-status {
            background: rgba(255,255,255,0.05);
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
            border-left: 4px solid #2196F3;
        }

        .execute-status {
            background: rgba(255,255,255,0.05);
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
            border-left: 4px solid #4CAF50;
        }

        .token-list, .approval-list, .execute-list {
            text-align: left;
            margin: 10px 0;
        }

        .token-item, .approval-item, .execute-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .token-name, .approval-name, .execute-name {
            font-weight: bold;
            color: #ffd700;
        }

        .token-balance, .approval-status-text, .execute-status-text {
            color: #4CAF50;
            font-family: 'Courier New', monospace;
        }

        .approval-status-text.not-approved, .execute-status-text.not-ready {
            color: #f44336;
        }

        .btn {
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            margin: 10px;
            transition: all 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255,107,107,0.4);
        }

        .btn:disabled {
            background: #666;
            cursor: not-allowed;
            transform: none;
        }

        .btn-success {
            background: linear-gradient(45deg, #4CAF50, #45a049);
        }

        .btn-warning {
            background: linear-gradient(45deg, #ff9800, #f57c00);
        }

        .btn-info {
            background: linear-gradient(45deg, #2196F3, #1976D2);
        }

        .hidden {
            display: none;
        }

        .status-message {
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
            text-align: center;
        }

        .status-success {
            background: rgba(76, 175, 80, 0.2);
            color: #4CAF50;
            border: 1px solid #4CAF50;
        }

        .status-error {
            background: rgba(244, 67, 54, 0.2);
            color: #f44336;
            border: 1px solid #f44336;
        }

        .status-info {
            background: rgba(33, 150, 243, 0.2);
            color: #2196F3;
            border: 1px solid #2196F3;
        }

        /* Game UI improvements */
        .game-ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-family: 'Pixelify Sans', cursive;
            z-index: 100;
        }

        .score-display {
            font-size: 1.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        .time-display {
            font-size: 1.2rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        .key-display {
            font-size: 1rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        /* Reward notification */
        .reward-notification {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg, #ffd700, #ffed4e);
            color: #1a1a2e;
            padding: 20px 30px;
            border-radius: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            text-align: center;
            z-index: 2000;
            box-shadow: 0 10px 30px rgba(255, 215, 0, 0.5);
            animation: rewardPulse 2s ease-in-out;
        }

        @keyframes rewardPulse {
            0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0; }
            50% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
        }

        /* Progress steps */
        .progress-steps {
            display: flex;
            justify-content: center;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .step {
            display: flex;
            align-items: center;
            margin: 5px;
        }

        .step-number {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #666;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 10px;
        }

        .step.active .step-number {
            background: #ffd700;
            color: #1a1a2e;
        }

        .step.completed .step-number {
            background: #4CAF50;
            color: white;
        }

        .step-text {
            font-size: 0.8rem;
        }

        /* Transaction details */
        .tx-details {
            background: rgba(255,255,255,0.05);
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
        }

        .tx-hash {
            color: #4CAF50;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <!-- Wallet Connection Overlay -->
    <div id="walletOverlay" class="wallet-overlay">
        <div class="wallet-modal">
            <h2>🎮 Shooter Game - ExecutePlay</h2>
            <img src="../Zombie_Adrian.gif" alt="Zombie Adrian" class="zombie-image">
            <p>Complete setup to play with executePlay integration!</p>
            
            <!-- Progress Steps -->
            <div class="progress-steps">
                <div class="step" id="step1">
                    <div class="step-number">1</div>
                    <div class="step-text">Connect</div>
                </div>
                <div class="step" id="step2">
                    <div class="step-number">2</div>
                    <div class="step-text">Tokens</div>
                </div>
                <div class="step" id="step3">
                    <div class="step-number">3</div>
                    <div class="step-text">Approve</div>
                </div>
                <div class="step" id="step4">
                    <div class="step-number">4</div>
                    <div class="step-text">Execute</div>
                </div>
                <div class="step" id="step5">
                    <div class="step-number">5</div>
                    <div class="step-text">Play</div>
                </div>
            </div>
            
            <div id="walletInfo" class="wallet-info hidden">
                <p><strong>Connected:</strong> <span id="walletAddress" class="wallet-address"></span></p>
                
                <div id="tokenStatus" class="token-status">
                    <p><strong>Token Status:</strong></p>
                    <div id="tokenList" class="token-list"></div>
                </div>
                
                <div id="approvalStatus" class="approval-status">
                    <p><strong>Contract Approval:</strong></p>
                    <div id="approvalList" class="approval-list"></div>
                </div>
                
                <div id="executeStatus" class="execute-status">
                    <p><strong>ExecutePlay Ready:</strong></p>
                    <div id="executeList" class="execute-list"></div>
                </div>
            </div>
            
            <button id="connectWallet" class="btn">Connect Wallet</button>
            <button id="checkTokens" class="btn btn-info hidden">Check Tokens</button>
            <button id="approveContract" class="btn btn-warning hidden">Approve Proxy</button>
            <button id="testExecutePlay" class="btn btn-success hidden">Test ExecutePlay</button>
            <button id="mintKey" class="btn btn-warning hidden">Mint Required Tokens</button>
            <button id="startGame" class="btn btn-success hidden">Start Game</button>
            
            <div id="statusMessage" class="status-message hidden"></div>
            <div id="txDetails" class="tx-details hidden"></div>
        </div>
    </div>

    <!-- Game Canvas -->
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    
    <!-- Game UI -->
    <div class="game-ui">
        <div class="score-display">Score: <span id="score">0</span></div>
        <div class="time-display">Time: <span id="time">60</span></div>
        <div class="key-display">Key: <span id="key">-</span></div>
    </div>

    <!-- Game Over Screen -->
    <div id="gameOverScreen" class="hidden" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: flex; justify-content: center; align-items: center; z-index: 1500;">
        <div style="text-align: center; color: white; font-family: 'Pixelify Sans', cursive;">
            <h1 style="font-size: 3rem; margin-bottom: 20px; color: #ff6b6b;">GAME OVER</h1>
            <p style="font-size: 1.5rem; margin-bottom: 10px;">Your Score: <span id="finalScore" style="color: #ffd700;">0</span></p>
            <p style="font-size: 1.2rem; margin-bottom: 30px;">High Score: <span id="highScore" style="color: #4CAF50;">0</span></p>
            <button id="playAgain" class="btn">Play Again</button>
            <button id="executePlay" class="btn btn-success hidden">Execute Play</button>
        </div>
    </div>

    <!-- Load ethers v6 from reliable CDN -->
    <script src="https://unpkg.com/ethers@6.8.0/dist/ethers.umd.min.js"></script>
    
    <!-- Load configuration -->
    <script src="config.js"></script>
    
    <!-- Load ERC1155 Manager -->
    <script src="utils/erc1155Manager.js"></script>
    
    <!-- Load game modules -->
    <script src="../game.js"></script>
    <script src="../gameUI.js"></script>
    
    <!-- Main game script -->
    <script>
        class ExecutePlayShooterGame {
            constructor() {
                this.walletManager = null;
                this.game = null;
                this.isConnected = false;
                this.hasRequiredTokens = false;
                this.playableTokens = [];
                this.isContractApproved = false;
                this.isExecutePlayReady = false;
                this.currentScore = 0;
                this.highScore = localStorage.getItem('shooterHighScore') || 0;
                this.erc1155Manager = null;
                this.proxyContract = null;
                this.userNonce = 0;
                
                this.init();
            }

            init() {
                this.setupEventListeners();
                this.initializeWallet();
            }

            setupEventListeners() {
                document.getElementById('connectWallet').addEventListener('click', () => this.connectWallet());
                document.getElementById('checkTokens').addEventListener('click', () => this.checkRequiredTokens());
                document.getElementById('approveContract').addEventListener('click', () => this.approveProxyContract());
                document.getElementById('testExecutePlay').addEventListener('click', () => this.testExecutePlay());
                document.getElementById('mintKey').addEventListener('click', () => this.mintRequiredTokens());
                document.getElementById('startGame').addEventListener('click', () => this.startGame());
                document.getElementById('playAgain').addEventListener('click', () => this.playAgain());
                document.getElementById('executePlay').addEventListener('click', () => this.executePlay());
            }

            async initializeWallet() {
                try {
                    if (typeof window.ethereum !== 'undefined') {
                        this.walletManager = new ethers.BrowserProvider(window.ethereum);
                        
                        // Check if already connected
                        const accounts = await this.walletManager.listAccounts();
                        if (accounts.length > 0) {
                            await this.connectWallet();
                        }
                    } else {
                        this.showStatus('MetaMask not installed. Please install MetaMask to play.', 'error');
                    }
                } catch (error) {
                    console.error('Error initializing wallet:', error);
                    this.showStatus('Error initializing wallet: ' + error.message, 'error');
                }
            }

            async connectWallet() {
                try {
                    this.showStatus('Connecting wallet...', 'info');
                    
                    // Request account access
                    await window.ethereum.request({ method: 'eth_requestAccounts' });
                    
                    // Get signer
                    const signer = await this.walletManager.getSigner();
                    const address = await signer.getAddress();
                    
                    // Check network
                    const network = await this.walletManager.getNetwork();
                    if (Number(network.chainId) !== SHOOTER_CONFIG.CHAIN_ID) {
                        await this.switchNetwork();
                    }
                    
                    this.isConnected = true;
                    this.updateWalletUI(address);
                    this.updateStep(1, true);
                    
                    // Initialize ERC1155 Manager
                    this.erc1155Manager = new ERC1155Manager(
                        SHOOTER_CONFIG.ERC1155_CONTRACT, 
                        this.walletManager, 
                        signer
                    );
                    
                    // Initialize proxy contract
                    this.initializeProxyContract();
                    
                    // Auto-check tokens
                    await this.checkRequiredTokens();
                    
                } catch (error) {
                    console.error('Error connecting wallet:', error);
                    this.showStatus('Failed to connect wallet: ' + error.message, 'error');
                }
            }

            initializeProxyContract() {
                const PROXY_ABI = [
                    "function nonces(address) view returns (uint256)",
                    "function executePlay(uint256[] burnIds, uint256[] burnAmts, uint256[] mintIds, uint256[] mintAmts, uint256 nonce, uint256 expiry, bytes signature)"
                ];
                
                this.proxyContract = new ethers.Contract(
                    SHOOTER_CONFIG.PROXY_ADDRESS || '0x...', // Will be set from backend config
                    PROXY_ABI,
                    this.walletManager
                );
            }

            async switchNetwork() {
                try {
                    await window.ethereum.request({
                        method: 'wallet_switchEthereumChain',
                        params: [{ chainId: `0x${SHOOTER_CONFIG.CHAIN_ID.toString(16)}` }],
                    });
                } catch (error) {
                    if (error.code === 4902) {
                        await this.addNetwork();
                    } else {
                        throw error;
                    }
                }
            }

            async addNetwork() {
                await window.ethereum.request({
                    method: 'wallet_addEthereumChain',
                    params: [{
                        chainId: `0x${SHOOTER_CONFIG.CHAIN_ID.toString(16)}`,
                        chainName: SHOOTER_CONFIG.CHAIN_NAME,
                        rpcUrls: [SHOOTER_CONFIG.RPC_URL],
                        blockExplorerUrls: [SHOOTER_CONFIG.BLOCK_EXPLORER_URL],
                        nativeCurrency: {
                            name: 'ETH',
                            symbol: 'ETH',
                            decimals: 18
                        }
                    }]
                });
            }

            updateWalletUI(address) {
                document.getElementById('walletAddress').textContent = address;
                document.getElementById('walletInfo').classList.remove('hidden');
                document.getElementById('connectWallet').classList.add('hidden');
                document.getElementById('checkTokens').classList.remove('hidden');
            }

            updateStep(stepNumber, completed = false) {
                const step = document.getElementById(`step${stepNumber}`);
                if (completed) {
                    step.classList.add('completed');
                } else {
                    step.classList.add('active');
                }
            }

            async checkRequiredTokens() {
                try {
                    this.showStatus('Checking required tokens...', 'info');
                    this.updateStep(2, false);
                    
                    // Get burn tokens from admin config
                    const adminConfig = new AdminConfig();
                    const burnTokens = adminConfig.getActiveBurnTokens();
                    
                    console.log('Required burn tokens:', burnTokens);
                    
                    if (burnTokens.length === 0) {
                        this.showStatus('No tokens required. You can play!', 'success');
                        this.hasRequiredTokens = true;
                        this.updateStep(2, true);
                        await this.checkContractApproval();
                        return;
                    }
                    
                    // Test connection first
                    const connectionTest = await this.erc1155Manager.testConnection();
                    if (!connectionTest) {
                        this.showStatus('Failed to connect to token contract', 'error');
                        return;
                    }
                    
                    this.hasRequiredTokens = await this.erc1155Manager.canPlay(burnTokens);
                    this.playableTokens = await this.erc1155Manager.getPlayableTokens(burnTokens);
                    
                    this.updateTokenStatus(burnTokens, this.playableTokens);
                    
                    if (this.hasRequiredTokens) {
                        this.showStatus('Required tokens found!', 'success');
                        this.updateStep(2, true);
                        await this.checkContractApproval();
                    } else {
                        this.showStatus('Required tokens not found. Check admin panel for required tokens.', 'error');
                        this.showMintButton();
                    }
                    
                } catch (error) {
                    console.error('Error checking required tokens:', error);
                    this.showStatus('Error checking tokens: ' + error.message, 'error');
                }
            }

            async checkContractApproval() {
                try {
                    this.showStatus('Checking contract approval...', 'info');
                    this.updateStep(3, false);
                    
                    if (!this.erc1155Manager) {
                        this.showStatus('ERC1155 Manager not initialized', 'error');
                        return;
                    }
                    
                    // Check if proxy contract is approved
                    this.isContractApproved = await this.erc1155Manager.isShooterApproved(SHOOTER_CONFIG.PROXY_ADDRESS || '0x...');
                    
                    this.updateApprovalStatus();
                    
                    if (this.isContractApproved) {
                        this.showStatus('Contract already approved!', 'success');
                        this.updateStep(3, true);
                        await this.checkExecutePlayReady();
                    } else {
                        this.showStatus('Contract approval required', 'info');
                        this.showApproveButton();
                    }
                    
                } catch (error) {
                    console.error('Error checking contract approval:', error);
                    this.showStatus('Error checking approval: ' + error.message, 'error');
                }
            }

            async checkExecutePlayReady() {
                try {
                    this.showStatus('Checking executePlay readiness...', 'info');
                    this.updateStep(4, false);
                    
                    // Get user nonce from backend
                    const signer = await this.walletManager.getSigner();
                    const userAddress = await signer.getAddress();
                    
                    const response = await fetch(`${SHOOTER_CONFIG.BACKEND_URL}/nonce/${userAddress}`);
                    const nonceData = await response.json();
                    this.userNonce = nonceData.nonce;
                    
                    this.isExecutePlayReady = this.hasRequiredTokens && this.isContractApproved;
                    
                    this.updateExecuteStatus();
                    
                    if (this.isExecutePlayReady) {
                        this.showStatus('ExecutePlay ready!', 'success');
                        this.updateStep(4, true);
                        this.showTestExecuteButton();
                    } else {
                        this.showStatus('ExecutePlay not ready', 'error');
                    }
                    
                } catch (error) {
                    console.error('Error checking executePlay readiness:', error);
                    this.showStatus('Error checking executePlay: ' + error.message, 'error');
                }
            }

            async approveProxyContract() {
                try {
                    this.showStatus('Approving proxy contract...', 'info');
                    
                    if (!this.erc1155Manager) {
                        this.showStatus('ERC1155 Manager not initialized', 'error');
                        return;
                    }
                    
                    const success = await this.erc1155Manager.setApprovalForShooter(SHOOTER_CONFIG.PROXY_ADDRESS || '0x...');
                    
                    if (success) {
                        this.isContractApproved = true;
                        this.showStatus('Contract approved successfully!', 'success');
                        this.updateStep(3, true);
                        this.updateApprovalStatus();
                        await this.checkExecutePlayReady();
                    } else {
                        this.showStatus('Failed to approve contract', 'error');
                    }
                    
                } catch (error) {
                    console.error('Error approving contract:', error);
                    this.showStatus('Error approving contract: ' + error.message, 'error');
                }
            }

            async testExecutePlay() {
                try {
                    this.showStatus('Testing executePlay...', 'info');
                    
                    const signer = await this.walletManager.getSigner();
                    const userAddress = await signer.getAddress();
                    
                    // Get reward for test score
                    const adminConfig = new AdminConfig();
                    const testScore = 100;
                    const reward = adminConfig.getRewardForScore(testScore);
                    
                    if (!reward) {
                        this.showStatus('No reward available for test', 'error');
                        return;
                    }
                    
                    // Request signature from backend
                    const response = await fetch(`${SHOOTER_CONFIG.BACKEND_URL}/sign-play`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            userAddress,
                            score: testScore,
                            burnTokenId: 1, // Default burn token
                            burnAmount: 1,
                            rewardTokenId: reward.tokenId,
                            rewardAmount: reward.amount
                        })
                    });
                    
                    if (!response.ok) {
                        throw new Error('Failed to get signed play authorization');
                    }
                    
                    const signedData = await response.json();
                    
                    // Call executePlay
                    const tx = await this.proxyContract.executePlay(
                        signedData.burnIds,
                        signedData.burnAmts,
                        signedData.mintIds,
                        signedData.mintAmts,
                        signedData.nonce,
                        signedData.expiry,
                        signedData.signature
                    );
                    
                    this.showTxDetails(tx.hash);
                    this.showStatus('ExecutePlay test successful!', 'success');
                    this.updateStep(4, true);
                    this.showStartButton();
                    
                } catch (error) {
                    console.error('Error testing executePlay:', error);
                    this.showStatus('Error testing executePlay: ' + error.message, 'error');
                }
            }

            updateTokenStatus(requiredTokens, playableTokens) {
                const tokenList = document.getElementById('tokenList');
                tokenList.innerHTML = '';
                
                requiredTokens.forEach(token => {
                    const playableToken = playableTokens.find(pt => pt.id === token.id);
                    const hasEnough = playableToken && playableToken.availableBalance >= token.amount;
                    
                    const tokenItem = document.createElement('div');
                    tokenItem.className = 'token-item';
                    tokenItem.innerHTML = `
                        <span class="token-name">${token.name} (ID: ${token.id})</span>
                        <span class="token-balance" style="color: ${hasEnough ? '#4CAF50' : '#f44336'}">
                            ${playableToken ? playableToken.availableBalance : 0} / ${token.amount}
                        </span>
                    `;
                    tokenList.appendChild(tokenItem);
                });
            }

            updateApprovalStatus() {
                const approvalList = document.getElementById('approvalList');
                approvalList.innerHTML = '';
                
                const approvalItem = document.createElement('div');
                approvalItem.className = 'approval-item';
                approvalItem.innerHTML = `
                    <span class="approval-name">Proxy Contract</span>
                    <span class="approval-status-text ${this.isContractApproved ? '' : 'not-approved'}">
                        ${this.isContractApproved ? 'Approved' : 'Not Approved'}
                    </span>
                `;
                approvalList.appendChild(approvalItem);
            }

            updateExecuteStatus() {
                const executeList = document.getElementById('executeList');
                executeList.innerHTML = '';
                
                const executeItem = document.createElement('div');
                executeItem.className = 'execute-item';
                executeItem.innerHTML = `
                    <span class="execute-name">ExecutePlay</span>
                    <span class="execute-status-text ${this.isExecutePlayReady ? '' : 'not-ready'}">
                        ${this.isExecutePlayReady ? 'Ready' : 'Not Ready'}
                    </span>
                `;
                executeList.appendChild(executeItem);
            }

            showTxDetails(txHash) {
                const txDetails = document.getElementById('txDetails');
                txDetails.innerHTML = `
                    <strong>Transaction Hash:</strong><br>
                    <span class="tx-hash">${txHash}</span><br>
                    <strong>Status:</strong> Pending confirmation...
                `;
                txDetails.classList.remove('hidden');
            }

            showStartButton() {
                document.getElementById('startGame').classList.remove('hidden');
                document.getElementById('mintKey').classList.add('hidden');
                document.getElementById('approveContract').classList.add('hidden');
                document.getElementById('testExecutePlay').classList.add('hidden');
                this.updateStep(5, false);
            }

            showTestExecuteButton() {
                document.getElementById('testExecutePlay').classList.remove('hidden');
                document.getElementById('mintKey').classList.add('hidden');
                document.getElementById('approveContract').classList.add('hidden');
                document.getElementById('startGame').classList.add('hidden');
            }

            showApproveButton() {
                document.getElementById('approveContract').classList.remove('hidden');
                document.getElementById('mintKey').classList.add('hidden');
                document.getElementById('testExecutePlay').classList.add('hidden');
                document.getElementById('startGame').classList.add('hidden');
            }

            showMintButton() {
                document.getElementById('mintKey').classList.remove('hidden');
                document.getElementById('approveContract').classList.add('hidden');
                document.getElementById('testExecutePlay').classList.add('hidden');
                document.getElementById('startGame').classList.add('hidden');
            }

            async mintRequiredTokens() {
                this.showStatus('Minting required tokens...', 'info');
                this.showStatus('Token minting not implemented yet. Please get tokens from admin panel.', 'error');
            }

            startGame() {
                this.hideWalletOverlay();
                this.initializeGame();
                this.updateStep(5, true);
            }

            hideWalletOverlay() {
                document.getElementById('walletOverlay').style.display = 'none';
            }

            initializeGame() {
                this.game = new ShooterGame();
                this.game.onScoreUpdate = (score) => this.updateScore(score);
                this.game.onGameOver = (finalScore) => this.handleGameOver(finalScore);
                this.game.start();
            }

            updateScore(score) {
                this.currentScore = score;
                document.getElementById('score').textContent = score;
            }

            handleGameOver(finalScore) {
                this.currentScore = finalScore;
                
                if (finalScore > this.highScore) {
                    this.highScore = finalScore;
                    localStorage.setItem('shooterHighScore', this.highScore);
                }
                
                document.getElementById('finalScore').textContent = finalScore;
                document.getElementById('highScore').textContent = this.highScore;
                
                if (this.hasRequiredTokens && this.playableTokens.length > 0) {
                    document.getElementById('executePlay').classList.remove('hidden');
                }
                
                document.getElementById('gameOverScreen').classList.remove('hidden');
            }

            playAgain() {
                document.getElementById('gameOverScreen').classList.add('hidden');
                document.getElementById('executePlay').classList.add('hidden');
                this.initializeGame();
            }

            async executePlay() {
                try {
                    this.showStatus('Executing play...', 'info');
                    
                    const signer = await this.walletManager.getSigner();
                    const userAddress = await signer.getAddress();
                    
                    // Get reward for current score
                    const adminConfig = new AdminConfig();
                    const reward = adminConfig.getRewardForScore(this.currentScore);
                    
                    if (!reward) {
                        this.showStatus('No reward available for this score', 'error');
                        return;
                    }
                    
                    // Request signature from backend
                    const response = await fetch(`${SHOOTER_CONFIG.BACKEND_URL}/sign-play`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            userAddress,
                            score: this.currentScore,
                            burnTokenId: 1, // Default burn token
                            burnAmount: 1,
                            rewardTokenId: reward.tokenId,
                            rewardAmount: reward.amount
                        })
                    });
                    
                    if (!response.ok) {
                        throw new Error('Failed to get signed play authorization');
                    }
                    
                    const signedData = await response.json();
                    
                    // Call executePlay
                    const tx = await this.proxyContract.executePlay(
                        signedData.burnIds,
                        signedData.burnAmts,
                        signedData.mintIds,
                        signedData.mintAmts,
                        signedData.nonce,
                        signedData.expiry,
                        signedData.signature
                    );
                    
                    const receipt = await tx.wait();
                    
                    this.showRewardNotification(`Play executed! Burned token, minted ${reward.amount} x ${reward.name}`);
                    this.showStatus('Play executed successfully!', 'success');
                    this.showTxDetails(tx.hash);
                    
                } catch (error) {
                    console.error('Error executing play:', error);
                    this.showStatus('Failed to execute play: ' + error.message, 'error');
                }
            }

            showRewardNotification(message) {
                const notification = document.createElement('div');
                notification.className = 'reward-notification';
                notification.textContent = message;
                document.body.appendChild(notification);
                
                setTimeout(() => {
                    document.body.removeChild(notification);
                }, 3000);
            }

            showStatus(message, type) {
                const statusDiv = document.getElementById('statusMessage');
                statusDiv.textContent = message;
                statusDiv.className = `status-message status-${type}`;
                statusDiv.classList.remove('hidden');
                
                setTimeout(() => {
                    statusDiv.classList.add('hidden');
                }, 5000);
            }
        }

        // Admin Configuration (Inline)
        class AdminConfig {
            constructor() {
                this.storageKey = 'shooterGameAdminConfig';
                this.defaultConfig = {
                    burnTokens: [
                        {
                            id: 1,
                            name: 'Basic Token',
                            amount: 1,
                            active: true
                        }
                    ],
                    rewards: [
                        {
                            score: 100,
                            tokenId: 2,
                            amount: 1,
                            name: 'Bronze Reward'
                        },
                        {
                            score: 500,
                            tokenId: 3,
                            amount: 5,
                            name: 'Silver Reward'
                        },
                        {
                            score: 1000,
                            tokenId: 4,
                            amount: 10,
                            name: 'Gold Reward'
                        }
                    ],
                    lastUpdated: null
                };
                this.loadConfig();
            }

            loadConfig() {
                try {
                    const stored = localStorage.getItem(this.storageKey);
                    if (stored) {
                        this.config = JSON.parse(stored);
                    } else {
                        this.config = { ...this.defaultConfig };
                        this.saveConfig();
                    }
                } catch (error) {
                    console.error('Error loading config:', error);
                    this.config = { ...this.defaultConfig };
                }
            }

            saveConfig() {
                try {
                    this.config.lastUpdated = new Date().toISOString();
                    localStorage.setItem(this.storageKey, JSON.stringify(this.config));
                    return true;
                } catch (error) {
                    console.error('Error saving config:', error);
                    return false;
                }
            }

            getBurnTokens() {
                return this.config.burnTokens || [];
            }

            getActiveBurnTokens() {
                return this.config.burnTokens.filter(t => t.active);
            }

            getRewards() {
                return this.config.rewards || [];
            }

            getRewardForScore(score) {
                const sortedRewards = this.config.rewards.sort((a, b) => b.score - a.score);
                return sortedRewards.find(r => score >= r.score);
            }
        }

        // Initialize game when page loads
        document.addEventListener('DOMContentLoaded', () => {
            new ExecutePlayShooterGame();
        });
    </script>
</body>
</html>
