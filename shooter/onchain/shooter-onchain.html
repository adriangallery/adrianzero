<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shooter Game - Onchain Rewards</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans&display=swap">
    <link rel="stylesheet" href="../styles.css">
    <style>
        /* Wallet connection overlay */
        .wallet-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .wallet-modal {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            color: white;
            max-width: 500px;
            width: 90%;
        }

        .wallet-modal h2 {
            font-size: 2rem;
            margin-bottom: 20px;
            color: #ffd700;
        }

        .zombie-image {
            width: 150px;
            height: 150px;
            margin-bottom: 20px;
            border-radius: 10px;
        }

        .wallet-info {
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
        }

        .wallet-address {
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            color: #4CAF50;
            word-break: break-all;
        }

        .token-status {
            background: rgba(255,255,255,0.05);
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
            border-left: 4px solid #ffd700;
        }

        .token-list {
            text-align: left;
            margin: 10px 0;
        }

        .token-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .token-name {
            font-weight: bold;
            color: #ffd700;
        }

        .token-balance {
            color: #4CAF50;
            font-family: 'Courier New', monospace;
        }

        .btn {
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            margin: 10px;
            transition: all 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255,107,107,0.4);
        }

        .btn:disabled {
            background: #666;
            cursor: not-allowed;
            transform: none;
        }

        .btn-success {
            background: linear-gradient(45deg, #4CAF50, #45a049);
        }

        .btn-warning {
            background: linear-gradient(45deg, #ff9800, #f57c00);
        }

        .hidden {
            display: none;
        }

        .status-message {
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
            text-align: center;
        }

        .status-success {
            background: rgba(76, 175, 80, 0.2);
            color: #4CAF50;
            border: 1px solid #4CAF50;
        }

        .status-error {
            background: rgba(244, 67, 54, 0.2);
            color: #f44336;
            border: 1px solid #f44336;
        }

        .status-info {
            background: rgba(33, 150, 243, 0.2);
            color: #2196F3;
            border: 1px solid #2196F3;
        }

        /* Game UI improvements */
        .game-ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-family: 'Pixelify Sans', cursive;
            z-index: 100;
        }

        .score-display {
            font-size: 1.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        .time-display {
            font-size: 1.2rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        .key-display {
            font-size: 1rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        /* Reward notification */
        .reward-notification {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg, #ffd700, #ffed4e);
            color: #1a1a2e;
            padding: 20px 30px;
            border-radius: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            text-align: center;
            z-index: 2000;
            box-shadow: 0 10px 30px rgba(255, 215, 0, 0.5);
            animation: rewardPulse 2s ease-in-out;
        }

        @keyframes rewardPulse {
            0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0; }
            50% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
        }

        /* Loading spinner */
        .loading-spinner {
            border: 4px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top: 4px solid #ffd700;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- Wallet Connection Overlay -->
    <div id="walletOverlay" class="wallet-overlay">
        <div class="wallet-modal">
            <h2>🎮 Connect Wallet to Play</h2>
            <img src="../Zombie_Adrian.gif" alt="Zombie Adrian" class="zombie-image">
            <p>You need to connect your wallet and own required tokens to play this game.</p>
            
            <div id="walletInfo" class="wallet-info hidden">
                <p><strong>Connected:</strong> <span id="walletAddress" class="wallet-address"></span></p>
                <div id="tokenStatus" class="token-status">
                    <p><strong>Token Status:</strong></p>
                    <div id="tokenList" class="token-list"></div>
                </div>
            </div>
            
            <button id="connectWallet" class="btn">Connect Wallet</button>
            <button id="mintKey" class="btn btn-warning hidden">Mint Required Tokens</button>
            <button id="startGame" class="btn btn-success hidden">Start Game</button>
            
            <div id="statusMessage" class="status-message hidden"></div>
        </div>
    </div>

    <!-- Game Canvas -->
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    
    <!-- Game UI -->
    <div class="game-ui">
        <div class="score-display">Score: <span id="score">0</span></div>
        <div class="time-display">Time: <span id="time">60</span></div>
        <div class="key-display">Key: <span id="key">-</span></div>
    </div>

    <!-- Game Over Screen -->
    <div id="gameOverScreen" class="hidden" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: flex; justify-content: center; align-items: center; z-index: 1500;">
        <div style="text-align: center; color: white; font-family: 'Pixelify Sans', cursive;">
            <h1 style="font-size: 3rem; margin-bottom: 20px; color: #ff6b6b;">GAME OVER</h1>
            <p style="font-size: 1.5rem; margin-bottom: 10px;">Your Score: <span id="finalScore" style="color: #ffd700;">0</span></p>
            <p style="font-size: 1.2rem; margin-bottom: 30px;">High Score: <span id="highScore" style="color: #4CAF50;">0</span></p>
            <button id="playAgain" class="btn">Play Again</button>
            <button id="claimReward" class="btn btn-success hidden">Claim Reward</button>
        </div>
    </div>

    <!-- Load ethers.js from reliable CDN -->
    <script src="https://unpkg.com/ethers@6.8.0/dist/ethers.umd.min.js"></script>
    
    <!-- Load configuration -->
    <script src="config.js"></script>
    
    <!-- Load ERC1155 Manager -->
    <script src="utils/erc1155Manager.js"></script>
    
    <!-- Game class will be defined inline -->
    
    <!-- Main game script -->
    <script>
        // Standalone Game Class
        class ShooterGame {
            constructor() {
                // Initialize canvas and context
                this.canvas = document.getElementById('gameCanvas');
                if (!this.canvas) {
                    console.error('Canvas element not found!');
                    return;
                }
                
                this.ctx = this.canvas.getContext('2d');
                if (!this.ctx) {
                    console.error('Could not get 2D context from canvas!');
                    return;
                }
                
                // Set canvas to window size
                this.resizeCanvas();
                window.addEventListener('resize', this.resizeCanvas.bind(this));
                
                // Update canvas size to 1920x1080
                this.canvas.width = 1920 * 0.5;
                this.canvas.height = 1080 * 0.5;
                
                // Game state
                this.gameState = 'start'; // 'start', 'playing', 'paused', 'gameOver'
                this.score = 0;
                this.timeLeft = 60;
                this.highScore = localStorage.getItem('shooterHighScore') || 0;
                
                // Game objects
                this.player = {
                    x: this.canvas.width / 2,
                    y: this.canvas.height - 100,
                    width: 50,
                    height: 50,
                    speed: 5,
                    color: '#00ff00'
                };
                
                this.bullets = [];
                this.enemies = [];
                this.particles = [];
                
                // Game timing
                this.lastTime = 0;
                this.timer = null;
                this.spawnTimer = null;
                
                // Callbacks
                this.onScoreUpdate = null;
                this.onGameOver = null;
                
                // Load background images
                this.loadBackgroundImages();
                
                // Setup event listeners
                this.setupEventListeners();
                
                // Create UI elements
                this.createUIElements();
            }
            
            resizeCanvas() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
            }
            
            loadBackgroundImages() {
                // Load main background
                const bgImage = new Image();
                bgImage.onload = () => {
                    this.backgroundLayers = [
                        { image: bgImage, speed: 0.1, x: 0, y: 0, width: this.canvas.width, height: this.canvas.height }
                    ];
                };
                bgImage.src = '../level1.png';
            }
            
            setupEventListeners() {
                // Keyboard controls
                this.keys = {};
                document.addEventListener('keydown', (e) => {
                    this.keys[e.code] = true;
                });
                
                document.addEventListener('keyup', (e) => {
                    this.keys[e.code] = false;
                });
                
                // Mouse controls
                this.canvas.addEventListener('mousemove', (e) => {
                    const rect = this.canvas.getBoundingClientRect();
                    this.mouseX = e.clientX - rect.left;
                    this.mouseY = e.clientY - rect.top;
                });
                
                this.canvas.addEventListener('click', (e) => {
                    if (this.gameState === 'playing') {
                        this.shoot();
                    }
                });
            }
            
            createUIElements() {
                // Create UI container if it doesn't exist
                let uiContainer = document.getElementById('uiContainer');
                if (!uiContainer) {
                    uiContainer = document.createElement('div');
                    uiContainer.id = 'uiContainer';
                    uiContainer.style.position = 'absolute';
                    uiContainer.style.top = '0';
                    uiContainer.style.left = '0';
                    uiContainer.style.width = '100%';
                    uiContainer.style.height = '100%';
                    uiContainer.style.pointerEvents = 'none';
                    uiContainer.style.zIndex = '100';
                    document.body.appendChild(uiContainer);
                }
                
                // Create score display
                let scoreDisplay = document.getElementById('scoreDisplay');
                if (!scoreDisplay) {
                    scoreDisplay = document.createElement('div');
                    scoreDisplay.id = 'scoreDisplay';
                    scoreDisplay.style.position = 'absolute';
                    scoreDisplay.style.top = '20px';
                    scoreDisplay.style.left = '20px';
                    scoreDisplay.style.color = 'white';
                    scoreDisplay.style.fontSize = '24px';
                    scoreDisplay.style.fontFamily = 'Arial, sans-serif';
                    scoreDisplay.style.textShadow = '2px 2px 4px rgba(0,0,0,0.8)';
                    scoreDisplay.textContent = 'Score: 0';
                    uiContainer.appendChild(scoreDisplay);
                }
                
                // Create time display
                let timeDisplay = document.getElementById('timeDisplay');
                if (!timeDisplay) {
                    timeDisplay = document.createElement('div');
                    timeDisplay.id = 'timeDisplay';
                    timeDisplay.style.position = 'absolute';
                    timeDisplay.style.top = '60px';
                    timeDisplay.style.left = '20px';
                    timeDisplay.style.color = 'white';
                    timeDisplay.style.fontSize = '24px';
                    timeDisplay.style.fontFamily = 'Arial, sans-serif';
                    timeDisplay.style.textShadow = '2px 2px 4px rgba(0,0,0,0.8)';
                    timeDisplay.textContent = 'Time: 60';
                    uiContainer.appendChild(timeDisplay);
                }
            }
            
            start() {
                if (this.gameState === 'start') {
                    this.gameState = 'playing';
                    this.score = 0;
                    this.timeLeft = 60;
                    this.bullets = [];
                    this.enemies = [];
                    this.particles = [];
                    
                    // Clear any existing timers
                    if (this.timer) clearInterval(this.timer);
                    if (this.spawnTimer) clearInterval(this.spawnTimer);
                    
                    // Start game loop
                    this.timer = setInterval(() => {
                        this.timeLeft--;
                        if (this.timeLeft <= 0) {
                            this.endGame();
                        }
                    }, 1000);
                    
                    // Start enemy spawning
                    this.spawnTimer = setInterval(() => {
                        this.spawnEnemy();
                    }, 2000);
                    
                    // Start game loop
                    this.gameLoop();
                }
            }
            
            endGame() {
                this.gameState = 'gameOver';
                
                // Clear timers
                if (this.timer) clearInterval(this.timer);
                if (this.spawnTimer) clearInterval(this.spawnTimer);
                
                // Update high score
                if (this.score > this.highScore) {
                    this.highScore = this.score;
                    localStorage.setItem('shooterHighScore', this.highScore);
                }
                
                // Call callbacks
                if (this.onScoreUpdate) this.onScoreUpdate(this.score);
                if (this.onGameOver) this.onGameOver(this.score);
                
                // Show game over screen
                this.showGameOverScreen();
            }
            
            showGameOverScreen() {
                const gameOverScreen = document.getElementById('gameOverScreen');
                if (gameOverScreen) {
                    const finalScore = document.getElementById('finalScore');
                    const highScore = document.getElementById('highScore');
                    
                    if (finalScore) finalScore.textContent = this.score;
                    if (highScore) highScore.textContent = this.highScore;
                    
                    gameOverScreen.classList.remove('hidden');
                }
            }
            
            spawnEnemy() {
                if (this.gameState !== 'playing') return;
                
                const enemy = {
                    x: Math.random() * (this.canvas.width - 50),
                    y: -50,
                    width: 50,
                    height: 50,
                    speed: 2 + Math.random() * 3,
                    color: '#ff0000'
                };
                
                this.enemies.push(enemy);
            }
            
            shoot() {
                if (this.gameState !== 'playing') return;
                
                const bullet = {
                    x: this.player.x + this.player.width / 2,
                    y: this.player.y,
                    width: 5,
                    height: 10,
                    speed: 8,
                    color: '#ffff00'
                };
                
                this.bullets.push(bullet);
            }
            
            update() {
                if (this.gameState !== 'playing') return;
                
                // Update player
                this.updatePlayer();
                
                // Update bullets
                this.updateBullets();
                
                // Update enemies
                this.updateEnemies();
                
                // Update particles
                this.updateParticles();
                
                // Check collisions
                this.checkCollisions();
                
                // Update UI
                this.updateUI();
            }
            
            updatePlayer() {
                // Keyboard movement
                if (this.keys['ArrowLeft'] || this.keys['KeyA']) {
                    this.player.x = Math.max(0, this.player.x - this.player.speed);
                }
                if (this.keys['ArrowRight'] || this.keys['KeyD']) {
                    this.player.x = Math.min(this.canvas.width - this.player.width, this.player.x + this.player.speed);
                }
                if (this.keys['ArrowUp'] || this.keys['KeyW']) {
                    this.player.y = Math.max(0, this.player.y - this.player.speed);
                }
                if (this.keys['ArrowDown'] || this.keys['KeyS']) {
                    this.player.y = Math.min(this.canvas.height - this.player.height, this.player.y + this.player.speed);
                }
                
                // Mouse movement
                if (this.mouseX !== undefined && this.mouseY !== undefined) {
                    this.player.x = this.mouseX - this.player.width / 2;
                    this.player.y = this.mouseY - this.player.height / 2;
                }
            }
            
            updateBullets() {
                for (let i = this.bullets.length - 1; i >= 0; i--) {
                    const bullet = this.bullets[i];
                    bullet.y -= bullet.speed;
                    
                    // Remove bullets that are off screen
                    if (bullet.y < 0) {
                        this.bullets.splice(i, 1);
                    }
                }
            }
            
            updateEnemies() {
                for (let i = this.enemies.length - 1; i >= 0; i--) {
                    const enemy = this.enemies[i];
                    enemy.y += enemy.speed;
                    
                    // Remove enemies that are off screen
                    if (enemy.y > this.canvas.height) {
                        this.enemies.splice(i, 1);
                    }
                }
            }
            
            updateParticles() {
                for (let i = this.particles.length - 1; i >= 0; i--) {
                    const particle = this.particles[i];
                    particle.x += particle.vx;
                    particle.y += particle.vy;
                    particle.life--;
                    
                    if (particle.life <= 0) {
                        this.particles.splice(i, 1);
                    }
                }
            }
            
            checkCollisions() {
                // Bullet vs Enemy collisions
                for (let i = this.bullets.length - 1; i >= 0; i--) {
                    const bullet = this.bullets[i];
                    
                    for (let j = this.enemies.length - 1; j >= 0; j--) {
                        const enemy = this.enemies[j];
                        
                        if (this.isColliding(bullet, enemy)) {
                            // Remove bullet and enemy
                            this.bullets.splice(i, 1);
                            this.enemies.splice(j, 1);
                            
                            // Add score
                            this.score += 10;
                            
                            // Create explosion particles
                            this.createExplosion(enemy.x + enemy.width / 2, enemy.y + enemy.height / 2);
                            
                            break;
                        }
                    }
                }
                
                // Player vs Enemy collisions
                for (let i = this.enemies.length - 1; i >= 0; i--) {
                    const enemy = this.enemies[i];
                    
                    if (this.isColliding(this.player, enemy)) {
                        // Game over
                        this.endGame();
                        break;
                    }
                }
            }
            
            isColliding(rect1, rect2) {
                return rect1.x < rect2.x + rect2.width &&
                       rect1.x + rect1.width > rect2.x &&
                       rect1.y < rect2.y + rect2.height &&
                       rect1.y + rect1.height > rect2.y;
            }
            
            createExplosion(x, y) {
                for (let i = 0; i < 10; i++) {
                    this.particles.push({
                        x: x,
                        y: y,
                        vx: (Math.random() - 0.5) * 10,
                        vy: (Math.random() - 0.5) * 10,
                        life: 30,
                        color: '#ffaa00'
                    });
                }
            }
            
            updateUI() {
                const scoreDisplay = document.getElementById('scoreDisplay');
                const timeDisplay = document.getElementById('timeDisplay');
                
                if (scoreDisplay) scoreDisplay.textContent = `Score: ${this.score}`;
                if (timeDisplay) timeDisplay.textContent = `Time: ${this.timeLeft}`;
                
                // Update score in game UI
                const scoreElement = document.getElementById('score');
                const timeElement = document.getElementById('time');
                
                if (scoreElement) scoreElement.textContent = this.score;
                if (timeElement) timeElement.textContent = this.timeLeft;
                
                // Call score update callback
                if (this.onScoreUpdate) this.onScoreUpdate(this.score);
            }
            
            render() {
                // Clear canvas
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                
                // Draw background
                this.drawBackground();
                
                // Draw game objects
                this.drawPlayer();
                this.drawBullets();
                this.drawEnemies();
                this.drawParticles();
            }
            
            drawBackground() {
                if (this.backgroundLayers && this.backgroundLayers[0] && this.backgroundLayers[0].image) {
                    this.ctx.drawImage(
                        this.backgroundLayers[0].image,
                        0, 0, this.canvas.width, this.canvas.height
                    );
                }
            }
            
            drawPlayer() {
                this.ctx.fillStyle = this.player.color;
                this.ctx.fillRect(this.player.x, this.player.y, this.player.width, this.player.height);
            }
            
            drawBullets() {
                this.ctx.fillStyle = '#ffff00';
                this.bullets.forEach(bullet => {
                    this.ctx.fillRect(bullet.x, bullet.y, bullet.width, bullet.height);
                });
            }
            
            drawEnemies() {
                this.ctx.fillStyle = '#ff0000';
                this.enemies.forEach(enemy => {
                    this.ctx.fillRect(enemy.x, enemy.y, enemy.width, enemy.height);
                });
            }
            
            drawParticles() {
                this.particles.forEach(particle => {
                    this.ctx.fillStyle = particle.color;
                    this.ctx.fillRect(particle.x, particle.y, 3, 3);
                });
            }
            
            gameLoop() {
                this.update();
                this.render();
                
                if (this.gameState === 'playing') {
                    requestAnimationFrame(() => this.gameLoop());
                }
            }
            
            reset() {
                this.gameState = 'start';
                this.score = 0;
                this.timeLeft = 60;
                this.bullets = [];
                this.enemies = [];
                this.particles = [];
                
                // Clear timers
                if (this.timer) clearInterval(this.timer);
                if (this.spawnTimer) clearInterval(this.spawnTimer);
                
                // Reset player position
                this.player.x = this.canvas.width / 2;
                this.player.y = this.canvas.height - 100;
            }
        }

        class OnchainShooterGame {
            constructor() {
                this.walletManager = null;
                this.game = null;
                this.isConnected = false;
                this.hasRequiredTokens = false;
                this.playableTokens = [];
                this.currentScore = 0;
                this.highScore = localStorage.getItem('shooterHighScore') || 0;
                
                this.init();
            }

            init() {
                this.setupEventListeners();
                this.initializeWallet();
            }

            setupEventListeners() {
                document.getElementById('connectWallet').addEventListener('click', () => this.connectWallet());
                document.getElementById('mintKey').addEventListener('click', () => this.mintRequiredTokens());
                document.getElementById('startGame').addEventListener('click', () => this.startGame());
                document.getElementById('playAgain').addEventListener('click', () => this.playAgain());
                document.getElementById('claimReward').addEventListener('click', () => this.claimReward());
            }

            async initializeWallet() {
                try {
                    if (typeof window.ethereum !== 'undefined') {
                        this.walletManager = new ethers.providers.Web3Provider(window.ethereum);
                        
                        // Check if already connected
                        const accounts = await this.walletManager.listAccounts();
                        if (accounts.length > 0) {
                            await this.connectWallet();
                        }
                    } else {
                        this.showStatus('MetaMask not installed. Please install MetaMask to play.', 'error');
                    }
                } catch (error) {
                    console.error('Error initializing wallet:', error);
                    this.showStatus('Error initializing wallet: ' + error.message, 'error');
                }
            }

            async connectWallet() {
                try {
                    this.showStatus('Connecting wallet...', 'info');
                    
                    // Request account access
                    await window.ethereum.request({ method: 'eth_requestAccounts' });
                    
                    // Get signer
                    const signer = this.walletManager.getSigner();
                    const address = await signer.getAddress();
                    
                    // Check network
                    const network = await this.walletManager.getNetwork();
                    if (network.chainId !== SHOOTER_CONFIG.CHAIN_ID) {
                        await this.switchNetwork();
                    }
                    
                    this.isConnected = true;
                    this.updateWalletUI(address);
                    
                    // Check for required tokens
                    await this.checkRequiredTokens();
                    
                } catch (error) {
                    console.error('Error connecting wallet:', error);
                    this.showStatus('Failed to connect wallet: ' + error.message, 'error');
                }
            }

            async switchNetwork() {
                try {
                    await window.ethereum.request({
                        method: 'wallet_switchEthereumChain',
                        params: [{ chainId: `0x${SHOOTER_CONFIG.CHAIN_ID.toString(16)}` }],
                    });
                } catch (error) {
                    if (error.code === 4902) {
                        // Network doesn't exist, add it
                        await this.addNetwork();
                    } else {
                        throw error;
                    }
                }
            }

            async addNetwork() {
                await window.ethereum.request({
                    method: 'wallet_addEthereumChain',
                    params: [{
                        chainId: `0x${SHOOTER_CONFIG.CHAIN_ID.toString(16)}`,
                        chainName: SHOOTER_CONFIG.CHAIN_NAME,
                        rpcUrls: [SHOOTER_CONFIG.RPC_URL],
                        blockExplorerUrls: [SHOOTER_CONFIG.BLOCK_EXPLORER_URL],
                        nativeCurrency: {
                            name: 'ETH',
                            symbol: 'ETH',
                            decimals: 18
                        }
                    }]
                });
            }

            updateWalletUI(address) {
                document.getElementById('walletAddress').textContent = address;
                document.getElementById('walletInfo').classList.remove('hidden');
                document.getElementById('connectWallet').classList.add('hidden');
            }

            async checkRequiredTokens() {
                try {
                    this.showStatus('Checking required tokens...', 'info');
                    
                    // Get burn tokens from admin config
                    const adminConfig = new AdminConfig();
                    const burnTokens = adminConfig.getActiveBurnTokens();
                    
                    console.log('Required burn tokens:', burnTokens);
                    
                    if (burnTokens.length === 0) {
                        this.showStatus('No tokens required. You can play!', 'success');
                        this.hasRequiredTokens = true;
                        this.showStartButton();
                        return;
                    }
                    
                    // Check if player has required tokens
                    const erc1155Manager = new ERC1155Manager(
                        SHOOTER_CONFIG.ERC1155_CONTRACT, 
                        this.walletManager, 
                        this.walletManager.getSigner()
                    );
                    
                    // Test connection first
                    const connectionTest = await erc1155Manager.testConnection();
                    if (!connectionTest) {
                        this.showStatus('Failed to connect to token contract', 'error');
                        return;
                    }
                    
                    this.hasRequiredTokens = await erc1155Manager.canPlay(burnTokens);
                    this.playableTokens = await erc1155Manager.getPlayableTokens(burnTokens);
                    
                    this.updateTokenStatus(burnTokens, this.playableTokens);
                    
                    if (this.hasRequiredTokens) {
                        this.showStatus('Required tokens found! You can play!', 'success');
                        this.showStartButton();
                    } else {
                        this.showStatus('Required tokens not found. Check admin panel for required tokens.', 'error');
                        this.showMintButton();
                    }
                    
                } catch (error) {
                    console.error('Error checking required tokens:', error);
                    this.showStatus('Error checking tokens: ' + error.message, 'error');
                }
            }

            updateTokenStatus(requiredTokens, playableTokens) {
                const tokenList = document.getElementById('tokenList');
                tokenList.innerHTML = '';
                
                requiredTokens.forEach(token => {
                    const playableToken = playableTokens.find(pt => pt.id === token.id);
                    const hasEnough = playableToken && playableToken.availableBalance >= token.amount;
                    
                    const tokenItem = document.createElement('div');
                    tokenItem.className = 'token-item';
                    tokenItem.innerHTML = `
                        <span class="token-name">${token.name} (ID: ${token.id})</span>
                        <span class="token-balance" style="color: ${hasEnough ? '#4CAF50' : '#f44336'}">
                            ${playableToken ? playableToken.availableBalance : 0} / ${token.amount}
                        </span>
                    `;
                    tokenList.appendChild(tokenItem);
                });
            }

            showStartButton() {
                document.getElementById('startGame').classList.remove('hidden');
                document.getElementById('mintKey').classList.add('hidden');
            }

            showMintButton() {
                document.getElementById('mintKey').classList.remove('hidden');
                document.getElementById('startGame').classList.add('hidden');
            }

            async mintRequiredTokens() {
                this.showStatus('Minting required tokens...', 'info');
                // This would integrate with the minting contract
                // For now, just show a message
                this.showStatus('Token minting not implemented yet. Please get tokens from admin panel.', 'error');
            }

            startGame() {
                this.hideWalletOverlay();
                this.initializeGame();
            }

            hideWalletOverlay() {
                document.getElementById('walletOverlay').style.display = 'none';
            }

            initializeGame() {
                // Initialize the game
                this.game = new ShooterGame();
                this.game.onScoreUpdate = (score) => this.updateScore(score);
                this.game.onGameOver = (finalScore) => this.handleGameOver(finalScore);
                this.game.start();
            }

            updateScore(score) {
                this.currentScore = score;
                document.getElementById('score').textContent = score;
            }

            handleGameOver(finalScore) {
                this.currentScore = finalScore;
                
                // Update high score
                if (finalScore > this.highScore) {
                    this.highScore = finalScore;
                    localStorage.setItem('shooterHighScore', this.highScore);
                }
                
                // Update UI
                document.getElementById('finalScore').textContent = finalScore;
                document.getElementById('highScore').textContent = this.highScore;
                
                // Show claim reward button if player has required tokens
                if (this.hasRequiredTokens && this.playableTokens.length > 0) {
                    document.getElementById('claimReward').classList.remove('hidden');
                }
                
                // Show game over screen
                document.getElementById('gameOverScreen').classList.remove('hidden');
            }

            playAgain() {
                document.getElementById('gameOverScreen').classList.add('hidden');
                document.getElementById('claimReward').classList.add('hidden');
                this.initializeGame();
            }

            async claimReward() {
                try {
                    this.showStatus('Claiming reward...', 'info');
                    
                    // Get reward for current score
                    const adminConfig = new AdminConfig();
                    const reward = adminConfig.getRewardForScore(this.currentScore);
                    
                    if (!reward) {
                        this.showStatus('No reward available for this score', 'error');
                        return;
                    }
                    
                    // Send score to backend for signing
                    const response = await fetch(`${SHOOTER_CONFIG.BACKEND_URL}/sign-reward`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            playerAddress: await this.walletManager.getSigner().getAddress(),
                            score: this.currentScore,
                            rewardTokenId: reward.tokenId,
                            rewardAmount: reward.amount
                        })
                    });
                    
                    if (!response.ok) {
                        throw new Error('Failed to get signed reward');
                    }
                    
                    const signedData = await response.json();
                    
                    // Call claimReward on shooter contract
                    const shooterContract = new ethers.Contract(
                        SHOOTER_CONFIG.SHOOTER_CONTRACT,
                        SHOOTER_CONFIG.SHOOTER_ABI,
                        this.walletManager.getSigner()
                    );
                    
                    const tx = await shooterContract.claimReward(
                        signedData.keyId,
                        signedData.score,
                        signedData.nonce,
                        signedData.expiry,
                        signedData.signature
                    );
                    
                    await tx.wait();
                    
                    this.showRewardNotification(`Reward claimed! ${reward.amount} x ${reward.name}`);
                    this.showStatus('Reward claimed successfully!', 'success');
                    
                } catch (error) {
                    console.error('Error claiming reward:', error);
                    this.showStatus('Failed to claim reward: ' + error.message, 'error');
                }
            }

            showRewardNotification(message) {
                const notification = document.createElement('div');
                notification.className = 'reward-notification';
                notification.textContent = message;
                document.body.appendChild(notification);
                
                setTimeout(() => {
                    document.body.removeChild(notification);
                }, 3000);
            }

            showStatus(message, type) {
                const statusDiv = document.getElementById('statusMessage');
                statusDiv.textContent = message;
                statusDiv.className = `status-message status-${type}`;
                statusDiv.classList.remove('hidden');
                
                setTimeout(() => {
                    statusDiv.classList.add('hidden');
                }, 5000);
            }
        }

        // Admin Configuration (Inline)
        class AdminConfig {
            constructor() {
                this.storageKey = 'shooterGameAdminConfig';
                this.defaultConfig = {
                    burnTokens: [
                        {
                            id: 1,
                            name: 'Basic Token',
                            amount: 1,
                            active: true
                        }
                    ],
                    rewards: [
                        {
                            score: 100,
                            tokenId: 2,
                            amount: 1,
                            name: 'Bronze Reward'
                        },
                        {
                            score: 500,
                            tokenId: 3,
                            amount: 5,
                            name: 'Silver Reward'
                        },
                        {
                            score: 1000,
                            tokenId: 4,
                            amount: 10,
                            name: 'Gold Reward'
                        }
                    ],
                    lastUpdated: null
                };
                this.loadConfig();
            }

            loadConfig() {
                try {
                    const stored = localStorage.getItem(this.storageKey);
                    if (stored) {
                        this.config = JSON.parse(stored);
                    } else {
                        this.config = { ...this.defaultConfig };
                        this.saveConfig();
                    }
                } catch (error) {
                    console.error('Error loading config:', error);
                    this.config = { ...this.defaultConfig };
                }
            }

            saveConfig() {
                try {
                    this.config.lastUpdated = new Date().toISOString();
                    localStorage.setItem(this.storageKey, JSON.stringify(this.config));
                    return true;
                } catch (error) {
                    console.error('Error saving config:', error);
                    return false;
                }
            }

            getBurnTokens() {
                return this.config.burnTokens || [];
            }

            getActiveBurnTokens() {
                return this.config.burnTokens.filter(t => t.active);
            }

            getRewards() {
                return this.config.rewards || [];
            }

            getRewardForScore(score) {
                const sortedRewards = this.config.rewards.sort((a, b) => b.score - a.score);
                return sortedRewards.find(r => score >= r.score);
            }
        }

        // Initialize game when page loads
        document.addEventListener('DOMContentLoaded', () => {
            new OnchainShooterGame();
        });
    </script>
</body>
</html>
