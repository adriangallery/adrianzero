<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shooter Game - Onchain Rewards</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans&display=swap">
    <link rel="stylesheet" href="../styles.css">
    <style>
        /* Wallet connection overlay */
        .wallet-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .wallet-modal {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            color: white;
            max-width: 500px;
            width: 90%;
        }

        .wallet-modal h2 {
            font-size: 2rem;
            margin-bottom: 20px;
            color: #ffd700;
        }

        .zombie-image {
            width: 150px;
            height: 150px;
            margin-bottom: 20px;
            border-radius: 10px;
        }

        .wallet-info {
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
        }

        .wallet-address {
            font-family: monospace;
            word-break: break-all;
            color: #74b9ff;
        }

        .btn {
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            border: none;
            color: white;
            padding: 15px 30px;
            border-radius: 10px;
            cursor: pointer;
            font-family: 'Pixelify Sans', sans-serif;
            font-size: 18px;
            margin: 10px;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255,107,107,0.4);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-success {
            background: linear-gradient(45deg, #00b894, #00a085);
        }

        .btn-warning {
            background: linear-gradient(45deg, #fdcb6e, #e17055);
        }

        .status-message {
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            text-align: center;
        }

        .status-success {
            background: rgba(0,184,148,0.2);
            border: 1px solid #00b894;
            color: #00b894;
        }

        .status-error {
            background: rgba(214,48,49,0.2);
            border: 1px solid #d63031;
            color: #d63031;
        }

        .status-info {
            background: rgba(116,185,255,0.2);
            border: 1px solid #74b9ff;
            color: #74b9ff;
        }

        .game-stats {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.7);
            padding: 15px;
            border-radius: 10px;
            color: white;
            font-family: 'Pixelify Sans', sans-serif;
        }

        .hidden {
            display: none;
        }

        .loading {
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid #ffd700;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- Wallet Connection Overlay -->
    <div id="walletOverlay" class="wallet-overlay">
        <div class="wallet-modal">
            <h2>🎮 Connect Wallet to Play</h2>
            <img src="../Zombie_Adrian.gif" alt="Zombie Adrian" class="zombie-image">
            <p>You need to connect your wallet and own a Key NFT to play this game.</p>
            
            <div id="walletInfo" class="wallet-info hidden">
                <div>Connected: <span id="walletAddress" class="wallet-address"></span></div>
                <div id="keyStatus"></div>
            </div>

            <div id="walletButtons">
                <button id="connectWallet" class="btn">Connect Wallet</button>
                <button id="mintKey" class="btn btn-warning hidden">Mint Key NFT</button>
            </div>

            <div id="statusMessage" class="status-message hidden"></div>
        </div>
    </div>

    <!-- Game Container -->
    <div class="game-container">
        <canvas id="gameCanvas" width="920" height="540" style="display: block; margin: 0 auto;"></canvas>
        
        <!-- Game Stats -->
        <div class="game-stats">
            <div>Score: <span id="score">0</span></div>
            <div>Time: <span id="time">60</span></div>
            <div>Key: <span id="keyId">-</span></div>
        </div>

        <!-- Hidden elements for data storage -->
        <div id="finalScore" class="hidden">0</div>
        <div id="highScore" class="hidden">0</div>
    </div>

    <!-- Scripts -->
    <script type="module">
        import { WalletManager, SHOOTER_CONTRACT_ABI } from './utils/wallet.js';
        import game from '../game.js';

        class OnchainShooterGame {
            constructor() {
                this.walletManager = new WalletManager();
                this.contractAddress = '0x...'; // Replace with actual contract address
                this.backendUrl = 'http://localhost:3001'; // Replace with actual backend URL
                this.isConnected = false;
                this.hasKey = false;
                this.keyId = null;
                this.currentScore = 0;
                this.init();
            }

            async init() {
                try {
                    await this.walletManager.init(this.contractAddress, SHOOTER_CONTRACT_ABI);
                    this.setupEventListeners();
                    this.checkWalletStatus();
                } catch (error) {
                    this.showStatus('Error initializing wallet: ' + error.message, 'error');
                }
            }

            setupEventListeners() {
                document.getElementById('connectWallet').addEventListener('click', () => this.connectWallet());
                document.getElementById('mintKey').addEventListener('click', () => this.mintKey());
                
                // Override game's startGame method
                const originalStartGame = game.startGame;
                game.startGame = () => this.startGameWithWallet();
            }

            async checkWalletStatus() {
                if (this.walletManager.isConnected) {
                    await this.updateWalletInfo();
                }
            }

            async connectWallet() {
                try {
                    const account = await this.walletManager.connect();
                    document.getElementById('walletAddress').textContent = account;
                    document.getElementById('walletInfo').classList.remove('hidden');
                    
                    this.isConnected = true;
                    await this.updateWalletInfo();
                } catch (error) {
                    this.showStatus('Failed to connect wallet: ' + error.message, 'error');
                }
            }

            async updateWalletInfo() {
                if (!this.isConnected) return;

                try {
                    const playerInfo = await this.walletManager.getPlayerInfo();
                    this.hasKey = playerInfo.hasKey;
                    this.keyId = playerInfo.keyId;

                    const keyStatus = document.getElementById('keyStatus');
                    const mintButton = document.getElementById('mintKey');

                    if (this.hasKey) {
                        keyStatus.innerHTML = `✅ Key NFT Found (ID: ${this.keyId})`;
                        mintButton.classList.add('hidden');
                        this.hideWalletOverlay();
                    } else {
                        keyStatus.innerHTML = '❌ No Key NFT found';
                        mintButton.classList.remove('hidden');
                    }
                } catch (error) {
                    this.showStatus('Error checking key status: ' + error.message, 'error');
                }
            }

            async mintKey() {
                try {
                    this.showStatus('Minting Key NFT...', 'info');
                    
                    const config = await this.walletManager.getGameConfig();
                    const txHash = await this.walletManager.mintKey(config.playCost);
                    
                    this.showStatus('Transaction sent: ' + txHash, 'info');
                    
                    // Wait for transaction confirmation
                    await this.waitForTransaction(txHash);
                    
                    this.showStatus('Key NFT minted successfully!', 'success');
                    await this.updateWalletInfo();
                } catch (error) {
                    this.showStatus('Failed to mint key: ' + error.message, 'error');
                }
            }

            async startGameWithWallet() {
                if (!this.isConnected || !this.hasKey) {
                    this.showWalletOverlay();
                    return;
                }

                // Update key ID display
                document.getElementById('keyId').textContent = this.keyId;
                
                // Start the original game
                game.startGame();
            }

            async endGameWithRewards() {
                if (!this.isConnected || !this.hasKey) return;

                try {
                    // Submit score to backend
                    const response = await fetch(`${this.backendUrl}/api/submit-score`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            playerAddress: this.walletManager.account,
                            score: this.currentScore,
                            keyId: this.keyId,
                            adminWallet: '0x4943407105999e3E97EFA2035F5cbC64D72581C6'
                        })
                    });

                    const result = await response.json();
                    
                    if (result.success) {
                        // Get signed reward claim
                        const claimResponse = await fetch(`${this.backendUrl}/api/claim-reward`, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                            },
                            body: JSON.stringify({
                                playerAddress: this.walletManager.account,
                                scoreId: result.scoreId,
                                adminWallet: '0x4943407105999e3E97EFA2035F5cbC64D72581C6'
                            })
                        });

                        const claimResult = await claimResponse.json();
                        
                        if (claimResult.success) {
                            // Claim reward on-chain
                            await this.claimReward(claimResult);
                        } else {
                            this.showStatus('Failed to get reward signature: ' + claimResult.error, 'error');
                        }
                    } else {
                        this.showStatus('Failed to submit score: ' + result.error, 'error');
                    }
                } catch (error) {
                    this.showStatus('Error processing rewards: ' + error.message, 'error');
                }
            }

            async claimReward(claimData) {
                try {
                    this.showStatus('Claiming reward...', 'info');
                    
                    const txHash = await this.walletManager.claimReward(
                        claimData.keyId,
                        claimData.score,
                        claimData.nonce,
                        claimData.expiry,
                        claimData.signature
                    );
                    
                    this.showStatus('Reward claimed! Transaction: ' + txHash, 'success');
                    
                    // Update wallet info after claiming
                    await this.updateWalletInfo();
                } catch (error) {
                    this.showStatus('Failed to claim reward: ' + error.message, 'error');
                }
            }

            async waitForTransaction(txHash) {
                // Simple polling for transaction confirmation
                return new Promise((resolve, reject) => {
                    const checkTx = async () => {
                        try {
                            const tx = await this.walletManager.provider.getTransaction(txHash);
                            if (tx && tx.blockNumber) {
                                resolve(tx);
                            } else {
                                setTimeout(checkTx, 2000);
                            }
                        } catch (error) {
                            reject(error);
                        }
                    };
                    checkTx();
                });
            }

            showWalletOverlay() {
                document.getElementById('walletOverlay').classList.remove('hidden');
            }

            hideWalletOverlay() {
                document.getElementById('walletOverlay').classList.add('hidden');
            }

            showStatus(message, type) {
                const statusDiv = document.getElementById('statusMessage');
                statusDiv.textContent = message;
                statusDiv.className = `status-message status-${type}`;
                statusDiv.classList.remove('hidden');
                
                // Hide after 5 seconds
                setTimeout(() => {
                    statusDiv.classList.add('hidden');
                }, 5000);
            }
        }

        // Initialize the onchain game
        const onchainGame = new OnchainShooterGame();
        
        // Override game's endGame method to include rewards
        const originalEndGame = game.endGame;
        game.endGame = function() {
            originalEndGame.call(this);
            onchainGame.endGameWithRewards();
        };

        // Override game's score update to track current score
        const originalHandleClick = game.handleClick;
        game.handleClick = function(event) {
            const result = originalHandleClick.call(this, event);
            if (this.gameActive) {
                onchainGame.currentScore = this.score;
            }
            return result;
        };
    </script>
</body>
</html>
