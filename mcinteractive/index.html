<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>MCINTERACTIVE — Offline NFT Mini Game</title>
  <style>
    :root {
      --bg: #0b0b0b;
      --fg: #f4f4f4;
      --muted: rgba(255,255,255,0.7);
      --panel: rgba(0,0,0,0.55);
      --border: rgba(255,255,255,0.18);
      --btn: rgba(255,255,255,0.1);
      --btnH: rgba(255,255,255,0.2);
      --accent: #ffcc00;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #000; color: var(--fg); font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    body { display: flex; align-items: stretch; justify-content: center; }
    #wrap { position: relative; width: 100%; height: 100%; overflow: hidden; }
    canvas { width: 100%; height: 100%; display: block; background: #000; }
    .hud {
      position: absolute; left: 12px; right: 12px; top: 12px;
      display: flex; gap: 10px; align-items: center; justify-content: space-between;
      padding: 10px 12px; border-radius: 14px; background: var(--panel); border: 1px solid var(--border);
      backdrop-filter: blur(8px);
      z-index: 3;
    }
    .hud .stat { font-size: 12px; color: var(--muted); }
    .hud .value { color: var(--fg); font-weight: 700; }
    .controls {
      position: absolute; left: 12px; right: 12px; bottom: 14px;
      display: flex; gap: 10px; align-items: center; justify-content: space-between;
      padding: 10px 12px; border-radius: 14px; background: var(--panel); border: 1px solid var(--border);
      backdrop-filter: blur(8px);
      z-index: 3;
    }
    .btn {
      border: 1px solid var(--border); background: var(--btn); color: var(--fg);
      padding: 10px 14px; border-radius: 12px; cursor: pointer; font-weight: 700;
      user-select: none; -webkit-tap-highlight-color: transparent; transition: transform 80ms ease, background 160ms ease;
    }
    .btn:active { transform: translateY(1px); }
    .btn:hover { background: var(--btnH); }
    .label { font-size: 12px; color: var(--muted); }
    .overlay {
      position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 10px; background: rgba(0,0,0,0.6); backdrop-filter: blur(6px); text-align: center;
      padding: 20px;
      z-index: 4;
    }
    .overlay h1 { margin: 0; font-size: 24px; letter-spacing: 0.5px; }
    .overlay p { margin: 0; color: var(--muted); max-width: 520px; }
    .hidden { display: none; }
    @media (max-width: 640px) {
      .hud, .controls { flex-direction: column; gap: 8px; align-items: stretch; }
      .controls .btn { width: 100%; text-align: center; }
    }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="game"></canvas>

    <div class="hud">
      <div class="stat">Score: <span class="value" id="score">0</span></div>
      <div class="stat">Lives: <span class="value" id="lives">3</span></div>
      <div class="stat">Mode: <span class="value">Offline</span></div>
    </div>

    <div class="controls">
      <div style="display:flex; gap:8px;">
        <button class="btn" id="leftBtn">◀ Left</button>
        <button class="btn" id="rightBtn">Right ▶</button>
      </div>
      <div style="display:flex; gap:8px;">
        <button class="btn" id="startBtn">Start / Restart</button>
        <button class="btn" id="pauseBtn">Pause</button>
      </div>
    </div>

    <div class="overlay" id="overlay">
      <h1>MCINTERACTIVE</h1>
      <p>Mini juego offline, listo para <code>animation_url</code> en OpenSea. Atrapa los ítems, evita que caigan. Flechas o botones para moverte.</p>
      <button class="btn" id="overlayBtn">Start</button>
    </div>
  </div>

    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    let dpr = 1;
    const lanes = 3;
    let assets = {};
    let player = { lane: 1, y: 0, facing: 1 };
    const items = [];
    let score = 0;
    let lives = 3;
    let lastSpawn = 0;
    let spawnEvery = 1000;
    let running = false;
    let paused = false;
    let lastTime = 0;

    const hudScore = document.getElementById('score');
    const hudLives = document.getElementById('lives');
    const overlay = document.getElementById('overlay');
    const overlayBtn = document.getElementById('overlayBtn');
    const startBtn = document.getElementById('startBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const leftBtn = document.getElementById('leftBtn');
    const rightBtn = document.getElementById('rightBtn');

    function resize() {
      dpr = Math.max(1, Math.min(3, window.devicePixelRatio || 1));
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.scale(dpr, dpr);
      ctx.imageSmoothingEnabled = false;
      player.y = rect.height - 120;
      if (!running) renderScene(false);
    }

    function randLane() {
      return Math.floor(Math.random() * lanes);
    }
    function randItemKey() {
      const arr = ['burger','fries','coke','nuggets','ice'];
      return arr[Math.floor(Math.random() * arr.length)];
    }

    function spawnItem() {
      items.push({
        lane: randLane(),
        y: -40,
        speed: 120 + Math.random() * 60,
        kind: randItemKey()
      });
    }

    function movePlayer(dir) {
      player.lane = Math.min(lanes - 1, Math.max(0, player.lane + dir));
      player.facing = dir === 0 ? player.facing : Math.sign(dir) || player.facing;
    }

    function resetGame() {
      score = 0;
      lives = 3;
      items.length = 0;
      lastSpawn = 0;
      spawnEvery = 1000;
      running = true;
      paused = false;
      overlay.classList.add('hidden');
      lastTime = performance.now();
      updateHUD();
      requestAnimationFrame(loop);
    }

    function updateHUD() {
      hudScore.textContent = String(score);
      hudLives.textContent = String(lives);
    }

    function drawBackground(w, h) {
      const img = assets.back;
      if (!img || !img.complete) {
        ctx.fillStyle = '#000';
        ctx.fillRect(0,0,w,h);
        return;
      }
      const scale = Math.max(w / img.width, h / img.height);
      const dw = img.width * scale;
      const dh = img.height * scale;
      const dx = (w - dw) / 2;
      const dy = (h - dh) / 2;
      ctx.drawImage(img, dx, dy, dw, dh);
    }

    function drawPlayer(w) {
      const img = player.facing >= 0 ? assets.managerR : assets.managerL;
      const laneWidth = w / lanes;
      const x = laneWidth * player.lane + laneWidth / 2 - 30;
      if (img && img.complete) {
        ctx.drawImage(img, x, player.y, 60, 60);
      } else {
        ctx.fillStyle = '#fff';
        ctx.fillRect(x, player.y, 60, 60);
      }
    }

    function drawItems(w) {
      const laneWidth = w / lanes;
      for (const it of items) {
        const img = assets[it.kind];
        const x = laneWidth * it.lane + laneWidth / 2 - 20;
        if (img && img.complete) ctx.drawImage(img, x, it.y, 40, 40);
        else { ctx.fillStyle = '#ff0'; ctx.fillRect(x, it.y, 40, 40); }
      }
    }

    function renderScene(includeItems = true) {
      const w = canvas.getBoundingClientRect().width;
      const h = canvas.getBoundingClientRect().height;
      ctx.clearRect(0,0,w,h);
      drawBackground(w,h);
      drawPlayer(w);
      if (includeItems) drawItems(w);
    }

    function collide(it, w) {
      const laneWidth = w / lanes;
      const px = laneWidth * player.lane + laneWidth / 2;
      const py = player.y + 20;
      const ix = laneWidth * it.lane + laneWidth / 2;
      const iy = it.y + 20;
      const dx = Math.abs(px - ix);
      const dy = Math.abs(py - iy);
      return dx < 30 && dy < 30;
    }

    function loop(ts) {
      if (!running) return;
      if (paused) { lastTime = ts; requestAnimationFrame(loop); return; }
      const dt = (ts - lastTime) / 1000;
      lastTime = ts;

      const w = canvas.getBoundingClientRect().width;
      const h = canvas.getBoundingClientRect().height;
      ctx.clearRect(0,0,w,h);
      drawBackground(w,h);

      // spawn
      lastSpawn += dt * 1000;
      if (lastSpawn >= spawnEvery) {
        spawnItem();
        lastSpawn = 0;
        spawnEvery = Math.max(500, spawnEvery * 0.98);
      }

      // update items
      for (let i = items.length -1; i >=0; i--) {
        const it = items[i];
        it.y += it.speed * dt;
        if (collide(it, w)) {
          score += 1;
          items.splice(i,1);
          continue;
        }
        if (it.y > h + 40) {
          items.splice(i,1);
          lives -= 1;
          if (lives <= 0) {
            running = false;
            overlay.classList.remove('hidden');
            overlay.querySelector('p').textContent = 'Game over. Score: ' + score;
          }
        }
      }

      updateHUD();
      drawPlayer(w);
      drawItems(w);

      if (running) requestAnimationFrame(loop);
    }

    function preload() {
      const entries = Object.entries(ASSETS).map(([k,src]) => {
        const img = new Image();
        img.src = src;
        assets[k] = img;
        return new Promise(res => { img.onload = () => res(); img.onerror = () => res(); });
      });
      return Promise.all(entries);
    }

    function togglePause() {
      paused = !paused;
      pauseBtn.textContent = paused ? 'Resume' : 'Pause';
    }

    // Controls
    leftBtn.addEventListener('click', () => movePlayer(-1));
    rightBtn.addEventListener('click', () => movePlayer(1));
    startBtn.addEventListener('click', resetGame);
    overlayBtn.addEventListener('click', resetGame);
    pauseBtn.addEventListener('click', togglePause);
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') movePlayer(-1);
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') movePlayer(1);
      if (e.key === ' ' && !running) resetGame();
      if (e.key === 'p' || e.key === 'P') togglePause();
    });
    window.addEventListener('resize', resize, { passive: true });

    preload().then(() => {
      resize();
      overlay.querySelector('p').textContent = 'Mini juego offline. Presiona Start para jugar.';
      renderScene(false);
    });
  })();
