<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdrianZERO - OpenSea API Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: white;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .api-key-section {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
        }

        .api-key-section h3 {
            color: #ffd700;
            margin-bottom: 15px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .input-group input {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
        }

        .btn {
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .results {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .result-card {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .result-card h3 {
            color: #ffd700;
            margin-bottom: 15px;
            font-size: 1.2rem;
        }

        .nft-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .nft-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .nft-image {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .nft-name {
            font-weight: bold;
            margin-bottom: 5px;
            color: #fff;
        }

        .nft-price {
            color: #ffd700;
            font-size: 0.9rem;
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-size: 1.2rem;
        }

        .error {
            background: rgba(255, 0, 0, 0.2);
            border: 1px solid rgba(255, 0, 0, 0.5);
            color: #ff6b6b;
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
        }

        .success {
            background: rgba(0, 255, 0, 0.2);
            border: 1px solid rgba(0, 255, 0, 0.5);
            color: #4ade80;
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            color: #ffd700;
        }

        .stat-label {
            font-size: 0.9rem;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎨 AdrianZERO</h1>
            <p>OpenSea API Integration Test</p>
        </div>

        <div class="api-key-section">
            <h3>🔑 API Key Configuration</h3>
            <div class="input-group">
                <input type="password" id="apiKey" placeholder="Enter your OpenSea API Key" />
                <button class="btn" onclick="setApiKey()">Set API Key</button>
            </div>
            <p style="font-size: 0.9rem; opacity: 0.8;">
                Your API key is stored locally and never sent to our servers.
            </p>
        </div>

        <div class="controls">
            <button class="btn" onclick="loadCollection()" id="loadBtn">📊 Load Collection Data</button>
            <button class="btn" onclick="loadNFTs()" id="nftBtn">🖼️ Load NFTs</button>
            <button class="btn" onclick="loadOffers()" id="offersBtn">💰 Load Offers</button>
            <button class="btn" onclick="loadListings()" id="listingsBtn">🏷️ Load Listings</button>
        </div>

        <div id="results"></div>
    </div>

    <script>
        // Configuration
        const CONTRACT_ADDRESS = '0x6e369bf0e4e0c106192d606fb6d85836d684da75';
        const COLLECTION_SLUG = 'adrianzero'; // You may need to adjust this
        const API_BASE_URL = 'https://api.opensea.io/api/v2';

        let apiKey = localStorage.getItem('opensea_api_key') || '';

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            if (apiKey) {
                document.getElementById('apiKey').value = apiKey;
                showMessage('API Key loaded from storage', 'success');
            }
        });

        function setApiKey() {
            const key = document.getElementById('apiKey').value.trim();
            if (key) {
                apiKey = key;
                localStorage.setItem('opensea_api_key', key);
                showMessage('API Key saved successfully!', 'success');
            } else {
                showMessage('Please enter a valid API key', 'error');
            }
        }

        function showMessage(message, type) {
            const results = document.getElementById('results');
            const messageDiv = document.createElement('div');
            messageDiv.className = type;
            messageDiv.textContent = message;
            results.insertBefore(messageDiv, results.firstChild);
            
            setTimeout(() => {
                messageDiv.remove();
            }, 5000);
        }

        function showLoading(message) {
            const results = document.getElementById('results');
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'loading';
            loadingDiv.id = 'loading';
            loadingDiv.innerHTML = `⏳ ${message}`;
            results.appendChild(loadingDiv);
        }

        function hideLoading() {
            const loading = document.getElementById('loading');
            if (loading) loading.remove();
        }

        async function makeAPICall(endpoint, params = {}) {
            if (!apiKey) {
                showMessage('Please set your API key first', 'error');
                return null;
            }

            const url = new URL(`${API_BASE_URL}${endpoint}`);
            Object.keys(params).forEach(key => url.searchParams.append(key, params[key]));

            try {
                const response = await fetch(url, {
                    headers: {
                        'X-API-KEY': apiKey,
                        'Accept': 'application/json'
                    }
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                return await response.json();
            } catch (error) {
                console.error('API Error:', error);
                showMessage(`API Error: ${error.message}`, 'error');
                return null;
            }
        }

        async function loadCollection() {
            showLoading('Loading collection data...');
            
            try {
                // Try to get collection by contract address
                const collectionData = await makeAPICall(`/collection/${CONTRACT_ADDRESS}`);
                
                if (collectionData) {
                    displayCollectionData(collectionData);
                }
            } catch (error) {
                showMessage('Failed to load collection data', 'error');
            }
            
            hideLoading();
        }

        async function loadNFTs() {
            showLoading('Loading NFTs...');
            
            try {
                const nftData = await makeAPICall('/nfts', {
                    asset_contract_address: CONTRACT_ADDRESS,
                    limit: 20
                });
                
                if (nftData) {
                    displayNFTs(nftData.nfts || []);
                }
            } catch (error) {
                showMessage('Failed to load NFTs', 'error');
            }
            
            hideLoading();
        }

        async function loadOffers() {
            showLoading('Loading offers...');
            
            try {
                const offersData = await makeAPICall('/orders', {
                    asset_contract_address: CONTRACT_ADDRESS,
                    side: 'offer',
                    limit: 10
                });
                
                if (offersData) {
                    displayOffers(offersData.orders || []);
                }
            } catch (error) {
                showMessage('Failed to load offers', 'error');
            }
            
            hideLoading();
        }

        async function loadListings() {
            showLoading('Loading listings...');
            
            try {
                const listingsData = await makeAPICall('/orders', {
                    asset_contract_address: CONTRACT_ADDRESS,
                    side: 'listing',
                    limit: 10
                });
                
                if (listingsData) {
                    displayListings(listingsData.orders || []);
                }
            } catch (error) {
                showMessage('Failed to load listings', 'error');
            }
            
            hideLoading();
        }

        function displayCollectionData(data) {
            const results = document.getElementById('results');
            const card = document.createElement('div');
            card.className = 'result-card';
            
            card.innerHTML = `
                <h3>📊 Collection Information</h3>
                <div class="stats">
                    <div class="stat-card">
                        <div class="stat-value">${data.stats?.total_supply || 'N/A'}</div>
                        <div class="stat-label">Total Supply</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${data.stats?.num_owners || 'N/A'}</div>
                        <div class="stat-label">Owners</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${data.stats?.floor_price ? `${data.stats.floor_price} ETH` : 'N/A'}</div>
                        <div class="stat-label">Floor Price</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${data.stats?.total_volume ? `${data.stats.total_volume} ETH` : 'N/A'}</div>
                        <div class="stat-label">Total Volume</div>
                    </div>
                </div>
                <p><strong>Name:</strong> ${data.name || 'N/A'}</p>
                <p><strong>Description:</strong> ${data.description || 'N/A'}</p>
                <p><strong>Contract:</strong> ${data.primary_asset_contracts?.[0]?.address || CONTRACT_ADDRESS}</p>
            `;
            
            results.appendChild(card);
        }

        function displayNFTs(nfts) {
            const results = document.getElementById('results');
            const card = document.createElement('div');
            card.className = 'result-card';
            
            let nftHTML = '<h3>🖼️ NFTs</h3><div class="nft-grid">';
            
            nfts.forEach(nft => {
                nftHTML += `
                    <div class="nft-card">
                        <img src="${nft.image_url || '/placeholder.png'}" alt="${nft.name}" class="nft-image" onerror="this.src='/placeholder.png'">
                        <div class="nft-name">${nft.name || `#${nft.token_id}`}</div>
                        <div class="nft-price">Token ID: ${nft.token_id}</div>
                    </div>
                `;
            });
            
            nftHTML += '</div>';
            card.innerHTML = nftHTML;
            results.appendChild(card);
        }

        function displayOffers(offers) {
            const results = document.getElementById('results');
            const card = document.createElement('div');
            card.className = 'result-card';
            
            let offersHTML = '<h3>💰 Active Offers</h3>';
            
            if (offers.length === 0) {
                offersHTML += '<p>No active offers found.</p>';
            } else {
                offers.forEach(offer => {
                    offersHTML += `
                        <div style="background: rgba(255,255,255,0.1); padding: 15px; margin: 10px 0; border-radius: 8px;">
                            <p><strong>Price:</strong> ${offer.current_price || 'N/A'} ETH</p>
                            <p><strong>Maker:</strong> ${offer.maker?.address || 'N/A'}</p>
                            <p><strong>Expiration:</strong> ${offer.expiration_time ? new Date(offer.expiration_time * 1000).toLocaleDateString() : 'N/A'}</p>
                        </div>
                    `;
                });
            }
            
            card.innerHTML = offersHTML;
            results.appendChild(card);
        }

        function displayListings(listings) {
            const results = document.getElementById('results');
            const card = document.createElement('div');
            card.className = 'result-card';
            
            let listingsHTML = '<h3>🏷️ Active Listings</h3>';
            
            if (listings.length === 0) {
                listingsHTML += '<p>No active listings found.</p>';
            } else {
                listings.forEach(listing => {
                    listingsHTML += `
                        <div style="background: rgba(255,255,255,0.1); padding: 15px; margin: 10px 0; border-radius: 8px;">
                            <p><strong>Price:</strong> ${listing.current_price || 'N/A'} ETH</p>
                            <p><strong>Seller:</strong> ${listing.maker?.address || 'N/A'}</p>
                            <p><strong>Expiration:</strong> ${listing.expiration_time ? new Date(listing.expiration_time * 1000).toLocaleDateString() : 'N/A'}</p>
                        </div>
                    `;
                });
            }
            
            card.innerHTML = listingsHTML;
            results.appendChild(card);
        }

        // Clear results function
        function clearResults() {
            document.getElementById('results').innerHTML = '';
        }
    </script>
</body>
</html>
