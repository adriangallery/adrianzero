<svg xmlns="http://www.w3.org/2000/svg" width="1025" height="1025" viewBox="0 0 1025 1025" style="image-rendering: pixelated; shape-rendering: crispEdges;">
  <defs>
    <style><![CDATA[
      image { image-rendering: pixelated; }
    ]]></style>
  </defs>
  <!-- Sandwich - pixel art -->
  <!-- Pan superior -->
  <rect x="300" y="200" width="425" height="80" fill="#d4a574"/>
  <rect x="320" y="200" width="385" height="60" fill="#f4a460"/>
  <rect x="340" y="220" width="345" height="40" fill="#daa520"/>
  
  <!-- Borde superior del pan -->
  <rect x="300" y="200" width="425" height="20" fill="#8b6914"/>
  <rect x="310" y="210" width="405" height="10" fill="#a0826d"/>
  
  <!-- Lechuga -->
  <rect x="320" y="280" width="385" height="40" fill="#90ee90"/>
  <rect x="330" y="290" width="365" height="20" fill="#7cfc00"/>
  <rect x="340" y="300" width="345" height="10" fill="#32cd32"/>
  
  <!-- Carne -->
  <rect x="320" y="320" width="385" height="60" fill="#8b4513"/>
  <rect x="330" y="330" width="365" height="40" fill="#a0522d"/>
  <rect x="340" y="340" width="345" height="20" fill="#cd853f"/>
  
  <!-- Queso -->
  <rect x="320" y="380" width="385" height="40" fill="#ffd700"/>
  <rect x="330" y="390" width="365" height="20" fill="#ffed4e"/>
  
  <!-- Lechuga inferior -->
  <rect x="320" y="420" width="385" height="40" fill="#90ee90"/>
  <rect x="330" y="430" width="365" height="20" fill="#7cfc00"/>
  <rect x="340" y="440" width="345" height="10" fill="#32cd32"/>
  
  <!-- Pan inferior -->
  <rect x="300" y="460" width="425" height="80" fill="#d4a574"/>
  <rect x="320" y="480" width="385" height="60" fill="#f4a460"/>
  <rect x="340" y="500" width="345" height="40" fill="#daa520"/>
  
  <!-- Borde inferior del pan -->
  <rect x="300" y="520" width="425" height="20" fill="#8b6914"/>
  <rect x="310" y="520" width="405" height="10" fill="#a0826d"/>
  
  <!-- Semillas en el pan superior -->
  <rect x="400" y="210" width="8" height="8" fill="#654321"/>
  <rect x="450" y="215" width="8" height="8" fill="#654321"/>
  <rect x="500" y="210" width="8" height="8" fill="#654321"/>
  <rect x="550" y="215" width="8" height="8" fill="#654321"/>
  <rect x="600" y="210" width="8" height="8" fill="#654321"/>
  <rect x="650" y="215" width="8" height="8" fill="#654321"/>
</svg>
