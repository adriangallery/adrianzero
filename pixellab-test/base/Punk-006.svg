<svg xmlns="http://www.w3.org/2000/svg" width="1025" height="1025" viewBox="0 0 1025 1025" style="image-rendering: pixelated; shape-rendering: crispEdges;">
  <defs>
    <style><![CDATA[
      image { image-rendering: pixelated; }
    ]]></style>
  </defs>
  <!-- Fondo -->
  <rect width="1025" height="1025" fill="#1a1a1a"/>
  
  <!-- Cabeza -->
  <rect x="300" y="200" width="425" height="500" fill="#ffdbac"/>
  <rect x="320" y="220" width="385" height="460" fill="#f4c2a1"/>
  
  <!-- Ojos - cerrados sonriendo -->
  <rect x="380" y="330" width="80" height="20" fill="#000000"/>
  <rect x="565" y="330" width="80" height="20" fill="#000000"/>
  
  <!-- Nariz -->
  <rect x="480" y="420" width="65" height="50" fill="#d4a574"/>
  <rect x="490" y="430" width="45" height="30" fill="#c8966a"/>
  
  <!-- Boca - sonrisa grande -->
  <rect x="420" y="480" width="185" height="60" fill="#8b4513"/>
  <rect x="430" y="490" width="165" height="40" fill="#654321"/>
  <rect x="440" y="500" width="145" height="30" fill="#ffffff"/>
  
  <!-- Cabello - rosa -->
  <rect x="350" y="150" width="325" height="80" fill="#ff69b4"/>
  <rect x="360" y="140" width="305" height="40" fill="#ff1493"/>
  <rect x="370" y="130" width="285" height="30" fill="#dc143c"/>
  
  <!-- Cuerpo -->
  <rect x="350" y="700" width="325" height="200" fill="#32cd32"/>
  <rect x="370" y="720" width="285" height="160" fill="#00ff00"/>
  
  <!-- Detalles del cuerpo -->
  <rect x="400" y="750" width="205" height="80" fill="#ffffff"/>
  <rect x="420" y="770" width="165" height="40" fill="#ff69b4"/>
  
  <!-- Piernas -->
  <rect x="400" y="900" width="100" height="80" fill="#1a1a1a"/>
  <rect x="525" y="900" width="100" height="80" fill="#1a1a1a"/>
  
  <!-- Zapatos -->
  <rect x="380" y="960" width="140" height="40" fill="#2c2c2c"/>
  <rect x="505" y="960" width="140" height="40" fill="#2c2c2c"/>
</svg>
