<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mis AdrianPunks</title>
  <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 20px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
    .card { border: 1px solid #ddd; border-radius: 8px; padding: 8px; background: #fff; }
    .card img { width: 100%; height: auto; display: block; border-radius: 4px; background: #fafafa; }
    .muted { color: #666; }
    .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
    button { padding: 8px 12px; border-radius: 6px; border: 1px solid #ccc; background: #f4f4f4; cursor: pointer; }
    button:hover { background: #eee; }
    #status { font-size: 12px; color: #666; }
  </style>
</head>
<body>
  <div class="row">
    <button id="connect">Connect Wallet</button>
    <div id="wallet" class="muted"></div>
    <div id="status" class="muted"></div>
  </div>

  <h3>Mis AdrianPunks</h3>
  <div id="tokens" class="grid"></div>

  <script>
    // Red y providers (Base Mainnet)
    const INFURA_URL = "https://base-mainnet.infura.io/v3/cc0c8013b1e044dcba79d4f7ec3b2ba1";
    const NETWORK_CONF = { name: "base", chainId: 8453 };
    const baseProvider = new ethers.providers.JsonRpcProvider(INFURA_URL, NETWORK_CONF);

    // Contratos
    const AD_PUNKS_ADDRESS = "0x79BE8AcdD339C7b92918fcC3fd3875b5Aaad7566"; // ERC721 AdrianPunks
    const MULTICALL3 = "0xcA11bde05977b3631167028862bE2a173976CA11";   // Multicall3 en Base

    // ABIs mínimos
    const nftABI = [
      "function balanceOf(address) view returns (uint256)",
      "function tokenOfOwnerByIndex(address,uint256) view returns (uint256)"
    ];
    const multicallAbi = [
      "function aggregate3(tuple(address target, bool allowFailure, bytes callData)[] calls) public view returns (tuple(bool success, bytes returnData)[] returnData)"
    ];

    // Estado
    let provider, signer, nftContract;
    const elTokens = document.getElementById("tokens");
    const elWallet = document.getElementById("wallet");
    const elStatus = document.getElementById("status");

    document.getElementById("connect").addEventListener("click", connect);

    async function connect() {
      try {
        if (!window.ethereum) {
          elWallet.textContent = "Instala MetaMask.";
          return;
        }
        provider = new ethers.providers.Web3Provider(window.ethereum);
        await provider.send("eth_requestAccounts", []);
        signer = provider.getSigner();
        const addr = await signer.getAddress();
        elWallet.textContent = `Conectado: ${addr.slice(0,6)}...${addr.slice(-4)}`;

        nftContract = new ethers.Contract(AD_PUNKS_ADDRESS, nftABI, baseProvider);
        await loadTokens(addr);
      } catch (e) {
        elStatus.textContent = `Error: ${e.message || e}`;
      }
    }

    async function loadTokens(ownerAddress) {
      try {
        elTokens.innerHTML = "";
        elStatus.textContent = "Cargando balance...";

        // Balance total
        const balanceBN = await nftContract.balanceOf(ownerAddress);
        const total = balanceBN.toNumber();
        if (total === 0) {
          elTokens.innerHTML = '<div class="muted">No hay tokens en esta wallet.</div>';
          elStatus.textContent = "";
          return;
        }

        elStatus.textContent = `Encontrados ${total} tokens. Resolviendo IDs (multicall)...`;

        // Multicall para obtener todos los tokenIds
        const multicall = new ethers.Contract(MULTICALL3, multicallAbi, baseProvider);
        const calls = [];
        for (let i = 0; i < total; i++) {
          calls.push({
            target: AD_PUNKS_ADDRESS,
            allowFailure: true,
            callData: nftContract.interface.encodeFunctionData("tokenOfOwnerByIndex", [ownerAddress, i])
          });
        }
        const results = await multicall.aggregate3(calls);
        const tokenIds = results
          .filter(r => r.success)
          .map(r => nftContract.interface.decodeFunctionResult("tokenOfOwnerByIndex", r.returnData)[0]);

        elStatus.textContent = `Renderizando ${tokenIds.length} tokens...`;

        // Intentar JSON remoto; si falla, usar fallback
        let jsonCollection = [];
        try {
          const res = await fetch("https://adrianpunks.com/punkquest/adrianpunks.json", { cache: "no-store" });
          if (res.ok) {
            const data = await res.json();
            jsonCollection = Array.isArray(data.collection) ? data.collection : [];
          }
        } catch (_) {}

        // Render
        for (const tokenId of tokenIds) {
          const idNum = ethers.BigNumber.isBigNumber(tokenId) ? tokenId.toNumber() : parseInt(tokenId, 10);
          const tokenInfo = jsonCollection.find(item => item.id === String(idNum));
          let imgUrl;

          if (tokenInfo && tokenInfo.image) {
            imgUrl = tokenInfo.image;
          } else {
            const baseUrl = idNum < 501
              ? "https://ipfs.io/ipfs/bafybeibfywb3emvjod5owcus7nyn4fqosqrbvuq2cyxczhbmavfxuautsy/"
              : "https://ipfs.io/ipfs/bafybeie4fatiqdy4mreadt6hmqysrtev6xe37esml2llsupb6ub4qilnta/";
            const gifTokens = [1, 13, 69, 221];
            const ext = gifTokens.includes(idNum) ? ".gif" : ".png";
            imgUrl = `${baseUrl}${idNum}${ext}`;
          }

          const card = document.createElement("div");
          card.className = "card";
          card.innerHTML = `
            <img src="${imgUrl}" alt="AdrianPunk #${idNum}" onerror="this.style.opacity=0.75;" />
            <div>#${idNum}</div>
          `;
          elTokens.appendChild(card);
        }
        elStatus.textContent = "";
      } catch (e) {
        elStatus.textContent = `Error: ${e.message || e}`;
      }
    }
  </script>
</body>
</html>
