<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reown AppKit Test - Wallet Connection</title>
    <script src="https://unpkg.com/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    
    <!-- WalletConnect v2 (Official) -->
    <script src="https://unpkg.com/@walletconnect/ethereum-provider@2.9.0/dist/umd/index.min.js" onload="console.log('✅ WalletConnect v2 script loaded')" onerror="console.error('❌ WalletConnect v2 script failed to load')"></script>
    
    <!-- Reown AppKit (Official) -->
    <script type="module" src="https://unpkg.com/@reown/appkit@1.0.0/dist/index.js" onload="console.log('✅ Reown AppKit script loaded')" onerror="console.error('❌ Reown AppKit script failed to load')"></script>
    <link rel="stylesheet" href="https://unpkg.com/@reown/appkit@1.0.0/dist/index.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 600px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            background: linear-gradient(45deg, #00ff88, #00ccff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 1.2rem;
            margin-bottom: 40px;
            color: #cccccc;
        }

        .button {
            background: linear-gradient(45deg, #00ff88, #00ccff);
            color: #000;
            border: none;
            padding: 15px 30px;
            font-size: 1.1rem;
            border-radius: 10px;
            cursor: pointer;
            margin: 10px;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 255, 136, 0.3);
        }

        .button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .status {
            margin: 20px 0;
            padding: 15px;
            border-radius: 10px;
            font-weight: bold;
        }

        .status.success {
            background: rgba(0, 255, 136, 0.2);
            border: 1px solid #00ff88;
            color: #00ff88;
        }

        .status.error {
            background: rgba(255, 0, 0, 0.2);
            border: 1px solid #ff0000;
            color: #ff0000;
        }

        .status.info {
            background: rgba(0, 204, 255, 0.2);
            border: 1px solid #00ccff;
            color: #00ccff;
        }

        .wallet-info {
            margin-top: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .wallet-address {
            font-family: 'Courier New', monospace;
            font-size: 1.1rem;
            margin: 10px 0;
            word-break: break-all;
        }

        .debug-panel {
            margin-top: 30px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: left;
            max-height: 300px;
            overflow-y: auto;
        }

        .debug-title {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: #00ff88;
        }

        .debug-log {
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            margin: 5px 0;
            padding: 5px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 3px;
        }

        .debug-log.success { color: #00ff88; }
        .debug-log.error { color: #ff0000; }
        .debug-log.info { color: #00ccff; }
        .debug-log.warning { color: #ffaa00; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Reown AppKit Test</h1>
        <p class="subtitle">Testing Wallet Connection Implementation</p>
        
        <div id="status" class="status info" style="display: none;">
            Initializing Reown AppKit...
        </div>
        
        <div id="buttonContainer">
            <button id="connectBtn" class="button" disabled>
                Connect Wallet
            </button>
            <button id="disconnectBtn" class="button" style="display: none;">
                Disconnect Wallet
            </button>
        </div>
        
        <div id="walletInfo" class="wallet-info" style="display: none;">
            <h3>Wallet Connected</h3>
            <div class="wallet-address" id="walletAddress"></div>
            <div id="walletType"></div>
        </div>
        
        <div class="debug-panel">
            <div class="debug-title">Debug Log</div>
            <div id="debugLog"></div>
        </div>
    </div>

    <script>
        // ===== DEBUGGING UTILITIES =====
        function addDebugLog(message, type = 'info') {
            const debugLog = document.getElementById('debugLog');
            const logEntry = document.createElement('div');
            logEntry.className = `debug-log ${type}`;
            logEntry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            debugLog.appendChild(logEntry);
            debugLog.scrollTop = debugLog.scrollHeight;
            console.log(`[DEBUG] ${message}`);
        }

        function showStatus(message, type = 'info') {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = `status ${type}`;
            status.style.display = 'block';
            addDebugLog(`Status: ${message}`, type);
        }

        // ===== GLOBAL VARIABLES =====
        let reownModal = null;
        let isConnected = false;
        let userAddress = null;
        let provider = null;
        let signer = null;

        // ===== WALLETCONNECT V2 IMPLEMENTATION (Based on Official Examples) =====
        
        async function initWalletConnect() {
            try {
                addDebugLog('🔍 Starting WalletConnect v2 initialization...', 'info');
                
                // Check for EthereumProvider
                if (!window.EthereumProvider) {
                    throw new Error('EthereumProvider not found');
                }
                
                addDebugLog('✅ EthereumProvider found', 'success');
                
                const projectId = '6afed75f72df7cefde4d998c2da4b041';
                addDebugLog(`🔍 Using Project ID: ${projectId}`, 'info');
                
                // Initialize WalletConnect provider
                const walletConnectProvider = await window.EthereumProvider.init({
                    projectId: projectId,
                    chains: [1, 8453], // Ethereum and Base
                    showQrModal: true,
                    qrModalOptions: {
                        themeMode: 'light',
                        themeVariables: {
                            '--wcm-z-index': '1000'
                        }
                    }
                });
                
                addDebugLog('✅ WalletConnect provider initialized', 'success');
                
                // Create ethers provider
                provider = new ethers.providers.Web3Provider(walletConnectProvider);
                signer = provider.getSigner();
                
                // Set up event listeners
                walletConnectProvider.on('connect', (error, payload) => {
                    if (error) {
                        addDebugLog(`❌ WalletConnect error: ${error.message}`, 'error');
                        return;
                    }
                    addDebugLog('✅ WalletConnect connected', 'success');
                    handleWalletConnectConnection(payload);
                });
                
                walletConnectProvider.on('disconnect', (error, payload) => {
                    if (error) {
                        addDebugLog(`❌ WalletConnect disconnect error: ${error.message}`, 'error');
                        return;
                    }
                    addDebugLog('✅ WalletConnect disconnected', 'info');
                    handleDisconnection();
                });
                
                // Store provider for connection
                reownModal = {
                    open: async () => {
                        await walletConnectProvider.enable();
                    },
                    close: async () => {
                        await walletConnectProvider.disconnect();
                    },
                    getAccount: () => {
                        return walletConnectProvider.accounts?.[0] ? { address: walletConnectProvider.accounts[0] } : null;
                    },
                    getIsConnected: () => walletConnectProvider.connected,
                    getWalletProvider: () => walletConnectProvider
                };
                
                addDebugLog('✅ WalletConnect v2 initialized successfully', 'success');
                showStatus('WalletConnect v2 initialized successfully!', 'success');
                document.getElementById('connectBtn').disabled = false;
                
            } catch (error) {
                addDebugLog(`❌ Failed to initialize WalletConnect v2: ${error.message}`, 'error');
                showStatus('Failed to initialize WalletConnect v2', 'error');
                console.error('WalletConnect v2 initialization error:', error);
            }
        }
        
        function handleWalletConnectConnection(payload) {
            try {
                if (payload && payload.accounts && payload.accounts.length > 0) {
                    userAddress = payload.accounts[0];
                    isConnected = true;
                    
                    addDebugLog(`✅ WalletConnect connected: ${userAddress}`, 'success');
                    updateWalletUI();
                    showStatus('Wallet connected successfully!', 'success');
                }
            } catch (error) {
                addDebugLog(`❌ WalletConnect connection handling error: ${error.message}`, 'error');
                console.error('WalletConnect connection handling error:', error);
            }
        }
        
        async function connectWallet() {
            try {
                if (!reownModal) {
                    showStatus('WalletConnect not initialized', 'error');
                    return;
                }
                
                addDebugLog('🔍 Opening WalletConnect modal...', 'info');
                showStatus('Opening wallet connection modal...', 'info');
                
                // Open the WalletConnect modal
                await reownModal.open();
                
                addDebugLog('✅ WalletConnect modal opened successfully', 'success');
                
            } catch (error) {
                addDebugLog(`❌ Connection error: ${error.message}`, 'error');
                showStatus('Failed to open wallet modal', 'error');
                console.error('Connection error:', error);
            }
        }
        
        function handleDisconnection() {
            addDebugLog('🔍 Handling disconnection...', 'info');
            isConnected = false;
            userAddress = null;
            provider = null;
            signer = null;
            
            updateWalletUI();
            showStatus('Wallet disconnected', 'info');
        }
        
        function updateWalletUI() {
            const connectBtn = document.getElementById('connectBtn');
            const disconnectBtn = document.getElementById('disconnectBtn');
            const walletInfo = document.getElementById('walletInfo');
            const walletAddress = document.getElementById('walletAddress');
            const walletType = document.getElementById('walletType');
            
            if (isConnected && userAddress) {
                connectBtn.style.display = 'none';
                disconnectBtn.style.display = 'inline-block';
                walletInfo.style.display = 'block';
                walletAddress.textContent = userAddress;
                walletType.textContent = 'Connected via Reown AppKit';
                addDebugLog('✅ UI updated for connected state', 'success');
            } else {
                connectBtn.style.display = 'inline-block';
                disconnectBtn.style.display = 'none';
                walletInfo.style.display = 'none';
                addDebugLog('✅ UI updated for disconnected state', 'success');
            }
        }
        
        async function disconnectWallet() {
            try {
                addDebugLog('🔍 Disconnecting wallet...', 'info');
                
                if (reownModal) {
                    await reownModal.close();
                    addDebugLog('✅ Reown modal closed', 'success');
                }
                
                handleDisconnection();
                
            } catch (error) {
                addDebugLog(`❌ Disconnection error: ${error.message}`, 'error');
                console.error('Disconnection error:', error);
            }
        }
        
        // ===== INITIALIZATION =====
        document.addEventListener('DOMContentLoaded', function() {
            addDebugLog('🔍 DOM loaded, initializing WalletConnect v2...', 'info');
            
            // Set up button event listeners
            document.getElementById('connectBtn').addEventListener('click', connectWallet);
            document.getElementById('disconnectBtn').addEventListener('click', disconnectWallet);
            
            // Initialize WalletConnect v2
            initWalletConnect();
        });
    </script>
</body>
</html>
