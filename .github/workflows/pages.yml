name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-deployment"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Alchemy Config
        run: |
          mkdir -p traitlab
          cat > traitlab/config-keys.js << EOF
          // This file is auto-generated by GitHub Actions
          // Do not edit manually - it will be overwritten on each push
          // Generated from ALCHEMY_PRIMARY_KEY repository secret
          window.ALCHEMY_KEYS_CONFIG = {
              primary: "${{ secrets.ALCHEMY_PRIMARY_KEY }}"
          };
          EOF

      - name: Generate Market Config
        run: |
          mkdir -p market
          cat > market/supabase-config.js << EOF
          // This file is auto-generated by GitHub Actions
          // Do not edit manually - it will be overwritten on each push
          window.SUPABASE_URL = "${{ secrets.SUPABASE_URL }}";
          window.SUPABASE_ANON_KEY = "${{ secrets.SUPABASE_ANON_KEY }}";
          window.ALCHEMY_API_KEY = "${{ secrets.ALCHEMY_PRIMARY_KEY }}";
          EOF

          cat > market/config.js << EOF
          // This file is auto-generated by GitHub Actions
          const config = {
              API_BASE_URL: 'https://marketplace-ks4ktpit5-adrians-projects-43090263.vercel.app',
              DB_URL: 'https://marketplace-ks4ktpit5-adrians-projects-43090263.vercel.app/api/nfts',
              IPFS_GATEWAY: 'https://ipfs.io/ipfs/'
          };
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4 