name: Build Alchemy Config

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-config:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      
      - name: Generate Alchemy Config
        run: |
          mkdir -p traitlab
          cat > traitlab/config-keys.js << EOF
          // This file is auto-generated by GitHub Actions
          // Do not edit manually - it will be overwritten on each push
          window.ALCHEMY_KEYS_CONFIG = {
              primary: "${{ secrets.ALCHEMY_PRIMARY_KEY }}"
          };
          EOF
      
      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add traitlab/config-keys.js
          if ! git diff --staged --quiet; then
            git commit -m "Auto-generate Alchemy config from secrets [skip ci]"
            git push
          else
            echo "No changes to commit"
          fi

