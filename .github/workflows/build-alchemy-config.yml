name: Build Alchemy Config

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-config:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      
      - name: Validate Secret
        run: |
          if [ -z "${{ secrets.ALCHEMY_PRIMARY_KEY }}" ]; then
            echo "❌ Error: ALCHEMY_PRIMARY_KEY secret is empty or not set"
            echo "Please configure ALCHEMY_PRIMARY_KEY in Repository Settings > Secrets and variables > Actions"
            exit 1
          else
            SECRET_LENGTH=$(echo -n "${{ secrets.ALCHEMY_PRIMARY_KEY }}" | wc -c)
            echo "✅ ALCHEMY_PRIMARY_KEY secret is set (length: $SECRET_LENGTH characters)"
          fi
      
      - name: Generate Alchemy Config
        run: |
          mkdir -p traitlab
          cat > traitlab/config-keys.js << EOF
          // This file is auto-generated by GitHub Actions
          // Do not edit manually - it will be overwritten on each push
          // Generated from ALCHEMY_PRIMARY_KEY repository secret
          window.ALCHEMY_KEYS_CONFIG = {
              primary: "${{ secrets.ALCHEMY_PRIMARY_KEY }}"
          };
          EOF
      
      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add traitlab/config-keys.js
          if ! git diff --staged --quiet; then
            git commit -m "Auto-generate Alchemy config from secrets [skip ci]"
            git push
          else
            echo "No changes to commit"
          fi

