# Imagen de adrianzero.com para el mini (mudanza de ZERO al mini, fase 1). Vite se construye aquí
# y el mini solo hace docker pull + dokku git:from-image (Beauty primero: nada de builds en el mini).
# Las VITE_* (valores públicos del bundle cliente) llegan del secret ADRIANZERO_VITE_ENV en formato
# dotenv, copiado de las variables de producción del proyecto adrianzero en Vercel.
name: build-mini-image

on:
  push:
    branches: [main]
    paths:
      - 'traitlabv4/**'
      - '.github/workflows/build-mini-image.yml'
  pull_request:
    paths:
      - 'traitlabv4/**'
      - '.github/workflows/build-mini-image.yml'
  workflow_dispatch: {}

concurrency:
  group: build-mini-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    # Los PR de forks no reciben secretos ni pueden publicar en GHCR
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      IMAGE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Write traitlabv4/.env.production from secret
        run: |
          if [ -z "$VITE_ENV" ]; then
            echo "::error::ADRIANZERO_VITE_ENV secret is empty — the bundle would compile without RPCs/addresses"
            exit 1
          fi
          printf '%s\n' "$VITE_ENV" > traitlabv4/.env.production
          echo "wrote $(grep -c '=' traitlabv4/.env.production) vars (values hidden)"
        env:
          VITE_ENV: ${{ secrets.ADRIANZERO_VITE_ENV }}

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push adrianzero
        uses: docker/build-push-action@v6
        with:
          context: traitlabv4
          file: traitlabv4/Dockerfile.mini
          push: true
          # El docker/containerd viejo del mini no sabe leer attestations de buildx.
          provenance: false
          sbom: false
          build-args: |
            GIT_SHA=${{ env.IMAGE_SHA }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/adrianzero:${{ env.IMAGE_SHA }}
            ${{ github.ref == 'refs/heads/main' && format('ghcr.io/{0}/adrianzero:latest', github.repository_owner) || '' }}
          cache-from: type=gha,scope=adrianzero-mini
          cache-to: type=gha,mode=max,scope=adrianzero-mini
