<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdrianZERO - Infinite Tunnel Showcase</title>
    <link rel="icon" href="/favicon.png">
    <link rel="stylesheet" href="tunnel.css">
</head>
<body>
    <!-- Loading Screen -->
    <div id="loadingScreen" class="loading-screen">
        <div class="loading-spinner"></div>
        <p class="loading-text">Loading tunnel...</p>
    </div>

    <!-- Main Container -->
    <div id="container"></div>

    <!-- UI Overlay -->
    <div class="ui-overlay">
        <!-- Title -->
        <div class="title-section">
            <h1 class="main-title">ADRIANZERO</h1>
            <p class="subtitle">Infinite Tunnel Experience</p>
        </div>

        <!-- Info Panel -->
        <div class="info-panel" id="infoPanel">
            <div class="info-content">
                <h3 id="currentTraitName">-</h3>
                <p id="currentTraitInfo">Navigate through the tunnel</p>
            </div>
        </div>

        <!-- Controls -->
        <div class="controls-panel">
            <button id="pauseBtn" class="control-btn" title="Pause/Play">
                <span class="icon">⏸</span>
            </button>
            <button id="speedDownBtn" class="control-btn" title="Slow Down">
                <span class="icon">−</span>
            </button>
            <span id="speedDisplay" class="speed-display">1.0x</span>
            <button id="speedUpBtn" class="control-btn" title="Speed Up">
                <span class="icon">+</span>
            </button>
            <button id="resetBtn" class="control-btn" title="Reset">
                <span class="icon">↻</span>
            </button>
        </div>

        <!-- Instructions -->
        <div class="instructions">
            <p>Use mouse to look around • Scroll to adjust speed</p>
        </div>
    </div>

    <!-- Three.js from CDN -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <!-- GSAP from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>

    <!-- Config -->
    <script type="module" src="config.js?v=12"></script>
    
    <!-- Main Tunnel Script -->
    <script type="module" src="tunnel.js?v=12"></script>
</body>
</html>
