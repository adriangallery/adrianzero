    <meta property="og:site_name" content="AdrianZERO" />

         Pixelify Sans = UI (botones, chips, badges, números, h2/h3, TabBar);
         Chakra Petch = body (párrafos, inputs). Fuera Space Grotesk/JetBrains Mono. -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400;500;600;700&family=Chakra+Petch:wght@400;500;600;700&display=swap" rel="stylesheet">
