<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdrianZERO — Zombie Shooter</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans&display=swap">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="topbar">
        <div class="brand">
            <span class="dot"></span>
            <span>AdrianZERO · Zombie Shooter</span>
        </div>
        <div class="wallet-block">
            <span id="walletAddress" class="wallet-addr">Not connected</span>
            <button id="connectBtn" class="btn-primary">Connect Wallet</button>
        </div>
    </header>

    <main class="game-container">
        <canvas id="gameCanvas" width="960" height="540"></canvas>
        <div id="mintStatus" class="mint-status"></div>
    </main>

    <section class="tier-panel">
        <div class="tier-row">
            <div class="tier">
                <div class="tier-name">Shambler</div>
                <div class="tier-score">150+</div>
                <div class="tier-price">25,000 ZERO</div>
            </div>
            <div class="tier">
                <div class="tier-name">Runner</div>
                <div class="tier-score">600+</div>
                <div class="tier-price">18,750 ZERO <span class="discount">-25%</span></div>
            </div>
            <div class="tier">
                <div class="tier-name">Brute</div>
                <div class="tier-score">1500+</div>
                <div class="tier-price">12,500 ZERO <span class="discount">-50%</span></div>
            </div>
            <div class="tier">
                <div class="tier-name">Boss</div>
                <div class="tier-score">3000+</div>
                <div class="tier-price free">FREE</div>
            </div>
        </div>
    </section>

    <footer class="footer">
        60s to rack up score · pay in <span style="color:#ffd24a">$ZERO</span> · higher score = fewer tokens burned · on <a href="https://base.org" target="_blank">Base</a>
    </footer>

    <script type="module">
        import game from './src/game.js';
        import { connectWallet } from './src/web3.js';

        document.getElementById('connectBtn').addEventListener('click', async () => {
            try { await connectWallet(); }
            catch (e) { alert(e.message || e); }
        });

        window.__zombieGame = game;
    </script>
</body>
</html>
