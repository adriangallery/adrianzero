<svg xmlns="http://www.w3.org/2000/svg" width="64" height="96" viewBox="0 0 16 24" shape-rendering="crispEdges">
  <!-- Runner — bloodied fast zombie -->
  <g fill="#8a4a3a">
    <rect x="5" y="1" width="6" height="6"/>
    <rect x="4" y="7" width="8" height="9"/>
    <rect x="3" y="8" width="1" height="6"/>
    <rect x="12" y="8" width="1" height="6"/>
  </g>
  <rect x="6" y="2" width="1" height="1" fill="#a06050"/>
  <rect x="10" y="2" width="1" height="1" fill="#a06050"/>
  <!-- glowing yellow eyes -->
  <rect x="6" y="3" width="1" height="2" fill="#ffd24a"/>
  <rect x="9" y="3" width="1" height="2" fill="#ffd24a"/>
  <!-- open bloody mouth -->
  <rect x="6" y="5" width="4" height="2" fill="#4a0a0a"/>
  <rect x="7" y="5" width="1" height="1" fill="#ffffff"/>
  <rect x="9" y="5" width="1" height="1" fill="#ffffff"/>
  <!-- bloodied torso -->
  <rect x="4" y="9" width="8" height="5" fill="#5a1a1a"/>
  <rect x="5" y="10" width="2" height="2" fill="#8a2a2a"/>
  <rect x="9" y="11" width="1" height="2" fill="#8a2a2a"/>
  <!-- legs (running, asymmetric) -->
  <rect x="5" y="16" width="2" height="6" fill="#2a1a1a"/>
  <rect x="9" y="16" width="2" height="7" fill="#2a1a1a"/>
  <rect x="4" y="21" width="3" height="1" fill="#1a1a1a"/>
  <rect x="9" y="22" width="3" height="1" fill="#1a1a1a"/>
</svg>
