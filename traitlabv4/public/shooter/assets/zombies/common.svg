<svg xmlns="http://www.w3.org/2000/svg" width="64" height="96" viewBox="0 0 16 24" shape-rendering="crispEdges">
  <!-- Common Shambler — green zombie -->
  <g fill="#5a7a3a">
    <rect x="5" y="1" width="6" height="6"/>
    <rect x="4" y="7" width="8" height="9"/>
    <rect x="3" y="8" width="1" height="6"/>
    <rect x="12" y="8" width="1" height="6"/>
  </g>
  <!-- skin highlights -->
  <rect x="5" y="2" width="1" height="1" fill="#6c8e46"/>
  <rect x="10" y="2" width="1" height="1" fill="#6c8e46"/>
  <!-- eyes -->
  <rect x="6" y="3" width="1" height="1" fill="#ff2a2a"/>
  <rect x="9" y="3" width="1" height="1" fill="#ff2a2a"/>
  <!-- mouth with blood -->
  <rect x="6" y="5" width="4" height="1" fill="#1a1a1a"/>
  <rect x="7" y="6" width="2" height="1" fill="#8b0000"/>
  <!-- torn shirt -->
  <rect x="4" y="9" width="8" height="5" fill="#3a2a2a"/>
  <rect x="5" y="10" width="1" height="1" fill="#5a3a3a"/>
  <rect x="9" y="12" width="2" height="1" fill="#5a3a3a"/>
  <!-- legs -->
  <rect x="5" y="16" width="2" height="7" fill="#2a2a3a"/>
  <rect x="9" y="16" width="2" height="7" fill="#2a2a3a"/>
  <!-- feet -->
  <rect x="4" y="22" width="3" height="1" fill="#1a1a1a"/>
  <rect x="9" y="22" width="3" height="1" fill="#1a1a1a"/>
</svg>
