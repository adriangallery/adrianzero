<svg xmlns="http://www.w3.org/2000/svg" width="112" height="128" viewBox="0 0 28 32" shape-rendering="crispEdges">
  <!-- Boss — golden rare zombie -->
  <g fill="#c8a24a">
    <rect x="8" y="1" width="12" height="8"/>
    <rect x="5" y="9" width="18" height="13"/>
    <rect x="3" y="11" width="2" height="10"/>
    <rect x="23" y="11" width="2" height="10"/>
  </g>
  <!-- golden highlights -->
  <rect x="9" y="2" width="2" height="1" fill="#e6c672"/>
  <rect x="17" y="2" width="2" height="1" fill="#e6c672"/>
  <rect x="9" y="10" width="1" height="8" fill="#e6c672"/>
  <!-- crown spikes -->
  <rect x="9" y="0" width="2" height="1" fill="#ffe28a"/>
  <rect x="13" y="0" width="2" height="1" fill="#ffe28a"/>
  <rect x="17" y="0" width="2" height="1" fill="#ffe28a"/>
  <!-- glowing red eyes -->
  <rect x="10" y="4" width="2" height="2" fill="#ff0000"/>
  <rect x="16" y="4" width="2" height="2" fill="#ff0000"/>
  <rect x="10" y="4" width="1" height="1" fill="#ffaaaa"/>
  <rect x="16" y="4" width="1" height="1" fill="#ffaaaa"/>
  <!-- fanged grin -->
  <rect x="9" y="7" width="10" height="2" fill="#0a0a0a"/>
  <rect x="10" y="7" width="1" height="2" fill="#ffffff"/>
  <rect x="12" y="7" width="1" height="2" fill="#ffffff"/>
  <rect x="14" y="7" width="1" height="2" fill="#ffffff"/>
  <rect x="16" y="7" width="1" height="2" fill="#ffffff"/>
  <rect x="18" y="7" width="1" height="2" fill="#ffffff"/>
  <!-- golden armor -->
  <rect x="5" y="11" width="18" height="8" fill="#6a4a1a"/>
  <rect x="7" y="12" width="4" height="2" fill="#c8a24a"/>
  <rect x="17" y="12" width="4" height="2" fill="#c8a24a"/>
  <rect x="12" y="14" width="4" height="3" fill="#e6c672"/>
  <rect x="13" y="15" width="2" height="1" fill="#ff0000"/>
  <!-- massive legs -->
  <rect x="7" y="22" width="5" height="9" fill="#2a1a0a"/>
  <rect x="16" y="22" width="5" height="9" fill="#2a1a0a"/>
  <rect x="6" y="30" width="6" height="1" fill="#1a0a0a"/>
  <rect x="16" y="30" width="6" height="1" fill="#1a0a0a"/>
</svg>
