<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdrianZERO Gallery - TraitLAB</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'VT323', monospace;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 50%, #0f0f0f 100%);
            min-height: 100vh;
            color: #fff;
        }

        /* Menu Styles */
        #menu-container {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
        }

        #menu-container .navbar {
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid #00ff00;
        }

        #menu-container .navbar-nav .nav-link {
            color: #00ff00 !important;
            font-family: 'VT323', monospace;
            font-size: 1.1rem;
            transition: all 0.3s ease;
        }

        #menu-container .navbar-nav .nav-link:hover {
            color: #ffffff !important;
            text-shadow: 0 0 10px #00ff00;
        }

        #menu-container .navbar-text {
            color: #00ff00 !important;
            font-family: 'VT323', monospace;
            font-size: 1.2rem;
            font-weight: bold;
        }

        /* Main Content */
        .main-content {
            margin-top: 80px;
            padding: 20px;
        }

        .gallery-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .gallery-title {
            font-size: 3rem;
            color: #00ff00;
            text-shadow: 0 0 20px #00ff00;
            margin-bottom: 20px;
        }

        .gallery-subtitle {
            font-size: 1.2rem;
            color: #ccc;
            margin-bottom: 30px;
        }

        /* Filters */
        .filters-section {
            background: rgba(0, 255, 0, 0.1);
            border: 1px solid #00ff00;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .filter-group {
            margin-bottom: 15px;
        }

        .filter-label {
            color: #00ff00;
            font-size: 1.1rem;
            margin-bottom: 5px;
            display: block;
        }

        .filter-input {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #00ff00;
            color: #fff;
            padding: 8px 12px;
            border-radius: 5px;
            font-family: 'VT323', monospace;
        }

        .filter-input:focus {
            outline: none;
            border-color: #ffffff;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
        }

        /* Gallery Grid */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
            opacity: 1;
            transition: opacity 0.5s ease;
        }

        .trait-card {
            background: rgba(0, 255, 0, 0.05);
            border: 1px solid #00ff00;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .trait-card:hover {
            background: rgba(0, 255, 0, 0.1);
            border-color: #ffffff;
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 255, 0, 0.3);
        }

        .trait-image {
            width: 100%;
            height: 150px;
            object-fit: contain;
            border-radius: 5px;
            margin-bottom: 10px;
            background: rgba(0, 0, 0, 0.3);
        }

        .trait-name {
            color: #00ff00;
            font-size: 1rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .trait-id {
            color: #ccc;
            font-size: 0.9rem;
        }

        .trait-supply {
            color: #888;
            font-size: 0.8rem;
            margin-top: 5px;
        }

        /* Placeholder Styles for Loading Sensation */
        .trait-card .placeholder-image {
            width: 100%;
            height: 150px;
            background: linear-gradient(45deg, #1a1a1a 25%, #2a2a2a 25%, #2a2a2a 50%, #1a1a1a 50%, #1a1a1a 75%, #2a2a2a 75%);
            background-size: 20px 20px;
            border-radius: 5px;
            margin-bottom: 10px;
            position: relative;
            animation: placeholder-pulse 2s ease-in-out infinite;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #00ff00;
            font-size: 0.9rem;
            font-weight: bold;
        }

        .trait-card .placeholder-image::before {
            content: "Trait " attr(data-trait-id);
            text-shadow: 0 0 10px #00ff00;
        }

        @keyframes placeholder-pulse {
            0% {
                opacity: 0.6;
                transform: scale(1);
            }
            50% {
                opacity: 1;
                transform: scale(1.02);
            }
            100% {
                opacity: 0.6;
                transform: scale(1);
            }
        }

        /* Loading States */
        #loadingState {
            transition: opacity 0.5s ease;
        }

        .loading-spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid rgba(0, 255, 0, 0.3);
            border-radius: 50%;
            border-top-color: #00ff00;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            color: #00ff00;
            font-size: 1.2rem;
            margin-top: 20px;
        }

        /* Pagination */
        .pagination-section {
            text-align: center;
            margin-top: 40px;
        }

        .pagination-btn {
            background: rgba(0, 255, 0, 0.1);
            border: 1px solid #00ff00;
            color: #00ff00;
            padding: 10px 20px;
            margin: 0 5px;
            border-radius: 5px;
            cursor: pointer;
            font-family: 'VT323', monospace;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .pagination-btn:hover:not(:disabled) {
            background: rgba(0, 255, 0, 0.2);
            border-color: #ffffff;
        }

        .pagination-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .pagination-info {
            color: #ccc;
            margin: 20px 0;
        }

        /* Stats */
        .stats-section {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid #333;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .stat-item {
            display: inline-block;
            margin: 0 20px;
            text-align: center;
        }

        .stat-number {
            color: #00ff00;
            font-size: 2rem;
            font-weight: bold;
        }

        .stat-label {
            color: #ccc;
            font-size: 1rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .gallery-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 15px;
            }
            
            .gallery-title {
                font-size: 2rem;
            }
            
            .trait-card {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation Menu -->
    <div id="menu-container">
        <nav class="navbar navbar-expand-lg">
            <div class="container-fluid">
                <a class="navbar-brand" href="https://adrianzero.com">AdrianZERO</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="https://adrianzero.com">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="https://adrianzero.com/traitlab">TraitLAB</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="https://adrianzero.com/gallery">Gallery</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="https://adrianzero.com/traitcreator">Trait Creator</a>
                        </li>
                    </ul>
                    <span class="navbar-text">Gallery</span>
                </div>
            </div>
        </nav>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Header -->
        <div class="gallery-header">
            <h1 class="gallery-title">AdrianZERO Gallery</h1>
            <p class="gallery-subtitle">Explore all available traits in the AdrianZERO collection</p>
        </div>

        <!-- Stats -->
        <div class="stats-section">
            <div class="stat-item">
                <div class="stat-number" id="totalTraits">--</div>
                <div class="stat-label">Total Traits</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="loadedTraits">0</div>
                <div class="stat-label">Loaded</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="filteredTraits">0</div>
                <div class="stat-label">Filtered</div>
            </div>
        </div>

        <!-- Filters -->
        <div class="filters-section">
            <div class="row">
                <div class="col-md-3">
                    <div class="filter-group">
                        <label class="filter-label" for="searchInput">Search</label>
                        <input type="text" id="searchInput" class="filter-input form-control" placeholder="Search traits...">
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="filter-group">
                        <label class="filter-label" for="categoryFilter">Category</label>
                        <select id="categoryFilter" class="filter-input form-control">
                            <option value="">All Categories</option>
                        </select>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="filter-group">
                        <label class="filter-label" for="sortBy">Sort By</label>
                        <select id="sortBy" class="filter-input form-control">
                            <option value="id">ID</option>
                            <option value="name">Name</option>
                            <option value="supply">Supply</option>
                            <option value="category">Category</option>
                        </select>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="filter-group">
                        <label class="filter-label">&nbsp;</label>
                        <div style="display: flex; gap: 5px;">
                            <button onclick="refreshTraits()" class="filter-input form-control" style="background: rgba(0, 255, 0, 0.1); border: 1px solid #00ff00; color: #00ff00; cursor: pointer; flex: 1;">
                                🔄 Refresh
                            </button>
                            <button onclick="loadDemoMode()" class="filter-input form-control" style="background: rgba(255, 165, 0, 0.1); border: 1px solid #ffa500; color: #ffa500; cursor: pointer; flex: 1;">
                                🎮 Demo
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Loading State -->
        <div id="loadingState" class="text-center">
            <div class="loading-spinner"></div>
            <div class="loading-text">Loading traits...</div>
            <div id="loadingProgress" class="mt-3">
                <div class="progress" style="background: rgba(0, 0, 0, 0.3); height: 20px; border-radius: 10px;">
                    <div id="progressBar" class="progress-bar" style="background: linear-gradient(90deg, #00ff00, #00cc00); width: 0%; transition: width 0.3s ease;"></div>
                </div>
                <div id="progressText" class="mt-2" style="color: #00ff00;">Starting...</div>
            </div>
        </div>

        <!-- Gallery Grid -->
        <div id="galleryGrid" class="gallery-grid" style="display: none;">
            <!-- Traits will be loaded here -->
        </div>

        <!-- Loading More Indicator -->
        <div id="loadingMore" class="text-center mt-4" style="display: none;">
            <div class="loading-spinner"></div>
            <div class="loading-text">Loading more traits...</div>
        </div>

        <!-- Pagination -->
        <div class="pagination-section">
            <div class="pagination-info">
                Showing <span id="showingStart">0</span> - <span id="showingEnd">0</span> of <span id="showingTotal">0</span> traits
            </div>
            <button id="prevPage" class="pagination-btn" disabled>Previous</button>
            <span id="pageInfo">Page 1 of 1</span>
            <button id="nextPage" class="pagination-btn" disabled>Next</button>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- TraitLAB Modules -->
    <script src="traitlab/modules/config.js"></script>
    <script src="traitlab/modules/wallet.js"></script>
    <script src="traitlab/modules/ui.js"></script>
    <script src="traitlab/modules/traits.js"></script>
    <script src="traitlab/modules/gallery-manager.js"></script>
    
    <!-- Gallery Script -->
    <script>
        // Gallery state
        let galleryManager = null;
        let allTraits = [];
        let filteredTraits = [];
        let currentPage = 1;
        const traitsPerPage = 24;
        let isLoadingMore = false;

        // Contract configuration
        window.TRAITS_CONTRACT = "0x6e369bf0e4e0c106192d606fb6d85836d684da75"; // AdrianLAB Core contract
        const BASE_CHAIN_ID = 8453;
        const BASE_CHAIN_ID_HEX = "0x2105";

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            setupEventListeners();
            initializeGallery();
        });

        async function initializeGallery() {
            try {
                console.log('Initializing gallery...');
                updateProgress(0, 'Initializing gallery...');
                
                // Clear any existing cache
                console.log('Clearing cache...');
                localStorage.removeItem('adrianzero_traits_cache');
                localStorage.removeItem('adrianzero_traits_cache_time');
                
                // Initialize gallery manager
                galleryManager = new GalleryManager();
                
                // Use Alchemy RPC for better performance
                console.log('Using Alchemy RPC...');
                const alchemyRpcUrl = `https://base-mainnet.g.alchemy.com/v2/${galleryManager.alchemyApiKey}`;
                const provider = new ethers.providers.JsonRpcProvider(alchemyRpcUrl);
                await galleryManager.initialize(provider, null);

                console.log('Gallery manager initialized, loading traits...');
                // Load initial traits
                await loadTraits();
                
                // Set up scroll listener for infinite loading
                setupInfiniteScroll();
                
            } catch (error) {
                console.error('Error initializing gallery:', error);
                updateProgress(0, 'Error initializing, switching to demo mode...');
                // Fallback to demo mode
                await loadDemoTraits();
            }
        }

        function setupEventListeners() {
            document.getElementById('searchInput').addEventListener('input', filterTraits);
            document.getElementById('categoryFilter').addEventListener('change', filterTraits);
            document.getElementById('sortBy').addEventListener('change', filterTraits);
            document.getElementById('prevPage').addEventListener('click', () => changePage(-1));
            document.getElementById('nextPage').addEventListener('click', () => changePage(1));
        }

        async function loadTraits() {
            try {
                console.log('Loading initial traits...');
                updateProgress(0, 'Loading traits from Alchemy...');
                
                if (galleryManager) {
                    // Load initial batch from Alchemy
                    allTraits = await galleryManager.loadTraits();
                    updateProgress(100, `Loaded ${allTraits.length} traits!`);
                } else {
                    console.log('No gallery manager, using demo mode');
                    await loadDemoTraits();
                }
                
                displayTraits();
                
            } catch (error) {
                console.error('Error loading traits:', error);
                updateProgress(0, 'Error loading traits, switching to demo mode...');
                // Fallback to demo mode
                await loadDemoTraits();
            }
        }

        async function loadMoreTraits() {
            if (isLoadingMore || !galleryManager || !galleryManager.hasMore()) {
                return;
            }

            isLoadingMore = true;
            console.log('Loading more traits...');
            
            // Show loading indicator
            const loadingMore = document.getElementById('loadingMore');
            if (loadingMore) {
                loadingMore.style.display = 'block';
            }

            try {
                const newTraits = await galleryManager.loadMoreTraits();
                allTraits = newTraits;
                
                // Update display with new traits
                displayMoreTraits();
                
            } catch (error) {
                console.error('Error loading more traits:', error);
            } finally {
                isLoadingMore = false;
                
                // Hide loading indicator
                if (loadingMore) {
                    loadingMore.style.display = 'none';
                }
            }
        }

        function setupProgressTracking() {
            if (!galleryManager) return;
            
            // Override the loadTraitsFromContract method to track progress
            const originalMethod = galleryManager.loadTraitsFromContract.bind(galleryManager);
            galleryManager.loadTraitsFromContract = async function() {
                const traits = [];
                const maxId = 1000;
                const totalBatches = Math.ceil(maxId / this.batchSize);
                
                for (let startId = 1; startId <= maxId; startId += this.batchSize) {
                    const endId = Math.min(startId + this.batchSize - 1, maxId);
                    const currentBatch = Math.ceil(startId / this.batchSize);
                    const progress = (currentBatch / totalBatches) * 100;
                    
                    console.log(`Loading traits ${startId}-${endId}... (${currentBatch}/${totalBatches})`);
                    updateProgress(progress, `Loading batch ${currentBatch}/${totalBatches} (${startId}-${endId})`);
                    
                    try {
                        const batchTraits = await this.loadBatchTraitsWithRetry(startId, endId);
                        traits.push(...batchTraits);
                        
                        // Longer delay to avoid rate limiting
                        await new Promise(resolve => setTimeout(resolve, 2000));
                        
                    } catch (error) {
                        console.warn(`Error loading batch ${startId}-${endId}:`, error);
                        updateProgress(progress, `Error in batch ${currentBatch}, retrying...`);
                        await new Promise(resolve => setTimeout(resolve, 5000));
                    }
                }

                this.allTraits = traits.filter(trait => trait !== null);
                console.log(`Loaded ${this.allTraits.length} traits`);
                updateProgress(100, `Loaded ${this.allTraits.length} traits successfully!`);
            };
        }

        function updateProgress(percentage, text) {
            const progressBar = document.getElementById('progressBar');
            const progressText = document.getElementById('progressText');
            
            if (progressBar) {
                progressBar.style.width = `${Math.min(100, Math.max(0, percentage))}%`;
            }
            
            if (progressText) {
                progressText.textContent = text;
            }
        }

        async function loadDemoTraits() {
            console.log('Loading demo traits...');
            updateProgress(0, 'Generating demo traits...');
            
            // Simulate loading with progress
            for (let i = 0; i <= 100; i += 10) {
                updateProgress(i, `Generating demo traits... ${i}%`);
                await new Promise(resolve => setTimeout(resolve, 50));
            }
            
            // Generate demo traits
            allTraits = generateDemoTraits();
            updateProgress(100, 'Demo traits loaded!');
            
            // Small delay before showing
            await new Promise(resolve => setTimeout(resolve, 500));
            displayTraits();
        }

        function generateDemoTraits() {
            const traits = [];
            const categories = ['Background', 'Body', 'Eyes', 'Mouth', 'Accessories', 'Special', 'Rare', 'Legendary'];
            const traitNames = [
                'Neon Glow', 'Cyber Punk', 'Retro Wave', 'Matrix Code', 'Digital Rain',
                'Holographic', 'Glitch Effect', 'Pixel Art', '8-Bit Style', 'Vaporwave',
                'Synthwave', 'Outrun', 'Cyber City', 'Neon Lights', 'Digital Sunset',
                'Electric Blue', 'Hot Pink', 'Lime Green', 'Purple Haze', 'Orange Crush'
            ];
            
            for (let i = 1; i <= 800; i++) {
                const category = categories[Math.floor(Math.random() * categories.length)];
                const nameIndex = Math.floor(Math.random() * traitNames.length);
                const traitName = `${traitNames[nameIndex]} ${i}`;
                
                traits.push({
                    id: i,
                    name: traitName,
                    category: category,
                    image: null, // Will use CSS placeholder
                    totalSupply: Math.floor(Math.random() * 1000) + 1,
                    maxSupply: Math.floor(Math.random() * 10000) + 1000,
                    description: `A unique ${category.toLowerCase()} trait for AdrianZERO characters.`
                });
            }
            
            return traits;
        }

        function displayTraits() {
            // Hide loading state smoothly
            const loadingState = document.getElementById('loadingState');
            const galleryGrid = document.getElementById('galleryGrid');
            
            // Fade out loading state
            loadingState.style.opacity = '0';
            loadingState.style.transition = 'opacity 0.5s ease';
            
            setTimeout(() => {
                loadingState.style.display = 'none';
                galleryGrid.style.display = 'grid';
                galleryGrid.style.opacity = '0';
                galleryGrid.style.transition = 'opacity 0.5s ease';
                
                // Fade in gallery
                setTimeout(() => {
                    galleryGrid.style.opacity = '1';
                }, 100);
            }, 500);
            
            // Update stats
            document.getElementById('totalTraits').textContent = allTraits.length;
            document.getElementById('loadedTraits').textContent = allTraits.length;
            
            // Populate category filter
            populateCategoryFilter();
            
            // Filter traits
            filterTraits();
        }

        function displayMoreTraits() {
            // Update stats
            document.getElementById('totalTraits').textContent = allTraits.length;
            document.getElementById('loadedTraits').textContent = allTraits.length;
            
            // Update category filter
            populateCategoryFilter();
            
            // Re-filter and display
            filterTraits();
        }

        function setupInfiniteScroll() {
            const galleryGrid = document.getElementById('galleryGrid');
            
            // Add scroll listener
            window.addEventListener('scroll', () => {
                if (isLoadingMore || !galleryManager || !galleryManager.hasMore()) {
                    return;
                }

                // Check if user is near bottom of page
                const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
                const windowHeight = window.innerHeight;
                const documentHeight = document.documentElement.scrollHeight;

                // Load more when user is 200px from bottom
                if (scrollTop + windowHeight >= documentHeight - 200) {
                    loadMoreTraits();
                }
            });
        }

        function filterTraits() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const category = document.getElementById('categoryFilter').value;
            const sortBy = document.getElementById('sortBy').value;

            // Filter traits
            filteredTraits = allTraits.filter(trait => {
                const matchesSearch = trait.name.toLowerCase().includes(searchTerm) ||
                                   trait.description.toLowerCase().includes(searchTerm);
                const matchesCategory = !category || trait.category === category;
                return matchesSearch && matchesCategory;
            });

            // Sort traits
            filteredTraits.sort((a, b) => {
                switch (sortBy) {
                    case 'name':
                        return a.name.localeCompare(b.name);
                    case 'supply':
                        return parseInt(b.totalSupply) - parseInt(a.totalSupply);
                    case 'category':
                        return a.category.localeCompare(b.category);
                    default:
                        return a.id - b.id;
                }
            });

            // Update stats
            document.getElementById('filteredTraits').textContent = filteredTraits.length;
            
            // Reset to first page
            currentPage = 1;
            displayPage();
        }

        function displayPage() {
            const startIndex = (currentPage - 1) * traitsPerPage;
            const endIndex = startIndex + traitsPerPage;
            const pageTraits = filteredTraits.slice(startIndex, endIndex);

            const galleryGrid = document.getElementById('galleryGrid');
            galleryGrid.innerHTML = '';

            pageTraits.forEach(trait => {
                const traitCard = createTraitCard(trait);
                galleryGrid.appendChild(traitCard);
            });

            // Update pagination
            updatePagination();
        }

        function createTraitCard(trait) {
            const card = document.createElement('div');
            card.className = 'trait-card';
            
            // Handle image or placeholder
            const imageHtml = trait.image ? 
                `<img src="${trait.image}" alt="${trait.name}" class="trait-image">` :
                `<div class="trait-image placeholder-image" data-trait-id="${trait.id}"></div>`;
            
            card.innerHTML = `
                ${imageHtml}
                <div class="trait-name">${trait.name}</div>
                <div class="trait-id">ID: ${trait.id}</div>
                <div class="trait-supply">Supply: ${trait.totalSupply}/${trait.maxSupply}</div>
            `;
            
            // Add click handler for trait details
            card.addEventListener('click', () => showTraitDetails(trait));
            
            return card;
        }

        function showTraitDetails(trait) {
            // Simple modal for trait details
            const modal = document.createElement('div');
            modal.style.cssText = `
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.8);
                display: flex;
                justify-content: center;
                align-items: center;
                z-index: 2000;
            `;
            
            // Handle image or placeholder
            const imageHtml = trait.image ? 
                `<img src="${trait.image}" alt="${trait.name}" style="width: 200px; height: 200px; object-fit: contain; margin-bottom: 15px;">` :
                `<div class="placeholder-image" data-trait-id="${trait.id}" style="width: 200px; height: 200px; margin: 0 auto 15px auto;"></div>`;
            
            modal.innerHTML = `
                <div style="background: #1a1a1a; border: 2px solid #00ff00; border-radius: 10px; padding: 20px; max-width: 400px; text-align: center;">
                    ${imageHtml}
                    <h3 style="color: #00ff00; margin-bottom: 10px;">${trait.name}</h3>
                    <p style="color: #ccc; margin-bottom: 10px;">ID: ${trait.id}</p>
                    <p style="color: #ccc; margin-bottom: 10px;">Category: ${trait.category}</p>
                    <p style="color: #ccc; margin-bottom: 10px;">Supply: ${trait.totalSupply}/${trait.maxSupply}</p>
                    <p style="color: #ccc; margin-bottom: 15px;">${trait.description}</p>
                    <button onclick="this.parentElement.parentElement.remove()" style="background: #00ff00; color: #000; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer;">Close</button>
                </div>
            `;
            
            document.body.appendChild(modal);
        }

        function updatePagination() {
            const totalPages = Math.ceil(filteredTraits.length / traitsPerPage);
            const startIndex = (currentPage - 1) * traitsPerPage + 1;
            const endIndex = Math.min(currentPage * traitsPerPage, filteredTraits.length);

            document.getElementById('showingStart').textContent = startIndex;
            document.getElementById('showingEnd').textContent = endIndex;
            document.getElementById('showingTotal').textContent = filteredTraits.length;
            document.getElementById('pageInfo').textContent = `Page ${currentPage} of ${totalPages}`;

            document.getElementById('prevPage').disabled = currentPage === 1;
            document.getElementById('nextPage').disabled = currentPage === totalPages;
        }

        function changePage(direction) {
            const totalPages = Math.ceil(filteredTraits.length / traitsPerPage);
            const newPage = currentPage + direction;
            
            if (newPage >= 1 && newPage <= totalPages) {
                currentPage = newPage;
                displayPage();
            }
        }

        function populateCategoryFilter() {
            const categories = [...new Set(allTraits.map(trait => trait.category))];
            const categoryFilter = document.getElementById('categoryFilter');
            
            // Clear existing options except "All Categories"
            categoryFilter.innerHTML = '<option value="">All Categories</option>';
            
            categories.sort().forEach(category => {
                const option = document.createElement('option');
                option.value = category;
                option.textContent = category;
                categoryFilter.appendChild(option);
            });
        }

        // Add refresh button functionality
        function refreshTraits() {
            if (galleryManager) {
                galleryManager.clearCache();
            }
            localStorage.removeItem('adrianzero_traits_cache');
            localStorage.removeItem('adrianzero_traits_cache_time');
            location.reload();
        }

        // Load demo mode immediately
        function loadDemoMode() {
            console.log('Switching to demo mode...');
            updateProgress(0, 'Loading demo mode...');
            
            // Hide loading state and show demo traits
            setTimeout(async () => {
                await loadDemoTraits();
            }, 1000);
        }
    </script>
</body>
</html>
