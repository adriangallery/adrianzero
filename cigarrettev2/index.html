<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1" name="viewport"/>
<title>SVG Mini-Game (Cigarette)</title>
<style>
    :root {
      --cigScale: 1;
      --ui: 14px;
      /* stage background can be changed by the user */
      --stage-bg: #fff;
      --stage-bg-img: none;
      --stage-bg-size: auto;
      --stage-bg-pos: 0 0;
      --stage-bg-repeat: no-repeat;
    }
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 16px; }
    .wrap { display: grid; gap: 14px; grid-template-columns: 1fr; max-width: 920px; margin: 0 auto; }
    .hud { display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
    button { padding: 8px 12px; border: 1px solid #ddd; background:#fff; border-radius: 10px; cursor:pointer; }
    button:active { transform: translateY(1px); }
    select { padding: 7px 10px; border: 1px solid #ddd; background:#fff; border-radius: 10px; cursor:pointer; }
    input[type="color"] { width: 42px; height: 34px; border: 1px solid #ddd; background:#fff; border-radius: 10px; padding: 0; }
    .pill { border:1px solid #eee; border-radius: 999px; padding: 6px 10px; font-size: var(--ui); }
    .bar { width: 180px; height: 10px; border-radius: 999px; border:1px solid #eee; overflow:hidden; background:#fafafa; }
    .bar > div { height: 100%; width: 100%; background:#111; transform-origin:left center; }
    .stage {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      border: 1px solid #eee;
      border-radius: 18px;
      overflow: hidden;
      background: var(--stage-bg);
      background-image: var(--stage-bg-img);
      background-size: var(--stage-bg-size);
      background-position: var(--stage-bg-pos);
      background-repeat: var(--stage-bg-repeat);
      touch-action: manipulation;
      user-select: none;
    }

    .sprite {
      position:absolute;
      inset:0;
      transform: scale(var(--cigScale));
      transform-origin: 50% 50%;
    }
    .frame {
      position:absolute; inset:0;
      width: 100%; height: 100%;
      image-rendering: pixelated;
      display:none;
      pointer-events: none;
    }
    .frame.show { display:block; }
    .hitbox {
      position:absolute;
      /* Adjust these percentages to match your cigarette location */
      left: 33%;
      top: 58%;
      width: 34%;
      height: 18%;
      cursor: pointer;
      border-radius: 16px;
    }
    .hint {
      position:absolute; left: 12px; bottom: 12px;
      background: rgba(255,255,255,.85);
      border: 1px solid rgba(0,0,0,.08);
      border-radius: 14px;
      padding: 8px 10px;
      font-size: 12px;
      backdrop-filter: blur(6px);
    }
    .toast {
      position:absolute; right: 12px; top: 12px;
      background: rgba(17,17,17,.86);
      color:#fff;
      border-radius: 14px;
      padding: 8px 10px;
      font-size: 12px;
      opacity: 0;
      transform: translateY(-6px);
      transition: opacity .18s ease, transform .18s ease;
      pointer-events: none;
    }
    .toast.on { opacity: 1; transform: translateY(0); }
    .shake { animation: shake 120ms linear 1; }
    @keyframes shake {
      0% { transform: translate(0,0); }
      25% { transform: translate(2px,0); }
      50% { transform: translate(0,0); }
      75% { transform: translate(-2px,0); }
      100% { transform: translate(0,0); }
    }
    .muted { opacity:.65; }
    .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
    input[type="range"] { width: 220px; }
    code { background:#f6f6f6; padding:2px 6px; border-radius: 8px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
<div class="wrap">
<div class="hud">
<button id="toggleBtn">Light</button>
<button class="muted" id="resetBtn">Reset</button>
<div class="pill">State: <b id="state">OFF</b></div>
<div class="pill">Puffs: <b id="puffs">0</b></div>
<div class="row pill">
<span>HP</span>
<div aria-label="health" class="bar"><div id="hpFill"></div></div>
<b id="hpText">100</b>
</div>
<div class="row pill">
<span>Speed</span>
<input id="speed" max="260" min="40" type="range" value="110"/>
<span><b id="speedVal">110</b>ms</span>
</div>
<div class="row pill">
<span>Background</span>
<select aria-label="background preset" id="bgPreset">
<option value="white">White</option>
<option value="paper">Paper</option>

<option value="gridLight">Grid (light)</option>
<option value="checkers">Checkers</option>
<option value="charcoal">Charcoal</option>
<option value="gridDark">Grid (dark)</option>
<option value="custom">Custom</option>
</select>
<input aria-label="custom background color" class="hidden" id="bgColor" type="color" value="#ffffff"/>
</div>

<script>
    const frames = Array.from(document.querySelectorAll(".frame"));

        try {
          const v = storage.get(k);
          return (v === null || v === undefined) ? defVal : v;

          return defVal;
        }
      },
      set(k, v) {
        try { storage.set(k, v); } catch (e) {}
      }
    };

    const game = {
      lit: false,
      hp: 100,
      puffs: 0,
      frameIndex: 0,
      msPerFrame: Number(speed.value),
      puffing: false,
      timer: null,
      puffTimer: null
    };

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add("on");
      setTimeout(() => toast.classList.remove("on"), 700);
    }

    function renderHUD() {
      stateEl.textContent = game.lit ? "ON" : "OFF";
      toggleBtn.textContent = game.lit ? "Extinguish" : "Light";
      puffsEl.textContent = String(game.puffs);
      hpText.textContent = String(game.hp);
      hpFill.style.transform = `scaleX(${Math.max(0, game.hp) / 100})`;
      speedVal.textContent = String(game.msPerFrame);

      // cigarette "consumption": shrink as HP goes down
      const t = Math.max(0, Math.min(1, game.hp / 100));
      const scale = 0.45 + 0.55 * t; // 1.0 -> 0.45
      document.documentElement.style.setProperty("--cigScale", scale.toFixed(3));
    }

    // --- BACKGROUND PRESETS ---
    const BG_PRESETS = {
      white: {
        bg: "#ffffff",
        img: "none",
        size: "auto",
        pos: "0 0",
        repeat: "no-repeat"
      },
      paper: {
        bg: "#fffaf0",
        img: "linear-gradient(180deg, rgba(0,0,0,.04), rgba(0,0,0,0))",
        size: "cover",
        pos: "center",
        repeat: "no-repeat"
      },
      sunset: {
        bg: "#0b0b10",
        img: "linear-gradient(140deg, rgba(255,214,102,.55), rgba(255,90,192,.45) 45%, rgba(80,120,255,.45))",
        size: "cover",
        pos: "center",
        repeat: "no-repeat"
      },
      gridLight: {
        bg: "#ffffff",
        img: "repeating-linear-gradient(0deg, rgba(0,0,0,.06), rgba(0,0,0,.06) 1px, transparent 1px, transparent 24px), repeating-linear-gradient(90deg, rgba(0,0,0,.06), rgba(0,0,0,.06) 1px, transparent 1px, transparent 24px)",
        size: "auto",
        pos: "0 0",
        repeat: "repeat"
      },
      checkers: {
        bg: "#ffffff",
        img: "linear-gradient(45deg, rgba(0,0,0,.06) 25%, transparent 25%, transparent 75%, rgba(0,0,0,.06) 75%, rgba(0,0,0,.06)), linear-gradient(45deg, rgba(0,0,0,.06) 25%, transparent 25%, transparent 75%, rgba(0,0,0,.06) 75%, rgba(0,0,0,.06))",
        size: "48px 48px",
        pos: "0 0, 24px 24px",
        repeat: "repeat"
      },
      charcoal: {
        bg: "#0f1115",
        img: "none",
        size: "auto",
        pos: "0 0",
        repeat: "no-repeat"
      },
      gridDark: {
        bg: "#0f1115",
        img: "repeating-linear-gradient(0deg, rgba(255,255,255,.09), rgba(255,255,255,.09) 1px, transparent 1px, transparent 24px), repeating-linear-gradient(90deg, rgba(255,255,255,.09), rgba(255,255,255,.09) 1px, transparent 1px, transparent 24px)",
        size: "auto",
        pos: "0 0",
        repeat: "repeat"
      }
    };

    function applyStageBackground({ bg, img, size, pos, repeat }) {
      stage.style.setProperty("--stage-bg", bg ?? "#fff");
      stage.style.setProperty("--stage-bg-img", img ?? "none");
      stage.style.setProperty("--stage-bg-size", size ?? "auto");
      stage.style.setProperty("--stage-bg-pos", pos ?? "0 0");
      stage.style.setProperty("--stage-bg-repeat", repeat ?? "no-repeat");
    }

    function setBackgroundPreset(preset) {
      const keyPreset = "svgMiniGame.bgPreset";
      const keyColor = "svgMiniGame.bgColor";

      if (preset === "custom") {
        bgColor.classList.remove("hidden");
        const c = bgColor.value || "#ffffff";
        applyStageBackground({ bg: c, img: "none", size: "auto", pos: "0 0", repeat: "no-repeat" });
        storage.set(keyPreset, "custom");
        storage.set(keyColor, c);
        return;
      }

      bgColor.classList.add("hidden");
      const cfg = BG_PRESETS[preset] || BG_PRESETS.white;
      applyStageBackground(cfg);
      storage.set(keyPreset, preset);
    }

    function showFrame(i) {
      frames.forEach((f, idx) => f.classList.toggle("show", idx === i));
    }

    function setLit(on) {
      if (on && game.hp <= 0) {
        showToast("No HP left 💀 Reset.");
        return;
      }
      game.lit = on;
      game.frameIndex = 0;
      showFrame(0);
      renderHUD();
      showToast(on ? "Lit 🔥" : "Off 🧯");
    }

    function reset() {
      game.lit = false;
      game.hp = 100;
      game.puffs = 0;
      game.frameIndex = 0;
      game.puffing = false;
      showFrame(0);
      renderHUD();
      showToast("Reset ✅");
    }

    function puffOnce() {
      if (!game.lit || game.hp <= 0) return;

      game.puffs += 1;
      game.hp = Math.max(0, game.hp - 3);
      stage.classList.remove("shake");
      // force reflow so the animation restarts
      void stage.offsetWidth;
      stage.classList.add("shake");

      if (game.hp === 0) {
        setLit(false);
        showToast("Game over 😵");
      } else {
        showToast("Puff 💨");
      }
      renderHUD();
    }

    function startPuffing() {
      if (game.puffing) return;
      game.puffing = true;
      puffOnce();
      // continuous puffing while holding
      game.puffTimer = setInterval(() => puffOnce(), 260);
    }

    function stopPuffing() {
      game.puffing = false;
      if (game.puffTimer) clearInterval(game.puffTimer);
      game.puffTimer = null;
    }

    function loop() {
      if (game.lit && game.hp > 0) {
        // if puffing, speed up animation a bit
        const max = frames.length;
        game.frameIndex = (game.frameIndex + 1) % max;
        showFrame(game.frameIndex);
      } else {
        showFrame(0);
      }
      game.timer = setTimeout(loop, game.puffing ? Math.max(35, game.msPerFrame * 0.55) : game.msPerFrame);
    }

    // UI events
    toggleBtn.addEventListener("click", () => setLit(!game.lit));
    resetBtn.addEventListener("click", reset);

    speed.addEventListener("input", () => {
      game.msPerFrame = Number(speed.value);
      renderHUD();
    });

    // background selector
    bgPreset.addEventListener("change", () => {
      setBackgroundPreset(bgPreset.value);
      showToast(`Background: ${bgPreset.options[bgPreset.selectedIndex]?.text || bgPreset.value}`);
    });

    bgColor.addEventListener("input", () => {
      if (bgPreset.value !== "custom") return;
      setBackgroundPreset("custom");
      showToast("Background: custom");
    });

    // Hotspot interaction (mouse/touch)
    hitbox.addEventListener("click", (e) => {
      // single click toggles
      setLit(!game.lit);
      e.stopPropagation();
    });

    // hold to puff
    hitbox.addEventListener("pointerdown", (e) => {
      if (!game.lit) return;
      hitbox.setPointerCapture?.(e.pointerId);
      startPuffing();
    });
    hitbox.addEventListener("pointerup", stopPuffing);
    hitbox.addEventListener("pointercancel", stopPuffing);
    hitbox.addEventListener("pointerleave", stopPuffing);

    // keyboard
    window.addEventListener("keydown", (e) => {
      if (e.code === "Space") {
        e.preventDefault();
        if (!game.lit) setLit(true);
        startPuffing();
      }
      if (e.key.toLowerCase() === "r") reset();
    });
    window.addEventListener("keyup", (e) => {
      if (e.code === "Space") stopPuffing();
    });

    // init
    {
      const keyPreset = "svgMiniGame.bgPreset";
      const keyColor = "svgMiniGame.bgColor";
      const savedPreset = storage.get(keyPreset, "white");
      const savedColor = storage.get(keyColor, "#ffffff");

      bgColor.value = savedColor;
      bgPreset.value = (savedPreset in BG_PRESETS || savedPreset === "custom") ? savedPreset : "white";
      setBackgroundPreset(bgPreset.value);
    }

    renderHUD();
    loop();
  </script>
</body>
</html>
