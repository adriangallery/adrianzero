<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 1200px;
            height: 630px;
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            font-family: Arial, sans-serif;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }
        
        .border {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            bottom: 20px;
            border: 4px solid #00ff88;
            border-radius: 20px;
        }
        
        .title {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            z-index: 10;
        }
        
        .subtitle {
            font-size: 24px;
            color: #00ff88;
            margin-bottom: 30px;
            z-index: 10;
        }
        
        .cta {
            font-size: 28px;
            color: #ffffff;
            margin-bottom: 10px;
            z-index: 10;
        }
        
        .url {
            font-size: 20px;
            color: #00ff88;
            z-index: 10;
        }
        
        .decorative {
            position: absolute;
            width: 100px;
            height: 100px;
            background: linear-gradient(45deg, #00ff88, #ffd700);
            border-radius: 50%;
            opacity: 0.3;
        }
        
        .decorative:nth-child(1) {
            top: 50px;
            right: 50px;
        }
        
        .decorative:nth-child(2) {
            bottom: 50px;
            left: 50px;
            width: 60px;
            height: 60px;
        }
    </style>
</head>
<body>
    <div class="border"></div>
    <div class="decorative"></div>
    <div class="decorative"></div>
    
    <h1 class="title">🏗️ Builder Battle</h1>
    <p class="subtitle">Vote for your favorite builder!</p>
    <div class="cta">Join the battle and help decide the winner</div>
    <div class="url">adriangallery.github.io/adrianzero-1/bb</div>
</body>
</html>
