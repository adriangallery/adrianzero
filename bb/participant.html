<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Builder Battle - Participant</title>
    
    <!-- X (Twitter) Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="@adriangallery">
    <meta name="twitter:title" content="Builder Battle - Vote for Your Favorite Builder!">
    <meta name="twitter:description" content="Vote for your favorite builder and enter the lottery! Join the battle and help decide the winner.">
    <meta name="twitter:image" content="https://adrianzero.com/bb/og-image.html">
    
    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="Builder Battle - Vote for Your Favorite Builder!">
    <meta property="og:description" content="Vote for your favorite builder and enter the lottery! Join the battle and help decide the winner.">
    <meta property="og:image" content="https://adrianzero.com/bb/og-image.html">
    <meta property="og:url" content="https://adrianzero.com/bb/">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Builder Battle">
    
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏗️</text></svg>">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'VT323', monospace;
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            min-height: 100vh;
            color: #fff;
        }

        .hero-section {
            background: rgba(0, 0, 0, 0.3);
            padding: 60px 0;
            text-align: center;
            border-bottom: 3px solid #00ff88;
        }

        .hero-title {
            font-size: 4rem;
            font-weight: bold;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .hero-subtitle {
            font-size: 1.5rem;
            color: #00ff88;
            margin-bottom: 30px;
        }

        .participant-message {
            margin-top: 30px;
            padding: 20px;
            background: rgba(255, 215, 0, 0.1);
            border: 2px solid #ffd700;
            border-radius: 15px;
            text-align: center;
        }

        .highlighted-participant-info h2 {
            color: #ffd700;
            font-size: 2rem;
            margin-bottom: 15px;
        }

        .highlighted-participant-info p {
            color: #ffffff;
            font-size: 1.2rem;
            margin-bottom: 10px;
        }
        
        .participant-image-container {
            margin-top: 20px;
            text-align: center;
        }
        
        .participant-image-large {
            width: 300px;
            height: 300px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #ffd700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }

        .loading {
            text-align: center;
            padding: 50px;
            font-size: 1.5rem;
        }
    </style>
</head>
<body>
    <div class="hero-section">
        <h1 class="hero-title">🏗️ Builder Battle</h1>
        <p class="hero-subtitle">Vote for your favorite builder and enter the lottery! v1.2.0</p>
        
        <div class="participant-message">
            <div class="highlighted-participant-info">
                <h2 id="participantTitle">Loading participant...</h2>
                <p id="participantVotes">Loading votes...</p>
                <p>Loading the full application...</p>
            </div>
            <div class="participant-image-container">
                <img id="participantImage" src="" alt="Participant" class="participant-image-large">
            </div>
        </div>
    </div>
    
    <div class="loading">
        <p>Redirecting to Builder Battle...</p>
    </div>

    <script>
        // Get participant ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const participantId = urlParams.get('participant');
        
        if (participantId) {
            // Load participant data and update meta tags
            loadParticipantData(participantId);
        } else {
            // Redirect to main app
            window.location.href = 'https://adrianzero.com/bb/';
        }

        async function loadParticipantData(participantId) {
            try {
                // Initialize Supabase
                const supabase = window.supabase.createClient(SUPABASE_CONFIG.url, SUPABASE_CONFIG.anonKey);
                
                // Get participant data
                const { data: participant, error } = await supabase
                    .from('participants')
                    .select('*')
                    .eq('id', participantId)
                    .single();

                if (error || !participant) {
                    console.error('Error loading participant:', error);
                    window.location.href = 'https://adrianzero.com/bb/';
                    return;
                }

                // Update page content
                document.getElementById('participantTitle').textContent = `🎯 Voting for ${participant.name}${participant.x_profile ? ` by ${participant.x_profile}` : ''}`;
                document.getElementById('participantVotes').textContent = `This participant has ${participant.votes} vote${participant.votes !== 1 ? 's' : ''}`;
                document.getElementById('participantImage').src = participant.image;
                document.getElementById('participantImage').alt = participant.name;

                // Update meta tags for better sharing
                updateMetaTags(participant);

                // Redirect to main app after 2 seconds
                setTimeout(() => {
                    window.location.href = `https://adrianzero.com/bb/?participant=${participantId}`;
                }, 2000);

            } catch (error) {
                console.error('Error loading participant data:', error);
                window.location.href = 'https://adrianzero.com/bb/';
            }
        }

        function updateMetaTags(participant) {
            const xProfile = participant.x_profile || '';
            const imageUrl = participant.image;
            const pageUrl = `https://adrianzero.com/bb/?participant=${participant.id}`;

            // Update title
            document.title = `${participant.name} - Builder Battle`;

            // Update Twitter meta tags
            const twitterTitle = document.querySelector('meta[name="twitter:title"]');
            const twitterDescription = document.querySelector('meta[name="twitter:description"]');
            const twitterImage = document.querySelector('meta[name="twitter:image"]');
            const twitterCreator = document.querySelector('meta[name="twitter:creator"]');

            if (twitterTitle) twitterTitle.content = `${participant.name} - Builder Battle`;
            if (twitterDescription) twitterDescription.content = `Vote for ${participant.name} in Builder Battle! ${xProfile ? `by ${xProfile}` : ''} Join the battle and help decide the winner.`;
            if (twitterImage) twitterImage.content = imageUrl;
            if (twitterCreator) twitterCreator.content = xProfile || '@adriangallery';

            // Update Open Graph meta tags
            const ogTitle = document.querySelector('meta[property="og:title"]');
            const ogDescription = document.querySelector('meta[property="og:description"]');
            const ogImage = document.querySelector('meta[property="og:image"]');
            const ogUrl = document.querySelector('meta[property="og:url"]');

            if (ogTitle) ogTitle.content = `${participant.name} - Builder Battle`;
            if (ogDescription) ogDescription.content = `Vote for ${participant.name} in Builder Battle! ${xProfile ? `by ${xProfile}` : ''} Join the battle and help decide the winner.`;
            if (ogImage) ogImage.content = imageUrl;
            if (ogUrl) ogUrl.content = pageUrl;
        }
    </script>
</body>
</html>
