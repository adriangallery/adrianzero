<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AdrianAuction — $ADRIAN Ecosystem</title>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <link rel="icon" href="../components/images/adrianzero.png">
  <style>
    :root{
      --bg:#0b0f14;
      --fg:#e6f1ff;
      --muted:#98a6b3;
      --cyan:#00e5ff;
      --red:#ff004c;
      --green:#00ff88;
      --orange:#ff8800;
      --card:#0f1620;
      --line:#182431;
      --ring1:0 0 30px rgba(0,229,255,.28);
      --ring2:0 0 30px rgba(255,0,76,.16);
      /* Grid suave */
      --grid-rgb: 255,255,255;
      --cell: 144px;
      --block: 384px;
      --minor-a: .18;
      --major-a: .28;
    }
    
    /* Fondo cuadriculado suave estilo Miro ($ADRIAN) */
    .grid-soft{
      background-color: var(--bg);
      background-image:
        linear-gradient(to right, rgba(var(--grid-rgb), var(--minor-a)) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(var(--grid-rgb), var(--minor-a)) 1px, transparent 1px),
        linear-gradient(to right, rgba(var(--grid-rgb), var(--major-a)) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(var(--grid-rgb), var(--major-a)) 1px, transparent 1px),
        radial-gradient(1200px 800px at 80% -10%, rgba(0,229,255,.06), transparent 60%),
        radial-gradient(900px 600px at -10% 100%, rgba(255,0,76,.07), transparent 65%);
      background-size:
        var(--cell) var(--cell),
        var(--cell) var(--cell),
        var(--block) var(--block),
        var(--block) var(--block),
        auto,
        auto;
      background-position:
         0 0,
         0 0,
         0 0,
         0 0,
         center,
         center;
      background-repeat: repeat;
      background-attachment: fixed, fixed, fixed, fixed, fixed, fixed;
      image-rendering: pixelated;
    }
    
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      color:#ffffff;
      font-family:"VT323", monospace;
      line-height:1.6;
      overflow-x:hidden;
      position:relative;min-height:100vh;
    }
    
    .container{width:min(1100px,92%);margin:0 auto 64px;position:relative}
    
    /* Banner Section */
    .banner-section {
      width: 100%;
      margin: 20px 0 40px;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid var(--line);
      box-shadow: var(--ring1);
    }
    
    .banner-section img {
      width: 100%;
      height: auto;
      display: block;
    }
    
    @media (max-width: 991.98px) {
      .banner-section {
        margin-top: 80px;
      }
    }
    
    /* Auction Info Card */
    .auction-card {
      background: var(--card);
      border: 2px solid var(--line);
      border-radius: 12px;
      padding: 32px;
      margin-bottom: 32px;
      box-shadow: var(--ring1);
    }
    
    .auction-card h2 {
      font-size: 32px;
      color: var(--cyan);
      margin-bottom: 24px;
      text-align: center;
    }
    
    .auction-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 24px;
    }
    
    .stat-item {
      text-align: center;
      padding: 16px;
      background: rgba(0, 229, 255, 0.05);
      border: 1px solid rgba(0, 229, 255, 0.2);
      border-radius: 8px;
    }
    
    .stat-label {
      font-size: 16px;
      color: var(--muted);
      margin-bottom: 8px;
    }
    
    .stat-value {
      font-size: 24px;
      color: var(--cyan);
      font-weight: bold;
    }
    
    .countdown {
      text-align: center;
      font-size: 36px;
      color: var(--green);
      margin: 24px 0;
      font-weight: bold;
      text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
    }
    
    .auction-status {
      text-align: center;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 20px;
      font-weight: bold;
      margin: 16px 0;
    }
    
    .status-not-started {
      background: rgba(0, 229, 255, 0.2);
      color: var(--cyan);
      border: 2px solid var(--cyan);
    }
    
    .status-active {
      background: rgba(0, 255, 136, 0.2);
      color: var(--green);
      border: 2px solid var(--green);
    }
    
    .status-ended {
      background: rgba(255, 0, 76, 0.2);
      color: var(--red);
      border: 2px solid var(--red);
    }
    
    /* Top Bidders Section */
    .bidders-section {
      background: var(--card);
      border: 2px solid var(--line);
      border-radius: 12px;
      padding: 32px;
      margin-bottom: 32px;
    }
    
    .bidders-section h3 {
      font-size: 28px;
      color: var(--cyan);
      margin-bottom: 24px;
      text-align: center;
    }
    
    .bidders-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    
    .bidder-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--line);
      border-radius: 8px;
      transition: all 0.3s ease;
    }
    
    .bidder-item:hover {
      border-color: var(--cyan);
      box-shadow: 0 0 10px rgba(0, 229, 255, 0.3);
    }
    
    .bidder-item.highest {
      border-color: var(--green);
      background: rgba(0, 255, 136, 0.1);
    }
    
    .bidder-rank {
      font-size: 20px;
      color: var(--muted);
      min-width: 40px;
    }
    
    .bidder-info {
      flex: 1;
      margin: 0 16px;
    }
    
    .bidder-address {
      font-size: 18px;
      color: var(--fg);
      font-family: monospace;
    }
    
    .bidder-amount {
      font-size: 20px;
      color: var(--cyan);
      font-weight: bold;
    }
    
    .highest-badge {
      display: inline-block;
      padding: 4px 12px;
      background: rgba(0, 255, 136, 0.2);
      color: var(--green);
      border: 1px solid var(--green);
      border-radius: 12px;
      font-size: 14px;
      margin-left: 12px;
    }
    
    @media (min-width: 768px) {
      .bidders-list {
        display: table;
        width: 100%;
      }
      
      .bidder-item {
        display: table-row;
      }
      
      .bidder-item > * {
        display: table-cell;
        padding: 16px;
        vertical-align: middle;
      }
    }
    
    /* Bid Section */
    .bid-section {
      background: var(--card);
      border: 2px solid var(--line);
      border-radius: 12px;
      padding: 32px;
      margin-bottom: 32px;
    }
    
    .bid-section h3 {
      font-size: 28px;
      color: var(--cyan);
      margin-bottom: 24px;
      text-align: center;
    }
    
    .wallet-info {
      text-align: center;
      margin-bottom: 24px;
      padding: 16px;
      background: rgba(0, 229, 255, 0.05);
      border: 1px solid rgba(0, 229, 255, 0.2);
      border-radius: 8px;
    }
    
    .wallet-address {
      font-size: 18px;
      color: var(--cyan);
      font-family: monospace;
      margin-bottom: 8px;
    }
    
    .wallet-balance {
      font-size: 16px;
      color: var(--muted);
    }
    
    .bid-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    
    .input-group label {
      font-size: 18px;
      color: var(--fg);
    }
    
    .input-group input {
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid var(--line);
      border-radius: 8px;
      color: var(--fg);
      font-size: 20px;
      font-family: 'VT323', monospace;
    }
    
    .input-group input:focus {
      outline: none;
      border-color: var(--cyan);
      box-shadow: 0 0 10px rgba(0, 229, 255, 0.3);
    }
    
    .btn-primary {
      background: var(--cyan);
      color: var(--bg);
      border: none;
      padding: 16px 32px;
      font-size: 20px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: 'VT323', monospace;
    }
    
    .btn-primary:hover:not(:disabled) {
      background: var(--green);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(0, 255, 136, 0.4);
    }
    
    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    .btn-connect {
      background: var(--green);
      color: var(--bg);
      border: none;
      padding: 16px 32px;
      font-size: 20px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: 'VT323', monospace;
      width: 100%;
    }
    
    .btn-connect:hover {
      background: var(--cyan);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(0, 229, 255, 0.4);
    }
    
    .status-message {
      text-align: center;
      padding: 12px;
      border-radius: 8px;
      margin-top: 16px;
      font-size: 18px;
    }
    
    .status-loading {
      background: rgba(0, 229, 255, 0.2);
      color: var(--cyan);
      border: 1px solid var(--cyan);
    }
    
    .status-success {
      background: rgba(0, 255, 136, 0.2);
      color: var(--green);
      border: 1px solid var(--green);
    }
    
    .status-error {
      background: rgba(255, 0, 76, 0.2);
      color: var(--red);
      border: 1px solid var(--red);
    }
    
    /* Menu Styles */
    #menu-container {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
    }

    #menu-container .navbar {
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 2px solid var(--green);
    }

    #menu-container .navbar-nav .nav-link {
      color: var(--green) !important;
      font-family: 'VT323', monospace;
      font-size: 1.1rem;
      transition: all 0.3s ease;
    }

    #menu-container .navbar-nav .nav-link:hover {
      color: #ffffff !important;
      text-shadow: 0 0 10px var(--green);
    }

    #menu-container .navbar-text {
      color: var(--green) !important;
      font-family: 'VT323', monospace;
      font-size: 1.2rem;
      font-weight: bold;
    }

    #menu-container .navbar-toggler {
      border-color: var(--green);
    }

    #menu-container .navbar-toggler-icon {
      background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3e%3cpath stroke='rgba(0, 255, 0, 1)' stroke-linecap='round' stroke-miterlimit='10' stroke-width='2' d='M4 7h22M4 15h22M4 23h22'/%3e%3c/svg%3e");
    }

    .hero {
      padding-top: 100px;
    }

    #menu-container .navbar-collapse {
      display: none;
    }

    #menu-container .navbar-collapse.show {
      display: block;
    }

    #menu-container .dropdown-menu {
      background: rgba(0, 0, 0, 0.95) !important;
      border: 2px solid var(--green) !important;
      border-radius: 8px !important;
      z-index: 1050 !important;
      min-width: 200px;
    }

    #menu-container .dropdown-item {
      color: var(--green) !important;
      font-family: 'VT323', monospace !important;
      font-size: 1rem !important;
      padding: 10px 20px !important;
      transition: all 0.3s ease !important;
    }

    #menu-container .dropdown-item:hover {
      background: rgba(0, 255, 0, 0.2) !important;
      color: #ffffff !important;
    }
    
    @media (max-width: 991.98px) {
      .hero {
        padding-top: 80px;
      }
      
      .auction-card,
      .bidders-section,
      .bid-section {
        padding: 24px 16px;
      }
      
      .auction-stats {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body class="grid-soft">
  <!-- Menu -->
  <div id="menu-container"></div>
  <script>
    fetch('../components/menu.html')
      .then(r => {
        if (!r.ok) throw new Error('Failed to load menu');
        return r.text();
      })
      .then(html => { 
        document.getElementById('menu-container').innerHTML = html; 
        const s = document.createElement('script'); 
        s.src = '../components/menu.js'; 
        s.onerror = () => console.warn('Menu script not found, continuing without it');
        document.head.appendChild(s); 
      })
      .catch(err => {
        console.warn('Error loading menu:', err);
      });
  </script>

  <div class="container hero">
    <!-- Banner -->
    <div class="banner-section">
      <img src="Adrian_Sensai.gif" alt="Current Auction">
    </div>

    <!-- Auction Info -->
    <div class="auction-card">
      <h2>Current Auction</h2>
      
      <div id="auctionStatus" class="auction-status status-loading">Loading...</div>
      
      <div class="countdown" id="countdown">--:--:--</div>
      
      <div class="auction-stats">
        <div class="stat-item">
          <div class="stat-label">Highest Bid</div>
          <div class="stat-value" id="highestBid">--</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">Highest Bidder</div>
          <div class="stat-value" id="highestBidder">--</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">Total Deposited</div>
          <div class="stat-value" id="totalDeposited">--</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">Total Bidders</div>
          <div class="stat-value" id="bidderCount">--</div>
        </div>
      </div>
    </div>

    <!-- Top Bidders -->
    <div class="bidders-section">
      <h3>Top 10 Bidders</h3>
      <div class="bidders-list" id="biddersList">
        <div style="text-align: center; padding: 40px; color: var(--muted);">Loading bidders...</div>
      </div>
    </div>

    <!-- Bid Section -->
    <div class="bid-section">
      <h3>Place Your Bid</h3>
      
      <div id="walletSection">
        <button class="btn-connect" id="connectBtn">Connect Wallet</button>
      </div>
      
      <div id="bidForm" style="display: none;">
        <div class="wallet-info">
          <div class="wallet-address" id="walletAddress">--</div>
          <div class="wallet-balance">Balance: <span id="walletBalance">--</span> $ADRIAN</div>
        </div>
        
        <div class="bid-form">
          <div class="input-group">
            <label for="bidAmount">Bid Amount ($ADRIAN)</label>
            <input type="number" id="bidAmount" placeholder="0" min="0" step="0.0001">
          </div>
          
          <button class="btn-primary" id="approveBtn" style="display: none;">Approve $ADRIAN</button>
          <button class="btn-primary" id="bidBtn">Place Bid</button>
          
          <div id="statusMessage"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="auction-app.js"></script>
</body>
</html>
