                                    data-recipe-id="${recipe.recipeId}" 
                                    ${meetsRequirement ? '' : 'disabled'}>
                                ${meetsRequirement ? '🔨 Craft' : '❌ Insufficient Materials'}
                            </button>
                        </div>
                    </div>
                `;
            }

            setupCraftingEventListeners() {
                // Listen for trait selection changes
                this.modules.crafting.on('traitsSelectionChanged', (data) => {
                    console.log('🔨 Crafting: Traits selection changed:', data);
                    this.displayCraftingRecipes(); // Refresh display
                });
                
                // Listen for crafting success
                this.modules.crafting.on('craftingSuccessful', (data) => {
                    console.log('🔨 Crafting: Success:', data);
                    this.showSuccess(`Crafting successful! TX: ${data.transactionHash}`);
                    // Refresh recipes
                    this.loadCraftingRecipes();
                });
                
                // Add click listeners to craft buttons
                document.querySelectorAll('.craft-btn.enabled').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const recipeId = parseInt(e.target.dataset.recipeId);
                        this.executeCrafting(recipeId);
                    });
                });
            }

            async executeCrafting(recipeId) {
                console.log('🔨 executeCrafting: Executing recipe:', recipeId);
                
                try {
                    const recipes = this.modules.crafting.getRecipes();
                    const recipe = recipes.find(r => r.recipeId === recipeId);
                    
                    if (!recipe) {
                        throw new Error('Recipe not found');
                    }
                    
                    if (recipe.type === 'specific') {
                        await this.modules.crafting.craftSpecific(recipeId);
                    } else if (recipe.type === 'any') {
                        const selectedTraits = this.modules.crafting.getSelectedTraits();
                        const burnIds = Array.from(selectedTraits.keys()).map(id => parseInt(id));
                        const burnAmounts = Array.from(selectedTraits.values());
                        
                        await this.modules.crafting.craftAny(recipeId, burnIds, burnAmounts);
                    }
                    
                } catch (error) {
                    console.error('Error executing crafting:', error);
                    this.showError(`Error executing recipe: ${error.message}`);
                }
            }

            handleCraftingTraitSelection(trait) {
                console.log('🔨 handleCraftingTraitSelection:', trait);
                
                // Toggle selection in crafting module
                const selectedTraits = this.modules.crafting.getSelectedTraits();
                if (selectedTraits.has(trait.tokenId)) {
                    this.modules.crafting.deselectTrait(trait.tokenId);
                } else {
                    this.modules.crafting.selectTrait(trait.tokenId, 1);
                }
                
                // Refresh the display to show updated selection
                this.displayCraftingRecipes();
            }

            // UI Helper Methods
            showLoading() {
                const loading = document.getElementById('loading');
                if (loading) loading.style.display = 'block';
            }

            hideLoading() {
                const loading = document.getElementById('loading');
                if (loading) loading.style.display = 'none';
            }

            showError(message) {
                const error = document.getElementById('error');
                if (error) {
                    error.textContent = message;
                    error.style.display = 'block';
                    setTimeout(() => error.style.display = 'none', 5000);
                }
            }

            showSuccess(message) {
                const success = document.getElementById('success');
                if (success) {
                    success.textContent = message;
                    success.style.display = 'block';
                    setTimeout(() => success.style.display = 'none', 5000);
                }
            }

            // AdrianNameRegistry Helper Methods
            updateTokenNamesOnly(nameMap) {
                console.log(`🔄 Starting name update for ${nameMap.size} tokens...`);
                
                // Use requestAnimationFrame to ensure smooth updates
                requestAnimationFrame(() => {
                    nameMap.forEach((customName, tokenId) => {
                        // Find the token card by token ID
                        const selector = `[data-token-id="${tokenId}"][data-contract="0x6e369bf0e4e0c106192d606fb6d85836d684da75"]`;
                        const tokenCard = document.querySelector(selector);
                        
                        if (tokenCard) {
                            // Find the title element within the card
                            const titleElement = tokenCard.querySelector('.token-title');
                            if (titleElement) {
                                const oldName = titleElement.textContent;
                                // Only update if the name is actually different
                                if (oldName !== customName) {
                                    titleElement.textContent = customName;
                                    console.log(`✨ Updated name for token ${tokenId}: "${oldName}" → "${customName}"`);
                                } else {
                                    console.log(`ℹ️ Name already up to date for token ${tokenId}: "${customName}"`);
                                }
                            } else {
                                console.log(`⚠️ Title element not found for token ${tokenId}`);
                            }
                        } else {
                            console.log(`⚠️ Token card not found for token ${tokenId} with selector: ${selector}`);
                        }
                    });
                    
                    console.log(`✅ Name update completed for ${nameMap.size} tokens`);
                });
            }

            handleCustomNamesProgressUpdate(data) {
                console.log('🔄 Custom names progress update:', data);
                const { nameMap, tokens } = data;
                
                // Update the local tokens array
                this.tokens = tokens;
                
                // Update display progressively
                this.updateTokenNamesOnly(nameMap);
            }

            handleTokensReadyForDisplay(data) {
                console.log('🔄 Tokens ready for display:', data);
                const { tokens, skipSelectionUpdate } = data;
                
                // Display tokens immediately with Alchemy names
                this.displayTokens(tokens, skipSelectionUpdate);
            }
        }

        // Initialize app when DOM is loaded
        document.addEventListener('DOMContentLoaded', () => {
            const app = new TraitLABApp();
            window.app = app;
            
            // Inicializar StickyVisibilityManager después del DOM
            if (app) {
                app.stickyManager = new window.StickyVisibilityManager();
                console.log('✅ StickyVisibilityManager inicializado después del DOM');
            }
            
            // Aplicar estado responsive por defecto al selection-info
            applyResponsiveSelectionInfo();
        });

        // Función para aplicar estado responsive al selection-info
        function applyResponsiveSelectionInfo() {
            const selectionInfo = document.getElementById('selection-info');
            const minimizeBtn = document.getElementById('minimizeBtn');
            
            if (selectionInfo && minimizeBtn) {
                const isMobile = window.innerWidth < 768;
                
                if (isMobile) {
                    // Mobile: Minimized por defecto
                    selectionInfo.classList.add('minimized');
                    minimizeBtn.textContent = 'Expand';
                    console.log('📱 Mobile detectado: selection-info minimized por defecto');
                } else {
                    // Desktop: Expanded por defecto
                    selectionInfo.classList.remove('minimized');
                    minimizeBtn.textContent = 'Minimize';
                    console.log('🖥️ Desktop detectado: selection-info expanded por defecto');
                }
            }
        }

        // Aplicar estado responsive cuando cambie el tamaño de ventana
        window.addEventListener('resize', () => {
            applyResponsiveSelectionInfo();
        });

        // Connect wallet button
        document.getElementById('connectBtn').addEventListener('click', () => {
            if (window.app && window.app.modules.wallet) {
                window.app.modules.wallet.connectWallet();
            }
        });

        // Disconnect wallet button
        document.getElementById('disconnectBtn').addEventListener('click', () => {
            if (window.app && window.app.modules.wallet) {
                window.app.modules.wallet.disconnectWallet();
            }
        });

        // Minimize selection info
        document.getElementById('minimizeBtn').addEventListener('click', () => {
            const selectionInfo = document.getElementById('selection-info');
            if (selectionInfo) {
                selectionInfo.classList.toggle('minimized');
                const btn = document.getElementById('minimizeBtn');
                if (btn) {
                    btn.textContent = selectionInfo.classList.contains('minimized') ? 'Expand' : 'Minimize';
                }
            }
        });

        // Add scroll detection for sticky behavior
        window.addEventListener('scroll', () => {
            const selectionInfo = document.getElementById('selection-info');
            if (selectionInfo && selectionInfo.style.display !== 'none') {
                if (window.scrollY > 100) {
                    selectionInfo.classList.add('sticky');
                } else {
                    selectionInfo.classList.remove('sticky');
                }
            }
        });
    </script>
</body>
</html>
