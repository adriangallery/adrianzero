<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TraitLAB - Refactorizado</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'VT323', monospace;
            background: #1a1a1a;
            min-height: 100vh;
            color: #fff;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            color: white;
        }

        .header h1 {
            font-size: 4.5rem;
            margin-bottom: 5px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .adrian-zero-font {
            font-family: 'VT323', monospace;
        }

        .header h1 .trait {
            color: #ffffff;
        }

        .header h1 .lab {
            color: #00ff00;
        }

        .header .subtitle {
            font-size: 1.45rem;
            color: #cccccc;
            margin-bottom: 20px;
            font-family: 'VT323', monospace;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }

        .connect-section {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin-bottom: 30px;
            border: 1px solid #333;
        }

        .connect-btn {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            font-family: 'VT323', monospace;
        }

        .connect-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }

        .account-section {
            display: none;
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin-bottom: 30px;
            border: 1px solid #333;
        }

        .wallet-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .wallet-address {
            background: #2a2a2a;
            padding: 10px 15px;
            border-radius: 10px;
            font-family: monospace;
            font-weight: bold;
        }

        .disconnect-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'VT323', monospace;
        }

        .disconnect-btn:hover {
            background: #c82333;
        }

        .tokens-section {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            border: 1px solid #333;
        }

        .section-title {
            font-size: 1.8rem;
            margin-bottom: 20px;
            color: #fff;
            text-align: center;
            font-family: 'VT323', monospace;
        }

        .contract-filter {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        /* Responsive para contract-filter en móviles */
        @media (max-width: 767px) {
            .contract-filter {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 15px;
                margin-bottom: 20px;
                width: 100%;
                padding: 0 10px;
            }
            
            .contract-btn {
                width: 100%;
                padding: 15px 16px;
                font-size: 0.9rem;
                text-align: center;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
        }

        .contract-btn {
            background: #333;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1rem;
            font-family: 'VT323', monospace;
        }

        .contract-btn.active {
            background: #00cc00;
        }

        .contract-btn:hover {
            transform: translateY(-1px);
        }

        .tabs {
            display: flex;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 5px;
            margin-bottom: 20px;
            overflow-x: auto;
        }

        .tab-btn {
            background: transparent;
            color: #ccc;
            border: none;
            padding: 12px 20px;
            margin: 0 2px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'VT323', monospace;
            white-space: nowrap;
        }

        .tab-btn.active {
            background: #00ff00;
            color: #000;
        }

        .tab-btn:hover:not(.active) {
            background: rgba(0, 255, 0, 0.2);
            color: #fff;
        }

        .tab-content {
            display: none;
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            border: 1px solid #333;
        }

        .tab-content.active {
            display: block;
        }

        .tokens-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .tokens-grid.adrianlab-mobile {
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        }

        .token-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
            cursor: pointer;
            border: 1px solid #333;
            position: relative;
        }

        .token-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .token-card.selected {
            border-color: #00cc00;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.5);
        }

        .token-image {
            width: 100%;
            height: auto;
            object-fit: contain;
            border-radius: 10px;
            margin-bottom: 10px;
            background: #2a2a2a;
            position: relative;
        }

        .token-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 5px;
            color: #00ff00;
        }

        .token-id {
            font-size: 0.9rem;
            color: #ccc;
        }

        .token-category {
            font-size: 0.8rem;
            color: #888;
            margin-top: 5px;
        }

        .token-quantity-tag {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #00ff00;
            color: #000;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.8rem;
            font-weight: bold;
        }



        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .selection-info {
            background: rgba(51, 51, 51, 0.95);
            border: 2px solid #333333;
            border-radius: 10px;
            padding: 8px;
            margin: 10px 0;
            text-align: center;
            font-family: 'VT323', monospace;
            font-size: 0.9rem;
            color: white;
            position: sticky;
            top: 20px;
            z-index: 100;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
        }

        /* Side emoji menu inside selection-info */
        .selection-info.with-side-menu {
            padding-left: 56px;
        }

        .side-emoji-menu {
            position: absolute;
            left: 8px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 101;
        }

        .side-emoji-menu .contract-btn {
            width: 40px;
            height: 40px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #333;
            color: #fff;
        }

        .side-emoji-menu .contract-btn.active {
            background: #00cc00;
            color: #000;
        }

        .side-emoji-menu .contract-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* Comportamiento responsive por defecto */
        /* Desktop (≥768px): Expanded por defecto */
        @media (min-width: 768px) {
            .selection-info {
                max-width: none;
                margin: 10px auto;
            }
            
            .selection-info .selection-text {
                display: block;
            }
            
            .selection-info .generated-image img {
                max-width: 300px;
                height: auto;
            }
            
            .selection-info .image-loading-overlay {
                width: 300px;
                height: 300px;
            }
        }

        /* Mobile (<768px): Minimized por defecto */
        @media (max-width: 767px) {
            .selection-info {
                max-width: 50%;
                margin: 10px auto;
            }
            .selection-info.with-side-menu {
                padding-left: 56px;
            }
            .side-emoji-menu {
                left: 6px;
                gap: 6px;
            }
            /* Ocultar botón minimizar/expandir en móviles */
            #minimizeBtn {
                display: none;
            }
            
            .selection-info .selection-text {
                display: none;
            }
            
            .selection-info .generated-image img {
                max-width: 210px;
                height: auto;
            }
            
            .selection-info .image-loading-overlay {
                width: 210px;
                height: 210px;
            }
        }

        .selection-info.minimized {
            max-width: 50%;
            margin: 10px auto;
        }

        .selection-info.minimized .selection-text {
            display: none;
        }

        .selection-info.minimized .generated-image img {
            max-width: 210px; /* 30% reduction from 300px */
            height: auto;
        }

        .selection-info.minimized .image-loading-overlay {
            width: 210px;
            height: 210px;
        }

        .selection-info.sticky .sticky-hidden {
            display: none !important;
        }

        /* En modo sticky, solo ocultar elementos realmente prescindibles */
        .selection-info.sticky .selected-traits-title,
        .selection-info.sticky .traits-container {
            display: none !important;
        }

        /* En modo sticky, solo mostrar elementos esenciales */
        .selection-info.sticky {
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(15px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8);
            /* Alto mínimo para mantener la botonera lateral visible */
            min-height: 120px;
        }

        /* En modo sticky móvil, ajustar alto mínimo */
        @media (max-width: 767px) {
            .selection-info.sticky {
                min-height: 140px; /* Más alto en móviles para la botonera */
            }
        }

        .selection-info.sticky .selection-text {
            font-size: 0.9rem;
            margin-bottom: 10px;
        }

        .selection-info.sticky .generated-image {
            max-width: 200px;
            margin: 0 auto;
        }

        .selection-info.sticky .generated-image img {
            max-width: 100%;
            height: auto;
        }

        /* En modo sticky, el botón Apply Traits debe ser más prominente */
        .selection-info.sticky .traits-actions-section {
            margin-top: 15px;
            text-align: center;
        }

        .selection-info.sticky .action-btn {
            background: #00cc00;
            color: black;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-family: 'VT323', monospace;
            width: 100%;
            transition: all 0.3s ease;
        }

        .selection-info.sticky .action-btn:hover {
            background: #009900;
            transform: translateY(-1px);
        }

        /* Estado sticky sin botones - mantener alto mínimo */
        .selection-info.sticky.no-buttons {
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .selection-info.sticky.no-buttons .side-emoji-menu {
            position: relative;
            left: auto;
            top: auto;
            transform: none;
            flex-direction: row;
            gap: 8px;
        }

        /* Móvil: sticky sin botones */
        @media (max-width: 767px) {
            .selection-info.sticky.no-buttons {
                min-height: 140px;
            }
            
            .selection-info.sticky.no-buttons .side-emoji-menu {
                gap: 6px;
            }
        }

        .minimize-btn {
            position: absolute;
            top: 5px;
            right: 10px;
            background: #666666;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 0.8rem;
            cursor: pointer;
            font-family: 'VT323', monospace;
            transition: all 0.3s ease;
            z-index: 101;
        }

        .minimize-btn:hover {
            background: #888888;
        }

        .minimize-btn.minimized {
            background: #00cc00;
            color: #000;
        }

        .minimize-btn.minimized:hover {
            background: #009900;
        }

        .minimize-btn:not(.minimized) {
            background: #cc0000;
            color: #fff;
        }

        .minimize-btn:not(.minimized):hover {
            background: #990000;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        .apply-traits-btn {
            background: #00cc00;
            color: black;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1rem;
            font-family: 'VT323', monospace;
        }

        .apply-traits-btn:hover {
            transform: translateY(-1px);
            background: #009900;
        }

        .apply-traits-btn:disabled {
            background: #333;
            cursor: not-allowed;
            transform: none;
        }

        .apply-status {
            margin-top: 15px;
            padding: 10px;
            border-radius: 8px;
            font-family: 'VT323', monospace;
            font-size: 1rem;
        }

        .apply-status.loading {
            background: rgba(255, 193, 7, 0.2);
            color: #ffc107;
            border: 1px solid #ffc107;
        }

        .apply-status.success {
            background: rgba(0, 204, 0, 0.2);
            color: #00cc00;
            border: 1px solid #00cc00;
        }

        .apply-status.error {
            background: rgba(255, 68, 68, 0.2);
            color: #ff4444;
            border: 1px solid #ff4444;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            text-align: center;
            font-family: 'VT323', monospace;
        }

        .success {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            text-align: center;
            font-family: 'VT323', monospace;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            color: #00ff00;
        }

        .no-tokens {
            display: none;
            text-align: center;
            padding: 40px;
            color: #888;
        }

        .input-group {
            margin: 10px 0;
        }

        .input-group input {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid #333;
            color: white;
            padding: 10px;
            border-radius: 5px;
            width: 100%;
            font-family: 'VT323', monospace;
        }

        .input-group input:focus {
            outline: none;
            border-color: #00ff00;
        }

        .generated-image {
            margin: 20px 0;
            text-align: center;
            position: relative;
        }

        .generated-image img {
            max-width: 300px;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.2);
        }

        .image-loading-overlay {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 300px;
            height: 300px;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 8px;
            z-index: 10;
        }

        .image-loading-overlay p {
            color: #00cc00;
            font-family: 'VT323', monospace;
            font-size: 18px;
            margin-top: 15px;
            text-shadow: 0 0 10px #00cc00;
        }

        .pixelated-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #333;
            border-top: 4px solid #00cc00;
            border-radius: 0;
            animation: pixelated-spin 1s linear infinite;
            image-rendering: pixelated;
        }

        @keyframes pixelated-spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .footer {
            text-align: center;
            margin-top: 40px;
            color: white;
            font-family: 'VT323', monospace;
            font-size: 1.1rem;
        }



        /* Estilos para tokens organizados por categorías */
        .traits-category-section {
            margin-bottom: 30px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #333;
        }

        .category-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #00ff00;
        }

        .category-name {
            font-size: 1.3rem;
            color: #00ff00;
            font-family: 'VT323', monospace;
            text-shadow: 0 0 10px rgba(0, 255, 0, 0.3);
        }

        .category-count {
            background: #00ff00;
            color: #000;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .category-tokens-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 10px;
        }

        .trait-token-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #333;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .trait-token-card:hover {
            border-color: #00ff00;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 255, 0, 0.2);
        }

        .trait-token-card.selected {
            border-color: #00ff00;
            background: rgba(0, 255, 0, 0.1);
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
        }

        .trait-token-image {
            width: 100px;
            height: 100px;
            margin: 0 auto 8px;
            border-radius: 4px;
            object-fit: cover;
        }

        .trait-token-name {
            font-size: 0.8rem;
            color: #fff;
            margin-bottom: 4px;
            font-family: 'VT323', monospace;
            line-height: 1.2;
        }

        .trait-token-id {
            font-size: 0.7rem;
            color: #888;
            font-family: 'VT323', monospace;
        }

        .trait-token-category {
            position: absolute;
            top: 5px;
            right: 5px;
            background: rgba(0, 0, 0, 0.7);
            color: #00ff00;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.6rem;
            font-family: 'VT323', monospace;
        }

        /* Estilos para la nueva selección elegante */
        .selected-token-title {
            font-size: 1.8rem;
            color: #00ff00;
            margin-bottom: 20px;
            text-align: center;
            font-family: 'VT323', monospace;
            text-shadow: 0 0 15px rgba(0, 255, 0, 0.5);
        }

        .selected-traits-title {
            font-size: 1.2rem;
            color: #fff;
            margin-bottom: 15px;
            text-align: center;
            font-family: 'VT323', monospace;
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
        }

        .trait-item {
            font-size: 1rem;
            color: #ccc;
            margin: 1px 0;
            text-align: center;
            font-family: 'VT323', monospace;
            padding: 5px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 5px;
        }

        /* Container para traits en dos columnas */
        .traits-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 15px 0;
        }

        /* Grid de botones de acciones */
        .actions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            width: 100%;
            margin-top: 20px;
        }

        .action-btn {
            background: rgba(255, 255, 255, 0.05);
            color: #ccc;
            border: 1px solid #333;
            padding: 15px 20px;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'VT323', monospace;
            font-size: 1rem;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            background: rgba(255, 255, 255, 0.1);
            border-color: #00ff00;
        }

        .action-btn:active {
            transform: translateY(0);
        }

        /* Crafting Recipe Cards */
        .recipe-card {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid #333;
            border-radius: 10px;
            padding: 20px;
            margin: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
        }

        .recipe-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
        }

        .recipe-card h3 {
            color: #00ff00;
            margin-bottom: 10px;
            font-size: 1.5rem;
        }

        .recipe-type {
            background: #333;
            color: #fff;
            padding: 5px 10px;
            border-radius: 5px;
            display: inline-block;
            margin-bottom: 15px;
            font-size: 0.9rem;
        }

        .recipe-ingredients, .recipe-requirement, .recipe-output {
            margin-bottom: 15px;
        }

        .recipe-ingredients h4, .recipe-requirement h4, .recipe-output h4 {
            color: #fff;
            margin-bottom: 8px;
            font-size: 1.1rem;
        }

        .recipe-ingredient {
            display: flex;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 12px;
            margin: 5px 0;
            border-radius: 5px;
            border-left: 3px solid #666;
        }

        .recipe-ingredient.eligible {
            border-left-color: #00ff00;
            background: rgba(0, 255, 0, 0.1);
        }

        .recipe-ingredient.insufficient {
            border-left-color: #ff4444;
            background: rgba(255, 68, 68, 0.1);
        }

        .requirement-status {
            padding: 8px 12px;
            border-radius: 5px;
            margin-top: 8px;
            font-weight: bold;
        }

        .requirement-status.met {
            background: rgba(0, 255, 0, 0.2);
            color: #00ff00;
            border: 1px solid #00ff00;
        }

        .requirement-status.not-met {
            background: rgba(255, 68, 68, 0.2);
            color: #ff4444;
            border: 1px solid #ff4444;
        }

        .craft-btn {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'VT323', monospace;
            width: 100%;
        }

        .craft-btn.enabled:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .craft-btn.disabled {
            background: #6c757d;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .output-trait {
            background: rgba(0, 255, 0, 0.1);
            border: 1px solid #00ff00;
            border-radius: 8px;
            padding: 12px;
            margin-top: 8px;

            font-weight: bold;
            color: #00ff00;
            margin-bottom: 5px;
        }

        .trait-details {
            color: #ccc;
            font-size: 0.9rem;
            margin-bottom: 8px;
        }

        .output-trait-image {
            width: 60px;
            height: 60px;
            border-radius: 5px;
            border: 1px solid #333;

        /* Crafting sections */
        .crafting-section, .user-traits-section {
            margin-bottom: 30px;

        .crafting-section h3, .user-traits-section h3 {
            color: #00ff00;

            font-size: 1.8rem;

        .selection-indicator {
            position: absolute;
            top: 5px;
            right: 5px;
            background: #00ff00;
            color: #000;
            border-radius: 50%;

            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 12px;
        }

        .trait-token-card {
            position: relative;
        }

        /* Flat grid for crafting traits */
        .crafting-traits-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 12px;
            width: 100%;
        }
        .crafting-traits-grid .trait-token-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #333;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .crafting-traits-grid .trait-token-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0,0,0,0.35);
            border-color: #00ff00;
        }
        .crafting-traits-grid .trait-token-card.selected {
            border-color: #00ff00;
            box-shadow: 0 0 0 2px rgba(0,255,0,0.25);
            background: rgba(0,255,0,0.08);
        }
        .crafting-traits-grid .trait-token-image {
            width: 100%;
            height: 100px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid #222;
            margin-bottom: 6px;
        }
        .crafting-traits-grid .trait-token-name {
            font-size: 0.9rem;
            color: #ddd;
            margin-bottom: 2px;
        }
        .crafting-traits-grid .trait-token-id {
            font-size: 0.8rem;
            color: #999;
        }

        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }
            
            .header h1 {
                font-size: 3.5rem;
            }
            
            .contract-filter {
                flex-direction: column;
                align-items: center;
            }
            
            .contract-btn {
                margin: 2px 0;
            }
            
            .tokens-grid {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            }

            .category-tokens-grid {
                grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
                gap: 8px;
            }
            
            .trait-token-card {
                padding: 8px;
            }
            
            .trait-token-image {
                width: 100px;
                height: 100px;
            }
            
            .trait-token-name {
                font-size: 0.7rem;
            }
            
            .trait-token-id {
                font-size: 0.6rem;
            }

            /* Mobile styles for new selection design */
            .selected-token-title {
                font-size: 1.5rem;
            }

            .selected-traits-title {
                font-size: 1.1rem;
            }

            .trait-item {
                font-size: 0.9rem;

            }

            /* Traits vuelven a una columna en móviles */
            .traits-container {
                grid-template-columns: 1fr;

            }

            .actions-grid {
                grid-template-columns: 1fr;
                gap: 10px;
            }

            .action-btn {

        }

        /* Excepción: mostrar botones erc721-actions en estado adrianzero-only */
        .selection-info.sticky.adrianzero-only #erc721-actions-section {
            display: block !important;
        }

            display: block !important;
        }

            display: none !important;
        }
    </style>
</head>

    <!-- Main Application Script -->
    <script>
        // Main TraitLAB Application
        class TraitLABApp {
            constructor() {
                this.modules = {};
                this.currentContract = "0x6e369bf0e4e0c106192d606fb6d85836d684da75"; // AdrianZERO por defecto
                this.currentFilter = null;
                this.currentTab = null; // Tab actual para sticky visibility
                this.tokens = [];
                this.traitTokens = []; // Store trait tokens separately
                this.selectedERC721 = null;
                this.selectedERC1155 = [];
                this.selectedFloppy = null;
                this.selectedSerum = null;
                
                this.init();
            }

            async init() {
                console.log('🚀 Initializing TraitLAB (refactor)...');
                
                try {
                    // Initialize all modules
                    await this.initializeModules();
                    
                    // Setup event listeners
                    this.setupEventListeners();
                    
                    // Setup tab system
                    this.setupTabs();
                    
                    console.log('✅ TraitLAB initialized successfully');
                    
                } catch (error) {
                    console.error('❌ Error initializing TraitLAB:', error);
                }
            }

            async initializeModules() {
                // Initialize Wallet Manager
                this.modules.wallet = new window.TraitLABWallet();
                this.modules.wallet.init();
                
                // Initialize UI Manager
                this.modules.ui = new window.TraitLABUI();
                this.modules.ui.init();
                
                // Initialize Traits Manager
                this.modules.traits = new window.TraitLABTraits();
                await this.modules.traits.init();
                
                // Initialize Floppy Manager
                this.modules.floppy = new window.TraitLABFloppy();
                this.modules.floppy.init();
                
                            // Initialize Serums Manager
            this.modules.serums = new window.TraitLABSerums();
            this.modules.serums.init();
            
            // Initialize Crafting Manager
            this.modules.crafting = new window.TraitLABCrafting();
                
                // Initialize Zero Manager
                this.modules.zero = new window.TraitLABZero();
                this.modules.zero.init();
                
                // Initialize StickyVisibilityManager (se inicializará después del DOM)
                this.stickyManager = new window.StickyVisibilityManager();
                
                console.log('✅ Todos los módulos inicializados');
            }

            setupEventListeners() {
                // Wallet events
                this.modules.wallet.on('walletConnected', (data) => {
                    this.onWalletConnected(data);
                });
                
                this.modules.wallet.on('walletDisconnected', () => {
                    this.onWalletDisconnected();
                });
                
                // UI events
                this.modules.ui.on('filterChanged', (data) => {
                    console.log('🔄 filterChanged event received:', data);
                    this.onFilterChanged(data);
                });
                
                this.modules.ui.on('tokenSelected', (data) => {
                    console.log('🎯 tokenSelected event received in main app:', data);
                    this.onTokenSelected(data);
                });
                
                // Traits events
                this.modules.traits.on('traitsDatabaseLoaded', (data) => {
                    console.log('Traits database loaded:', data);
                });
                
                this.modules.traits.on('traitsApplied', (data) => {
                    this.showSuccess(`Traits applied successfully! TX: ${data.transactionHash}`);
                });
                
                this.modules.traits.on('imageGenerated', (data) => {
                    this.displayGeneratedImage(data);
                });
                
                this.modules.traits.on('traitsSelectionUpdated', (data) => {
                    this.updateTraitsVisualSelection(data);
                });
                
                // Floppy events
                this.modules.floppy.on('floppyOpened', (data) => {
                    this.showSuccess(`Floppy opened successfully! TX: ${data.transactionHash}`);
                });
                
                this.modules.floppy.on('packOpened', (data) => {
                    this.showSuccess(`Pack opened successfully! TX: ${data.transactionHash}`);
                });
                
                this.modules.floppy.on('actionPackOpened', (data) => {
                    this.showSuccess(`Action Pack opened successfully! TX: ${data.transactionHash}`);
                });
                
                // Serums events
                this.modules.serums.on('serumUsed', (data) => {
                    this.showSuccess(`Serum used successfully! TX: ${data.transactionHash}`);
                });
                
                // Zero events
                this.modules.zero.on('tokensLoaded', (data) => {
                    this.onTokensLoaded(data);
                });
                
                // Setup button event listeners after DOM is loaded
                this.setupButtonEventListeners();
                
                // AdrianNameRegistry events
                this.modules.zero.on('tokensReadyForDisplay', (data) => {
                    this.handleTokensReadyForDisplay(data);
                });
                
                this.modules.zero.on('customNamesProgressUpdate', (data) => {
                    this.handleCustomNamesProgressUpdate(data);
                });
                
                this.modules.zero.on('customNamesLoaded', (data) => {
                    console.log('✅ Custom names fully loaded:', data);
                    // Final update if needed
                    if (data.tokens) {
                        this.tokens = data.tokens;
                    }
                });
                
                // Setup Use Serum button event listener
                const useSerumBtn = document.getElementById('useSerumBtn');
                if (useSerumBtn) {
                    useSerumBtn.addEventListener('click', () => this.useSerum());
                }
                
                // Setup other button event listeners
                const activateTokenBtn = document.getElementById('activateTokenBtn');
                if (activateTokenBtn) {
                    activateTokenBtn.addEventListener('click', () => this.activateToken());
                }
                
                const loadNamePriceBtn = document.getElementById('loadNamePriceBtn');
                if (loadNamePriceBtn) {
                    loadNamePriceBtn.addEventListener('click', () => this.loadNamePrice());
                }
                
                const showRenameSectionBtn = document.getElementById('showRenameSectionBtn');
                if (showRenameSectionBtn) {
                    showRenameSectionBtn.addEventListener('click', () => this.showRenameSection());
                }
                
                const generateCombinedImageBtn = document.getElementById('generateCombinedImageBtn');
                if (generateCombinedImageBtn) {
                    generateCombinedImageBtn.addEventListener('click', () => this.generateCombinedImage());
                }
                
                const applyTraitsBtn = document.getElementById('applyTraitsBtn');
                if (applyTraitsBtn) {
                    applyTraitsBtn.addEventListener('click', () => this.applyTraits());
                }
                
                // Zero events (continued)
                this.modules.zero.on('tokenActivated', (data) => {
                    this.showSuccess(`Token activated successfully! TX: ${data.transactionHash}`);
                });
                
                this.modules.zero.on('tokenRenamed', (data) => {
                    this.showSuccess(`Token renamed successfully! TX: ${data.transactionHash}`);
                });
            }
            
            setupButtonEventListeners() {
                // Open Floppy button
                const openFloppyBtn = document.getElementById('openFloppyBtn');
                if (openFloppyBtn) {
                    openFloppyBtn.addEventListener('click', () => {
                        this.openFloppy();
                    });
                }
                
                // Open Pack button
                const openPackBtn = document.getElementById('openPackBtn');
                if (openPackBtn) {
                    openPackBtn.addEventListener('click', () => {
                        this.openPack();
                    });
                }
                
                // Approve Rename button (rename flow)
                const approveRenameBtn = document.getElementById('approveRenameBtn');
                if (approveRenameBtn) {
                    approveRenameBtn.addEventListener('click', () => this.approveRename());
                }
                
                // Rename Token button (rename flow)
                const renameTokenBtn = document.getElementById('renameTokenBtn');
                if (renameTokenBtn) {
                    renameTokenBtn.addEventListener('click', () => this.renameToken());
                }
            }

            setupTabs() {
                const contractBtns = document.querySelectorAll('.contract-btn');
                
                contractBtns.forEach(btn => {
                    btn.addEventListener('click', () => {
                        const contract = btn.dataset.contract;
                        const filter = btn.dataset.filter;
                        
                        // Update active button
                        contractBtns.forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        
                        // Update current contract and filter
                        this.currentContract = contract;
                        this.currentFilter = filter;
                        this.currentTab = filter; // Actualizar currentTab para sticky visibility
                        
                        // Show/hide traits categories filter based on tab
                        this.toggleTraitsCategoriesFilter(filter);
                        
                        // Update UI filter
                        if (this.modules.ui && this.modules.ui.setCurrentFilter) {
                            this.modules.ui.setCurrentFilter(filter);
                        }
                        
                        // Update zero module filter
                        if (this.modules.zero && this.modules.zero.setCurrentFilter) {
                            this.modules.zero.setCurrentFilter(filter);
                        }
                        
                        // Load tokens for this contract/filter
                        this.loadTokensForTab();
                    });
                });
            }

            toggleTraitsCategoriesFilter(filter) {
                const traitsCategoriesFilter = document.getElementById('traits-categories-filter');
                if (traitsCategoriesFilter) {
                    if (filter === 'traits' || (!filter && this.currentContract === "0x90546848474fb3c9fda3fdad887969bb244e7e58")) {
                        traitsCategoriesFilter.style.display = 'block';
                        this.setupTraitsCategoriesFilter();
                    } else {
                        traitsCategoriesFilter.style.display = 'none';
                    }
                }
            }

            setupTraitsCategoriesFilter() {
                // Setup category filter buttons
                const categoryBtns = document.querySelectorAll('.category-btn');
                categoryBtns.forEach(btn => {
                    btn.addEventListener('click', () => {
                        // Update active category button
                        categoryBtns.forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        
                        const category = btn.dataset.category;
                        this.filterTraitsByCategory(category);
                    });
                });

                // Setup search functionality
                const searchInput = document.getElementById('traits-search-input');
                const clearSearchBtn = document.getElementById('clear-traits-search');
                
                if (searchInput) {
                    searchInput.addEventListener('input', (e) => {
                        this.searchTraits(e.target.value);
                    });
                }
                
                if (clearSearchBtn) {
                    clearSearchBtn.addEventListener('click', () => {
                        if (searchInput) searchInput.value = '';
                        this.searchTraits('');
                    });
                }
            }

            filterTraitsByCategory(category) {
                console.log('Filtering traits by category:', category);
                console.log('Using stored trait tokens:', this.traitTokens.length);
                
                if (!this.traitTokens || this.traitTokens.length === 0) {
                    console.log('No trait tokens available, showing empty state');
                    this.displayTraitsByCategory([]);
                    return;
                }
                
                if (category === 'all') {
                    this.displayTraitsByCategory(this.traitTokens);
                } else {
                    // Filter by specific category
                    const filteredTraits = this.traitTokens.filter(token => {
                        const traitInfo = this.modules.traits.getTraitCategory(token.tokenId);
                        console.log(`Token ${token.tokenId} category: ${traitInfo}, looking for: ${category}`);
                        return traitInfo === category;
                    });
                    console.log(`Filtered traits for ${category}:`, filteredTraits.length);
                    this.displayTraitsByCategory(filteredTraits);
                }
            }

            searchTraits(searchTerm) {
                console.log('Searching traits with term:', searchTerm);
                
                if (!searchTerm.trim()) {
                    // If search is empty, show all traits
                    this.filterTraitsByCategory('all');
                    return;
                }
                
                if (!this.traitTokens || this.traitTokens.length === 0) {
                    console.log('No trait tokens available for search');
                    this.displayTraitsByCategory([]);
                    return;
                }
                
                console.log('Using stored trait tokens for search:', this.traitTokens.length);
                
                // Filter by search term
                const searchResults = this.traitTokens.filter(token => 
                    token.title.toLowerCase().includes(searchTerm.toLowerCase()) ||
                    token.tokenId.toString().includes(searchTerm)
                );
                
                console.log('Search results:', searchResults.length);
                this.displayTraitsByCategory(searchResults);
            }

            displayTraitsByCategory(traits) {
                console.log('Displaying traits by category:', traits);
                console.log('Sample trait structure:', traits[0]);
                
                const grid = document.getElementById('tokens-grid');
                if (!grid) return;
                
                if (!traits || traits.length === 0) {
                    grid.innerHTML = '<div class="no-tokens"><p>No traits found for this category/search</p></div>';
                    return;
                }
                
                // Group traits by category
                const traitsByCategory = new Map();
                traits.forEach(trait => {
                    const category = this.modules.traits.getTraitCategory(trait.tokenId) || 'UNKNOWN';
                    console.log(`Trait ${trait.tokenId} (${trait.title}) -> Category: ${category}`);
                    if (!traitsByCategory.has(category)) {
                        traitsByCategory.set(category, []);
                    }
                    traitsByCategory.get(category).push(trait);
                });
                
                // Generate HTML for each category
                let html = '';
                traitsByCategory.forEach((categoryTraits, category) => {
                    html += `
                        <div class="traits-category-section">
                            <div class="category-header">
                                <span class="category-name">${category}</span>
                                <span class="category-count">${categoryTraits.length}</span>
                            </div>
                            <div class="category-tokens-grid">
                    `;
                    
                    categoryTraits.forEach(trait => {
                        const isSelected = this.selectedERC1155.some(t => t.tokenId === trait.tokenId);
                        // Use Alchemy cache images as before - they work well

                                <div class="trait-token-category">${category}</div>
                                <img src="${imageUrl}" alt="${trait.title}" class="trait-token-image" 
                                     onerror="this.src='data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iODAiIGhlaWdodD0iODAiIHZpZXdCb3g9IjAgMCA4MCA4MCIgZmlsbD0ibm9uZSIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj4KPHJlY3Qgd2lkdGg9IjgwIiBoZWlnaHQ9IjgwIiBmaWxsPSIjMzMzIi8+Cjx0ZXh0IHg9IjQwIiB5PSI0NSIgZm9udC1mYW1pbHk9IjEwIiBmaWxsPSIjZmZmIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIj5UcmFpdDwvdGV4dD4KPC9zdmc+'">
                                <div class="trait-token-name">${trait.title}</div>
                                <div class="trait-token-id">#${trait.tokenId}</div>
                            </div>
                        `;
                    });
                    
                    html += `
                            </div>
                        </div>
                    `;

                grid.innerHTML = html;
            }

            selectTraitToken(tokenId) {
                console.log('Selecting trait token:', tokenId);
                
                // Find the token in the current tokens array - check multiple possible contract properties
                const token = this.tokens.find(t => {
                    const isTraitContract = t.contract === "0x90546848474fb3c9fda3fdad887969bb244e7e58" || 
                                          t.contractAddress === "0x90546848474fb3c9fda3fdad887969bb244e7e58" ||
                                          t.contractId === "0x90546848474fb3c9fda3fdad887969bb244e7e58";
                    const isERC1155 = t.tokenType === 'ERC1155' || t.type === 'ERC1155';
                    return t.tokenId === tokenId && isTraitContract && isERC1155;
                });
                
                if (!token) {
                    console.error('Token not found:', tokenId);
                    console.log('Available tokens:', this.tokens.map(t => ({ id: t.tokenId, contract: t.contract || t.contractAddress || t.contractId, type: t.tokenType || t.type })));
                    return;
                }
                
                console.log('Found token for selection:', token);
                
                // Use the traits module to handle selection
                this.modules.traits.handleTraitSelection(token);
                
                // Update visual selection
                this.updateTraitsVisualSelection({
                    selectedTraits: this.modules.traits.getSelectedTraits()
                });
                
                // Refresh the display to show updated selection
                this.refreshTraitsDisplay();
            }

            refreshTraitsDisplay() {
                console.log('refreshTraitsDisplay called - traitTokens available:', this.traitTokens.length);
                
                // Get current active category
                const activeCategoryBtn = document.querySelector('.category-btn.active');
                const currentCategory = activeCategoryBtn ? activeCategoryBtn.dataset.category : 'all';
                
                // Get current search term
                const searchInput = document.getElementById('traits-search-input');
                const currentSearch = searchInput ? searchInput.value : '';
                
                if (currentSearch.trim()) {
                    this.searchTraits(currentSearch);
                } else {
                    this.filterTraitsByCategory(currentCategory);
                }
            }

            handleTraitSelectionFromDisplay(traitData) {
                console.log('handleTraitSelectionFromDisplay called with:', traitData);
                console.log('Current traitTokens before selection:', this.traitTokens.length);
                
                // Use the traits module to handle selection
                this.modules.traits.handleTraitSelection(traitData);
                
                // Update visual selection
                this.updateTraitsVisualSelection({
                    selectedTraits: this.modules.traits.getSelectedTraits()
                });
                
                // IMPORTANT: Don't refresh the display here - it causes traits to disappear
                // this.refreshTraitsDisplay(); // Commented out to prevent loss of traits
                
                // Update selection info to show selected traits
                this.updateSelectionInfo();
                
                console.log('Current traitTokens after selection:', this.traitTokens.length);
                console.log('Traits should remain visible on screen');
            }

            async loadTokensForTab() {
                console.log('🔍 loadTokensForTab called');
                console.log('🔍 Wallet connected:', this.modules.wallet.isWalletConnected());
                console.log('🔍 Zero module:', this.modules.zero);
                console.log('🔍 Current contract:', this.currentContract);
                console.log('🔍 Current filter:', this.currentFilter);
                
                if (!this.modules.wallet.isWalletConnected()) {
                    console.log('❌ Wallet not connected, returning');
                    return;
                }
                
                const userAddress = this.modules.wallet.getCurrentAccount();
                console.log('🔍 User address:', userAddress);
                
                try {
                    console.log('🚀 Showing loading...');
                    this.showLoading();
                    
                    console.log('🚀 Calling zero.loadTokens...');
                    // Load tokens based on current contract and filter
                    const tokens = await this.modules.zero.loadTokens(userAddress, this.currentContract);
                    console.log('✅ Tokens loaded:', tokens);
                    
                    console.log('🚀 Calling displayTokens...');
                    this.displayTokens(tokens, this.currentFilter);
                    
                } catch (error) {
                    console.error('❌ Error loading tokens:', error);
                    this.showError(`Failed to load tokens: ${error.message}`);
                } finally {
                    console.log('🚀 Hiding loading...');
                    this.hideLoading();
                }
            }

            displayTokens(tokens, tabType) {
                const grid = document.getElementById('tokens-grid');
                const noTokens = document.getElementById('no-tokens');
                
                if (!grid) return;
                
                if (!tokens || tokens.length === 0) {
                    grid.innerHTML = '';
                    if (noTokens) noTokens.style.display = 'block';
                    return;
                }
                
                if (noTokens) noTokens.style.display = 'none';
                
                // Special handling for crafting tab
                if (this.currentFilter === 'crafting') {
                    this.displayCraftingRecipes();
                    return;
                }
                
                // Check if we're in traits tab and should use category display
                if (this.currentFilter === 'traits' || 
                    (!this.currentFilter && this.currentContract === "0x90546848474fb3c9fda3fdad887969bb244e7e58")) {
                    // Use new category-based display for traits
                    this.displayTraitsByCategory(tokens);
                } else {
                    // Use UI module to display tokens for other tabs
                    if (this.modules.ui && this.modules.ui.displayTokens) {
                        this.modules.ui.displayTokens(tokens, true);
                    }
                }
            }

            onWalletConnected(data) {
                console.log('🔌 onWalletConnected called with:', data);
                console.log('🔍 Current app state:', {
                    modules: Object.keys(this.modules),
                    zeroModule: this.modules.zero,
                    currentContract: this.currentContract,
                    currentFilter: this.currentFilter
                });
                
                // Update UI
                document.getElementById('connect-section').style.display = 'none';
                document.getElementById('account-section').style.display = 'block';
                document.getElementById('walletAddress').textContent = `${data.account.substring(0, 6)}...${data.account.slice(-4)}`;
                
                // Show tokens section
                document.getElementById('tokens-section').style.display = 'block';
                
                // Load tokens for current contract
                console.log('🚀 Calling loadTokensForTab...');
                this.loadTokensForTab();
            }

            onWalletDisconnected() {
                console.log('Wallet disconnected');
                
                // Update UI
                document.getElementById('connect-section').style.display = 'block';
                document.getElementById('account-section').style.display = 'none';
                document.getElementById('tokens-section').style.display = 'none';
                
                // Clear tokens
                this.clearAllTokens();
                
                // Clear selection
                this.clearSelection();
            }

            onFilterChanged(data) {
                console.log('Filter changed:', data);
                
                // Handle crafting tab specifically
                if (data.filter === 'crafting') {
                    console.log('🔨 Crafting tab selected, loading recipes...');
                    this.loadCraftingRecipes();
                }
            }

            onTokenSelected(data) {
                console.log('🎯 onTokenSelected called with:', data);
                
                const { token, filter } = data;
                console.log('📋 Parsed data:', { token, filter, currentContract: this.currentContract });
                
                if (filter === 'rename' || this.currentContract === "0x6e369bf0e4e0c106192d606fb6d85836d684da75") {
                    // AdrianZERO tokens
                    console.log('🔵 Setting as ERC721 token');
                    this.selectedERC721 = token;
                    // Propagar selección al ZeroManager para operaciones on-chain
                    if (this.modules.zero && this.modules.zero.setSelectedERC721) {
                        this.modules.zero.setSelectedERC721(token);
                    }
                    this.selectedERC1155 = [];
                    this.selectedFloppy = null;
                    // Don't reset selectedSerum if we're in serum mode
                    if (this.currentTab !== 'serum') {
                        this.selectedSerum = null;
                    }
                } else if (filter === 'floppy') {
                    console.log('💾 Setting as Floppy token');
                    this.selectedFloppy = token;
                    // Don't reset selectedERC721 if we're in floppy mode
                    if (this.currentTab !== 'floppy') {
                        this.selectedERC721 = null;
                    }
                    this.selectedERC1155 = [];
                    this.selectedSerum = null;
                    
                    // Propagate selection to floppy module
                    this.modules.floppy.setSelectedFloppy(token);
                } else if (filter === 'serum') {
                    console.log('🧪 Setting as Serum token');
                    this.selectedSerum = token;
                    this.selectedERC1155 = [];
                    this.selectedFloppy = null;
                    
                    // Propagate selection to serum module
                    this.modules.serums.setSelectedSerum(token);
                } else if (filter === 'crafting') {
                    console.log('🔨 Setting as Crafting token');
                    // For crafting, we treat traits as ingredients
                    if (token.tokenType === 'ERC1155') {
                        this.selectedERC1155 = [token];
                        // Propagate selection to crafting module
                        this.modules.crafting.selectTrait(token.tokenId, 1);
                    }
                } else {
                    // AdrianLAB - traits
                    console.log('🎭 Setting as Traits token');
                    if (token.tokenType === 'ERC721') {
                        this.selectedERC721 = token;
                        // Propagar selección al ZeroManager para operaciones on-chain
                        if (this.modules.zero && this.modules.zero.setSelectedERC721) {
                            this.modules.zero.setSelectedERC721(token);
                        }
                    } else if (token.tokenType === 'ERC1155') {
                        // Update traits module selection
                        this.modules.traits.handleTraitSelection(token);
                        this.selectedERC1155 = this.modules.traits.getSelectedTraits();
                    }
                }
                
                console.log('📊 Final selection state:', {
                    selectedERC721: this.selectedERC721?.tokenId,
                    selectedFloppy: this.selectedFloppy?.tokenId,
                    selectedSerum: this.selectedSerum?.tokenId,
                    selectedERC1155: this.selectedERC1155.map(t => t.tokenId)
                });
                
                this.updateSelectionInfo();
            }

            onTokensLoaded(data) {
                console.log('Tokens loaded:', data);
                this.tokens = data.tokens;
                
                // Store trait tokens separately for the categories system
                const TRAITS_CONTRACT = "0x90546848474fb3c9fda3fdad887969bb244e7e58";
                this.traitTokens = data.tokens.filter(token => {
                    const contractAddr = (token.contract || token.contractAddress || token.contractId || '').toLowerCase();
                    const isTraitContract = contractAddr === TRAITS_CONTRACT.toLowerCase();
                    const tokenType = (token.tokenType || token.type || '').toUpperCase();
                    const isERC1155 = tokenType === 'ERC1155';
                    return isTraitContract && isERC1155;
                });
                
                console.log('Trait tokens stored:', this.traitTokens.length);
                
                // Share traits with crafting module if available
                if (this.modules.crafting && this.traitTokens.length > 0) {
                    console.log('🔨 Compartiendo traits con módulo de crafting:', this.traitTokens.length);
                    this.modules.crafting.setAvailableTraits(this.traitTokens);
                }
                
                // Update display based on current tab
                this.displayTokens(data.tokens, this.currentTab);
            }

                const selectionText = document.getElementById('selection-text');
                const actionButtons = document.querySelector('.action-buttons');

                    // Load ethers dynamically only when needed
                    let ethers;
                    if (typeof window.ethers === 'undefined') {
                        // Load ethers from CDN
                        const script = document.createElement('script');
                        script.src = 'https://unpkg.com/ethers@5.7.2/dist/ethers.umd.min.js';
                        script.onload = () => {

                        };
                        document.head.appendChild(script);
                    } else {

                    }
                } catch (error) {
                    this.showError(`Error applying traits: ${error.message}`);
                    const applyTraitsBtn = document.getElementById('applyTraitsBtn');
                    if (applyTraitsBtn) applyTraitsBtn.disabled = false;
                }

            async executeApplyTraitsTransaction(ethers, userAddress) {
                try {
                    this.showApplyStatus('Preparing transaction...', 'loading');

                    // Get provider and signer
                    const provider = new ethers.providers.Web3Provider(window.ethereum);
                    const signer = provider.getSigner();

                    // Contract ABI for applyTraitMultiple function
                    const contractABI = [
                        {
                            "inputs": [
                                {
                                    "internalType": "uint256",
                                    "name": "tokenId",
                                    "type": "uint256"
                                },
                                {
                                    "internalType": "uint256[]",
                                    "name": "traitIds",
                                    "type": "uint256[]"
                                }
                            ],
                            "name": "applyTraitMultiple",
                            "outputs": [],
                            "stateMutability": "nonpayable",
                            "type": "function"
                        }
                    ];

                    // Create contract instance
                    const contract = new ethers.Contract(window.TraitLABConfig.TRAITS_EXTENSIONS_CONTRACT, contractABI, signer);

                    // Prepare parameters
                    const erc721TokenId = this.selectedERC721.tokenId;
                    const traitIds = this.selectedERC1155.map(token => token.tokenId);

                    console.log('Contract address:', window.TraitLABConfig.TRAITS_EXTENSIONS_CONTRACT);
                    console.log('ERC721 Token ID:', erc721TokenId);
                    console.log('Trait IDs:', traitIds);

                    this.showApplyStatus('Confirming transaction in your wallet...', 'loading');

                    // Call the contract function
                    const tx = await contract.applyTraitMultiple(erc721TokenId, traitIds);
                    
                    this.showApplyStatus('Transaction sent! Waiting for confirmation...', 'loading');
                    console.log('Transaction hash:', tx.hash);

                    // Wait for transaction confirmation
                    const receipt = await tx.wait();
                    
                    this.showApplyStatus(`✅ Traits applied successfully! Transaction: ${receipt.transactionHash}`, 'success');
                    console.log('Transaction confirmed:', receipt);

                    // Refresh tokens after successful application
                    setTimeout(() => {
                        this.loadTokens(userAddress, this.currentContract);
                    }, 2000);

                } catch (error) {
                    console.error('Error in executeApplyTraitsTransaction:', error);
                    this.showApplyStatus(`❌ Error: ${error.message}`, 'error');
                } finally {
                    const applyTraitsBtn = document.getElementById('applyTraitsBtn');
                    if (applyTraitsBtn) applyTraitsBtn.disabled = false;
                }
            }
