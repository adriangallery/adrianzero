<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TraitLAB v2 - Modular</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'VT323', monospace;
            background: #1a1a1a;
            min-height: 100vh;
            color: #fff;
        }

        /* Menu Styles */
        #menu-container {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
        }

        #menu-container .navbar {
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid #00ff00;
        }

        #menu-container .navbar-nav .nav-link {
            color: #00ff00 !important;
            font-family: 'VT323', monospace;
            font-size: 1.1rem;
            transition: all 0.3s ease;
        }

        #menu-container .navbar-nav .nav-link:hover {
            color: #ffffff !important;
            text-shadow: 0 0 10px #00ff00;
        }

        .menu-spacer {
            height: 80px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            color: white;
        }

        .header h1 {
            font-size: 4.5rem;
            margin-bottom: 5px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header h1 .trait {
            color: #ffffff;
        }

        .header h1 .lab {
            color: #00ff00;
        }

        .header .subtitle {
            font-size: 1.45rem;
            color: #cccccc;
            margin-bottom: 20px;
            font-family: 'VT323', monospace;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }

        /* Connect Section */
        .connect-section {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin-bottom: 30px;
            border: 1px solid #333;
        }

        .connect-btn {
            background: #00ff00;
            color: #000;
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'VT323', monospace;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(0, 255, 0, 0.3);
        }

        .connect-btn:hover {
            background: #00cc00;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 255, 0, 0.4);
        }

        /* Account Section */
        .account-section {
            display: none;
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin-bottom: 30px;
            border: 1px solid #333;
        }

        .wallet-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .wallet-address {
            background: #2a2a2a;
            padding: 10px 15px;
            border-radius: 10px;
            font-family: monospace;
            font-weight: bold;
        }

        .disconnect-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'VT323', monospace;
        }

        .disconnect-btn:hover {
            background: #c82333;
        }

        /* Tokens Section */
        .tokens-section {
            display: none;
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            border: 1px solid #333;
        }

        .section-title {
            font-size: 1.8rem;
            margin-bottom: 20px;
            color: #fff;
            text-align: center;
            font-family: 'VT323', monospace;
        }

        /* Contract Filter */
        .contract-filter {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .contract-btn {
            background: #333;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1rem;
            font-family: 'VT323', monospace;
        }

        .contract-btn.active {
            background: #00cc00;
        }

        .contract-btn:hover {
            transform: translateY(-1px);
        }

        /* Responsive */
        @media (max-width: 767px) {
            .contract-filter {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 15px;
                margin-bottom: 20px;
                width: 100%;
                padding: 0 10px;
            }
            
            .contract-btn {
                width: 100%;
                padding: 15px 16px;
                font-size: 0.9rem;
                text-align: center;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .spinner {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #00ff00;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Error/Success Messages */
        .error, .success {
            text-align: center;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
        }

        .error {
            background: rgba(231, 76, 60, 0.1);
            color: #e74c3c;
            border: 1px solid rgba(231, 76, 60, 0.3);
        }

        .success {
            background: rgba(0, 255, 0, 0.1);
            color: #00ff00;
            border: 1px solid rgba(0, 255, 0, 0.3);
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 20px;
            color: #666;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <!-- Menu -->
    <div id="menu-container">
        <nav class="navbar navbar-expand-lg">
            <div class="container-fluid">
                <span class="navbar-text">TraitLAB v2</span>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="https://adrianlab.vercel.app" target="_blank">AdrianLAB</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="https://adrianzero.vercel.app" target="_blank">AdrianZERO</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </div>

    <div class="menu-spacer"></div>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>
                <span class="trait">TRAIT</span><span class="lab">LAB</span>
            </h1>
            <div class="subtitle">Modular & Clean Architecture</div>
        </div>

        <!-- Wallet Section -->
        <div class="wallet-section">
            <div id="connect-section" class="connect-section">
                <button id="connectBtn" class="connect-btn">Connect Wallet</button>
            </div>
            <div id="account-section" class="account-section" style="display: none;">
                <div class="wallet-info">
                    <div>
                        <strong>Connected Wallet:</strong>
                        <span id="walletAddress" class="wallet-address"></span>
                    </div>
                    <button id="disconnectBtn" class="disconnect-btn">Disconnect</button>
                </div>
            </div>
        </div>

        <!-- Tokens Section -->
        <div id="tokens-section" class="tokens-section" style="display: none;">
            <h2 class="section-title">Your Tokens</h2>
            
            <!-- Contract Filter -->
            <div class="contract-filter">
                <button class="contract-btn active" data-contract="0x6e369bf0e4e0c106192d606fb6d85836d684da75">
                    AdrianZERO
                </button>
                <button class="contract-btn" data-contract="0x90546848474fb3c9fda3fdad887969bb244e7e58">
                    Traits
                </button>
                <button class="contract-btn" data-contract="0x90546848474fb3c9fda3fdad887969bb244e7e58" data-filter="floppy">
                    Floppy Discs
                </button>
                <button class="contract-btn" data-contract="0x90546848474fb3c9fda3fdad887969bb244e7e58" data-filter="serum">
                    Serums
                </button>
                <button class="contract-btn" data-contract="0x90546848474fb3c9fda3fdad887969bb244e7e58" data-filter="crafting">
                    Crafting
                </button>
                <button class="contract-btn" data-contract="0x6e369bf0e4e0c106192d606fb6d85836d684da75" data-filter="rename">
                    RENAME
                </button>
            </div>

            <!-- Loading -->
            <div id="loading" class="loading" style="display: none;">
                <div class="spinner"></div>
                <p>Loading tokens...</p>
            </div>

            <!-- Error/Success Messages -->
            <div id="error" class="error" style="display: none;"></div>
            <div id="success" class="success" style="display: none;"></div>

            <!-- No Tokens -->
            <div id="no-tokens" class="no-tokens" style="display: none;">
                <p>No tokens found in this contract</p>
            </div>

            <!-- Tokens Grid -->
            <div id="tokens-grid" class="tokens-grid"></div>
        </div>
    </div>

    <div class="footer">
        Powered by $ADRIAN
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    
    <!-- TraitLAB Modules -->
    <script src="modules/config.js"></script>
    <script src="modules/wallet.js"></script>
    <script src="modules/ui.js"></script>
    <script src="modules/traits.js"></script>
    <script src="modules/floppy.js"></script>
    <script src="modules/serums.js"></script>
    <script src="modules/zero.js"></script>
    <script src="modules/crafting.js"></script>
    <script src="modules/sticky-visibility.js"></script>
    <script src="modules/data-manager.js"></script>

    <!-- Main App -->
    <script>
        /**
         * TRAITLAB v2 - Main Application
         * Arquitectura modular limpia y organizada
         */
        class TraitLABv2 {
            constructor() {
                this.modules = {};
                this.currentContract = "0x6e369bf0e4e0c106192d606fb6d85836d684da75"; // AdrianZERO por defecto
                this.currentFilter = null;
                this.isInitialized = false;
                
                console.log('🚀 TraitLAB v2: Inicializando aplicación modular...');
            }

            /**
             * Inicializar la aplicación
             */
            async init() {
                try {
                    console.log('🚀 TraitLAB v2: Iniciando...');
                    
                    // Inicializar módulos
                    await this.initializeModules();
                    
                    // Configurar event listeners
                    this.setupEventListeners();
                    
                    // Configurar tabs
                    this.setupTabs();
                    
                    this.isInitialized = true;
                    console.log('✅ TraitLAB v2: Inicializada correctamente');
                    
                } catch (error) {
                    console.error('❌ Error inicializando TraitLAB v2:', error);
                    this.showError(`Error inicializando: ${error.message}`);
                }
            }

            /**
             * Inicializar todos los módulos
             */
            async initializeModules() {
                console.log('🔧 TraitLAB v2: Inicializando módulos...');
                
                // Wallet Manager
                this.modules.wallet = new window.TraitLABWallet();
                this.modules.wallet.init();
                
                // UI Manager
                this.modules.ui = new window.TraitLABUI();
                this.modules.ui.init();
                
                // Traits Manager
                this.modules.traits = new window.TraitLABTraits();
                await this.modules.traits.init();
                
                // Floppy Manager
                this.modules.floppy = new window.TraitLABFloppy();
                this.modules.floppy.init();
                
                // Serums Manager
                this.modules.serums = new window.TraitLABSerums();
                this.modules.serums.init();
                
                // Crafting Manager
                this.modules.crafting = new window.TraitLABCrafting();
                
                // Zero Manager
                this.modules.zero = new window.TraitLABZero();
                this.modules.zero.init();
                
                // Sticky Visibility Manager
                this.stickyManager = new window.StickyVisibilityManager();
                this.stickyManager.init();
                
                // Data Manager
                this.modules.dataManager = new window.TraitLABDataManager();
                
                console.log('✅ TraitLAB v2: Todos los módulos inicializados');
            }

            /**
             * Configurar event listeners básicos
             */
            setupEventListeners() {
                console.log('🔧 TraitLAB v2: Configurando event listeners...');
                
                // Connect Wallet button
                const connectBtn = document.getElementById('connectBtn');
                if (connectBtn) {
                    connectBtn.addEventListener('click', () => this.connectWallet());
                }
                
                // Disconnect Wallet button
                const disconnectBtn = document.getElementById('disconnectBtn');
                if (disconnectBtn) {
                    disconnectBtn.addEventListener('click', () => this.disconnectWallet());
                }
                
                // Wallet events
                if (this.modules.wallet) {
                    this.modules.wallet.on('walletConnected', (data) => this.onWalletConnected(data));
                    this.modules.wallet.on('walletDisconnected', () => this.onWalletDisconnected());
                }
                
                console.log('✅ TraitLAB v2: Event listeners configurados');
            }

            /**
             * Configurar sistema de tabs
             */
            setupTabs() {
                console.log('🔧 TraitLAB v2: Configurando tabs...');
                
                const contractBtns = document.querySelectorAll('.contract-btn');
                
                contractBtns.forEach(btn => {
                    btn.addEventListener('click', () => {
                        const contract = btn.dataset.contract;
                        const filter = btn.dataset.filter;
                        
                        // Update active button
                        contractBtns.forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        
                        // Update current contract and filter
                        this.currentContract = contract;
                        this.currentFilter = filter;
                        
                        // Load tokens for this contract/filter
                        this.loadTokensForTab();
                    });
                });
                
                // Activar automáticamente el primer tab si hay wallet conectada
                if (this.modules.wallet && this.modules.wallet.getCurrentAccount()) {
                    const firstBtn = contractBtns[0];
                    if (firstBtn) {
                        firstBtn.click(); // Esto activará el tab y cargará tokens
                    }
                }
                
                console.log('✅ TraitLAB v2: Tabs configurados');
            }

            /**
             * Conectar wallet
             */
            async connectWallet() {
                try {
                    console.log('🔌 TraitLAB v2: Conectando wallet...');
                    await this.modules.wallet.connectWallet();
                } catch (error) {
                    console.error('❌ Error conectando wallet:', error);
                    this.showError(`Error conectando wallet: ${error.message}`);
                }
            }

            /**
             * Desconectar wallet
             */
            async disconnectWallet() {
                try {
                    console.log('🔌 TraitLAB v2: Desconectando wallet...');
                    await this.modules.wallet.disconnectWallet();
                } catch (error) {
                    console.error('❌ Error desconectando wallet:', error);
                    this.showError(`Error desconectando wallet: ${error.message}`);
                }
            }

            /**
             * Wallet conectado
             */
            onWalletConnected(data) {
                console.log('🔌 TraitLAB v2: Wallet conectada:', data);
                
                // Update UI
                document.getElementById('connect-section').style.display = 'none';
                document.getElementById('account-section').style.display = 'block';
                document.getElementById('walletAddress').textContent = `${data.account.substring(0, 6)}...${data.account.slice(-4)}`;
                
                // Show tokens section
                document.getElementById('tokens-section').style.display = 'block';
                
                // Iniciar DataManager en background
                if (this.modules.dataManager) {
                    this.modules.dataManager.init().catch(error => {
                        console.warn('📊 DataManager error:', error);
                    });
                }
                
                // No cargar tokens aquí, se cargarán cuando se configure el primer tab
                console.log('🔧 TraitLAB v2: Wallet conectada, esperando configuración de tabs...');
            }

            /**
             * Wallet desconectada
             */
            onWalletDisconnected() {
                console.log('�� TraitLAB v2: Wallet desconectada');
                
                // Update UI
                document.getElementById('connect-section').style.display = 'block';
                document.getElementById('account-section').style.display = 'none';
                document.getElementById('tokens-section').style.display = 'none';
                
                // Clear tokens
                this.clearTokens();
            }

            /**
             * Cargar tokens para el tab actual
             */
            async loadTokensForTab() {
                try {
                    console.log('🚀 TraitLAB v2: Cargando tokens para tab:', this.currentFilter);
                    console.log('🔍 Contrato actual:', this.currentContract);
                    
                    this.showLoading();
                    
                    // Verificar que tengamos los módulos necesarios
                    if (!this.modules.wallet || !this.modules.ui) {
                        throw new Error('Módulos wallet o UI no disponibles');
                    }
                    
                    const userAddress = this.modules.wallet.getCurrentAccount();
                    if (!userAddress) {
                        throw new Error('No hay wallet conectada');
                    }
                    
                    if (this.currentFilter === 'crafting') {
                        // Usar módulo de crafting
                        if (this.modules.crafting) {
                            await this.modules.crafting.loadRecipes();
                            this.displayCraftingContent();
                        } else {
                            throw new Error('Módulo de crafting no disponible');
                        }
                    } else if (this.currentFilter === 'traits') {
                        // Usar módulo de traits
                        if (this.modules.traits) {
                            const traits = await this.modules.traits.loadTraits();
                            this.modules.ui.displayTokens(traits, 'traits');
                        } else {
                            throw new Error('Módulo de traits no disponible');
                        }
                    } else if (this.currentFilter === 'floppy') {
                        // Usar módulo de floppy
                        if (this.modules.floppy) {
                            const floppys = await this.modules.floppy.loadFloppys();
                            this.modules.ui.displayTokens(floppys, 'floppy');
                        } else {
                            throw new Error('Módulo de floppy no disponible');
                        }
                    } else if (this.currentFilter === 'serum') {
                        // Usar módulo de serums
                        if (this.modules.serums) {
                            const serums = await this.modules.serums.loadSerums();
                            this.modules.ui.displayTokens(serums, 'serum');
                        } else {
                            throw new Error('Módulo de serums no disponible');
                        }
                    } else {
                        // Usar módulo zero para AdrianZERO (caso por defecto)
                        if (this.modules.zero && this.currentContract) {
                            console.log('🔍 Cargando tokens AdrianZERO con contrato:', this.currentContract);
                            const tokens = await this.modules.zero.loadTokens(
                                userAddress,
                                this.currentContract
                            );
                            this.modules.ui.displayTokens(tokens, this.currentFilter || 'adrianzero');
                        } else {
                            throw new Error('Módulo zero o contrato no disponible');
                        }
                    }
                    
                    this.hideLoading();
                    
                } catch (error) {
                    console.error('❌ Error cargando tokens:', error);
                    this.hideLoading();
                    this.showError(`Error cargando tokens: ${error.message}`);
                }
            }

            /**
             * Mostrar contenido de crafting
             */
            displayCraftingContent() {
                const grid = document.getElementById('tokens-grid');
                if (!grid) return;
                
                // Usar el módulo de crafting para mostrar contenido
                this.modules.crafting.displayRecipes(grid);
            }

            /**
             * Limpiar tokens
             */
            clearTokens() {
                const grid = document.getElementById('tokens-grid');
                if (grid) {
                    grid.innerHTML = '';
                }
            }

            /**
             * Mostrar loading
             */
            showLoading() {
                const loading = document.getElementById('loading');
                if (loading) {
                    loading.style.display = 'block';
                }
            }

            /**
             * Ocultar loading
             */
            hideLoading() {
                const loading = document.getElementById('loading');
                if (loading) {
                    loading.style.display = 'none';
                }
            }

            /**
             * Mostrar error
             */
            showError(message) {
                const error = document.getElementById('error');
                if (error) {
                    error.textContent = message;
                    error.style.display = 'block';
                    setTimeout(() => {
                        error.style.display = 'none';
                    }, 5000);
                }
            }

            /**
             * Mostrar éxito
             */
            showSuccess(message) {
                const success = document.getElementById('success');
                if (success) {
                    success.textContent = message;
                    success.style.display = 'block';
                    setTimeout(() => {
                        success.style.display = 'none';
                    }, 3000);
                }
            }
        }

        // Inicializar aplicación cuando el DOM esté listo
        document.addEventListener('DOMContentLoaded', async () => {
            console.log('🚀 TraitLAB v2: DOM listo, inicializando...');
            
            // Crear instancia global
            window.app = new TraitLABv2();
            
            // Inicializar
            await window.app.init();
        });
    </script>
</body>
</html>
