<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TraitLAB v2 - Modular & Clean</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="modules/styles.css" rel="stylesheet">
</head>
<body>
    <!-- Contenedor principal para la aplicación -->
    <div id="app-container"></div>

    <!-- Scripts de módulos -->
    <script src="modules/config.js"></script>
    <script src="modules/wallet.js"></script>
    <script src="modules/sticky-popup-manager.js"></script>
    <script src="modules/data-manager.js"></script>
    <script src="modules/filters.js"></script>
    <script src="modules/display-manager.js"></script>
    <script src="modules/token-selection-manager.js"></script>
    <script src="modules/app-initializer.js"></script>
    <script src="modules/ui-templates.js"></script>
    <script src="modules/traits.js"></script>
    <script src="modules/floppy.js"></script>
    <script src="modules/serums.js"></script>
    <script src="modules/crafting.js"></script>
    <script src="modules/zero.js"></script>
    <script src="modules/ui.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // TraitLAB v2 - Main Application (Esqueleto Limpio)
        class TraitLABv2 {
            constructor() {
                this.modules = {};
                this.currentContract = "0x6e369bf0e4e0c106192d606fb6d85836d684da75";
                this.currentFilter = null;
                this.tokensAlreadyDisplayed = false; // 🚨 NUEVO: Flag para evitar sobrescrituras
            }

            /**
             * Inicializar aplicación
             */
            async init() {
                try {
                    console.log('🚀 TraitLAB v2: Inicializando...');
                    
                    // Renderizar UI usando templates
                    this.renderUI();
                    
                    // Inicializar aplicación usando AppInitializer
                    const initializer = new window.AppInitializer(this);
                    await initializer.initialize();
                    
                    // 🚨 NUEVO: Configurar carga progresiva después de inicializar módulos
                    this.setupProgressiveLoading();
                    
                    console.log('✅ TraitLAB v2: Inicializada correctamente');
                    
                } catch (error) {
                    console.error('❌ TraitLAB v2: Error en inicialización:', error);
                }
            }

            /**
             * Renderizar interfaz de usuario
             */
            renderUI() {
                const container = document.getElementById('app-container');
                if (container) {
                    const templates = new window.UITemplates();
                    templates.renderAllTemplates(container);
                }
            }

            /**
             * 🚨 NUEVO: Configurar carga progresiva
             */
            setupProgressiveLoading() {
                console.log('🔄 Configurando carga progresiva...');
                
                // Suscribirse a eventos del módulo zero para actualizaciones progresivas
                if (this.modules.zero) {
                    // Mostrar tokens inmediatamente cuando estén listos
                    this.modules.zero.on('tokensReadyForDisplay', (data) => {
                        console.log('🎯 Tokens listos para mostrar inmediatamente:', data.tokens.length);
                        this.modules.ui.displayTokens(data.tokens, 'adrianzero');
                        this.hideLoading();
                    });
                    
                    // Actualizar nombres progresivamente sin re-renderizar todo
                    this.modules.zero.on('customNamesProgressUpdate', (data) => {
                        console.log('📝 Actualizando nombres progresivamente:', data.updatedCount, '/', data.totalCount);
                        this.modules.ui.updateTokenNamesOnly(data.nameMap);
                    });
                    
                    // Finalizar carga progresiva
                    this.modules.zero.on('customNamesLoaded', (data) => {
                        console.log('✅ Nombres personalizados cargados completamente');
                        this.modules.ui.finalizeProgressiveLoading();
                    });
                }
            }

            /**
             * Cargar tokens para el tab actual
             */
            async loadTokensForTab() {
                try {
                    console.log('🚀 TraitLAB v2: Cargando tokens para tab:', this.currentFilter);
                    console.log('🔍 Contrato actual:', this.currentContract);
                    
                    this.showLoading();
                    
                    // Verificar que tengamos los módulos necesarios
                    if (!this.modules.wallet || !this.modules.ui) {
                        throw new Error('Módulos wallet o UI no disponibles');
                    }
                    
                    const userAddress = this.modules.wallet.getCurrentAccount();
                    if (!userAddress) {
                        throw new Error('No hay wallet conectada');
                    }
                    
                    // Usar data-manager para obtener tokens ya filtrados
                    if (!this.modules.dataManager) {
                        throw new Error('Módulo data-manager no disponible');
                    }
                    
                    if (this.currentFilter === 'crafting') {
                        console.log('🔨 CRAFTING: Iniciando carga de crafting...');
                        console.log('🔨 CRAFTING: this.modules.crafting disponible:', !!this.modules.crafting);
                        console.log('🔨 CRAFTING: this.modules.displayManager disponible:', !!this.modules.displayManager);
                        console.log('🔨 CRAFTING: tokens-grid disponible:', !!document.getElementById('tokens-grid'));
                        
                        // Mostrar contenido de crafting
                        if (this.modules.crafting) {
                            console.log('🔨 CRAFTING: Cargando recetas...');
                            await this.modules.crafting.loadRecipes();
                            console.log('🔨 CRAFTING: Recetas cargadas, llamando displayCraftingContent...');
                            this.modules.displayManager.displayCraftingContent(
                                document.getElementById('tokens-grid'),
                                this.modules.crafting,
                                this.modules.dataManager
                            );
                            console.log('🔨 CRAFTING: displayCraftingContent llamado');
                        } else {
                            console.error('🔨 CRAFTING: Módulo de crafting no disponible');
                            throw new Error('Módulo de crafting no disponible');
                        }
                    } else {
                        // 🚀 MOSTRAR TOKENS PROGRESIVAMENTE
                        const filteredTokens = this.modules.dataManager.getFilteredTokens(this.currentFilter || 'adrianzero');
                        console.log(`📊 Tokens filtrados obtenidos: ${filteredTokens.length}`);
                        
                        if (filteredTokens.length > 0) {
                            // 🚨 VERIFICAR: Solo mostrar si no hay tokens ya mostrados por DataManager
                            if (!this.tokensAlreadyDisplayed || this.currentFilter !== 'adrianzero') {
                                console.log('✅ Mostrando tokens disponibles inmediatamente');
                                this.modules.ui.displayTokens(filteredTokens, this.currentFilter || 'adrianzero');
                                this.hideLoading();
                            } else {
                                console.log('⚠️ Saltando displayTokens - Ya mostrados por DataManager');
                                this.hideLoading();
                            }
                        } else {
                            // Mostrar loading mientras se cargan los tokens
                            console.log('⏳ Mostrando loading mientras se cargan tokens...');
                            // El loading ya se mostró al inicio del método
                            // Los tokens se mostrarán automáticamente cuando estén listos
                            // a través del callback onTokensLoaded
                        }
                    }
                    
                } catch (error) {
                    console.error('❌ Error cargando tokens:', error);
                    this.hideLoading();
                    this.showError(`Error cargando tokens: ${error.message}`);
                }
            }

            /**
             * Mostrar loading
             */
            showLoading() {
                const loading = document.getElementById('loading');
                if (loading) loading.style.display = 'block';
            }

            /**
             * Ocultar loading
             */
            hideLoading() {
                const loading = document.getElementById('loading');
                if (loading) loading.style.display = 'none';
            }

            /**
             * Mostrar error
             */
            showError(message) {
                const error = document.getElementById('error');
                if (error) {
                    error.textContent = message;
                    error.style.display = 'block';
                }
            }

            /**
             * Mostrar éxito
             */
            showSuccess(message) {
                const success = document.getElementById('success');
                if (success) {
                    success.textContent = message;
                    success.style.display = 'block';
                }
            }

            /**
             * Limpiar tokens
             */
            clearTokens() {
                const grid = document.getElementById('tokens-grid');
                if (grid) grid.innerHTML = '';
            }

            /**
             * Manejar wallet conectada
             */
            onWalletConnected(data) {
                console.log('🔌 TraitLAB v2: Wallet conectada:', data);
                
                // ✅ ACTUALIZAR UI INMEDIATAMENTE (sin esperar carga)
                document.getElementById('connect-section').style.display = 'none';
                document.getElementById('account-section').style.display = 'block';
                document.getElementById('tokens-section').style.display = 'block';
                
                // Update wallet address
                const walletAddress = document.getElementById('walletAddress');
                if (walletAddress) {
                    walletAddress.textContent = `${data.account.substring(0, 6)}...${data.account.slice(-4)}`;
                }
                
                // 🚀 CARGAR DATOS EN BACKGROUND (no bloquea la UI)
                this.loadDataInBackground(data.account);
            }

            /**
             * Cargar datos en background sin bloquear la UI
             */
            async loadDataInBackground(userAddress) {
                console.log('🚀 TraitLAB v2: Iniciando carga en background...');
                
                // NO mostrar mensaje de carga aquí - se maneja en loadTokensForTab
                
                try {
                    // 1. Iniciar DataManager en background (SECUENCIAL)
                    if (this.modules.dataManager) {
                        console.log('📊 TraitLAB v2: Iniciando DataManager en background...');
                        await this.modules.dataManager.init();
                        console.log('📊 TraitLAB v2: DataManager cargado en background');
                        const status = this.modules.dataManager.getStatus();
                        console.log('📊 TraitLAB v2: Estado del cache:', status);
                    }
                    
                    // 2. Cargar tokens del contrato actual en background (DESPUÉS de DataManager)
                    console.log('🚀 TraitLAB v2: Cargando tokens del contrato actual en background...');
                    await this.loadTokensForTab();
                    
                    // 3. NO limpiar el grid aquí - los tokens ya se mostraron
                    // El grid se mantiene con el contenido mostrado por displayTokens
                    
                } catch (error) {
                    console.error('❌ TraitLAB v2: Error en carga en background:', error);
                    // Mostrar error pero no bloquear la UI
                    if (tokensGrid) {
                        tokensGrid.innerHTML = `
                            <div class="error-message" style="text-align: center; padding: 20px; color: #e74c3c;">
                                <p>⚠️ Error cargando tokens</p>
                                <p style="font-size: 12px;">${error.message}</p>
                                <button onclick="window.app.loadDataInBackground('${userAddress}')" style="background: #e74c3c; color: white; border: none; padding: 5px 10px; border-radius: 3px; cursor: pointer;">Reintentar</button>
                            </div>
                        `;
                    }
                }
            }

            /**
             * Manejar wallet desconectada
             */
            onWalletDisconnected() {
                console.log('🔌 TraitLAB v2: Wallet desconectada');
                
                // Update UI
                document.getElementById('connect-section').style.display = 'block';
                document.getElementById('account-section').style.display = 'none';
                document.getElementById('tokens-section').style.display = 'none';
                
                // Clear tokens
                this.clearTokens();
            }

            /**
             * Callback para cuando se cargan tokens progresivamente
             */
            onTokensLoaded({ tokens, filter }) {
                console.log('🚀 TraitLAB v2: Tokens cargados progresivamente:', { 
                    count: tokens.length, 
                    filter 
                });
                
                // Si estamos en el tab correcto, mostrar los tokens inmediatamente
                if (this.currentFilter === filter) {
                    // 🚨 VERIFICAR: Solo mostrar si no hay tokens ya mostrados por DataManager
                    if (!this.tokensAlreadyDisplayed || filter !== 'adrianzero') {
                        console.log('✅ Mostrando tokens cargados progresivamente para tab:', filter);
                        this.modules.ui.displayTokens(tokens, filter);
                        this.hideLoading();
                    } else {
                        console.log('⚠️ Saltando onTokensLoaded - Ya mostrados por DataManager');
                        this.hideLoading();
                    }
                }
            }
        }

        // Inicializar aplicación cuando el DOM esté listo
        document.addEventListener('DOMContentLoaded', async () => {
            console.log('🚀 TraitLAB v2: DOM listo, inicializando...');
            
            // Crear instancia global
            window.app = new TraitLABv2();
            
            // Inicializar
            await window.app.init();
        });
    </script>
</body>
</html>
