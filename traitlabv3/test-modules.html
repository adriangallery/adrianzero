<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TraitLAB - Test de Módulos</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'VT323', monospace;
            background: #1a1a1a;
            min-height: 100vh;
            color: #fff;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            color: white;
        }

        .header h1 {
            font-size: 4.5rem;
            margin-bottom: 5px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header h1 .trait {
            color: #ffffff;
        }

        .header h1 .lab {
            color: #00ff00;
        }

        .header .subtitle {
            font-size: 1.45rem;
            color: #cccccc;
            margin-bottom: 20px;
            font-family: 'VT323', monospace;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }

        .test-section {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin-bottom: 20px;
            border: 1px solid #333;
        }

        .test-section h3 {
            color: #00ff00;
            margin-bottom: 15px;
        }

        .test-btn {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            font-family: 'VT323', monospace;
            margin: 5px;
        }

        .test-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }

        .test-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .log-area {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid #333;
            border-radius: 10px;
            padding: 15px;
            margin-top: 15px;
            max-height: 300px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.9rem;
        }

        .log-entry {
            margin-bottom: 5px;
            padding: 2px 0;
        }

        .log-info { color: #00ff00; }
        .log-error { color: #ff4444; }
        .log-warning { color: #ffaa00; }
        .log-success { color: #44ff44; }

        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }

        .status-ok { background-color: #44ff44; }
        .status-error { background-color: #ff4444; }
        .status-loading { background-color: #ffaa00; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>
                <span class="trait">TRAIT</span><span class="lab">LAB</span>
            </h1>
            <div class="subtitle">Test de Módulos Refactorizados</div>
            <p>Verificando funcionalidad de los módulos antes del traspaso final</p>
        </div>

        <!-- Test de Configuración -->
        <div class="test-section">
            <h3>🔧 Módulo de Configuración</h3>
            <button class="test-btn" onclick="testConfig()">Test Config</button>
            <button class="test-btn" onclick="showConfig()">Mostrar Config</button>
            <div class="log-area" id="config-log"></div>
        </div>

        <!-- Test de Wallet -->
        <div class="test-section">
            <h3>💰 Módulo de Wallet</h3>
            <button class="test-btn" onclick="testWallet()">Test Wallet</button>
            <button class="test-btn" onclick="connectWallet()">Conectar Wallet</button>
            <button class="test-btn" onclick="disconnectWallet()">Desconectar Wallet</button>
            <div class="log-area" id="wallet-log"></div>
        </div>

        <!-- Test de UI -->
        <div class="test-section">
            <h3>🎨 Módulo de UI</h3>
            <button class="test-btn" onclick="testUI()">Test UI</button>
            <button class="test-btn" onclick="testImagePath()">Test Image Path</button>
            <div class="log-area" id="ui-log"></div>
        </div>

        <!-- Test de Traits -->
        <div class="test-section">
            <h3>🎭 Módulo de Traits</h3>
            <button class="test-btn" onclick="testTraits()">Test Traits</button>
            <button class="test-btn" onclick="loadTraitsDB()">Cargar DB</button>
            <div class="log-area" id="traits-log"></div>
        </div>

        <!-- Test de Integración -->
        <div class="test-section">
            <h3>🔗 Test de Integración</h3>
            <button class="test-btn" onclick="testIntegration()">Test Completo</button>
            <button class="test-btn" onclick="clearAllLogs()">Limpiar Logs</button>
            <div class="log-area" id="integration-log"></div>
        </div>
    </div>

    <!-- Cargar módulos -->
    <script src="modules/config.js"></script>
    <script src="modules/wallet.js"></script>
    <script src="modules/ui.js"></script>
    <script src="modules/traits.js"></script>

    <script>
        // Variables globales para los módulos
        let walletManager, uiManager, traitsManager;
        let testResults = {};

        // Inicializar módulos cuando se carga la página
        document.addEventListener('DOMContentLoaded', () => {
            console.log('🚀 Inicializando módulos de TraitLAB...');
            
            try {
                // Verificar que los módulos estén disponibles
                if (window.TraitLABConfig) {
                    console.log('✅ Módulo de configuración cargado');
                    testResults.config = true;
                } else {
                    console.error('❌ Módulo de configuración no disponible');
                    testResults.config = false;
                }

                if (window.TraitLABWallet) {
                    console.log('✅ Módulo de wallet cargado');
                    walletManager = new window.TraitLABWallet();
                    testResults.wallet = true;
                } else {
                    console.error('❌ Módulo de wallet no disponible');
                    testResults.wallet = false;
                }

                if (window.TraitLABUI) {
                    console.log('✅ Módulo de UI cargado');
                    uiManager = new window.TraitLABUI();
                    testResults.ui = true;
                } else {
                    console.error('❌ Módulo de UI no disponible');
                    testResults.ui = false;
                }

                if (window.TraitLABTraits) {
                    console.log('✅ Módulo de traits cargado');
                    traitsManager = new window.TraitLABTraits();
                    testResults.traits = true;
                } else {
                    console.error('❌ Módulo de traits no disponible');
                    testResults.traits = false;
                }

                // Configurar event listeners entre módulos
                setupModuleCommunication();

                console.log('🎯 Módulos inicializados:', testResults);
                
            } catch (error) {
                console.error('❌ Error durante la inicialización:', error);
            }
        });

        // Configurar comunicación entre módulos
        function setupModuleCommunication() {
            if (walletManager && uiManager) {
                walletManager.on('uiUpdate', (data) => {
                    logToArea('wallet-log', `UI Update: ${JSON.stringify(data)}`, 'info');
                });
            }

            if (traitsManager && uiManager) {
                traitsManager.on('traitsDatabaseLoaded', (data) => {
                    logToArea('traits-log', `Traits DB loaded: ${data.traits?.length || 0} traits`, 'success');
                });

                traitsManager.on('traitSelected', (data) => {
                    logToArea('traits-log', `Trait selected: ${data.token.tokenId} (${data.category})`, 'info');
                });
            }
        }

        // Función helper para logging
        function logToArea(areaId, message, type = 'info') {
            const logArea = document.getElementById(areaId);
            if (logArea) {
                const timestamp = new Date().toLocaleTimeString();
                const logEntry = document.createElement('div');
                logEntry.className = `log-entry log-${type}`;
                logEntry.innerHTML = `<span class="status-indicator status-${type === 'error' ? 'error' : type === 'success' ? 'ok' : 'info'}"></span>[${timestamp}] ${message}`;
                logArea.appendChild(logEntry);
                logArea.scrollTop = logArea.scrollHeight;
            }
            console.log(`[${type.toUpperCase()}] ${message}`);
        }

        // Test de Configuración
        function testConfig() {
            logToArea('config-log', '🧪 Iniciando test de configuración...', 'info');
            
            try {
                if (window.TraitLABConfig) {
                    const config = window.TraitLABConfig;
                    
                    // Verificar constantes importantes
                    const requiredProps = [
                        'ALCHEMY_API_KEY', 'CONTRACTS', 'TRAITS_EXTENSIONS_CONTRACT',
                        'ACTION_PACKS_CONTRACT', 'ACTION_PACK_10007_CONTRACT'
                    ];
                    
                    let allPropsPresent = true;
                    requiredProps.forEach(prop => {
                        if (config[prop]) {
                            logToArea('config-log', `✅ ${prop}: ${config[prop]}`, 'success');
                        } else {
                            logToArea('config-log', `❌ ${prop}: No encontrado`, 'error');
                            allPropsPresent = false;
                        }
                    });
                    
                    if (allPropsPresent) {
                        logToArea('config-log', '🎉 Test de configuración completado exitosamente', 'success');
                        testResults.config = true;
                    } else {
                        logToArea('config-log', '⚠️ Test de configuración completado con advertencias', 'warning');
                    }
                } else {
                    logToArea('config-log', '❌ Módulo de configuración no disponible', 'error');
                    testResults.config = false;
                }
            } catch (error) {
                logToArea('config-log', `❌ Error en test de configuración: ${error.message}`, 'error');
                testResults.config = false;
            }
        }

        function showConfig() {
            if (window.TraitLABConfig) {
                logToArea('config-log', '📋 Mostrando configuración completa:', 'info');
                logToArea('config-log', JSON.stringify(window.TraitLABConfig, null, 2), 'info');
            } else {
                logToArea('config-log', '❌ Módulo de configuración no disponible', 'error');
            }
        }

        // Test de Wallet
        function testWallet() {
            logToArea('wallet-log', '🧪 Iniciando test de wallet...', 'info');
            
            try {
                if (walletManager) {
                    // Verificar métodos disponibles
                    const requiredMethods = [
                        'connectWallet', 'disconnectWallet', 'checkConnection',
                        'getCurrentAccount', 'isWalletConnected'
                    ];
                    
                    let allMethodsPresent = true;
                    requiredMethods.forEach(method => {
                        if (typeof walletManager[method] === 'function') {
                            logToArea('wallet-log', `✅ Método ${method} disponible`, 'success');
                        } else {
                            logToArea('wallet-log', `❌ Método ${method} no disponible`, 'error');
                            allMethodsPresent = false;
                        }
                    });
                    
                    if (allMethodsPresent) {
                        logToArea('wallet-log', '🎉 Test de wallet completado exitosamente', 'success');
                        testResults.wallet = true;
                    } else {
                        logToArea('wallet-log', '⚠️ Test de wallet completado con advertencias', 'warning');
                    }
                } else {
                    logToArea('wallet-log', '❌ Módulo de wallet no disponible', 'error');
                    testResults.wallet = false;
                }
            } catch (error) {
                logToArea('wallet-log', `❌ Error en test de wallet: ${error.message}`, 'error');
                testResults.wallet = false;
            }
        }

        function connectWallet() {
            if (walletManager) {
                logToArea('wallet-log', '🔌 Intentando conectar wallet...', 'info');
                walletManager.connectWallet();
            } else {
                logToArea('wallet-log', '❌ Módulo de wallet no disponible', 'error');
            }
        }

        function disconnectWallet() {
            if (walletManager) {
                logToArea('wallet-log', '🔌 Desconectando wallet...', 'info');
                walletManager.disconnectWallet();
            } else {
                logToArea('wallet-log', '❌ Módulo de wallet no disponible', 'error');
            }
        }

        // Test de UI
        function testUI() {
            logToArea('ui-log', '🧪 Iniciando test de UI...', 'info');
            
            try {
                if (uiManager) {
                    // Verificar métodos disponibles
                    const requiredMethods = [
                        'displayTokens', 'getImagePath', 'showLoading', 'hideLoading',
                        'showError', 'showSuccess', 'setCurrentFilter'
                    ];
                    
                    let allMethodsPresent = true;
                    requiredMethods.forEach(method => {
                        if (typeof uiManager[method] === 'function') {
                            logToArea('ui-log', `✅ Método ${method} disponible`, 'success');
                        } else {
                            logToArea('ui-log', `❌ Método ${method} no disponible`, 'error');
                            allMethodsPresent = false;
                        }
                    });
                    
                    if (allMethodsPresent) {
                        logToArea('ui-log', '🎉 Test de UI completado exitosamente', 'success');
                        testResults.ui = true;
                    } else {
                        logToArea('ui-log', '⚠️ Test de UI completado con advertencias', 'warning');
                    }
                } else {
                    logToArea('ui-log', '❌ Módulo de UI no disponible', 'error');
                    testResults.ui = false;
                }
            } catch (error) {
                logToArea('ui-log', `❌ Error en test de UI: ${error.message}`, 'error');
                testResults.ui = false;
            }
        }

        function testImagePath() {
            if (uiManager) {
                const localPath = uiManager.getImagePath(10007, '.png');
                const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
                
                logToArea('ui-log', `🌐 Hostname: ${window.location.hostname}`, 'info');
                logToArea('ui-log', `📁 Path generado: ${localPath}`, 'info');
                logToArea('ui-log', `🏠 Es local: ${isLocal}`, 'info');
            } else {
                logToArea('ui-log', '❌ Módulo de UI no disponible', 'error');
            }
        }

        // Test de Traits
        function testTraits() {
            logToArea('traits-log', '🧪 Iniciando test de traits...', 'info');
            
            try {
                if (traitsManager) {
                    // Verificar métodos disponibles
                    const requiredMethods = [
                        'loadTraitsDatabase', 'getTraitCategory', 'handleTraitSelection',
                        'generateCombinedImage', 'applyTraitsToNFT'
                    ];
                    
                    let allMethodsPresent = true;
                    requiredMethods.forEach(method => {
                        if (typeof traitsManager[method] === 'function') {
                            logToArea('traits-log', `✅ Método ${method} disponible`, 'success');
                        } else {
                            logToArea('traits-log', `❌ Método ${method} no disponible`, 'error');
                            allMethodsPresent = false;
                        }
                    });
                    
                    if (allMethodsPresent) {
                        logToArea('traits-log', '🎉 Test de traits completado exitosamente', 'success');
                        testResults.traits = true;
                    } else {
                        logToArea('traits-log', '⚠️ Test de traits completado con advertencias', 'warning');
                    }
                } else {
                    logToArea('traits-log', '❌ Módulo de traits no disponible', 'error');
                    testResults.traits = false;
                }
            } catch (error) {
                logToArea('traits-log', `❌ Error en test de traits: ${error.message}`, 'error');
                testResults.traits = false;
            }
        }

        function loadTraitsDB() {
            if (traitsManager) {
                logToArea('traits-log', '📚 Cargando base de datos de traits...', 'info');
                traitsManager.loadTraitsDatabase();
            } else {
                logToArea('traits-log', '❌ Módulo de traits no disponible', 'error');
            }
        }

        // Test de Integración
        function testIntegration() {
            logToArea('integration-log', '🧪 Iniciando test de integración completa...', 'info');
            
            const results = Object.values(testResults);
            const successCount = results.filter(r => r === true).length;
            const totalCount = results.length;
            
            logToArea('integration-log', `📊 Resultados: ${successCount}/${totalCount} módulos funcionando`, 'info');
            
            if (successCount === totalCount) {
                logToArea('integration-log', '🎉 ¡Todos los módulos están funcionando correctamente!', 'success');
                logToArea('integration-log', '🚀 TraitLAB está listo para la refactorización completa', 'success');
            } else {
                logToArea('integration-log', '⚠️ Algunos módulos tienen problemas', 'warning');
                logToArea('integration-log', '🔧 Revisa los logs individuales para más detalles', 'warning');
            }
            
            // Mostrar resumen de estado
            Object.entries(testResults).forEach(([module, status]) => {
                const statusText = status ? '✅ OK' : '❌ ERROR';
                logToArea('integration-log', `${module}: ${statusText}`, status ? 'success' : 'error');
            });
        }

        function clearAllLogs() {
            const logAreas = ['config-log', 'wallet-log', 'ui-log', 'traits-log', 'integration-log'];
            logAreas.forEach(areaId => {
                const logArea = document.getElementById(areaId);
                if (logArea) {
                    logArea.innerHTML = '';
                }
            });
            logToArea('integration-log', '🧹 Todos los logs han sido limpiados', 'info');
        }
    </script>
</body>
</html>
