<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TraitLAB v2 - Modular & Clean</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="modules/styles.css" rel="stylesheet">
    
    <style>
        /* Crafting Container Styles */
        .crafting-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 40px;
        }

        .crafting-section {
            width: 100%;
        }

        .recipes-section h3,
        .traits-section h3 {
            color: #00ff00;
            margin-bottom: 20px;
            font-size: 1.5rem;
            text-align: center;
        }

        .recipes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 15px;
        }

        .traits-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        /* Recipe Card Styles */
        .recipe-card {
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid #333;
            border-radius: 15px;
            padding: 20px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .recipe-card.eligible {
            border-color: #00ff00;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
            background: rgba(0, 255, 0, 0.05);
        }

        .recipe-card.not-eligible {
            border-color: #ff4444;
            background: rgba(255, 68, 68, 0.05);
        }

        .recipe-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        .recipe-card.specific-recipe {
            border-left: 4px solid #00ff88;
        }

        .recipe-card.any-recipe {
            border-left: 4px solid #ff8800;
        }

        .recipe-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #333;
        }

        .recipe-header h4 {
            margin: 0;
            color: #fff;
            font-size: 1.2rem;
        }

        .recipe-type {
            background: #333;
            color: #fff;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
        }

        .recipe-ingredients h5,
        .recipe-output h5 {
            color: #00ff00;
            margin: 10px 0 5px 0;
            font-size: 1rem;
        }

        .recipe-ingredient {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            border-bottom: 1px solid #222;
        }

        .trait-id {
            color: #ccc;
            font-weight: bold;
        }

        .trait-required {
            color: #ff8800;
            font-weight: bold;
        }

        .output-info {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
        }

        /* Trait Card Styles for Crafting */
        .trait-card.crafting-trait {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 10px;
            border: 1px solid #333;
            transition: all 0.3s ease;
            cursor: pointer;
            text-align: center;
        }

        .trait-card.crafting-trait:hover {
            transform: translateY(-2px);
            border-color: #00ff00;
            box-shadow: 0 4px 15px rgba(0, 255, 0, 0.2);
        }

        .trait-card.crafting-trait.selected {
            border-color: #00ff00;
            box-shadow: 0 0 0 2px rgba(0,255,0,0.25);
            background: rgba(0,255,0,0.08);
        }

        .trait-card.crafting-trait .trait-image {
            margin-bottom: 10px;
        }

        .trait-card.crafting-trait .trait-image img {
            width: 100%;
            height: 100px;
            object-fit: cover;
            border-radius: 5px;
            border: 1px solid #444;
        }

        .trait-card.crafting-trait .trait-info h4 {
            font-size: 14px;
            margin: 5px 0;
            color: #00ff00;
            font-weight: bold;
        }

        .trait-card.crafting-trait .trait-title {
            font-size: 12px;
            color: #ccc;
            margin: 3px 0;
                overflow: hidden;
                text-overflow: ellipsis;
            white-space: nowrap;
        }

        .trait-card.crafting-trait .trait-balance {
            font-size: 11px;
            color: #999;
            margin: 3px 0;
            font-weight: bold;
        }

        /* Loading and No Content States */
        .loading-recipes,
        .no-recipes,
        .loading-traits,
        .no-traits {
            text-align: center;
            padding: 40px 20px;
            color: #666;
        }

        .loading-recipes p,
        .no-recipes p,
        .loading-traits p,
        .no-traits p {
            font-size: 1.1rem;
            margin: 0;
        }

        /* Craft Button Styles */
        .craft-btn {
            background: #00ff00;
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            width: 100%;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .craft-btn:hover:not(:disabled) {
            background: #00cc00;
            transform: translateY(-1px);
            box-shadow: 0 4px 8px rgba(0, 255, 0, 0.3);
        }

        .craft-btn:disabled {
            background: #666;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .craft-btn.enabled {
            background: #00ff00;
            cursor: pointer;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .recipes-grid {
                grid-template-columns: 1fr;
            }
            
            .traits-grid {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            }
            
            .recipe-card {
                padding: 16px;
            }
        }
    </style>
</head>
<body>
    <!-- Contenedor principal para la aplicación -->
    <div id="app-container"></div>

    <!-- Scripts de módulos -->
    <!-- 1. Configuración (sin dependencias) -->
    <script src="config-keys.js" onerror="console.log('ℹ️ config-keys.js no disponible, usando keys de fallback')"></script>
    <script src="modules/config.js?v=12"></script>
    
    <!-- 2. Utilidades (sin dependencias de módulos de negocio) -->
    <script src="modules/utils/image-loader.js?v=1"></script>
    
    <!-- 3. Módulos base (sin dependencias entre sí) -->
    <script src="modules/wallet.js?v=12"></script>
    <script src="modules/filters.js?v=12"></script>
    
    <!-- 4. Módulos de negocio (dependen de módulos base) -->
    <script src="modules/zero.js?v=12"></script>
    <script src="modules/traits.js?v=12"></script>
    <script src="modules/floppy.js?v=12"></script>
    <script src="modules/serums.js?v=12"></script>
    <script src="modules/crafting.js?v=12"></script>
    <script src="modules/customise.js?v=12"></script>
    <script src="modules/lambo.js?v=12"></script>
    
    <!-- 5. Data Manager (depende de zero y wallet) -->
    <script src="modules/data-manager.js?v=12"></script>
    
    <!-- 6. UI y Managers (dependen de módulos anteriores) -->
    <script src="modules/ui.js?v=12"></script>
    <script src="modules/sticky-popup-manager.js?v=12"></script>
    <script src="modules/display-manager.js?v=12"></script>
    <script src="modules/token-selection-manager.js?v=12"></script>
    <script src="modules/ui-templates.js?v=13"></script>
    
    <!-- 7. App Initializer (depende de todos los anteriores) -->
    <script src="modules/app-initializer.js?v=12"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // TraitLAB v2 - Main Application (Esqueleto Limpio)
        class TraitLABv2 {
            constructor() {
                this.modules = {};
                this.currentContract = "0x6e369bf0e4e0c106192d606fb6d85836d684da75";
                this.currentFilter = null;
                this.tokensAlreadyDisplayed = false; // 🚨 NUEVO: Flag para evitar sobrescrituras
            }

            /**
             * Inicializar aplicación
             */
            async init() {
                try {
                    console.log('🚀 TraitLAB v2: Inicializando...');
                    
                    // Renderizar UI usando templates
                    this.renderUI();
                    
                    // Inicializar aplicación usando AppInitializer
                    const initializer = new window.AppInitializer(this);
                    await initializer.initialize();
                    
                    // 🚨 NUEVO: Configurar carga progresiva después de inicializar módulos
                    this.setupProgressiveLoading();
                    
                    console.log('✅ TraitLAB v2: Inicializada correctamente');
                    
                } catch (error) {
                    console.error('❌ TraitLAB v2: Error en inicialización:', error);
                }
            }

            /**
             * Renderizar interfaz de usuario
             */
            renderUI() {
                const container = document.getElementById('app-container');
                if (container) {
                    const templates = new window.UITemplates();
                    templates.renderAllTemplates(container);
                }
            }

            /**
             * 🚨 NUEVO: Configurar carga progresiva
             */
            setupProgressiveLoading() {
                console.log('🔄 Configurando carga progresiva...');
                
                // Suscribirse a eventos del módulo zero para actualizaciones progresivas
                if (this.modules.zero) {
                    // Mostrar tokens inmediatamente cuando estén listos
                    this.modules.zero.on('tokensReadyForDisplay', (data) => {
                        console.log('🎯 Tokens listos para mostrar inmediatamente:', data.tokens.length);
                        this.modules.ui.displayTokens(data.tokens, { filter: 'adrianzero' });
                        this.hideLoading();
                    });
                    
                    // Actualizar nombres progresivamente sin re-renderizar todo
                    this.modules.zero.on('customNamesProgressUpdate', (data) => {
                        console.log('📝 Actualizando nombres progresivamente:', data.updatedCount, '/', data.totalCount);
                        this.modules.ui.updateTokenNamesOnly(data.nameMap);
                    });
                    
                    // Finalizar carga progresiva
                    this.modules.zero.on('customNamesLoaded', (data) => {
                        console.log('✅ Nombres personalizados cargados completamente');
                        this.modules.ui.finalizeProgressiveLoading();
                    });
                }
                
                // 🚨 NUEVO: Escuchar eventos de tokens ERC1155 listos
                if (this.modules.dataManager) {
                    this.modules.dataManager.on('adrianLabTokensReady', ({ floppys, serums, traits }) => {
                        console.log('🎯 Tokens ERC1155 listos:', { floppys: floppys.length, serums: serums.length, traits: traits.length });
                        
                        // Actualizar display si estamos en el tab correcto
                        if (this.currentFilter === 'floppy' && floppys.length > 0) {
                            console.log('✅ Mostrando floppy tokens inmediatamente');
                            this.modules.ui.displayTokens(floppys, { filter: 'floppy' });
                            this.hideLoading();
                        } else if (this.currentFilter === 'serum' && serums.length > 0) {
                            console.log('✅ Mostrando serum tokens inmediatamente');
                            this.modules.ui.displayTokens(serums, { filter: 'serum' });
                            this.hideLoading();
                        } else if (this.currentFilter === 'traits' && traits.length > 0) {
                            console.log('✅ Mostrando trait tokens inmediatamente');
                            this.modules.ui.displayTokens(traits, { filter: 'traits' });
                            this.hideLoading();
                        }
                    });
                }
            }

            /**
             * Cargar tokens para el tab actual
             */
            async loadTokensForTab() {
                try {
                    console.log('🚀 TraitLAB v2: Cargando tokens para tab:', this.currentFilter);
                    console.log('🔍 Contrato actual:', this.currentContract);
                    
                    this.showLoading();
                    
                    // Verificar que tengamos los módulos necesarios
                    if (!this.modules.wallet || !this.modules.ui) {
                        throw new Error('Módulos wallet o UI no disponibles');
                    }
                    
                    const userAddress = this.modules.wallet.getCurrentAccount();
                    if (!userAddress) {
                        throw new Error('No hay wallet conectada');
                    }
                    
                    // Usar data-manager para obtener tokens ya filtrados
                    if (!this.modules.dataManager) {
                        throw new Error('Módulo data-manager no disponible');
                    }
                    
                    if (this.currentFilter === 'crafting') {
                        console.log('🔨 CRAFTING: Iniciando carga de crafting...');
                        console.log('🔨 CRAFTING: this.modules.crafting disponible:', !!this.modules.crafting);
                        console.log('🔨 CRAFTING: this.modules.displayManager disponible:', !!this.modules.displayManager);
                        console.log('🔨 CRAFTING: tokens-grid disponible:', !!document.getElementById('tokens-grid'));
                        
                        // Mostrar contenido de crafting
                        if (this.modules.crafting) {
                            console.log('🔨 CRAFTING: Cargando recetas...');
                            await this.modules.crafting.loadRecipes();
                            console.log('🔨 CRAFTING: Recetas cargadas, llamando displayCraftingContent...');
                            this.modules.displayManager.displayCraftingContent(
                                document.getElementById('tokens-grid'),
                                this.modules.crafting,
                                this.modules.dataManager
                            );
                            console.log('🔨 CRAFTING: displayCraftingContent llamado');
                        } else if (this.currentFilter === 'rename') {
                            // Mostrar inmediatamente AdrianZERO (ERC721) y habilitar rename en popup
                            const erc721 = this.modules.dataManager.getFilteredTokens('rename');
                            console.log('✍️ RENAME: Mostrando AdrianZERO para renombrar:', erc721.length);
                            this.modules.ui.displayTokens(erc721, { filter: 'adrianzero' });
                            this.hideLoading();
                        } else if (this.currentFilter === 'lambo') {
                            // Show AdrianZERO tokens for Lambo selection
                            const erc721 = this.modules.dataManager.getFilteredTokens('adrianzero');
                            console.log('🚗 LAMBO: Showing AdrianZERO for Lambo selection:', erc721.length);
                            this.modules.ui.displayTokens(erc721, { filter: 'adrianzero' });
                            this.hideLoading();
                        } else {
                            console.error('🔨 CRAFTING: Módulo de crafting no disponible');
                            throw new Error('Módulo de crafting no disponible');
                        }
                    } else if (this.currentFilter === 'traits') {
                        // 🎯 CASO ESPECIAL: Traits - Iniciar carga bajo demanda si es necesario
                        console.log('🎨 TRAITS: Verificando estado de carga de traits...');
                        
                        // Verificar si los traits ya están cargados
                        const filteredTokens = this.modules.dataManager.getFilteredTokens('traits');
                        console.log(`📊 Traits disponibles actualmente: ${filteredTokens.length}`);
                        
                        if (filteredTokens.length > 0) {
                            // Traits ya están cargados, mostrar inmediatamente
                            console.log('✅ Mostrando traits disponibles inmediatamente');
                            this.modules.ui.displayTokens(filteredTokens, { filter: 'traits' });
                            this.hideLoading();
                        } else {
                            // Traits no están cargados, iniciar carga bajo demanda
                            console.log('⏳ Traits no están cargados, iniciando carga bajo demanda...');
                            try {
                                // Iniciar carga de traits inmediatamente
                                await this.modules.dataManager.loadAdrianLabTokensOnDemand();
                                
                                // Intentar obtener traits nuevamente después de iniciar la carga
                                const traitsAfterLoad = this.modules.dataManager.getFilteredTokens('traits');
                                if (traitsAfterLoad.length > 0) {
                                    console.log('✅ Traits cargados, mostrando:', traitsAfterLoad.length);
                                    this.modules.ui.displayTokens(traitsAfterLoad, 'traits');
                                    this.hideLoading();
                                } else {
                                    // Los traits aún se están cargando, mostrar loading
                                    // Se mostrarán automáticamente cuando estén listos vía onTokensLoaded
                                    console.log('⏳ Traits en proceso de carga, mostrando loading...');
                                }
                            } catch (error) {
                                console.error('❌ Error iniciando carga de traits:', error);
                                this.hideLoading();
                                this.showError(`Error cargando traits: ${error.message}`);
                            }
                        }
                    } else {
                        // 🚀 MOSTRAR TOKENS PROGRESIVAMENTE (para otros tabs)
                        const filteredTokens = this.modules.dataManager.getFilteredTokens(this.currentFilter || 'adrianzero');
                        console.log(`📊 Tokens filtrados obtenidos: ${filteredTokens.length}`);
                        
                        if (filteredTokens.length > 0) {
                            console.log('✅ Mostrando tokens disponibles inmediatamente');
                            this.modules.ui.displayTokens(filteredTokens, { filter: this.currentFilter || 'adrianzero' });
                            this.hideLoading();
                        } else {
                            // Mostrar loading mientras se cargan los tokens
                            console.log('⏳ Mostrando loading mientras se cargan tokens...');
                            // El loading ya se mostró al inicio del método
                            // Los tokens se mostrarán automáticamente cuando estén listos
                            // a través del callback onTokensLoaded
                        }
                    }
                    
                } catch (error) {
                    console.error('❌ Error cargando tokens:', error);
                    this.hideLoading();
                    this.showError(`Error cargando tokens: ${error.message}`);
                }
            }

            /**
             * Mostrar loading
             */
            showLoading() {
                const loading = document.getElementById('loading');
                if (loading) loading.style.display = 'block';
            }

            /**
             * Ocultar loading
             */
            hideLoading() {
                const loading = document.getElementById('loading');
                if (loading) loading.style.display = 'none';
            }

            /**
             * Mostrar error
             */
            showError(message) {
                const error = document.getElementById('error');
                if (error) {
                    error.textContent = message;
                    error.style.display = 'block';
                }
            }

            /**
             * Mostrar éxito
             */
            showSuccess(message) {
                const success = document.getElementById('success');
                if (success) {
                    success.textContent = message;
                    success.style.display = 'block';
                }
            }

            /**
             * Limpiar tokens
             */
            clearTokens() {
                const grid = document.getElementById('tokens-grid');
                if (grid) grid.innerHTML = '';
            }

            /**
             * Manejar wallet conectada
             */
            onWalletConnected(data) {
                console.log('🔌 TraitLAB v2: Wallet conectada:', data);
                
                // ✅ ACTUALIZAR UI INMEDIATAMENTE (sin esperar carga)
                document.getElementById('connect-section').style.display = 'none';
                document.getElementById('account-section').style.display = 'block';
                document.getElementById('tokens-section').style.display = 'block';
                
                // Update wallet address
                const walletAddress = document.getElementById('walletAddress');
                if (walletAddress) {
                    walletAddress.textContent = `${data.account.substring(0, 6)}...${data.account.slice(-4)}`;
                }
                
                // 🚀 CARGAR DATOS EN BACKGROUND (no bloquea la UI)
                this.loadDataInBackground(data.account);
            }

            /**
             * Cargar datos en background sin bloquear la UI
             * IMPORTANTE: Esta función NO debe bloquear los clicks del botón Connect Wallet
             */
            async loadDataInBackground(userAddress) {
                console.log('🚀 TraitLAB v2: Iniciando carga en background...');
                
                // 🚨 CRÍTICO: Asegurar que el botón sea clickeable durante todo el proceso
                const connectBtn = document.getElementById('connectBtn');
                if (connectBtn) {
                    connectBtn.style.pointerEvents = 'auto';
                    connectBtn.style.cursor = 'pointer';
                    connectBtn.disabled = false;
                    console.log('✅ Botón Connect Wallet habilitado para clicks durante carga');
                }
                
                // NO mostrar mensaje de carga aquí - se maneja en loadTokensForTab
                
                try {
                    // 1. Iniciar DataManager en background (SECUENCIAL) - FORZAR reinicialización
                    // Usar setTimeout para no bloquear el event loop
                    if (this.modules.dataManager) {
                        console.log('📊 TraitLAB v2: Iniciando DataManager en background...');
                        
                        // Iniciar carga de forma asíncrona (no bloqueante)
                        this.modules.dataManager.init(true).then(() => {
                            console.log('📊 TraitLAB v2: DataManager cargado en background');
                            const status = this.modules.dataManager.getStatus();
                            console.log('📊 TraitLAB v2: Estado del cache:', status);
                            
                            // Esperar a que los tokens se carguen (máximo 10 segundos)
                            let attempts = 0;
                            const maxAttempts = 20; // 20 intentos * 500ms = 10 segundos máximo
                            
                            const checkTokens = async () => {
                                while (attempts < maxAttempts) {
                                    const hasAdrianZero = this.modules.dataManager.getFilteredTokens('adrianzero').length > 0;
                                    const hasAdrianLab = this.modules.dataManager.getFilteredTokens('traits').length > 0 || 
                                                       this.modules.dataManager.getFilteredTokens('floppy').length > 0;
                                    
                                    if (hasAdrianZero || hasAdrianLab) {
                                        console.log('✅ TraitLAB v2: Tokens cargados, continuando...');
                                        
                                        // Cargar tokens del contrato actual en background (DESPUÉS de DataManager)
                                        console.log('🚀 TraitLAB v2: Cargando tokens del contrato actual en background...');
                                        this.loadTokensForTab().catch(err => {
                                            console.error('❌ Error cargando tokens para tab:', err);
                                        });
                                        break;
                                    }
                                    
                                    attempts++;
                                    await new Promise(resolve => setTimeout(resolve, 500));
                                }
                                
                                if (attempts >= maxAttempts) {
                                    console.warn('⚠️ TraitLAB v2: Timeout esperando tokens, continuando de todas formas...');
                                }
                            };
                            
                            checkTokens();
                        }).catch(error => {
                            console.error('❌ TraitLAB v2: Error en DataManager:', error);
                        });
                    }
                    
                } catch (error) {
                    console.error('❌ TraitLAB v2: Error en carga en background:', error);
                    // Mostrar error pero no bloquear la UI
                    const tokensGrid = document.getElementById('tokens-grid');
                    if (tokensGrid) {
                        tokensGrid.innerHTML = `
                            <div class="error-message" style="text-align: center; padding: 20px; color: #e74c3c;">
                                <p>⚠️ Error cargando tokens</p>
                                <p style="font-size: 12px;">${error.message}</p>
                                <button onclick="window.app.loadDataInBackground('${userAddress}')" style="background: #e74c3c; color: white; border: none; padding: 5px 10px; border-radius: 3px; cursor: pointer;">Reintentar</button>
                            </div>
                        `;
                    }
                }
            }

            /**
             * Manejar wallet desconectada
             */
            onWalletDisconnected() {
                console.log('🔌 TraitLAB v2: Wallet desconectada');
                
                // 🚨 CRÍTICO: Reinicializar DataManager cuando se desconecta
                if (this.modules.dataManager) {
                    console.log('🔄 Reinicializando DataManager después de desconexión...');
                    // Limpiar cache y estado
                    this.modules.dataManager.cache.adrianZero = [];
                    this.modules.dataManager.cache.adrianLab = null;
                    this.modules.dataManager.isInitialized = false;
                    this.modules.dataManager.cache.loading.adrianZero = false;
                    this.modules.dataManager.cache.loading.adrianLab = false;
                    this.modules.dataManager.cache.ready.adrianZero = false;
                    this.modules.dataManager.cache.ready.adrianLab = false;
                }
                
                // Limpiar grid
                const tokensGrid = document.getElementById('tokens-grid');
                if (tokensGrid) {
                    tokensGrid.innerHTML = '';
                }
                
                // Update UI
                const connectSection = document.getElementById('connect-section');
                if (connectSection) {
                    connectSection.style.display = 'block';
                }
                
                // Asegurar que el botón sea clickeable
                const connectBtn = document.getElementById('connectBtn');
                if (connectBtn) {
                    connectBtn.style.pointerEvents = 'auto';
                    connectBtn.style.cursor = 'pointer';
                    connectBtn.disabled = false;
                    console.log('✅ Botón Connect Wallet habilitado después de desconexión');
                }
                document.getElementById('account-section').style.display = 'none';
                document.getElementById('tokens-section').style.display = 'none';
                
                // Clear tokens
                this.clearTokens();
            }

            /**
             * Callback para cuando se cargan tokens progresivamente
             */
            onTokensLoaded({ tokens, filter }) {
                console.log('🚀 TraitLAB v2: Tokens cargados progresivamente:', { 
                    count: tokens.length, 
                    filter 
                });
                
                // Si estamos en el tab correcto, mostrar los tokens inmediatamente
                if (this.currentFilter === filter) {
                    console.log('✅ Mostrando tokens cargados progresivamente para tab:', filter);
                    this.modules.ui.displayTokens(tokens, filter);
                    this.hideLoading();
                } else {
                    console.log('⚠️ Saltando onTokensLoaded - Tab actual no coincide:', this.currentFilter, 'vs', filter);
                }
            }
        }

        // Inicializar aplicación cuando el DOM esté listo
        document.addEventListener('DOMContentLoaded', async () => {
            console.log('🚀 TraitLAB v2: DOM listo, inicializando...');
            
            // Crear instancia global
            window.app = new TraitLABv2();
            
            // Delay adicional para WalletConnect
            if (window.ethereum && (
                window.ethereum.isWalletConnect || 
                window.ethereum.isWalletConnect === true ||
                (window.ethereum.provider && window.ethereum.provider.isWalletConnect) ||
                window.ethereum.connector ||
                window.ethereum.wc
            )) {
                console.log('🚀 WalletConnect detectado, añadiendo delay de inicialización...');
                await new Promise(resolve => setTimeout(resolve, 2000));
            }
            
            // Inicializar
            await window.app.init();
        });
    </script>
</body>
</html>
