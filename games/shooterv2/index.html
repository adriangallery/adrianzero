<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Target Rush - Game & Watch Edition</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="target-rush-game" class="game-watch-container">
        <div class="info-bar">
            <div class="info-readout">
                <span>SCORE <span id="score">0</span></span>
                <span>WAVE <span id="wave">1</span></span>
                <span>LIVES <span id="lives">3</span></span>
            </div>
        </div>

        <div id="screen-area" class="screen-area">
            <canvas id="gameCanvas" width="480" height="640"></canvas>
        </div>

        <div class="control-panel">
            <button class="btn-control" data-action="start">START</button>
            <button class="btn-control" data-action="reset">RESET</button>
        </div>
    </div>
    
    <script type="module">
        import game from './game.js';
        
        window.addEventListener('DOMContentLoaded', () => {
            window.gameInstance = game;
            console.log('Game instance created:', window.gameInstance);
            
            if (typeof game.init === 'function') {
                game.init();
            } else {
                console.error('Game initialization function not found');
            }
            
            const canvas = document.getElementById('gameCanvas');
            if (canvas) {
                canvas.addEventListener('click', (event) => {
                    if (typeof game.handleClick === 'function') {
                        game.handleClick(event);
                    }
                });
            }

            // Wait a bit for everything to be ready
            setTimeout(() => {
                const controlPanel = document.querySelector('.control-panel');
                const startBtn = document.querySelector('button[data-action="start"]');
                const resetBtn = document.querySelector('button[data-action="reset"]');
                
                console.log('Control panel:', controlPanel);
                console.log('Start button:', startBtn);
                console.log('Reset button:', resetBtn);
                console.log('Game instance:', window.gameInstance);
                console.log('Has startGame?', typeof window.gameInstance?.startGame);
                
                if (controlPanel) {
                    console.log('Control panel found, setting up listeners');
                    
                    // Add click listener to control panel
                    controlPanel.addEventListener('click', (event) => {
                        console.log('Control panel clicked!', event.target, event.currentTarget);
                        event.stopPropagation();
                        const button = event.target.closest('button[data-action]');
                        if (!button) {
                            console.log('No button found in event.target.closest');
                            return;
                        }
                        if (!window.gameInstance) {
                            console.log('Game instance not found');
                            return;
                        }

                        const action = button.getAttribute('data-action');
                        console.log('Button action:', action);
                        if (action === 'start' && typeof window.gameInstance.startGame === 'function') {
                            console.log('Starting game...');
                            window.gameInstance.startGame();
                        } else if (action === 'reset' && typeof window.gameInstance.resetGame === 'function') {
                            console.log('Resetting game...');
                            window.gameInstance.resetGame();
                        }
                    }, true); // Use capture phase
                } else {
                    console.error('Control panel not found!');
                }
                
                // Also add direct button listeners as backup
                if (startBtn) {
                    console.log('Adding direct listener to START button');
                    startBtn.addEventListener('click', (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        console.log('START button clicked directly!');
                        console.log('Game instance:', window.gameInstance);
                        if (window.gameInstance && typeof window.gameInstance.startGame === 'function') {
                            console.log('Calling startGame...');
                            window.gameInstance.startGame();
                        } else {
                            console.error('Cannot start game - instance or method missing');
                        }
                    }, true);
                } else {
                    console.error('START button not found!');
                }
                
                if (resetBtn) {
                    console.log('Adding direct listener to RESET button');
                    resetBtn.addEventListener('click', (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        console.log('RESET button clicked directly!');
                        if (window.gameInstance && typeof window.gameInstance.resetGame === 'function') {
                            console.log('Calling resetGame...');
                            window.gameInstance.resetGame();
                        } else {
                            console.error('Cannot reset game - instance or method missing');
                        }
                    }, true);
                } else {
                    console.error('RESET button not found!');
                }
            }, 100);
        });
    </script>
</body>
</html>
