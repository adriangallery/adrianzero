<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdrianREWARDS - OG Holders Rewards</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <script src="config.js"></script>
    <link rel="icon" href="../components/images/adrianzero.png">
    <style>
        @font-face {
            font-family: 'ADRIAN_ZERO_FONT';
            src: url('../components/fonts/ADRIAN_ZERO.otf') format('opentype');
            font-display: swap;
        }
    </style>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'VT323', monospace;
            background: #1a1a1a;
            min-height: 100vh;
            color: #fff;
        }

        /* Menu */
        #menu-container {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
        }

        #menu-container .navbar {
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid #00ff88;
            font-family: 'VT323', monospace;
        }

        #menu-container .navbar-nav .nav-link {
            color: #cccccc !important;
            font-weight: bold;
            font-size: 1.1rem;
            transition: all 0.3s ease;
        }

        #menu-container .navbar-nav .nav-link:hover {
            color: #00ff88 !important;
            text-shadow: 0 0 10px #00ff88;
        }

        #menu-container .navbar-toggler {
            border-color: #00ff88;
        }

        #menu-container .navbar-toggler-icon {
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3e%3cpath stroke='rgba(0, 255, 136, 1)' stroke-linecap='round' stroke-miterlimit='10' stroke-width='2' d='M4 7h22M4 15h22M4 23h22'/%3e%3c/svg%3e");
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            padding-top: 80px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            color: white;
        }

        .header h1 {
            font-family: 'ADRIAN_ZERO_FONT', 'VT323', monospace;
            font-size: 4.8rem;
            margin-bottom: 5px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header h1 .adrian {
            color: #ffffff;
            font-family: 'ADRIAN_ZERO_FONT', 'VT323', monospace;
        }

        .header h1 .rewards {
            color: #ff6b35;
            font-family: 'ADRIAN_ZERO_FONT', 'VT323', monospace;
        }

        .header .subtitle {
            font-size: 1.45rem;
            color: #cccccc;
            margin-bottom: 20px;
            font-family: 'VT323', monospace;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.3rem;
            opacity: 0.9;
            color: #aaaaaa;
        }

        .connect-section {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin-bottom: 30px;
            border: 1px solid #333;
        }

        .connect-btn {
            background: linear-gradient(45deg, #ff6b35, #ff8c42);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.1rem;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            font-family: 'VT323', monospace;
        }

        .connect-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }

        .account-section {
            display: none;
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin-bottom: 30px;
            border: 1px solid #333;
        }

        .account-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .account-address {
            font-size: 1.1rem;
            color: #00ff88;
            font-family: 'VT323', monospace;
        }

        .punk-count {
            font-size: 1.2rem;
            color: #ff6b35;
            font-weight: bold;
        }

        .rewards-section {
            display: none;
            background: rgba(255, 255, 255, 0.05);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin-bottom: 30px;
            border: 1px solid #333;
        }

        .rewards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
        }

        .reward-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 25px;
            border: 2px solid #333;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            max-width: 400px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
        }

        .reward-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            border-color: #ff6b35;
        }

        .reward-card.active {
            border-color: #00ff88;
            background: rgba(0, 255, 136, 0.1);
        }

        .reward-card.claimed {
            border-color: #666;
            background: rgba(102, 102, 102, 0.1);
            opacity: 0.7;
        }

        .reward-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .reward-title {
            font-size: 1.4rem;
            color: #fff;
            font-weight: bold;
        }

        .reward-status {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
        }

        .status-active {
            background: #00ff88;
            color: #000;
        }

        .status-inactive {
            background: #666;
            color: #fff;
        }

        .status-claimed {
            background: #ff6b35;
            color: #fff;
        }

        .reward-details {
            margin-bottom: 20px;
        }

        .reward-detail {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 1rem;
        }

        .reward-detail-label {
            color: #ccc;
        }

        .reward-detail-value {
            color: #fff;
            font-weight: bold;
        }

        .reward-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .claim-btn {
            background: linear-gradient(45deg, #00ff88, #00cc66);
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-family: 'VT323', monospace;
            font-size: 1rem;
            font-weight: bold;
            transition: all 0.3s ease;
            flex: 1;
            min-width: 120px;
        }

        .claim-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 255, 136, 0.3);
        }

        .claim-btn:disabled {
            background: #666;
            color: #999;
            cursor: not-allowed;
        }

        .batch-claim-btn {
            background: linear-gradient(45deg, #ff6b35, #ff8c42);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-family: 'VT323', monospace;
            font-size: 1rem;
            font-weight: bold;
            transition: all 0.3s ease;
            flex: 1;
            min-width: 120px;
        }

        .batch-claim-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 107, 53, 0.3);
        }

        .batch-claim-btn:disabled {
            background: #666;
            color: #999;
            cursor: not-allowed;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            color: #00ff88;
            font-size: 1.2rem;
        }

        .loading-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .loading-spinner {
            font-size: 1.5rem;
            animation: spin 1s linear infinite;
        }

        .loading-text {
            font-size: 1rem;
            color: #00ff88;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-state {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #ffaa00;
            font-size: 0.9rem;
        }

        .user-status {
            color: #00ff88;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .reward-image {
            width: 100%;
            height: 200px;
            overflow: hidden;
            border-radius: 10px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.2);
        }

        .reward-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 10px;
        }

        .reward-info {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .reward-stats {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
            font-size: 0.9rem;
            color: #ccc;
        }

        .campaign-actions {
            margin-top: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .claim-btn, .batch-claim-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .claim-btn {
            background: linear-gradient(45deg, #00ff88, #00cc6a);
            color: #000;
        }

        .claim-btn:hover:not(:disabled) {
            background: linear-gradient(45deg, #00cc6a, #00aa55);
            transform: translateY(-2px);
        }

        .claim-btn:disabled {
            background: #666;
            color: #999;
            cursor: not-allowed;
        }

        .batch-claim-btn {
            background: linear-gradient(45deg, #ff6b35, #ff8c42);
            color: #fff;
        }

        .batch-claim-btn:hover {
            background: linear-gradient(45deg, #ff8c42, #ffa500);
            transform: translateY(-2px);
        }

        .error {
            background: rgba(255, 0, 0, 0.1);
            border: 1px solid #ff0000;
            color: #ff0000;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            display: none;
        }

        .success {
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid #00ff88;
            color: #00ff88;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            display: none;
        }

        .punk-list {
            max-height: 200px;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 10px;
            margin-top: 10px;
        }

        .punk-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 0;
            border-bottom: 1px solid #333;
        }

        .punk-item:last-child {
            border-bottom: none;
        }

        .punk-id {
            color: #00ff88;
            font-weight: bold;
        }

        .punk-status {
            font-size: 0.9rem;
        }

        .status-available {
            color: #00ff88;
        }

        .status-claimed {
            color: #ff6b35;
        }

        /* Desktop: 4 cards per row */
        @media (min-width: 1200px) {
            .rewards-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        /* Tablet: 2-3 cards per row */
        @media (min-width: 768px) and (max-width: 1199px) {
            .rewards-grid {
                grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            }
        }

        /* Mobile: 1 card per row */
        @media (max-width: 767px) {
            .header h1 {
                font-size: 3rem;
            }
            
            .rewards-grid {
                grid-template-columns: 1fr;
                padding: 0 10px;
            }
            
            .reward-card {
                max-width: 100%;
                margin: 0;
            }
            
            .account-info {
                flex-direction: column;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div id="menu-container"></div>
    <div class="container">
        <div class="header">
            <h1><span class="adrian">Adrian</span><span class="rewards">REWARDS</span></h1>
            <p class="subtitle">Rewards for AdrianPunks holders</p>
            <p>Claim your rewards based on your OG tokens</p>
        </div>

        <!-- Connect Section -->
        <div class="connect-section" id="connectSection">
            <h3>Connect your wallet to start</h3>
            <p>You need to have AdrianPunks to claim rewards</p>
            <button class="connect-btn" onclick="connectWallet()">Connect Wallet</button>
        </div>

        <!-- Account Section -->
        <div class="account-section" id="accountSection">
            <div class="account-info">
                <div>
                    <strong>Account:</strong>
                    <span class="account-address" id="accountAddress"></span>
                </div>
                <div>
                    <strong>AdrianPunks:</strong>
                    <span class="punk-count" id="punkCount">0</span>
                </div>
            </div>
        </div>

        <!-- Loading -->
        <div class="loading" id="loading">
            <div class="spinner-border text-success" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p>Loading rewards...</p>
        </div>

        <!-- Error Message -->
        <div class="error" id="errorMessage"></div>

        <!-- Success Message -->
        <div class="success" id="successMessage"></div>

        <!-- Rewards Section -->
        <div class="rewards-section" id="rewardsSection">
            <h3>Available Rewards</h3>
            <p>Select a campaign to view details and claim</p>
            <div class="rewards-grid" id="rewardsGrid">
                <!-- Rewards will be loaded here -->
            </div>
        </div>
    </div>

    <script>
        // Contract addresses and ABIs from config
        const REWARDS_CONTRACT = window.RewardsConfig.REWARDS_CONTRACT;
        const PUNKS_CONTRACT = window.RewardsConfig.PUNKS_CONTRACT;
        const TRAITS_CORE_CONTRACT = window.RewardsConfig.TRAITS_CORE_CONTRACT;
        const REWARDS_ABI = window.RewardsConfig.REWARDS_ABI;
        const PUNKS_ABI = window.RewardsConfig.PUNKS_ABI;

        // Global variables
        let provider;
        let signer;
        let rewardsContract;
        let punksContract;
        let currentAccount;
        let userPunks = [];
        let campaigns = [];

        // Generate image URL for reward asset using AdrianLAB ERC1155
        function getRewardImageUrl(assetId) {
            // Use AdrianLAB ERC1155 contract for reward images
            // Pattern: https://adrianlab.vercel.app/api/render/floppy/{assetId}
            const imageUrl = `https://adrianlab.vercel.app/api/render/floppy/${assetId}`;
            console.log(`🖼️ Generating reward image URL for asset ${assetId}:`, imageUrl);
            return imageUrl;
        }

        // Load campaign data from JSON file
        async function loadCampaignData() {
            try {
                const response = await fetch('./campaigns.json');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                console.log('📋 Campaign data loaded:', data);
                return data.campaigns;
            } catch (error) {
                console.warn('⚠️ Error loading campaign data:', error);
                return [];
            }
        }

        // Retry contract call with limited retries and longer delays
        async function retryContractCall(contractCall, maxRetries = 2, baseDelay = 3000) {
            let lastError;
            
            for (let attempt = 1; attempt <= maxRetries; attempt++) {
                try {
                    console.log(`🔄 Attempt ${attempt}/${maxRetries} - Contract call`);
                    const result = await contractCall();
                    console.log(`✅ Contract call successful on attempt ${attempt}`);
                    return result;
                } catch (error) {
                    lastError = error;
                    console.warn(`❌ Attempt ${attempt}/${maxRetries} failed:`, error.message);
                    
                    // Only retry for specific RPC errors, not for all errors
                    if (attempt < maxRetries && 
                        (error.message && error.message.includes('state histories haven\'t been fully indexed yet')) ||
                        error.code === 'CALL_EXCEPTION' || error.code === -32603) {
                        
                        console.log(`⏳ Waiting ${baseDelay}ms before retry...`);
                        await new Promise(resolve => setTimeout(resolve, baseDelay));
                    } else {
                        // For other errors or max retries reached, don't retry
                        throw error;
                    }
                }
            }
            
            // If we get here, all retries failed
            console.error(`❌ All ${maxRetries} attempts failed`);
            throw lastError;
        }

        // Initialize the app with progressive loading
        async function init() {
            try {
                // Verificar que la configuración esté cargada
                if (typeof window.RewardsConfig === 'undefined') {
                    throw new Error('RewardsConfig not loaded');
                }

                // FASE 1: Cargar campañas básicas inmediatamente
                console.log('🚀 PHASE 1: Loading basic campaigns...');
                showLoading(true, '📋 Loading campaigns...');
                await loadCampaignsBasic();
                renderCampaignsBasic();
                showLoading(false);
                console.log('✅ PHASE 1: Campaigns displayed');

                // Verificar si hay datos en caché para mostrar inmediatamente
                const cachedData = window.RewardsConfig.getCachedData();
                if (cachedData && cachedData.userPunks && cachedData.currentAccount) {
                    console.log('📦 Usando datos en caché para display inmediato');
                    userPunks = cachedData.userPunks;
                    currentAccount = cachedData.currentAccount;
                    showAccountSection();
                    await updateCampaignsWithUserData();
                    renderCampaignsComplete();
                }

                // FASE 2: Cargar datos de usuario en background
                if (typeof window.ethereum !== 'undefined') {
                    console.log('🚀 FASE 2: Conectando wallet y cargando datos de usuario...');
                    showLoading(true, '🔗 Conectando wallet...');
                    
                    // Usar Web3Provider solo para transacciones
                    provider = await window.RewardsConfig.getWriteProvider();
                    signer = provider.getSigner();
                    currentAccount = await signer.getAddress();
                    
                    // Inicializar contrato de recompensas (para transacciones)
                    rewardsContract = new ethers.Contract(REWARDS_CONTRACT, REWARDS_ABI, signer);
                    
                    showAccountSection();
                    
                    // Cargar punks y actualizar campañas progresivamente
                    await loadUserPunksAndUpdateCampaigns();
                    showLoading(false);
                    console.log('✅ FASE 2: Datos de usuario cargados');
                } else {
                    showError('MetaMask is not installed. Please install MetaMask to continue.');
                }
            } catch (error) {
                console.error('Error initializing app:', error);
                showError('Error: ' + error.message);
                showLoading(false);
            }
        }

        // Connect wallet
        async function connectWallet() {
            try {
                if (typeof window.ethereum !== 'undefined') {
                    await window.ethereum.request({ method: 'eth_requestAccounts' });
                    await init();
                } else {
                    showError('MetaMask is not installed. Please install MetaMask to continue.');
                }
            } catch (error) {
                console.error('Error connecting wallet:', error);
                showError('Error connecting wallet: ' + error.message);
            }
        }

        // Show account section
        function showAccountSection() {
            document.getElementById('connectSection').style.display = 'none';
            document.getElementById('accountSection').style.display = 'block';
            document.getElementById('rewardsSection').style.display = 'block';
            document.getElementById('accountAddress').textContent = currentAccount;
        }

        // Load user punks and update campaigns progressively
        async function loadUserPunksAndUpdateCampaigns() {
            try {
                // 1. Cargar punks
                console.log('👥 Loading user punks...');
                showLoading(true, '👥 Loading your punks...');
                await loadUserPunks();
                
                // 2. Actualizar campañas con datos de usuario
                console.log('✅ Updating campaigns with user data...');
                showLoading(true, '✅ Verifying rewards...');
                await updateCampaignsWithUserData();
                
                // 3. Re-renderizar con datos completos
                renderCampaignsComplete();
                showLoading(false);
                console.log('🎉 Carga progresiva completada');
                
            } catch (error) {
                console.error('Error loading user data:', error);
                showError('Error cargando datos de usuario: ' + error.message);
                showLoading(false);
            }
        }

        // Load user's AdrianPunks with Alchemy RPC
        async function loadUserPunks() {
            try {
                showLoading(true);
                
                // Usar Alchemy RPC para lecturas (más confiable)
                const readProvider = window.RewardsConfig.getReadProvider();
                const punksContract = new ethers.Contract(PUNKS_CONTRACT, PUNKS_ABI, readProvider);
                
                // Retry logic for balanceOf call
                const balance = await retryContractCall(() => punksContract.balanceOf(currentAccount));
                const punkCount = balance.toNumber();
                
                document.getElementById('punkCount').textContent = punkCount;
                
                userPunks = [];
                for (let i = 0; i < punkCount; i++) {
                    // Retry logic for each tokenOfOwnerByIndex call
                    const tokenId = await retryContractCall(() => punksContract.tokenOfOwnerByIndex(currentAccount, i));
                    userPunks.push(tokenId.toNumber());
                }
                
                console.log('User punks loaded:', userPunks);
                
                // Guardar en caché
                const cachedData = window.RewardsConfig.getCachedData() || {};
                window.RewardsConfig.setCachedData({
                    ...cachedData,
                    userPunks: userPunks,
                    currentAccount: currentAccount
                });
                
            } catch (error) {
                console.error('Error loading user punks:', error);
                
                // Intentar usar datos en caché
                const cachedData = window.RewardsConfig.getCachedData();
                if (cachedData && cachedData.userPunks) {
                    userPunks = cachedData.userPunks;
                    document.getElementById('punkCount').textContent = userPunks.length;
                    showError('⚠️ Usando datos en caché debido a problemas de red');
                } else {
                // Check if it's a state indexing error
                    if (error.message && error.message.includes('historical state')) {
                    showError('⏳ La red está sincronizando. Por favor espera unos minutos y recarga la página.');
                } else {
                    showError('Error loading AdrianPunks: ' + error.message);
                    }
                }
            } finally {
                showLoading(false);
            }
        }

        // Load campaigns basic data (without user-specific data)
        async function loadCampaignsBasic() {
            try {
                console.log('📋 Loading basic campaigns data...');
                
                // Load campaign metadata from JSON
                const campaignMetadata = await loadCampaignData();
                
                // Usar Alchemy RPC para lecturas (más confiable)
                const readProvider = window.RewardsConfig.getReadProvider();
                const readRewardsContract = new ethers.Contract(REWARDS_CONTRACT, REWARDS_ABI, readProvider);
                
                // Get current campaign ID from contract with retry
                const currentCampaignId = await retryContractCall(() => readRewardsContract.currentCampaignId());

        // Update campaigns with user data progressively
        async function updateCampaignsWithUserData() {
            try {
                console.log('🔄 Actualizando campañas con datos de usuario...');
                const readProvider = window.RewardsConfig.getReadProvider();
                const readRewardsContract = new ethers.Contract(REWARDS_CONTRACT, REWARDS_ABI, readProvider);
                
                // Procesar campañas en paralelo para mejor rendimiento
                const campaignUpdates = campaigns.map(async (campaign) => {
                    try {
                        console.log(`🔄 Processing campaign ${campaign.id}...`);
                        
                        // Verificar claims en lote (más eficiente que uno por uno)
                        const claimsData = await Promise.all(
                            userPunks.map(punkId => 
                                readRewardsContract.hasClaimed(campaign.id, punkId)
                                    .then(hasClaimed => ({ punkId, hasClaimed }))
                                    .catch(() => ({ punkId, hasClaimed: false }))
                            )
                        );
                        
                        // Filtrar punks que pueden reclamar
                        const userPunksForCampaign = claimsData
                            .filter(data => !data.hasClaimed)
                            .map(data => data.punkId);
                        
                        // Actualizar campaña
                        campaign.userPunks = userPunksForCampaign;
                        campaign.canClaim = userPunksForCampaign.length > 0;
                        campaign.loading = false;
                        campaign.userDataLoaded = true;
                        
                        console.log(`✅ Campaign ${campaign.id}: ${userPunksForCampaign.length} punks available`);
                        
                        // Actualizar UI inmediatamente para esta campaña
                        updateCampaignCard(campaign);
                        
                    } catch (error) {
                        console.warn(`⚠️ Error actualizando campaña ${campaign.id}:`, error);
                        campaign.loading = false;
                        campaign.userDataLoaded = false;
                        updateCampaignCard(campaign);
                    }
                });
                
                // Esperar a que todas las campañas se actualicen
                await Promise.all(campaignUpdates);
                
                // Guardar en caché
                const cachedData = window.RewardsConfig.getCachedData() || {};
                window.RewardsConfig.setCachedData({
                    ...cachedData,
                    campaigns: campaigns,
                    userPunks: userPunks,
                    currentAccount: currentAccount
                });
                
                console.log('✅ Todas las campañas actualizadas con datos de usuario');
                
            } catch (error) {
                console.error('Error updating campaigns with user data:', error);
                throw error;
            }
        }

        // Claim selected punks
        async function claimSelectedPunks(campaignId) {
            const selectedPunks = Array.from(document.querySelectorAll(`#punk-list-${campaignId} .punk-checkbox:checked`))
                .map(checkbox => parseInt(checkbox.dataset.punkId));
            
            if (selectedPunks.length === 0) {
                showError('Please select at least one punk to claim');
                return;
            }

            try {
                showLoading(true, `Claiming rewards for ${selectedPunks.length} punks...`);
                
                console.log(`Claiming reward for campaign ${campaignId} with selected punks:`, selectedPunks);
                
                // Use batchClaim for selected punks only

                console.log('Transaction sent:', tx.hash);
                
                showSuccess('Transaction sent. Waiting for confirmation...');
                
                // Wait for transaction confirmation
                const receipt = await tx.wait();
                console.log('Transaction confirmed:', receipt);
                
                showSuccess(`Successfully claimed rewards for ${selectedPunks.length} punks!`);
                
                // Refresh the punk list
                await showPunkList(campaignId);
                
                // Refresh campaigns data
                await updateCampaignsWithUserData();
                renderCampaignsComplete();
                
            } catch (error) {
                console.error('Error claiming selected punks:', error);
                
                let errorMessage = 'Error claiming reward: ';
                if (error.code === 4001) {
                    errorMessage += 'Transaction rejected by user.';
                } else if (error.message && error.message.includes('Already claimed')) {
                    errorMessage += 'You have already claimed this reward.';
                } else if (error.message && error.message.includes('Not token owner')) {
                    errorMessage += 'You are not the owner of these tokens.';
                } else if (error.message && error.message.includes('Campaign not active')) {
                    errorMessage += 'Campaign is not active.';
                } else if (error.message && error.message.includes('Exceeds max supply')) {
                    errorMessage += 'Exceeds maximum supply.';
                } else {
                    errorMessage += error.message;
                }
                
                showError(errorMessage);
            } finally {
                showLoading(false);
            }
        }

                    errorMessage += 'Transaction rejected by user.';
                } else if (error.message && error.message.includes('Already claimed')) {

                } else if (error.message && error.message.includes('Not token owner')) {
                    errorMessage += 'You are not the owner of these tokens.';
                } else if (error.message && error.message.includes('Campaign not active')) {

                showError(errorMessage);

        // Batch claim for selected punks
        async function batchClaim(campaignId, punkIds) {
            try {
                if (punkIds.length === 0) {
                    showError('Select at least one Punk to claim');
                    return;
                }

                showLoading(true);
                
                console.log(`Batch claiming reward for campaign ${campaignId} with punks:`, punkIds);
                
                // Use batchClaim for selected punks
                const tx = await rewardsContract.batchClaim(campaignId, punkIds);
                console.log('Transaction sent:', tx.hash);
                
                showSuccess('Transaction sent. Waiting for confirmation...');
                
                // Wait for transaction confirmation
                const receipt = await tx.wait();
                console.log('Transaction confirmed:', receipt);
                
                showSuccess(`Reward claimed successfully! ${punkIds.length} tokens processed. TX: ${tx.hash}`);
                
                // Reload campaigns to update totalClaimed
                await loadCampaigns();
                
            } catch (error) {
                console.error('Error batch claiming:', error);
                
                let errorMessage = 'Error claiming reward: ';
                if (error.code === 4001) {
                    errorMessage += 'Transaction rejected by user.';
                } else if (error.message && error.message.includes('Already claimed')) {
                    errorMessage += 'You have already claimed this reward.';
                } else if (error.message && error.message.includes('Not token owner')) {
                    errorMessage += 'You are not the owner of these tokens.';
                } else if (error.message && error.message.includes('Campaign not active')) {
                    errorMessage += 'Campaign is not active.';
                } else if (error.message && error.message.includes('Exceeds max supply')) {
                    errorMessage += 'Exceeds max supply. The reward asset may be sold out.';
                } else {
                    errorMessage += error.message;
                }
                
                showError(errorMessage);
            } finally {
                showLoading(false);
            }
        }

        // Show loading with custom message
        function showLoading(show, message = 'Loading...') {
            const loadingDiv = document.getElementById('loading');
            if (show) {
                loadingDiv.innerHTML = `
                    <div class="loading-content">
                        <div class="loading-spinner">⏳</div>
                        <div class="loading-text">${message}</div>
                    </div>
                `;
                loadingDiv.style.display = 'block';
            } else {
                loadingDiv.style.display = 'none';
            }
        }

        // Show error message
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 8000);
        }

        // Show success message
        function showSuccess(message) {
            const successDiv = document.getElementById('successMessage');
            successDiv.textContent = message;
            successDiv.style.display = 'block';
            setTimeout(() => {
                successDiv.style.display = 'none';
            }, 5000);
        }


        // Initialize when page loads
        window.addEventListener('load', () => {
            if (typeof window.ethereum !== 'undefined') {
                init();
            }
        });

        // Listen for account changes
        if (typeof window.ethereum !== 'undefined') {
            window.ethereum.on('accountsChanged', (accounts) => {
                if (accounts.length === 0) {
                    location.reload();
                } else {
                    init();
                }
            });
        }

        // Load menu
        fetch('../components/menu.html')
            .then(response => response.text())
            .then(html => {
                document.getElementById('menu-container').innerHTML = html;
                const s = document.createElement('script');
                s.src = '../components/menu.js';
                document.head.appendChild(s);
            })
            .catch(error => console.error('Error loading menu:', error));
    </script>
</body>
</html>
