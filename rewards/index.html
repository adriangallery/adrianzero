<body>

        </div>

        <!-- Account Section -->

        <!-- Loading -->

        <!-- Rewards Section -->

            <h3>Available Rewards</h3>

                <!-- Rewards will be loaded here -->

    <script>
        // Contract addresses and ABIs from config
        const REWARDS_CONTRACT = window.RewardsConfig.REWARDS_CONTRACT;
        const PUNKS_CONTRACT = window.RewardsConfig.PUNKS_CONTRACT;
        const TRAITS_CORE_CONTRACT = window.RewardsConfig.TRAITS_CORE_CONTRACT;
        const REWARDS_ABI = window.RewardsConfig.REWARDS_ABI;
        const PUNKS_ABI = window.RewardsConfig.PUNKS_ABI;

        // Global variables
        let provider;
        let signer;
        let rewardsContract;
        let punksContract;
        let currentAccount;
        let userPunks = [];
        let campaigns = [];

        // Multicall configuration - Multicall3 contract address (same on all chains)
        // Use lowercase address and let ethers calculate the correct checksum
        const MULTICALL_ADDRESS_RAW = '0xca11bde05977b3631167028862be2a1752a10533'; // Multicall3 on Base Mainnet (lowercase)
        
        // Function to get normalized Multicall address (lazy initialization to avoid checksum errors)
        function getMulticallAddress() {
            if (typeof ethers === 'undefined' || !ethers.utils) {
                throw new Error('Ethers library not loaded');
            }
            // Use lowercase address - ethers will calculate the correct checksum
            return ethers.utils.getAddress(MULTICALL_ADDRESS_RAW.toLowerCase());
        }
        
        // Multicall3 ABI (only the functions we need)
        const MULTICALL_ABI = [
            "function aggregate3(tuple(address target, bool allowFailure, bytes callData)[] calls) public view returns (tuple(bool success, bytes returnData)[] returnData)"
        ];

        /**
         * Batch load user punks using multicall (optimized)
         * Divides into smaller batches if there are many punks to avoid rate limits
         */
        async function batchGetUserPunks(userAddress) {
            try {
                console.log('🚀 Loading user punks with multicall...');
                const readProvider = window.RewardsConfig.getReadProvider();
                const punksContract = new ethers.Contract(PUNKS_CONTRACT, PUNKS_ABI, readProvider);
                
                // First get balance
                const balance = await retryContractCall(() => punksContract.balanceOf(userAddress));
                const punkCount = balance.toNumber();
                
                if (punkCount === 0) {
                    return [];
                }
                
                console.log(`📦 Loading ${punkCount} punks with multicall...`);
                
                // Create multicall contract with normalized address
                const multicallContract = new ethers.Contract(getMulticallAddress(), MULTICALL_ABI, readProvider);
                
                // If there are many punks, divide into batches to avoid rate limits
                const BATCH_SIZE = 50; // Process 50 punks at a time
                const allPunks = [];
                
                if (punkCount <= BATCH_SIZE) {
                    // Small batch, process all at once
                    const calls = [];
                    for (let i = 0; i < punkCount; i++) {
                        const callData = punksContract.interface.encodeFunctionData('tokenOfOwnerByIndex', [userAddress, i]);
                        calls.push({
                            target: PUNKS_CONTRACT,
                            allowFailure: false,
                            callData: callData
                        });
                    }
                    
                    // Execute multicall with retry
                    const results = await retryContractCall(() => multicallContract.aggregate3(calls));
                    
                    // Decode results
                    const punks = results.map((result, index) => {
                        if (!result.success) {
                            throw new Error(`Multicall failed for index ${index}`);
                        }
                        const decoded = punksContract.interface.decodeFunctionResult('tokenOfOwnerByIndex', result.returnData);
                        return decoded[0].toNumber();
                    });
                    
                    allPunks.push(...punks);
                } else {
                    // Large batch, process in chunks
                    console.log(`📦 Processing ${punkCount} punks in batches of ${BATCH_SIZE}...`);
                    
                    for (let startIndex = 0; startIndex < punkCount; startIndex += BATCH_SIZE) {
                        const endIndex = Math.min(startIndex + BATCH_SIZE, punkCount);
                        const batchNum = Math.floor(startIndex / BATCH_SIZE) + 1;
                        const totalBatches = Math.ceil(punkCount / BATCH_SIZE);
                        
                        console.log(`📦 Batch ${batchNum}/${totalBatches}: Loading punks ${startIndex + 1}-${endIndex}...`);
                        
                        const calls = [];
                        for (let i = startIndex; i < endIndex; i++) {
                            const callData = punksContract.interface.encodeFunctionData('tokenOfOwnerByIndex', [userAddress, i]);
                            calls.push({
                                target: PUNKS_CONTRACT,
                                allowFailure: false,
                                callData: callData
                            });
                        }
                        
                        try {
                            // Execute multicall with retry
                            const results = await retryContractCall(() => multicallContract.aggregate3(calls));
                            
                            // Decode results
                            const punks = results.map((result, index) => {
                                if (!result.success) {
                                    throw new Error(`Multicall failed for index ${startIndex + index}`);
                                }
                                const decoded = punksContract.interface.decodeFunctionResult('tokenOfOwnerByIndex', result.returnData);
                                return decoded[0].toNumber();
                            });
                            
                            allPunks.push(...punks);
                            console.log(`✅ Batch ${batchNum}/${totalBatches} complete: ${punks.length} punks loaded`);
                            
                            // Add small delay between batches to avoid rate limiting
                            if (endIndex < punkCount) {
                                await new Promise(resolve => setTimeout(resolve, 200));
                            }
                        } catch (batchError) {
                            console.error(`❌ Batch ${batchNum}/${totalBatches} failed:`, batchError);
                            // If it's a rate limit error, wait longer before continuing
                            if (batchError.message && batchError.message.includes('429')) {
                                console.log('⏳ Rate limited, waiting 5 seconds before next batch...');
                                await new Promise(resolve => setTimeout(resolve, 5000));
                            }
                            throw batchError;
                        }
                    }
                }
                
                console.log(`✅ Loaded ${allPunks.length} punks with multicall`);
                return allPunks;
                
            } catch (error) {
                console.error('Error in batchGetUserPunks:', error);
                throw error;
            }
        }

        /**
         * Batch check claims for multiple punks in a campaign using multicall (optimized)
         */
        async function batchCheckClaims(campaignId, punkIds) {
            try {
                if (punkIds.length === 0) {
                    return punkIds.map(punkId => ({ punkId, hasClaimed: false }));
                }
                
                console.log(`🚀 Checking ${punkIds.length} claims for campaign ${campaignId} with multicall...`);
                
                const readProvider = window.RewardsConfig.getReadProvider();
                const rewardsContract = new ethers.Contract(REWARDS_CONTRACT, REWARDS_ABI, readProvider);
                const multicallContract = new ethers.Contract(getMulticallAddress(), MULTICALL_ABI, readProvider);
                
                // Prepare calls for multicall
                const calls = punkIds.map(punkId => {
                    const callData = rewardsContract.interface.encodeFunctionData('hasClaimed', [campaignId, punkId]);
                    return {
                        target: REWARDS_CONTRACT,
                        allowFailure: true, // Allow individual failures
                        callData: callData
                    };
                });
                
                // Execute multicall with retry
                const results = await retryContractCall(() => multicallContract.aggregate3(calls));
                
                // Decode results and map to punkIds
                const claimsData = punkIds.map((punkId, index) => {
                    const result = results[index];
                    let hasClaimed = false;
                    
                    if (result.success) {
                        try {
                            const decoded = rewardsContract.interface.decodeFunctionResult('hasClaimed', result.returnData);
                            hasClaimed = decoded[0];
                        } catch (decodeError) {
                            console.warn(`Error decoding result for punk ${punkId}:`, decodeError);
                        }
                    } else {
                        console.warn(`Multicall failed for punk ${punkId}`);
                    }
                    
                    return { punkId, hasClaimed };
                });
                
                console.log(`✅ Checked ${claimsData.length} claims with multicall`);
                return claimsData;
                
            } catch (error) {
                console.error('Error in batchCheckClaims:', error);
                // Fallback to individual calls if multicall fails
                console.warn('⚠️ Multicall failed, falling back to individual calls with throttling...');
                const readProvider = window.RewardsConfig.getReadProvider();
                const readRewardsContract = new ethers.Contract(REWARDS_CONTRACT, REWARDS_ABI, readProvider);
                
                const claimsData = [];
                const THROTTLE_DELAY = 100; // 100ms delay between calls
                
                for (let i = 0; i < punkIds.length; i++) {
                    const punkId = punkIds[i];
                    try {
                        const hasClaimed = await retryContractCall(() => 
                            readRewardsContract.hasClaimed(campaignId, punkId)
                        );
                        claimsData.push({ punkId, hasClaimed });
                        
                        // Add throttle delay between calls (except for the last one)
                        if (i < punkIds.length - 1) {
                            await new Promise(resolve => setTimeout(resolve, THROTTLE_DELAY));
                        }
                    } catch (error) {
                        console.warn(`Error checking claim for punk ${punkId}:`, error);
                        claimsData.push({ punkId, hasClaimed: false });
                        
                        // If rate limited, wait longer
                        if (error.message && error.message.includes('429')) {
                            console.warn('⚠️ Rate limited, waiting 2 seconds...');
                            await new Promise(resolve => setTimeout(resolve, 2000));
                        } else if (i < punkIds.length - 1) {
                            await new Promise(resolve => setTimeout(resolve, THROTTLE_DELAY));
                        }
                    }
                }
                
                return claimsData;
            }
        }

        /**
         * Batch check ALL claims for ALL campaigns and ALL punks in a single multicall (highly optimized)
         * This replaces multiple multicall calls (one per campaign) with a single multicall
         * Example: 3 campaigns × 99 punks = 297 calls in ONE multicall instead of 3 multicalls
         */
        async function batchCheckAllClaims(campaignIds, punkIds) {
            try {
                if (campaignIds.length === 0 || punkIds.length === 0) {
                    // Return empty structure
                    const emptyResult = {};
                    campaignIds.forEach(id => emptyResult[id] = []);
                    return emptyResult;
                }
                
                const totalCalls = campaignIds.length * punkIds.length;
                console.log(`🚀 Checking ALL claims: ${campaignIds.length} campaigns × ${punkIds.length} punks = ${totalCalls} calls in ONE multicall...`);
                
                const readProvider = window.RewardsConfig.getReadProvider();
                const rewardsContract = new ethers.Contract(REWARDS_CONTRACT, REWARDS_ABI, readProvider);
                const multicallContract = new ethers.Contract(getMulticallAddress(), MULTICALL_ABI, readProvider);
                
                // Create array of all combinations (campaign × punk)
                const calls = [];
                const callIndexMap = []; // Map call index to (campaignId, punkId)
                
                for (const campaignId of campaignIds) {
                    for (const punkId of punkIds) {
                        const callData = rewardsContract.interface.encodeFunctionData('hasClaimed', [campaignId, punkId]);
                        calls.push({
                            target: REWARDS_CONTRACT,
                            allowFailure: true, // Allow individual failures
                            callData: callData
                        });
                        callIndexMap.push({ campaignId, punkId });
                    }
                }
                
                // Execute single multicall with retry
                const results = await retryContractCall(() => multicallContract.aggregate3(calls));
                
                // Process results and group by campaign
                const claimsByCampaign = {};
                campaignIds.forEach(id => claimsByCampaign[id] = []);
                
                results.forEach((result, index) => {
                    const { campaignId, punkId } = callIndexMap[index];
                    let hasClaimed = false;
                    
                    if (result.success) {
                        try {
                            const decoded = rewardsContract.interface.decodeFunctionResult('hasClaimed', result.returnData);
                            hasClaimed = decoded[0];
                        } catch (decodeError) {
                            console.warn(`Error decoding result for campaign ${campaignId}, punk ${punkId}:`, decodeError);
                        }
                    } else {
                        console.warn(`Multicall failed for campaign ${campaignId}, punk ${punkId}`);
                    }
                    
                    claimsByCampaign[campaignId].push({ punkId, hasClaimed });
                });
                
                console.log(`✅ Checked ALL ${totalCalls} claims in ONE multicall`);
                return claimsByCampaign;
                
            } catch (error) {
                console.error('Error in batchCheckAllClaims:', error);
                // Fallback: return empty structure and let individual campaign processing handle it
                console.warn('⚠️ batchCheckAllClaims failed, will fall back to per-campaign processing');
                const emptyResult = {};
                campaignIds.forEach(id => emptyResult[id] = []);
                return emptyResult;
            }
        }

        /**
         * Batch load campaigns using multicall (optimized)
         */
        async function batchGetCampaigns(maxCampaignId) {
            try {
                console.log(`🚀 Loading ${maxCampaignId} campaigns with multicall...`);
                
                const readProvider = window.RewardsConfig.getReadProvider();
                const rewardsContract = new ethers.Contract(REWARDS_CONTRACT, REWARDS_ABI, readProvider);
                const multicallContract = new ethers.Contract(getMulticallAddress(), MULTICALL_ABI, readProvider);
                
                // Prepare calls for multicall
                const calls = [];
                for (let i = 1; i <= maxCampaignId; i++) {
                    const callData = rewardsContract.interface.encodeFunctionData('getCampaign', [i]);
                    calls.push({
                        target: REWARDS_CONTRACT,
                        allowFailure: true, // Allow individual failures
                        callData: callData
                    });
                }
                
                // Execute multicall with retry
                const results = await retryContractCall(() => multicallContract.aggregate3(calls));
                
                // Decode results and convert to campaign objects
                const campaignsData = [];
                for (let i = 0; i < results.length; i++) {
                    const result = results[i];
                    const campaignId = i + 1;
                    
                    if (result.success) {
                        try {
                            const decoded = rewardsContract.interface.decodeFunctionResult('getCampaign', result.returnData);
                            const campaignData = decoded[0];
                            
                            campaignsData.push({
                                id: campaignId,
                                assetId: campaignData.assetId.toNumber(),
                                amountPerToken: campaignData.amountPerToken.toNumber(),
                                startTime: campaignData.startTime.toNumber(),
                                endTime: campaignData.endTime.toNumber(),
                                active: campaignData.active,
                                totalClaimed: campaignData.totalClaimed.toNumber()
                            });
                        } catch (decodeError) {
                            console.warn(`Error decoding campaign ${campaignId}:`, decodeError);
                        }
                    } else {
                        console.warn(`Multicall failed for campaign ${campaignId}`);
                    }
                }
                
                console.log(`✅ Loaded ${campaignsData.length} campaigns with multicall`);
                return campaignsData;
                
            } catch (error) {
                console.error('Error in batchGetCampaigns:', error);
                throw error;
            }
        }

        // Retry contract call with limited retries and exponential backoff for rate limiting
        async function retryContractCall(contractCall, maxRetries = 3, baseDelay = 1000) {
            let lastError;
            
            for (let attempt = 1; attempt <= maxRetries; attempt++) {
                try {
                    const result = await contractCall();
                    if (attempt > 1) {
                        console.log(`✅ Contract call successful on attempt ${attempt}`);
                    }
                    return result;
                } catch (error) {
                    lastError = error;
                    
                    // Check if it's a rate limiting error (429)
                    const isRateLimit = error.message && (
                        error.message.includes('429') ||
                        error.message.includes('Too Many Requests') ||
                        error.message.includes('rate limit') ||
                        error.code === 429 ||
                        error.status === 429
                    );
                    
                    // Check if it's a network/RPC error that should be retried
                    const isRetryableError = isRateLimit ||
                        (error.message && error.message.includes('state histories haven\'t been fully indexed yet')) ||
                        error.code === 'CALL_EXCEPTION' ||
                        error.code === -32603 ||
                        error.code === 'NETWORK_ERROR' ||
                        error.code === 'TIMEOUT';
                    
                    if (attempt < maxRetries && isRetryableError) {
                        // Exponential backoff: longer delays for rate limiting
                        const delay = isRateLimit 
                            ? baseDelay * Math.pow(2, attempt) * 2  // Exponential backoff for 429: 2s, 4s, 8s
                            : baseDelay * attempt;  // Linear backoff for other errors: 1s, 2s, 3s
                        
                        console.warn(`⚠️ Attempt ${attempt}/${maxRetries} failed${isRateLimit ? ' (Rate Limited)' : ''}: ${error.message?.substring(0, 100)}`);
                        console.log(`⏳ Waiting ${delay}ms before retry...`);
                        await new Promise(resolve => setTimeout(resolve, delay));
                    } else {
                        // For other errors or max retries reached, don't retry
                        if (attempt >= maxRetries) {
                            console.error(`❌ All ${maxRetries} attempts failed`);
                        }
                        throw error;
                    }
                }
            }
            
            // If we get here, all retries failed
            console.error(`❌ All ${maxRetries} attempts failed`);
            throw lastError;
        }

        async function loadUserPunks() {

                });

                console.error('Error loading user punks:', error);
                
                // Fallback to sequential loading if multicall fails
                console.warn('⚠️ Multicall failed, falling back to sequential loading with throttling...');
                try {
                    const readProvider = window.RewardsConfig.getReadProvider();
                    const punksContract = new ethers.Contract(PUNKS_CONTRACT, PUNKS_ABI, readProvider);
                    
                    const balance = await retryContractCall(() => punksContract.balanceOf(currentAccount));
                    const punkCount = balance.toNumber();
                    
                    document.getElementById('punkCount').textContent = punkCount;
                    
                    userPunks = [];
                    const THROTTLE_DELAY = 150; // 150ms delay between calls to avoid rate limiting
                    
                    for (let i = 0; i < punkCount; i++) {
                        try {
                            const tokenId = await retryContractCall(() => punksContract.tokenOfOwnerByIndex(currentAccount, i));
                            userPunks.push(tokenId.toNumber());
                            
                            // Log progress every 10 punks
                            if ((i + 1) % 10 === 0 || i === punkCount - 1) {
                                console.log(`📦 Fallback progress: ${i + 1}/${punkCount} punks loaded`);
                            }
                            
                            // Add throttle delay between calls (except for the last one)
                            if (i < punkCount - 1) {
                                await new Promise(resolve => setTimeout(resolve, THROTTLE_DELAY));
                            }
                        } catch (callError) {
                            // Check if it's a rate limit error
                            const isRateLimit = callError.message && (
                                callError.message.includes('429') ||
                                callError.message.includes('Too Many Requests') ||
                                callError.message.includes('rate limit')
                            );
                            
                            if (isRateLimit) {
                                console.warn(`⚠️ Rate limited at punk ${i + 1}, waiting 3 seconds...`);
                                await new Promise(resolve => setTimeout(resolve, 3000));
                                // Retry this call
                                i--; // Decrement to retry this index
                                continue;
                            } else {
                                console.warn(`⚠️ Error loading punk ${i + 1}:`, callError.message);
                                // Continue with next punk
                            }
                        }
                    }
                    
                    console.log(`✅ User punks loaded (fallback): ${userPunks.length} punks`);
                } catch (fallbackError) {
                    console.error('Fallback loading also failed:', fallbackError);
                    
                    // Intentar usar datos en caché
                    const cachedData = window.RewardsConfig.getCachedData();
                    if (cachedData && cachedData.userPunks) {
                        userPunks = cachedData.userPunks;
                        document.getElementById('punkCount').textContent = userPunks.length;
                        showError('⚠️ Usando datos en caché debido a problemas de red');
                    } else {
                        // Check if it's a state indexing error
                        if (error.message && error.message.includes('historical state')) {
                            showError('⏳ La red está sincronizando. Por favor espera unos minutos y recarga la página.');
                        } else {
                            showError('Error loading AdrianPunks: ' + error.message);
                        }
                    }
                }
            } finally {
                showLoading(false);
            }
        }

        // Update campaigns with user data using single optimized multicall (highly optimized)
        async function updateCampaignsWithUserData() {
            try {
                console.log('🔄 Actualizando campañas con datos de usuario usando multicall optimizado...');
                
                if (userPunks.length === 0) {
                    console.log('⚠️ No user punks to check');
                    campaigns.forEach(campaign => {
                        campaign.userPunks = [];
                        campaign.userClaimed = 0;
                        campaign.canClaim = false;
                        campaign.loading = false;
                        campaign.userDataLoaded = true;
                        updateCampaignCard(campaign);
                    });
                    return;
                }
                
                // Get all campaign IDs
                const campaignIds = campaigns.map(c => c.id);
                
                // Check ALL claims for ALL campaigns in a SINGLE multicall
                const claimsByCampaign = await batchCheckAllClaims(campaignIds, userPunks);
                
                // Process results for each campaign
                campaigns.forEach(campaign => {
                    try {
                        const claimsData = claimsByCampaign[campaign.id] || [];
                        
                        // Filtrar punks que pueden reclamar
                        const userPunksForCampaign = claimsData
                            .filter(data => !data.hasClaimed)
                            .map(data => data.punkId);
                        
                        // Calcular cuántos claims ha hecho el usuario
                        const userClaimedCount = claimsData
                            .filter(data => data.hasClaimed)
                            .length;
                        
                        // Actualizar campaña
                        campaign.userPunks = userPunksForCampaign;
                        campaign.userClaimed = userClaimedCount;
                        campaign.canClaim = userPunksForCampaign.length > 0;
                        campaign.loading = false;
                        campaign.userDataLoaded = true;
                        
                        console.log(`✅ Campaign ${campaign.id}: ${userPunksForCampaign.length} punks available`);
                        
                        // Actualizar UI inmediatamente para esta campaña
                        updateCampaignCard(campaign);
                        
                    } catch (error) {
                        console.warn(`⚠️ Error procesando resultados para campaña ${campaign.id}:`, error);
                        campaign.loading = false;
                        campaign.userDataLoaded = false;
                        updateCampaignCard(campaign);
                    }
                });
                
                // If batchCheckAllClaims failed, fall back to per-campaign processing
                const hasEmptyResults = campaignIds.some(id => !claimsByCampaign[id] || claimsByCampaign[id].length === 0);
                if (hasEmptyResults && campaignIds.length > 0 && userPunks.length > 0) {
                    console.warn('⚠️ batchCheckAllClaims returned empty results, falling back to per-campaign processing...');
                    
                    // Fallback: process each campaign individually
                    for (const campaign of campaigns) {
                        try {
                            const claimsData = await batchCheckClaims(campaign.id, userPunks);
                            
                            const userPunksForCampaign = claimsData
                                .filter(data => !data.hasClaimed)
                                .map(data => data.punkId);
                            
                            const userClaimedCount = claimsData
                                .filter(data => data.hasClaimed)
                                .length;
                            
                            campaign.userPunks = userPunksForCampaign;
                            campaign.userClaimed = userClaimedCount;
                            campaign.canClaim = userPunksForCampaign.length > 0;
                            campaign.loading = false;
                            campaign.userDataLoaded = true;
                            
                            updateCampaignCard(campaign);
                        } catch (error) {
                            console.warn(`⚠️ Error en fallback para campaña ${campaign.id}:`, error);
                            campaign.loading = false;
                            campaign.userDataLoaded = false;
                            updateCampaignCard(campaign);
                        }
                    }
                }
                
                // Guardar en caché
                const cachedData = window.RewardsConfig.getCachedData() || {};
                window.RewardsConfig.setCachedData({
                    ...cachedData,
                    campaigns: campaigns,
                    userPunks: userPunks,
                    currentAccount: currentAccount
                });
                
                console.log('✅ Todas las campañas actualizadas con datos de usuario');
                
            } catch (error) {
                console.error('Error updating campaigns with user data:', error);
                throw error;
            }
        }

        // Render campaigns (legacy function)
        function renderCampaigns() {

        // Create campaign card complete (with user data)
        function createCampaignCardComplete(campaign) {
            const card = document.createElement('div');
            card.className = 'reward-card';
            card.id = `campaign-${campaign.id}`;

            const now = Math.floor(Date.now() / 1000);
            const isActive = campaign.active && 
                           (campaign.startTime === 0 || now >= campaign.startTime) &&
                           (campaign.endTime === 0 || now <= campaign.endTime);
            
            // Debug logs
            console.log(`🔍 Campaign ${campaign.id} debug:`, {
                active: campaign.active,
                startTime: campaign.startTime,
                endTime: campaign.endTime,
                now: now,
                isActive: isActive
            });

            const imageUrl = getRewardImageUrl(campaign.assetId);

            // Determinar estado de la campaña
            let statusText = '';
            let buttonHtml = '';
            
            if (!isActive) {
                statusText = '⏸️ Campaign inactive';
                buttonHtml = '<button class="claim-btn" disabled>Inactive</button>';
            } else if (campaign.userDataLoaded) {

                    statusText = `✅ ${campaign.userPunks.length} punks available to claim`;
                    buttonHtml = `
                        <button class="claim-btn" onclick="claimReward(${campaign.id})">
                            🎁 Claim Reward
                        </button>
                    `;
                } else {
                    statusText = '❌ No punks available to claim';
                    buttonHtml = '<button class="claim-btn" disabled>Not available</button>';
                }
            } else {
                statusText = '⏳ Loading user data...';
                buttonHtml = '<button class="claim-btn" disabled>Loading...</button>';
            }

            card.innerHTML = `
                <div class="reward-image">
                    <img src="${imageUrl}" alt="${campaign.name}" onload="console.log('✅ Reward image loaded for asset ${campaign.assetId}:', this.src)" onerror="console.error('❌ Error loading reward image for asset ${campaign.assetId}:', this.src)">
                </div>
                <div class="reward-info">
                    <h3>${campaign.name}</h3>
                    <p>${campaign.description}</p>
                    <div class="reward-stats">
                        <span class="amount">Amount: ${campaign.amountPerToken}</span>
                        <span class="user-claimed">Your Claims: ${campaign.userClaimed || 0}</span>
                        <span class="total-claimed">Total: ${campaign.totalClaimed}/1000</span>

                    <div class="user-data">
                        <div class="user-status">

        // Update individual campaign card
        function updateCampaignCard(campaign) {
            const card = document.getElementById(`campaign-${campaign.id}`);
            if (!card) return;

            const userDataDiv = card.querySelector('.user-data');
            const actionsDiv = card.querySelector('.campaign-actions');
            const statsDiv = card.querySelector('.reward-stats');
            
            if (!userDataDiv || !actionsDiv || !statsDiv) return;

            // Actualizar estadísticas
            statsDiv.innerHTML = `
                <span class="amount">Amount: ${campaign.amountPerToken}</span>
                <span class="user-claimed">Your Claims: ${campaign.userClaimed || 0}</span>
                <span class="total-claimed">Total: ${campaign.totalClaimed}/1000</span>
            `;

            // Actualizar estado de usuario
            let statusText = '';
            let buttonHtml = '';
            
            if (campaign.userDataLoaded) {
                if (campaign.canClaim) {
                    statusText = `✅ ${campaign.userPunks.length} punks available to claim`;
                    buttonHtml = `
                        <button class="claim-btn" onclick="claimReward(${campaign.id})">
                            🎁 Claim Reward
                        </button>
                    `;
                } else {
                    statusText = '❌ No punks available to claim';
                    buttonHtml = '<button class="claim-btn" disabled>Not available</button>';
                }
            } else {
                statusText = '⏳ Loading user data...';
                buttonHtml = '<button class="claim-btn" disabled>Loading...</button>';
            }

            userDataDiv.innerHTML = `
                <div class="user-status">
                    <span>${statusText}</span>
                </div>

            actionsDiv.innerHTML = buttonHtml;

        // Create campaign card (legacy function)
        function createCampaignCard(campaign) {
            const card = document.createElement('div');
            card.className = 'reward-card';
            card.id = `campaign-${campaign.id}`;

            const now = Math.floor(Date.now() / 1000);
            const isActive = campaign.active && 
                           (campaign.startTime === 0 || now >= campaign.startTime) &&
                           (campaign.endTime === 0 || now <= campaign.endTime);

            const availablePunks = userPunks.length;
            const totalReward = availablePunks * campaign.amountPerToken;

            const rewardImageUrl = getRewardImageUrl(campaign.assetId);
            
            card.innerHTML = `
                <div class="reward-header">
                    <div class="reward-title">${campaign.name}</div>

                        ${isActive ? 'ACTIVE' : 'INACTIVE'}

                <div class="reward-image" style="text-align: center; margin: 20px 0;">
                    <img src="${rewardImageUrl}" 
                         alt="Reward Asset ${campaign.assetId}" 
                         style="max-width: 200px; max-height: 200px; border-radius: 15px; border: 3px solid #00ff88; box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);"
                         onload="console.log('✅ Reward image loaded for asset ${campaign.assetId}:', this.src)"
                         onerror="console.error('❌ Reward image failed to load for asset ${campaign.assetId}:', this.src); this.style.display='none'">
                </div>
                
                <div class="reward-details">
                    <div class="reward-detail">
                        <span class="reward-detail-label">Asset ID:</span>

                    </div>
                    <div class="reward-detail">
                        <span class="reward-detail-label">Amount per Punk:</span>
                        <span class="reward-detail-value">${campaign.amountPerToken}</span>
                    </div>
                    <div class="reward-detail">
                        <span class="reward-detail-label">Your Punks:</span>
                        <span class="reward-detail-value">${availablePunks}</span>
                    </div>
                    <div class="reward-detail">
                        <span class="reward-detail-label">Total to Claim:</span>
                        <span class="reward-detail-value">${totalReward}</span>
                    </div>
                    <div class="reward-detail">
                        <span class="reward-detail-label">Description:</span>
                        <span class="reward-detail-value">${campaign.description}</span>
                    </div>
                </div>

                <div class="reward-actions">
                    <button class="claim-btn" onclick="claimReward(${campaign.id})" ${!isActive ? 'disabled' : ''}>
                        Claim All
                    </button>
                </div>

            `;

            return card;
        }


        // Claim reward for all punks
        async function claimReward(campaignId) {
            try {
                // Find the campaign to get available punks
                const campaign = campaigns.find(c => c.id === campaignId);
                if (!campaign) {
                    showError('Campaign not found');
                    return;
                }

                if (campaign.userPunks.length === 0) {
                    showError('No punks available to claim for this campaign');
                    return;
                }

                showLoading(true);
                
                console.log(`Claiming reward for campaign ${campaignId} with ${campaign.userPunks.length} available punks`);
                
                // Use batchClaim for available punks only
                const tx = await rewardsContract.batchClaim(campaignId, campaign.userPunks);
                console.log('Transaction sent:', tx.hash);
                
                showSuccess('Transaction sent. Waiting for confirmation...');
                
                // Wait for transaction confirmation
                const receipt = await tx.wait();
                console.log('Transaction confirmed:', receipt);
                
                showSuccess(`Reward claimed successfully! ${userPunks.length} tokens processed. TX: ${tx.hash}`);
                
                // Update UI
                const card = document.getElementById(`campaign-${campaignId}`);
                card.classList.add('claimed');
                card.querySelector('.claim-btn').disabled = true;
                
                // Reload campaigns to update totalClaimed
                await loadCampaigns();
                
            } catch (error) {
                console.error('Error claiming reward:', error);
                
                let errorMessage = 'Error claiming reward: ';
                if (error.code === 4001) {
                    errorMessage += 'Transaction rejected by user.';
                } else if (error.message && error.message.includes('Already claimed')) {
                    errorMessage += 'You have already claimed this reward.';
                } else if (error.message && error.message.includes('Not token owner')) {
                    errorMessage += 'You are not the owner of these tokens.';
                } else if (error.message && error.message.includes('Campaign not active')) {
                    errorMessage += 'Campaign is not active.';
                } else if (error.message && error.message.includes('Exceeds max supply')) {
                    errorMessage += 'Exceeds max supply. The reward asset may be sold out.';
                } else {
                    errorMessage += error.message;
                }
                
                showError(errorMessage);
            } finally {
                showLoading(false);
            }
        }

        // Batch claim for selected punks
        async function batchClaim(campaignId, punkIds) {
            try {
                if (punkIds.length === 0) {
                    showError('Select at least one Punk to claim');
                    return;
                }

                showLoading(true);
                
                console.log(`Batch claiming reward for campaign ${campaignId} with punks:`, punkIds);
                
                // Use batchClaim for selected punks
                const tx = await rewardsContract.batchClaim(campaignId, punkIds);
                console.log('Transaction sent:', tx.hash);
                
                showSuccess('Transaction sent. Waiting for confirmation...');
                
                // Wait for transaction confirmation
                const receipt = await tx.wait();
                console.log('Transaction confirmed:', receipt);
                
                showSuccess(`Reward claimed successfully! ${punkIds.length} tokens processed. TX: ${tx.hash}`);
                
                // Reload campaigns to update totalClaimed
                await loadCampaigns();
                
            } catch (error) {
                console.error('Error batch claiming:', error);
                
                let errorMessage = 'Error claiming reward: ';
                if (error.code === 4001) {
                    errorMessage += 'Transaction rejected by user.';
                } else if (error.message && error.message.includes('Already claimed')) {
                    errorMessage += 'You have already claimed this reward.';
                } else if (error.message && error.message.includes('Not token owner')) {
                    errorMessage += 'You are not the owner of these tokens.';
                } else if (error.message && error.message.includes('Campaign not active')) {
                    errorMessage += 'Campaign is not active.';
                } else if (error.message && error.message.includes('Exceeds max supply')) {
                    errorMessage += 'Exceeds max supply. The reward asset may be sold out.';
                } else {
                    errorMessage += error.message;
                }
                
                showError(errorMessage);
            } finally {
                showLoading(false);
            }
        }

        // Show loading with custom message
        function showLoading(show, message = 'Loading...') {
            const loadingDiv = document.getElementById('loading');
            if (show) {
                loadingDiv.innerHTML = `
                    <div class="loading-content">
                        <div class="loading-spinner">⏳</div>
                        <div class="loading-text">${message}</div>
                    </div>
                `;
                loadingDiv.style.display = 'block';
            } else {
                loadingDiv.style.display = 'none';
            }
        }

        // Show error message
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 8000);
        }

        // Show success message
        function showSuccess(message) {
            const successDiv = document.getElementById('successMessage');
            successDiv.textContent = message;
            successDiv.style.display = 'block';
            setTimeout(() => {
                successDiv.style.display = 'none';
            }, 5000);
        }


        // Initialize when page loads
        window.addEventListener('load', () => {
            if (typeof window.ethereum !== 'undefined') {
                init();
            }
        });

        // Listen for account changes
        if (typeof window.ethereum !== 'undefined') {
            window.ethereum.on('accountsChanged', (accounts) => {
                if (accounts.length === 0) {
                    location.reload();
                } else {
                    init();
                }
            });
        }

        // Load menu
        fetch('../components/menu.html')
            .then(response => response.text())
            .then(html => {
                document.getElementById('menu-container').innerHTML = html;
                const s = document.createElement('script');
                s.src = '../components/menu.js';
                document.head.appendChild(s);
            })
            .catch(error => console.error('Error loading menu:', error));
    </script>
